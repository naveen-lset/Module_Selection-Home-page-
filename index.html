<!doctype html>
<!--
  ═══════════════════════════════════════════════════════════════════════════
  ANTZ COMMAND CENTRE · HOME
  Customizable module dashboard — one self-contained file.

  Implemented from Figma: Antz Modules → Home (iPad Pro 12.9" - 6)
  node 55476:32828. Colours, gradients, type sizes, paddings and the five
  column grid are transcribed from that artboard; icons and photographs are the
  assets exported from it, in ./assets. The one drawing that is not from the
  Figma file is the header planting, which was supplied separately as a flat
  PNG and is processed into a transparent, tileable asset by tools/foliage.py.

  Open it by double-clicking. There is no build step and nothing to install.
  Everything except the images lives in this file: the stylesheet is in <style>
  below, and the whole application is in the single <script> at the foot,
  organised into the same sections it was authored in.

  WHAT THIS IS
    Seventeen modules, each offering the widgets its own work actually has —
    seventy-one cards in total, built from two treatments and eleven content
    blocks so that they are recognisably one product. Every card declares a
    PURPOSE (navigate · understand · attention · act · monitor), the sizes it
    supports, and a PRIORITY that decides whether it seeds the default home
    page. The catalogue is data: see js/data/cardVariants.js below.

    The home page is arranged by the user — drag, resize, add, remove — and
    saved to localStorage. Everything they can do to it hangs off their own
    avatar, top right.

  CONTENTS
    <style>   tokens · home chrome · header planting · grid · cards + blocks ·
              edit mode · profile menu · widget gallery
    <body>    status bar · planting · greeting · search · hero banner · modules
    <script>  icons · sizes · packer · store · modules · card variants ·
              card · grid · drag · edit · preview · profile menu ·
              widget gallery · app

  Console helpers
    antz.state()          the live layout
    antz.columns()        how many columns the viewport resolves to
    antz.reset()          back to the default home page
    antz.allVariants()    every card at every size it declares, on the grid
    antz.checkDefaults()  assert the catalogue and the default page agree
  ═══════════════════════════════════════════════════════════════════════════
-->

     doing real work — drop it and the whole page darkens against the browser
     ground. Stop positions are Figma's own, to three decimals. */

  --c-add-primary:      #00AFD6;  /* MD3_Antz/addPrimary                      */
  --c-tertiary:         #FA6140;  /* MD3_Antz/Tertiary                        */
  --c-on-primary-ctr:   #1F515B;  /* MD3_Antz/OnPrimaryContainer  active date */
  --c-success:          #72E128;  /* Light/Success/Main          presence dot */
  --c-white:            #FFFFFF;  /* Light/Common/White                       */

  --ink:      var(--c-on-secondary-ctr);
  --ink-head: var(--c-on-surface-var);
  --ink-mute: var(--c-neutral-2);
  --on-dark:  var(--c-white);

  /* ── 3 · module card gradients ─────────────────────────────────────────
     Each of these is the RENDERED ramp, sampled off the Figma artboard at ten
     points along the card's own gradient axis, and the angles are Figma's.

     WHY SAMPLED RATHER THAN TRANSCRIBED. Figma reports these fills as two
     alpha stops — e.g. `rgba(0,109,53,.16) 48.848%, rgba(0,109,53,.8) 74.362%`
     — and pasting those into CSS is wrong, because a Figma gradient handle is
     positioned independently of the shape it fills. On these cards the handle
     runs well past the corners, so the shape only ever shows a slice of the
     ramp; CSS instead maps 0–100% onto the shape's own diagonal. Transcribed
     directly, every card came out correct at its dark end and far too pale at
     its light end — measured, the top-left of Medical was #E7FAF9 against
     Figma's #86B99F, while the bottom-right matched to within one unit.

     Sampling sidesteps the whole handle-geometry problem: a linear gradient is
     constant along the perpendicular to its axis, so each stop is the median of
     a full perpendicular scan line, which also rejects the white icon and label
     glyphs sitting on the axis. The values are opaque because they are the
     composited result — what Figma actually draws. */

     see the other modules": a Hospital or Species card with no photograph under

     wear the same fill behind a white glyph, came out as pale ghosts next to

     the alpha was doing nothing except breaking the plain cards.

     These are the same three hues, composited to opacity on the same ten-stop
     ramp the rest of the palette uses. The photographs are untouched. */

                  rgb(82, 156, 118) 6.0%,
                  rgb(70, 149, 109) 15.8%,
                  rgb(59, 143, 99) 25.6%,

                  rgb(103, 137, 143) 6.0%,
                  rgb(93, 129, 136) 15.8%,
                  rgb(82, 121, 128) 25.6%,
                  rgb(72, 113, 121) 35.3%,
                  rgb(62, 105, 113) 45.1%,
                  rgb(52, 97, 106) 54.9%,
                  rgb(41, 89, 98) 64.7%,
                  rgb(31, 81, 91) 74.4%,

  /* The scrim under a label on a photographic card. Figma draws it as a fixed
     113px band across the bottom with a 2px backdrop blur — not a full-height
     overlay — which is why the top of those photographs stays clean. */
  --scrim-band: linear-gradient(179.41143632907807deg,
    rgba(255, 255, 255, 0) 5.6838%, rgba(58, 58, 58, .7) 64.478%);
  --scrim-band-h: 113px;

  /* ── 4 · elevation ─────────────────────────────────────────────────────*/
  --shadow-hero: 0 2px 10px 0 rgba(76, 78, 100, .22);
  --shadow-card: 0 1px 3px rgba(31, 65, 91, .06), 0 8px 24px -10px rgba(31, 65, 91, .14);
  --shadow-lift: 0 4px 10px rgba(31, 65, 91, .10), 0 26px 56px -18px rgba(31, 65, 91, .32);

  /* ── 5 · radii · Figma uses 16px almost everywhere ─────────────────────*/
  --r-card:  16px;
  --r-field: 16px;
  --r-sheet: 28px;
  --r-pill:  999px;

  /* ── 6 · spacing scale ─────────────────────────────────────────────────*/
  --s1: 4px;  --s2: 8px;  --s3: 12px; --s4: 16px; --s5: 20px;
  --s6: 24px; --s7: 28px; --s8: 32px; --s10: 40px; --s11: 44px; --s12: 48px;

  /* ── 7 · motion ────────────────────────────────────────────────────────*/
  --ease:       cubic-bezier(.22, .61, .36, 1);
  --ease-out:   cubic-bezier(.16, 1, .3, 1);
  --ease-sheet: cubic-bezier(.32, .72, 0, 1);
  --t-fast: 140ms; --t-base: 220ms; --t-slow: 320ms; --t-sheet: 420ms;

  /* ── 8 · type ──────────────────────────────────────────────────────────
     Three families, each doing one job, all as Figma specifies.
       Inter       everything structural — Antz text/* is an Inter set
       Sour Gummy  the "Good Morning," line, Light, and nothing else
       DM Sans     the two big figures on the Species card, Bold, opsz 14

     LINE HEIGHT IS `normal`, AND THE TOKENS ARE MISLEADING ABOUT IT. Every
     Antz text style reports `lineHeight: 100`, which reads like "line-height:
     1" and is not: in Figma a percentage line height of 100% means 100% of the
     font's own default, i.e. Auto. The node metadata settles it — a 20px
     Module Name occupies a 24px text frame, which is Inter's normal 1.21, not
     1.0. Setting these to 1 was tried and measured worse.

     Every clamp is SOLVED so that its middle term evaluates to Figma's exact
     size at the 1024px reference, not merely to something between the floor and
     the ceiling. Written by eye the first time, the whole page came out 10–25%
     small — `--fs-card` landed at 18.0px against the artboard's 20px, and every
     other token was under too. For a token that should read Npx at 1024:

         a = (N − b × 10.24) / 16      given the chosen vw coefficient b

     so `--fs-card` is 1.058rem + .3vw → 16.928 + 3.072 = 20.000px. Change a
     ceiling or a floor freely; change a middle term and re-solve it. */
  --font:       'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  --font-greet: 'Sour Gummy', 'Comic Sans MS', var(--font);
  --font-num:   'DM Sans', var(--font);
  --font-sys:   -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Roboto, sans-serif;

  --fs-greet:   clamp(18px, 1.3848rem + .18vw, 26px);   /* Figma 24 @1024 */
  --fs-name:    clamp(24px, 1.84rem + .25vw, 36px);   /* Figma 32 @1024 */
  --fs-hero:    clamp(24px, 1.3796rem + 1.36vw, 40px);   /* Figma 36 @1024 */
  --fs-search:  clamp(16px, 1.0772rem + .27vw, 22px);   /* Figma 20 @1024 */
  --fs-card:    clamp(16px, 1.058rem + .3vw, 22px);   /* Figma 20 @1024 */
  --fs-card-lg: clamp(18px, 1.244rem + .4vw, 26px);   /* Figma 24 · Diet  */
  --fs-stat:    clamp(30px, 1.95rem + 1.25vw, 48px);   /* Figma 44 @1024 */
  /* No Figma reference — the artboard has no one-row statistics card. Sized so
     a label row plus a figure clears a 132px content box with room to spare. */
  --fs-stat-sm: clamp(22px, 1.15rem + 1.2vw, 34px);

  /* THE TWO SIZES BETWEEN A HEADING AND A HEADLINE FIGURE.
     Figma has exactly one figure size, 44px, because the artboard has exactly
     one card that shows a figure. A catalogue with four-up metric cards and
     queue counts on it needs two more steps, or every card ends up shouting at
     the same volume and the grid loses its hierarchy entirely.

       --fs-count   a queue length — "24 Pending". Reads as a state.
       --fs-metric  one of two to four figures sharing a card. Reads as data.

     Both are derived from the Figma step rather than picked: count is 44 × 0.7
     and metric is 44 × 0.61, which keeps the same 1.15 ratio the rest of the
     scale walks on. The `-sm` pair is the same figure on a one-row card. */
  --fs-count:     clamp(24px, 1.36rem + .95vw, 34px);
  --fs-count-sm:  clamp(21px, 1.19rem + .74vw, 29px);
  --fs-metric:    clamp(20px, 1.14rem + .68vw, 27px);
  --fs-metric-sm: clamp(17px, .99rem + .52vw, 23px);

  --fs-body:    clamp(14px, .8848rem + .18vw, 17px);   /* Figma 16 @1024 */
  --fs-label:   clamp(12.5px, .779rem + .15vw, 15px);   /* Figma 14 @1024 */
  --fs-micro:   clamp(11px, .6732rem + .12vw, 13px);   /* Figma 12 @1024 */

  /* ── 9 · the grid ──────────────────────────────────────────────────────
     FIVE columns at the reference, not six.

     This is measured, not chosen: every small card in the Figma is 179.2px and
     every wide one 374.4px. (960 − 4×16) ÷ 5 = 179.2, and 179.2×2 + 16 = 374.4.
     The tall cards are 344px, which is 164×2 + 16. So the artboard is a five
     column grid with 16px gutters and 164px rows, and the whole layout falls
     out of that. An earlier requirements note said six columns for this width;
     the Figma is the more specific instruction and it wins. */
  --grid-cols: 5;
  --grid-gap:  16px;
  --grid-row:  164px;
  --pad-page:  32px;
  --pad-card:  16px;
  /* 960, THE ARTBOARD'S CONTENT WIDTH — so the page frame is 960 + 2×32 =
     1024px, and the product renders at its native size on any monitor.
     It was 1440, which let the page fill a desktop and stretch a design that
     was drawn for a tablet. */
  --max-content: 960px;

  /* ── 10 · UI chrome ────────────────────────────────────────────────────
     Edit mode and the Add-to-Home sheet are product surfaces the artboard does
     not draw — it shows the resting home page only. They still need a neutral
     palette, so this is one derived from the Figma tokens above rather than
     invented alongside them: the petrol ramp is stepped from #1F515B
     (OnPrimaryContainer), the ink tiers from #7A8684 (neutralSecondary), and
     the accent is #00AFD6 (addPrimary) — the same cyan the design uses for its
     own affordances. Nothing here appears on a module card. */
  --surface:    #FFFFFF;
  --line:       rgba(31, 65, 91, .10);
  --line-2:     rgba(31, 65, 91, .16);
  --canvas-2:   #E7F7F5;                 /* mid point of the page wash        */

  --ink-2:      #52697A;
  --ink-3:      var(--c-neutral-2);      /* #7A8684 · labels, meta            */
  --ink-4:      #9AAAB4;                 /* decorative glyphs only, never text */

  --sig:        var(--c-add-primary);    /* #00AFD6                           */
  /* The Edit affordance is the one element on this page that is NOT in the
     artboard, so it is the one place I am free to fix contrast without altering
     the design. Figma's #00AFD6 measures 2.40:1 on the mint canvas; this is the
     same cyan darkened until it clears AA at 4.65:1. Every colour that IS in
     the artboard is left exactly as drawn — see the note in the README. */
  --ui-link:    #007A95;
  --clay:       var(--c-tertiary);       /* #FA6140 · destructive hover       */

  --petrol-050: #EEF5F6;
  --petrol-100: #DCE9EB;
  --petrol-200: #B6CDD1;
  --petrol-300: #8DAEB4;
  --petrol-400: #5E8A92;
  --petrol-500: #3E7078;
  --petrol-600: #2E5C64;
  --petrol-700: #234C54;
  --petrol-800: var(--c-on-primary-ctr); /* #1F515B                           */
  --petrol-900: #16373D;

  --e0:     0 1px 2px rgba(31, 65, 91, .05);
  --e1:     0 1px 3px rgba(31, 65, 91, .06), 0 8px 24px -10px rgba(31, 65, 91, .14);
  --e2:     0 2px 6px rgba(31, 65, 91, .08), 0 18px 40px -14px rgba(31, 65, 91, .22);
  --e-drag: var(--shadow-lift);

  --btn:       var(--icon-btn);          /* 44px touch floor                  */
  --fs-title:  var(--fs-card);
  --s16:       64px;

/* ── 900px and up · 5 columns · THE FIGMA REFERENCE, AND THE LAST BAND ───
   There used to be an 8-column band at 1200 and a 12-column one at 1600. They
   are gone, because the page is now capped at 1024px on every screen and a
   column count is only meaningful against the width it has to divide.

   THIS IS THE TRAP THAT MAKES A CAPPED PAGE GO WRONG. `--grid-cols` is set by
   media queries, which measure the VIEWPORT, while the grid divides the PAGE.
   While those two were the same thing the arrangement was sound; the moment the
   page stops growing they diverge, and a 1920px monitor would have asked for
   twelve columns inside 960px of content — 57px cards, on a design whose
   smallest card is 179. Above 1024 the page is always the artboard, so the
   artboard's five columns are always the answer. */

    --grid-gap:  16px;

   Every --fs- token is a clamp on `vw`, tuned so it lands exactly on Figma's
   value at the 1024pt reference and keeps growing past it. That was right when
   the page grew too. Now the page is pinned at 1024 and the type has to be
   pinned with it, or a 1920px monitor renders artboard-width cards carrying
   desktop-width text.

   These ARE the values the clamps produce at 1024 — the Figma-referenced ones
   land on round numbers because they were derived to, which is the clearest
   possible confirmation that the two definitions agree. Nothing jumps at the
   breakpoint; the curve simply stops. */

    --fs-name:      32px;      /* Figma 32 */
    --fs-hero:      36px;      /* Figma 36 */
    --fs-search:    20px;      /* Figma 20 */
    --fs-card:      20px;      /* Figma 20 */
    --fs-card-lg:   24px;      /* Figma 24 · Diet */
    --fs-stat:      44px;      /* Figma 44 */
    --fs-body:      16px;      /* Figma 16 */
    --fs-label:     14px;      /* Figma 14 */
    --fs-micro:     12px;      /* Figma 12 */
    /* no Figma reference — the artboard has no card that shows these */
    --fs-stat-sm:   30.69px;
    --fs-count:     31.49px;
    --fs-count-sm:  26.62px;
    --fs-metric:    25.2px;
    --fs-metric-sm: 21.17px;

/* ── 2b · the header planting ────────────────────────────────────────────
   A band of foliage behind the greeting, dissolving before the search field.

   ═══ THE FADE IS A MASK, NOT A GRADIENT ═══════════════════════════════════

   The obvious way to soften the bottom of an illustration is to lay a
   background-coloured gradient over it. It is also wrong here, for two
   reasons. The page wash is a translucent double gradient that changes down
   the document, so any overlay would have to be a moving target and would show
   as a pale block the moment it missed. And an overlay fades the WHOLE band
   uniformly — leaves and gaps alike — which reads as fog rather than as
   foliage thinning out.

   `mask-image` removes the artwork's own alpha instead, so the leaves dissolve
   individually into whatever is behind them and the gaps between them stay
   exactly as transparent as they already were. There is no boundary to see
   because there is no second layer.

   ═══ THE STOPS ARE IN PIXELS, AND THEY ARE THE BRIEF ══════════════════════

   Percentages would float with the box height and hide what the numbers mean.
   These are absolute, measured against the page, and they say the requirement
   out loud:

     0 - 239px    solid. The search field runs 135-199, so the planting is at
                  full strength the whole way down the header, behind the field
                  and through the gap under it. Its tips clear the top of the
                  field by a hundred pixels.
     239 - 428px  the feather. 239 is forty pixels below the foot of the search
                  field, which is where the fade was asked to begin; 189px of
                  ramp to nothing is long enough to read as atmosphere rather
                  than as an edge.

   Eight stops rather than two, so the falloff eases instead of running straight
   — a linear ramp reads as a wipe.

   ONE THING TO KNOW ABOUT WHERE THAT FEATHER LANDS. The hero banner starts 32px
   below the search field, so a fade beginning at 40px starts 8px inside it and
   runs its whole length behind an opaque photograph. What is actually visible
   is the planting at full strength all the way to the hero's top edge. That is
   the instruction carried out exactly; if the feather should be seen, it has to
   begin at the foot of the field instead, and there are 32 pixels to do it in.

   ═══ THE ARTWORK ═══════════════════════════════════════════════════════════

   Supplied as a flat PNG on its own opaque ground — a blue that is not this
   product's mint canvas. Dropped in as-is it would paint a rectangle of the
   wrong colour with a hard edge on all four sides, and no mask can rescue that
   because the ground is part of the picture. tools/foliage.py un-composites it
   instead: it measures the ground, turns every pixel's departure from it into
   alpha, and writes the result as a transparent PNG that sits correctly on
   anything. It also mirror-pairs it, because the source is a one-off
   illustration whose left and right edges do not meet, and a mirrored pair
   always does. */
.foliage {
  position: absolute;
  z-index: 0;
  left: 0;
  right: 0;
  top: 0;
  height: 440px;
  pointer-events: none;
  /* The supplied artwork, un-composited off its own ground and mirror-paired
     so it tiles — see tools/foliage.py. `auto 100%` maps the crop onto this
     box, which is how the artwork is positioned: the crop's proportions are
     the layout, and there is nothing to nudge here. */
  background: url('assets/img/foliage.png') repeat-x top center / auto 100%;

  /* the long vertical feather — the stops are explained above */
  --feather: linear-gradient(to bottom,
    rgb(0, 0, 0) 0,
    rgb(0, 0, 0) 239px,
    rgba(0, 0, 0, .86) 268px,
    rgba(0, 0, 0, .66) 297px,
    rgba(0, 0, 0, .44) 326px,
    rgba(0, 0, 0, .25) 355px,
    rgba(0, 0, 0, .10) 384px,
    rgba(0, 0, 0, .03) 406px,
    transparent 428px);

  /* AND A CLEARING BEHIND THE GREETING.
     Measured on the render, with the glyphs made transparent and the true
     painted ground sampled underneath: the planting took "Good Morning," from
     2.65:1 to 2.24:1 on average, and to 1.87:1 where a leaf sat directly behind
     a letter. That text is #00ABAB from the Figma palette and was already under
     the 3.0:1 it needs at that size — but "already failing" is not a licence to
     make it worse, and the brief is explicit that the planting must never
     reduce readability.

     So a second mask layer thins the planting over the greeting block and
     feathers back to full by the edge of the ellipse. It is soft, and its
     strength tracks the depth of the band: when the planting stopped above the
     search field, holding the centre at 0.30 was enough, and now that it runs
     at full strength the whole depth of the header, that same ellipse left the
     greeting at 2.24:1 against a 2.62:1 baseline. At 0.06 it measures 2.48:1 —
     a tenth of a point, against the 0.38 it was costing. */
  --clearing: radial-gradient(ellipse 470px 138px at 194px 70px,
    rgba(0, 0, 0, .06) 0%,
    rgba(0, 0, 0, .42) 40%,
    rgba(0, 0, 0, .66) 62%,
    rgba(0, 0, 0, .88) 82%,
    rgb(0, 0, 0) 100%);

  -webkit-mask-image: var(--feather);
  mask-image: var(--feather);
}

/* Both layers, intersected, where the browser can do it. Where it cannot, the
   rule above still applies the vertical feather on its own — the planting is
   just a little heavier behind the greeting, which is where this started. */

  .foliage {
    -webkit-mask-image: var(--feather), var(--clearing);
    mask-image: var(--feather), var(--clearing);
    -webkit-mask-composite: source-in;
    mask-composite: intersect;
  }
}

/* A phone header is the same height as a tablet's but a third of the width, so
   the same 220px band puts far fewer, far larger plants behind the greeting.
   Shrinking the box scales the artwork with it — the plants get smaller and
   closer together, which is the finer texture the narrow column wants. */

       the stops move up with it. */

      rgb(0, 0, 0) 0,
      rgb(0, 0, 0) 225px,
      rgba(0, 0, 0, .86) 252px,
      rgba(0, 0, 0, .66) 279px,
      rgba(0, 0, 0, .44) 306px,
      rgba(0, 0, 0, .25) 333px,
      rgba(0, 0, 0, .10) 360px,
      rgba(0, 0, 0, .03) 382px,
      transparent 404px);

       wisp in the top right rather than a band. */

      rgba(0, 0, 0, .42) 40%,
      rgba(0, 0, 0, .66) 62%,
      rgba(0, 0, 0, .88) 82%,
      rgb(0, 0, 0) 100%);
  }

   across the page, which is the one thing the brief rules out. Better to have
   no planting than a rectangle of it. */

               (mask-image: linear-gradient(#000, transparent))) {
  .foliage { display: none; }
}

   row, and an earlier pass added one anyway — which pushed the whole grid 28px

  font-weight: 600;
}
.link-btn--done:hover { background: color-mix(in srgb, var(--ui-link) 86%, #000); }
.link-btn--done:active { transform: scale(.97); }
</style>
<style>
/* ══ css/grid.css ══ */
/* ══════════════════════════════════════════════════════════════════════════
   THE MODULE GRID
   ──────────────────────────────────────────────────────────────────────────
   Column count and row height come from tokens.css and change at the five
   breakpoints; every card's position comes from the packer and is written as an
   inline `grid-area`. Nothing here is auto-placed, which is what lets the drag
   controller know where every card actually is.
   ══════════════════════════════════════════════════════════════════════════ */

.module-grid {
  display: grid;
  grid-template-columns: repeat(var(--grid-cols), minmax(0, 1fr));
  grid-auto-rows: var(--grid-row);
  gap: var(--grid-gap);
  /* The grid owns the horizontal scroll axis and refuses it. If a span ever
     escaped the packer, this is the line that stops it turning the whole page
     into a side-scroller on an iPad. */
  min-width: 0;
}

/* Each card sits in a slot. The slot owns the grid position and the drag
   transform; the card inside owns the looks. Keeping those on two elements
   means a FLIP transform on the slot never fights a hover transform on the
   card — which, on one element, it does, and the result is a card that snaps
   back to the wrong place the moment the pointer crosses it. */
.slot {
  position: relative;
  min-width: 0;
  min-height: 0;
}

.slot > .card { width: 100%; height: 100%; }

/* Cards animate to their new home when the layout reflows — after a drop, an
   add, a remove, or a rotation. The transform is set and cleared by the FLIP
   code in ModuleGrid; this class is what gives it a duration. */
.slot.is-flipping {
  transition: transform var(--t-slow) var(--ease-out);
  will-change: transform;
}

/* The slot being dragged. Its CARD is hidden — not the slot — because the slot
   still has to draw the hole the card will drop back into, and a slot at zero
   opacity cannot draw anything. */
.slot.is-source { pointer-events: none; }
.slot.is-source > .card { opacity: 0; }

/* The hole. Not a dashed outline — a dashed outline on a grid this dense reads
   as a fifteenth card. A soft inset wash reads as absence. */
.slot.is-placeholder::after {
  content: '';
  position: absolute;
  inset: 0;
  border-radius: var(--r-card);
  background: color-mix(in srgb, var(--petrol-400) 11%, transparent);
  box-shadow: inset 0 0 0 1.5px color-mix(in srgb, var(--petrol-400) 18%, transparent);
  animation: placeholder-in var(--t-base) var(--ease-out);
}

@keyframes placeholder-in {
  from { opacity: 0; transform: scale(.96); }
  to   { opacity: 1; transform: scale(1); }
}

/* ── the empty state ──────────────────────────────────────────────────────
   Reachable: a user can remove everything except the two core cards, and a
   fresh profile with a cleared layout lands here too. */
.grid-empty {
  grid-column: 1 / -1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: var(--s4);
  padding: var(--s12) var(--s6);
  border-radius: var(--r-card);
  background: color-mix(in srgb, var(--surface) 60%, transparent);
  box-shadow: inset 0 0 0 1px var(--line);
  text-align: center;
}
.grid-empty__title { font-size: var(--fs-title); font-weight: 600; color: var(--ink); }
.grid-empty__note  { font-size: var(--fs-body); color: var(--ink-3); max-width: 40ch; }

/* ── the drag layer ───────────────────────────────────────────────────────
   One fixed-position layer at the top of the stacking order holds the card
   being dragged. Lifting it out of the grid is what lets it cross the whole
   page without being clipped by the grid's own bounds, and what stops every
   pointermove from touching grid layout. */
.drag-layer {
  position: fixed;
  inset: 0;
  z-index: var(--z-drag);
  pointer-events: none;
}

.drag-proxy {
  position: absolute;
  top: 0;
  left: 0;
  border-radius: var(--r-card);
  box-shadow: var(--e-drag);
  /* the lift: a little bigger, a little tilted, so the card reads as being
     held rather than as having jumped */
  transform-origin: center;
  will-change: transform;
}
.drag-proxy .card {
  box-shadow: none;
  transform: none;
  pointer-events: none;
}

/* Settling back into the grid on drop. */
.drag-proxy.is-landing {
  transition: transform var(--t-slow) var(--ease-out),
              width var(--t-slow) var(--ease-out),
              height var(--t-slow) var(--ease-out);
}
</style>
<style>
/* ══ css/cards.css ══ */
/* ══════════════════════════════════════════════════════════════════════════
   MODULE CARDS
   ──────────────────────────────────────────────────────────────────────────
   Two treatments and one composition rule.

     gradient   a tinted card, at the module's own Figma fill
     image      a photograph

   and on top of either, a card is a DOOR (icon at the top, name at the foot)
   or a PANEL (a label row, then a stack of blocks). Figma draws every card at
   16px padding inside a 16px radius, with the icon and the label pushed to
   opposite ends by a single `justify-between` column. That one rule is most of
   the card system; the rest is which blocks go inside.

   THE BLOCK VOCABULARY, which is the whole of the visual system:

     stat / hero      a large figure and its caption
     blk-metrics      two to four medium figures
     blk-count        a headline that reads as a sentence — "24 Pending"
     blk-note         a quiet second line
     blk-status       a dot and a phrase
     blk-rows         named rows: breakdown · list · timeline · schedule
     blk-bar          a filled track and its caption
     blk-trend        a small column chart and its figures
     blk-delta        a movement chip against the previous period
     blk-actions      up to three pills
     blk-link         the way into the module

   Seventy-one cards are built from these eleven. Nothing here is per-module and
   nothing here is per-variant: a card looks different from its neighbour
   because it holds different blocks, not because it has its own stylesheet.
   ══════════════════════════════════════════════════════════════════════════ */

.card {
  container-type: inline-size;
  container-name: card;
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  width: 100%;
  height: 100%;
  padding: var(--pad-card);
  border: none;
  border-radius: var(--r-card);
  overflow: hidden;
  isolation: isolate;
  text-align: left;
  cursor: pointer;
  background: transparent;
  -webkit-tap-highlight-color: transparent;
  /* A card may be an anchor (see ModuleCard.js). The reset hands `button` its
     font and colour; a link needs telling, and needs the underline taken off.
     `touch-callout` is the one that matters on the target device: without it an
     iPad long-press on a linked card raises Safari's link preview instead of
     entering edit mode, which is the gesture this product is arranged by. */
  font: inherit;
  color: inherit;
  text-decoration: none;
  -webkit-touch-callout: none;
  transition: box-shadow var(--t-base) var(--ease), transform var(--t-base) var(--ease-out);
}

@media (hover: hover) {
  .card:hover { transform: translateY(-2px); box-shadow: var(--shadow-card); }
}
.card:active { transform: translateY(0) scale(.985); }

/* ── the fill ─────────────────────────────────────────────────────────────
   Each module writes its Figma gradient into --card-bg (see modules.js), and
   this is the only place it is consumed. Both a door and a panel take it; only
   a photographic card does not, because it has a photograph instead. */
.card[data-treatment='gradient'] { background: var(--card-bg, var(--g-users)); }

/* ── ATTENTION, WITHOUT A RED CARD ────────────────────────────────────────
   The brief is firm about this twice: Hospital's critical card must use
   "subtle attention styling, not a full red background", and "do not make every
   Mortality card red". Both are the same mistake — a module repainted by its
   worst news stops being recognisable, and a grid where four cards are red
   trains everyone to stop seeing red.

   So an attention card keeps its module's own fill and says so with a warning
   glyph in its label row and the warm accent on its note. It used to carry a
   hairline ring as well; that is gone. On a grid where only one or two cards
   are ever in this state the ring read as a card that had been selected rather
   than one that needed attention, and the glyph was already doing the work.
   The card now takes the same hover shadow as every other. */
.card__flag {
  flex: none;
  display: grid;
  place-items: center;
  width: 22px;
  height: 22px;
  border-radius: var(--r-pill);
  background: rgba(255, 255, 255, .18);
  color: #FFE3B4;
}
.card__flag-icon { width: 13px; height: 13px; }

/* ── the photograph ──────────────────────────────────────────────────────*/
.card__media {
  position: absolute;
  inset: 0;
  z-index: 0;
  border-radius: var(--r-card);
  object-fit: cover;
  width: 100%;
  height: 100%;
  display: block;
  transition: transform var(--t-slow) var(--ease-out);
}
@media (hover: hover) {
  .card[data-treatment='image']:hover .card__media { transform: scale(1.035); }
}

/* Figma lays a flat wash over some photographs — 0.4 on the hero, 0.2 on Diet
   & Kitchen and Follow Up, none on Hospital or Species. It is a separate layer
   from the label scrim below, and both can be present. */
.card__wash { position: absolute; inset: 0; z-index: 1; border-radius: var(--r-card); }

/* ── the body ────────────────────────────────────────────────────────────*/
.card__body {
  position: relative;
  z-index: 2;
  display: flex;
  flex: 1 0 0;
  flex-direction: column;
  align-items: flex-start;
  justify-content: space-between;
  min-height: 0;
  width: 100%;
}

/* A panel is a label row of fixed height and then everything else. */
.card__body--panel { justify-content: flex-start; gap: var(--s3); }

/* A TALL CARD PUTS AIR UNDER ITS TITLE. Twelve pixels is right on a one-row
   card, where the whole content box is 132px and every pixel is spoken for; on
   a two-row card it leaves the heading sitting on top of its own content. This
   is deliberately scoped to `data-h='2'` rather than raised everywhere — the
   one-row budget is tight enough that four more pixels of gap was the
   difference between a bar caption showing and being clipped. */
.card[data-h='2'] .card__body--panel { gap: var(--s5); }

/**
 * THE BLOCK STACK IS `space-between`, AND THAT IS THE LAYOUT ENGINE.
 *
 * It is why one rule dresses six different cards correctly. Species' two heroes
 * spread to the top and bottom of the space, exactly as the artboard draws
 * them. Hospital's capacity card puts the figure at the top and the bar at the
 * foot. Medical's request queue puts the count at the top, the breakdown in the
 * middle and "View Requests →" on the bottom edge. A card with a single block
 * leaves it at the top, because `space-between` with one child is `flex-start`.
 *
 * No card declares its own vertical rhythm. The space does it.
 */
.card__blocks {
  display: flex;
  flex: 1 0 0;
  flex-direction: column;
  justify-content: space-between;
  gap: var(--s3);
  width: 100%;
  min-height: 0;
  overflow: hidden;
}

/* ── icon ────────────────────────────────────────────────────────────────
   Figma gives each module its own icon size — 44 for most, 38 for Hospital,
   34 for Users, 32 for Security and small Parivesh, 28 for Species, 24 for
   Follow Up. The size travels with the module, not with the card. */
.card__icon {
  position: relative;
  flex: none;
  display: block;
  width: var(--icon-size, 44px);
  height: var(--icon-size, 44px);
}
.card__icon img { display: block; width: 100%; height: 100%; }

/* Mortality and Fetal Death reuse one dead-fish glyph, rotated a quarter turn
   and flipped, inside a 44px box at a 4.162px offset. Figma's transform, kept
   rather than re-drawn, so both cards match the artboard. */
.card__icon--fish { width: 44px; height: 44px; }
.card__icon--fish img {
  width: 39.838px;
  height: 39.838px;
  margin: 4.162px 0 0 4.162px;
  transform: rotate(-90deg) scaleY(-1);
}

/* ── label ───────────────────────────────────────────────────────────────*/
.card__name {
  font-size: var(--fs-card);
  font-weight: 500;
  line-height: normal;
  color: var(--on-dark);
  min-width: 0;
  max-width: 100%;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

/* ── the scrim band on a photographic door ───────────────────────────────
   Figma's own construction: a 113px band pinned to the bottom edge, wider than
   the card so its blur has no visible seam, with a 2px backdrop blur and a
   gradient that is transparent at 5.68% and 70% black by 64.48%. The label
   sits inside the band, not over the card.

   A full-height overlay would have been simpler and would have muddied the top
   of every photograph — which is the part Figma is showing off. */
.card__band {
  position: absolute;
  bottom: 0;
  left: 50%;
  translate: -50% 0;
  z-index: 2;
  display: flex;
  align-items: center;
  width: calc(100% + 2px);
  height: var(--scrim-band-h);
  padding: 60px var(--pad-card) var(--pad-card);
  background: var(--scrim-band);
  -webkit-backdrop-filter: blur(2px);
  backdrop-filter: blur(2px);
  pointer-events: none;
}
.card__band .card__name { flex: 1 0 0; }
.card[data-band-size='lg'] .card__band { padding: 61px var(--s5) var(--s5); }
.card[data-band-size='lg'] .card__name { font-size: var(--fs-card-lg); }

/* ── the label row on a panel ────────────────────────────────────────────
   28px glyph, the title, and the attention flag if there is one. Figma's
   Species card is the reference; every panel in the product now wears it, which
   is what makes a Pharmacy queue card and the artboard's own statistics card
   recognisable as the same object. */
.card__label-row {
  display: flex;
  align-items: center;
  gap: 10px;
  width: 100%;
  min-width: 0;
  flex: none;
}
.card__label-row .card__icon { --icon-size: 28px; }
.card__label-row .card__icon--fish { width: 28px; height: 28px; }
.card__label-row .card__icon--fish img { width: 26px; height: 26px; margin: 2px 0 0 2px; }
.card__label-row .card__name { flex: 1 0 0; }

/* Panels sit on a photograph often enough that every one of them needs to stay
   legible over one. A one-pixel shadow costs nothing on a gradient and saves
   the Follow Up and Species cards. */
.card[data-treatment='image'] .card__body--panel { text-shadow: 0 1px 8px rgba(0, 0, 0, .34); }

/* ══════════════════════════════════════════════════════════════════════════
   BLOCK · hero  — the large figure
   Figma's Species card: DM Sans Bold at 44px over a 16px caption. Every other
   single-figure card in the product now uses it, at the same size, which is the
   difference between a design system and a pile of cards.
   ══════════════════════════════════════════════════════════════════════════ */
.stat { display: flex; flex-direction: column; gap: var(--s1); min-width: 0; color: var(--on-dark); width: 100%; }
.stat__value {
  font-family: var(--font-num);
  font-weight: 700;
  font-size: var(--fs-stat);
  line-height: normal;
  letter-spacing: -.02em;                   /* Figma −0.88px at 44px */
  font-variant-numeric: tabular-nums;
  font-variation-settings: 'opsz' 14;
  white-space: nowrap;
}
.stat__label { font-size: var(--fs-body); font-weight: 400; line-height: normal; white-space: nowrap; }

/* ══ BLOCK · metrics ══════════════════════════════════════════════════════
   Two to four figures at a third the hero's weight. Laid out as a row that
   wraps: on a 2×1 card four metrics come out as four narrow columns, on a 2×2
   they fall into a 2×2 block, and neither arrangement is written down anywhere
   — `flex-wrap` and a `min-width` do it, so a fifth metric would work too. */
.blk-metrics {
  display: flex;
  flex-wrap: wrap;
  gap: var(--s3) var(--s5);
  width: 100%;
  min-width: 0;
}
.metric {
  display: flex;
  flex-direction: column;
  gap: 2px;
  min-width: 0;
  flex: 1 1 auto;
  color: var(--on-dark);
}
.metric__value {
  font-family: var(--font-num);
  font-weight: 700;
  font-size: var(--fs-metric);
  line-height: 1.05;
  letter-spacing: -.02em;
  font-variant-numeric: tabular-nums;
  font-variation-settings: 'opsz' 14;
  white-space: nowrap;
}
.metric__label {
  font-size: var(--fs-micro);
  font-weight: 450;
  line-height: 1.25;
  opacity: .85;
}
/* A figure that is the bad news gets the warm accent — Hospital's 12 critical,
   Parivesh's 2 returned. One figure per card, never the whole card. */
.metric[data-tone='alert'] .metric__value { color: #FFE0AE; }

/* ══ BLOCK · count ════════════════════════════════════════════════════════
   "24 Pending". A statistic is a figure with a caption under it; this is a
   sentence with a figure in it, and the difference matters — a queue length is
   read as a state, not as a measurement. */
.blk-count { display: flex; align-items: baseline; gap: 8px; color: var(--on-dark); min-width: 0; }
.blk-count__value {
  font-family: var(--font-num);
  font-weight: 700;
  font-size: var(--fs-count);
  line-height: 1;
  letter-spacing: -.02em;
  font-variant-numeric: tabular-nums;
  font-variation-settings: 'opsz' 14;
}
.blk-count__label {
  font-size: var(--fs-body);
  font-weight: 500;
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

/* ══ BLOCK · note ═════════════════════════════════════════════════════════ */
.blk-note {
  font-size: var(--fs-label);
  font-weight: 500;
  line-height: 1.3;
  color: rgba(255, 255, 255, .82);
}
.card[data-tone='attention'] .blk-note { color: #FFE3B4; }

/* ══ BLOCK · status ═══════════════════════════════════════════════════════ */
.blk-status {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: var(--fs-body);
  font-weight: 500;
  color: var(--on-dark);
  min-width: 0;
}
.blk-status__dot {
  flex: none;
  width: 9px;
  height: 9px;
  border-radius: var(--r-pill);
  background: #8FE3B0;
  box-shadow: 0 0 0 3px rgba(143, 227, 176, .26);
}
.blk-status[data-tone='alert'] .blk-status__dot {
  background: #FFD08A;
  box-shadow: 0 0 0 3px rgba(255, 208, 138, .26);
}

/* ══ BLOCK · rows ═════════════════════════════════════════════════════════
   Four dresses, one row element. The breakdown carries a proportional track,
   the list carries a tone-coloured figure, the timeline carries a dot and a
   timestamp, the schedule carries a lead line. Sharing the element is what
   stops the Approvals breakdown and the Security log from looking like two
   different products on the same screen. */
.blk-rows {
  display: flex;
  flex-direction: column;
  gap: var(--s3);
  width: 100%;
  min-width: 0;
  flex: 0 1 auto;
  overflow: hidden;
  color: var(--on-dark);
}
.blk-rows[data-style='timeline'] { gap: var(--s4); }
.blk-rows[data-style='schedule'] { gap: var(--s4); }

.blk-row { display: flex; flex-direction: column; gap: 6px; min-width: 0; width: 100%; }
.blk-row__line { display: flex; align-items: center; gap: var(--s2); min-width: 0; width: 100%; }
.blk-row__title {
  flex: 1 1 auto;
  font-size: var(--fs-label);
  font-weight: 500;
  line-height: 1.25;
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.blk-row__value {
  flex: none;
  font-family: var(--font-num);
  font-weight: 700;
  font-size: var(--fs-label);
  font-variant-numeric: tabular-nums;
  letter-spacing: -.01em;
}
.blk-row[data-tone='alert'] .blk-row__value { color: #FFE0AE; }
.blk-row[data-tone='up']    .blk-row__value { color: #B6EFC9; }
.blk-row[data-tone='down']  .blk-row__value { color: #FFCFC2; }

/* the proportional track under a breakdown row */
.blk-row__track {
  display: block;
  width: 100%;
  height: 4px;
  border-radius: var(--r-pill);
  background: rgba(255, 255, 255, .22);
  overflow: hidden;
}
.blk-row__track i {
  display: block;
  height: 100%;
  border-radius: var(--r-pill);
  background: rgba(255, 255, 255, .9);
}

/* timeline */
.blk-rows[data-style='timeline'] .blk-row { flex-direction: row; align-items: flex-start; gap: var(--s3); }
.blk-row__dot {
  flex: none;
  width: 7px;
  height: 7px;
  margin-top: 6px;
  border-radius: var(--r-pill);
  background: rgba(255, 255, 255, .85);
}
.blk-row__stack { display: flex; flex-direction: column; gap: 3px; min-width: 0; flex: 1 1 auto; }
.blk-row__stack .blk-row__title { font-size: var(--fs-body); }
.blk-row__meta {
  font-size: var(--fs-label);
  font-weight: 400;
  line-height: 1.2;
  opacity: .82;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

/* schedule — a lead line, then the item */
.blk-row--sched { gap: 3px; }
.blk-row__lead {
  font-size: var(--fs-micro);
  font-weight: 650;
  letter-spacing: .04em;
  text-transform: uppercase;
  opacity: .72;
}
.blk-row--sched[data-tone='alert'] .blk-row__lead { color: #FFE3B4; opacity: 1; }
.blk-row--sched[data-tone='alert'] .blk-row__dot { background: #FFD08A; }
.blk-row--sched .blk-row__title { font-size: var(--fs-body); }

/* ══ BLOCK · bar ══════════════════════════════════════════════════════════ */
.blk-bar { display: flex; flex-direction: column; gap: var(--s2); width: 100%; color: var(--on-dark); }
.blk-bar__track {
  display: block;
  width: 100%;
  height: 8px;
  border-radius: var(--r-pill);
  background: rgba(255, 255, 255, .24);
  overflow: hidden;
}
.blk-bar__track i {
  display: block;
  height: 100%;
  border-radius: var(--r-pill);
  background: #FFFFFF;
}
.blk-bar__caption { font-size: var(--fs-label); font-weight: 600; }

/* ══ BLOCK · trend ════════════════════════════════════════════════════════
   Columns scaled from zero — see the note in ModuleCard.js. The current period
   is the solid one; the history behind it is deliberately quieter, because the
   card's job is "is this getting better", not "here are three bars". */
.blk-trend { display: flex; flex-direction: column; gap: var(--s4); width: 100%; flex: 1 1 auto; min-height: 0; }
.blk-trend__chart {
  display: flex;
  align-items: flex-end;
  gap: var(--s3);
  width: 100%;
  flex: 1 1 auto;
  min-height: 34px;
}
.blk-trend__col {
  flex: 1 1 0;
  display: block;
  min-width: 10px;
  border-radius: 5px 5px 2px 2px;
  background: rgba(255, 255, 255, .34);
}
.blk-trend__col.is-current { background: #FFFFFF; }
.blk-trend .blk-row--fig.is-current .blk-row__title,
.blk-trend .blk-row--fig.is-current .blk-row__value { font-weight: 700; }

/* ══ BLOCK · delta ════════════════════════════════════════════════════════ */
.blk-delta { display: flex; flex-direction: column; align-items: flex-start; gap: 6px; color: var(--on-dark); }
.blk-delta__chip {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 4px 10px 4px 8px;
  border-radius: var(--r-pill);
  background: rgba(255, 255, 255, .18);
  font-size: var(--fs-label);
  font-weight: 650;
  font-variant-numeric: tabular-nums;
}
/* A fall in mortality is good news and a rise in egg collection is good news,
   so the chip does NOT colour by direction — it colours by nothing, and the
   caption underneath says what the movement means. Green-for-up would be wrong
   on half the cards that use it. */
.blk-delta__arrow { font-size: 1.05em; line-height: 1; }
.blk-delta__caption { font-size: var(--fs-micro); opacity: .82; line-height: 1.3; }

/* ══ BLOCK · actions ══════════════════════════════════════════════════════
   Pills, not buttons — see the note in ModuleCard.js. Three is the cap the
   brief sets and the cap the layout enforces: a fourth would wrap onto a second
   line and turn a card into a menu. */
.blk-actions { display: flex; flex-direction: column; gap: var(--s2); width: 100%; }
.blk-action {
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 34px;
  padding: 7px var(--s3);
  border-radius: 10px;
  background: rgba(255, 255, 255, .17);
  box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .22);
  color: var(--on-dark);
  font-size: var(--fs-label);
  font-weight: 600;
  line-height: 1.2;
  text-align: center;
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.card:hover .blk-action { background: rgba(255, 255, 255, .23); }

/* ══ BLOCK · link ═════════════════════════════════════════════════════════ */
.blk-link {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  flex: none;
  font-size: var(--fs-label);
  font-weight: 650;
  color: var(--on-dark);
  opacity: .92;
}
.blk-link__arrow { transition: transform var(--t-fast) var(--ease); }
.card:hover .blk-link__arrow { transform: translateX(3px); }

/* ══════════════════════════════════════════════════════════════════════════
   FITTING THE BLOCKS TO THE SPACE
   ──────────────────────────────────────────────────────────────────────────
   A variant declares which sizes it supports, so no card is ever asked to draw
   itself somewhere absurd. What it IS asked to do is draw itself at 179px on a
   phone and 500px on a desktop, and these are the rules that make one set of
   blocks survive both. Everything below is a response to the card's own width
   or its own row count — never to the viewport, which the card cannot see.
   ══════════════════════════════════════════════════════════════════════════ */

/* ── one row tall ────────────────────────────────────────────────────────
   132px of content box under the label row. The Species card's stacked
   layout — two figures 44px apart — needs 164, so on a one-row card the figures
   sit side by side at the smaller size instead. */
.card[data-h='1'] .card__blocks { gap: var(--s2); }
.card[data-h='1'] .stat__value { font-size: var(--fs-stat-sm); }
.card[data-h='1'] .stat { min-width: 0; }
.card[data-h='1'] .stat__label { overflow: hidden; text-overflow: ellipsis; }
/* two heroes on a one-row card go side by side rather than stacking off the
   bottom edge — Species Overview at Medium, Diet's plans-and-kilograms card */
.card[data-h='1'] .card__blocks:has(.stat + .stat) { flex-direction: row; align-items: flex-end; gap: var(--s5); }
.card[data-h='1'] .blk-count__value { font-size: var(--fs-count-sm); }
.card[data-h='1'] .blk-rows { gap: var(--s2); }
.card[data-h='1'] .blk-rows[data-style='timeline'] { gap: var(--s3); }

/* THE 132px BUDGET.
   A one-row card is 164px tall, less 32px of padding, less a 28px label row and
   its 12px gap: 92px for everything else. That is not much, and three of these
   cards were over it by two or three pixels — enough for `overflow: hidden` to
   eat the last line, which is how "86% Completed" and "Review →" went missing
   from cards that otherwise looked finished.

   Rather than tune each card, the secondary type on a one-row card steps down
   one notch across the board. The figure stays big — it is the thing the card
   is for — and its caption, its bar label and its link get out of the way. */
.card[data-h='1'] .stat__label      { font-size: var(--fs-label); }
.card[data-h='1'] .blk-note         { font-size: var(--fs-micro); line-height: 1.25; }
.card[data-h='1'] .blk-link         { font-size: var(--fs-micro); }
.card[data-h='1'] .blk-bar__caption { font-size: var(--fs-micro); }
.card[data-h='1'] .blk-bar__track   { height: 7px; }
.card[data-h='1'] .blk-bar          { gap: 6px; }

/* Two or three metrics share a one-row card side by side, in equal columns
   rather than content-sized ones — so "Animals in Care" wrapping to two lines
   cannot steal the width from "Critical" beside it.

   FOUR DO NOT FIT IN A ROW. On an eight-column desktop a 2×1 card is 266px of
   content; four columns and three gaps leaves 54px each, and "Recovering",
   "Submissions" and "Admitted" are all wider than that with nowhere to break.
   So a four-up metric block folds into a 2×2 instead — 125px a column, two
   rows of 36px inside the 92px budget, and every label complete. Hospital's
   Live Status and Parivesh's Submission Status are the two cards this is for,
   and they are better in a square than in a squeezed row. */
.card[data-h='1'] .blk-metrics { gap: var(--s2) var(--s4); flex-wrap: nowrap; }
.card[data-h='1'] .metric { flex: 1 1 0; }
.card[data-h='1'] .blk-metrics[data-n='4'] { flex-wrap: wrap; gap: var(--s2) var(--s5); }
.card[data-h='1'] .blk-metrics[data-n='4'] .metric { flex: 1 1 40%; }
.card[data-h='1'] .metric__value { font-size: var(--fs-metric-sm); }
.card[data-h='1'] .metric__label { line-height: 1.15; }

/* A delta lies down on a one-row card: the chip and its caption side by side
   instead of stacked, which is 26px rather than 48 and leaves the figure above
   its full size. */
.card[data-h='1'] .blk-delta { flex-direction: row; align-items: center; gap: var(--s2); }
.card[data-h='1'] .blk-delta__caption { min-width: 0; }

/* A LONE BLOCK SINKS TO THE BOTTOM — UNLESS IT IS A LIST.
   `space-between` leaves a single child at the top, which is right on a Small
   card and wrong on a Large one: Hospital's Live Status at 4×2 had its four
   figures stuck under the label row with three hundred pixels of empty fill
   beneath them. Dropping it to the foot restores the artboard's own rhythm —
   the glyph at the top, the content at the bottom, the space between doing the
   work.

   A list is the exception, and Follow Up is why. Figures read as a block you
   can hang off the bottom edge; a list of tasks reads as something that starts
   under its heading, and pushed to the foot it leaves a hole where the eye
   expects the first row. It only became a lone child when "View All" was
   removed from it, which is exactly the sort of thing a general rule does not
   see coming. */
.card__blocks > :only-child:not(.blk-rows) { margin-top: auto; }

/* THREE BLOCKS DO NOT FIT IN 92px.
   A queue card is count → breakdown → link, which is three things where there
   is room for two. Rather than refuse the size (the brief asks for these at
   Medium) the card drops its least valuable part: the link, because the whole
   card is already a link, and the third and later breakdown rows, because two
   named figures and a total still says what the queue is made of.

   Both rules are conditional on what the card actually holds, so a card that
   fits is never trimmed — Species' Recent Updates keeps all three of its rows
   at Medium, because it has no count above them. */
.card[data-h='1'] .card__blocks:has(.blk-rows, .blk-metrics) .blk-link { display: none; }
.card[data-h='1'] .card__blocks:has(.blk-count) .blk-rows > .blk-row:nth-child(n+3) { display: none; }

/* Actions go side by side on a one-row card. Stacked, the third pill falls off
   the bottom edge; in a row, three of them share 342px and each still holds
   "Request Medicine". */
.card[data-h='1'] .blk-actions { flex-direction: row; gap: 6px; }
.card[data-h='1'] .blk-action {
  flex: 1 1 0;
  min-height: 34px;
  padding-inline: 7px;
  font-size: var(--fs-micro);
  /* "Request Medicine" gets two lines rather than an ellipsis — a truncated
     verb is not an action anyone can be sure of. */
  white-space: normal;
  line-height: 1.15;
}

/* A 1×1 card — Small — is 179px square on the artboard and 147px on a
   twelve-column desktop. Only the compact blocks are offered there, which is
   the supportedSizes list doing its job; these keep the ones that ARE offered
   from crowding. */
.card[data-w='1'][data-h='1'] .blk-count__value { font-size: var(--fs-count-sm); }
.card[data-w='1'][data-h='1'] .card__blocks { gap: var(--s1); }
.card[data-w='1'][data-h='1'] .blk-note { font-size: var(--fs-micro); }
.card[data-w='1'][data-h='1'] .card__label-row .card__icon { --icon-size: 24px; }

/* ── A MODULE NAME IS NOT ALLOWED TO BE TRUNCATED ────────────────────────
   Eight of the seventeen doors came out as "Specie…", "Admini…", "Approv…",
   "Comm…". A door whose only job is to say which module it is, and which
   cannot finish saying it, has failed at the one thing it does.

   Figma draws the label at 20px on a 179px card and that stands — the fix is
   to let it use the second line it has always had room for, since the door's
   `justify-between` column leaves eighty spare pixels under a 44px glyph.
   Below 165px the card is narrower than anything the artboard drew, so there
   the label also steps down to body size; that is not a deviation from Figma,
   it is a width Figma never specified. */
@container card (max-width: 300px) {
  .card__body > .card__name {
    white-space: normal;
    line-height: 1.18;
    width: 100%;
    /* "Communication" is one word of 108px and the box is 94px, so wrapping
       alone cannot save it — every other module name has a space to break at.
       Hyphenation breaks it at a syllable ("Communi-cation") instead of at an
       ellipsis. The break point itself is a soft hyphen in the module's name —
       see modules.js — because `hyphens: auto` needs a dictionary the browser
       may not have. */
  }
}
/* The ladder below is measured against the card's OWN content box, not the
   viewport, and each rung is a width the artboard does not contain:

     ≥146px   Figma's 20px, unchanged. The artboard's 179px card is 147px of
              content, so the design's own card is on this rung and stays there.
     ≤145px   body size. An eight-column desktop makes a Small card 145px wide,
              which is narrower than anything in the file.
     ≤110px   label size. A twelve-column wall display, and a phone in portrait.

   "Species Management" is the string that sets these numbers: it is the
   longest module name, and at each rung its longer word clears the box. */
@container card (max-width: 145px) {
  .card__body > .card__name { font-size: var(--fs-body); }
}
@container card (max-width: 110px) {
  .card__body > .card__name { font-size: var(--fs-label); }
}

/* A panel's head is a label, not a card name. At the artboard's own 374px
   Species card it stays at Figma's 20px; on anything narrower it steps down,
   because "Requires Attention" beside a warning chip does not fit a 298px card
   at 20px and a truncated heading is worse than a smaller one. */
@container card (max-width: 360px) {
  .card__label-row .card__name { font-size: var(--fs-body); }
}

/* ── narrow cards ───────────────────────────────────────────────────────*/
@container card (max-width: 200px) {
  /* "12 Critical Cases" will not sit on one line in 115px, so the figure takes
     its own line and the phrase follows underneath. */
  .blk-count { flex-direction: column; align-items: flex-start; gap: 1px; }
  .blk-count__label { white-space: normal; line-height: 1.2; }
  /* the whole card is the link at this size */
  .blk-link { display: none; }
  /* The glyph goes. On a 115px card the icon, the title and the warning chip
     are competing for one line, and the card's own fill already says which
     module this is — the words do not. */
  .card__label-row .card__icon { display: none; }
  .card__label-row { align-items: flex-start; gap: 7px; }
  .card__label-row .card__name { font-size: var(--fs-label); white-space: normal; line-height: 1.2; }
  .card__flag { width: 18px; height: 18px; }
  .card__flag-icon { width: 11px; height: 11px; }
}

@container card (max-width: 299px) {
  .card__blocks { gap: var(--s2); }
  /* "Access request approved" is 3px wider than a two-column phone card. A
     timeline row already has a second line for its meta, so it can have one for
     its title too — an ellipsis in an activity feed hides the verb. */
  .blk-row__stack .blk-row__title { white-space: normal; line-height: 1.2; }
  .blk-metrics { gap: var(--s2) var(--s3); }
  .blk-rows { gap: var(--s2); }
  .blk-rows[data-style='timeline'], .blk-rows[data-style='schedule'] { gap: var(--s3); }
  .blk-actions { gap: 6px; }
  .blk-action { min-height: 30px; font-size: var(--fs-micro); }
  /* four metrics will not sit in a row at this width, so let them fall into
     two columns rather than shrink to nothing */
  .blk-metrics[data-n='4'] .metric, .blk-metrics[data-n='3'] .metric { flex: 1 1 44%; }
}

/* ── wide cards ─────────────────────────────────────────────────────────
   At Large and Full there is room to let the metrics breathe and to put a
   breakdown into two columns rather than leaving half the card empty. */
@container card (min-width: 560px) {
  .card__blocks { gap: var(--s4); }
  .blk-metrics { gap: var(--s4) var(--s8); }
  .blk-rows[data-style='breakdown'], .blk-rows[data-style='timeline'] {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: var(--s3) var(--s8);
  }
  .blk-actions { flex-direction: row; }
  .blk-action { flex: 1 1 0; }
}

@supports not (container-type: inline-size) {
  .card__blocks { gap: var(--s3); }
}
</style>
<style>
/* ══ css/edit.css ══ */
/* ══════════════════════════════════════════════════════════════════════════
   EDIT MODULES MODE
   ──────────────────────────────────────────────────────────────────────────
   "Do not overuse borders. Keep the editing controls subtle and clean."

   So edit mode is announced by three things and no chrome: the page desaturates
   very slightly so the cards read as objects rather than destinations, each
   removable card grows a remove control, and an Add Widget tile appears at the
   end of the grid. There is no outline around the grid, no toolbar, no banner.

   NO JIGGLE. iOS wiggles its icons because a phone home screen has no other way
   to say "these are movable now" — there is no cursor, no hover, no room for a
   caption. This product has a section header that literally changes to read
   "Edit Modules", a Done button, and remove controls on every card. A command
   centre that vibrates at a curator is a command centre that looks broken, and
   a continuous animation on fourteen cards is also the one thing on this page
   that would drain an iPad. A single settle on entry says the same thing once.
   ══════════════════════════════════════════════════════════════════════════ */

body.is-editing .updates,
body.is-editing .search {
  opacity: .5;
  filter: saturate(.72);
  pointer-events: none;
  transition: opacity var(--t-base) var(--ease), filter var(--t-base) var(--ease);
}

.updates, .search {
  transition: opacity var(--t-base) var(--ease), filter var(--t-base) var(--ease);
}

/* The one-shot settle, staggered by index so the grid acknowledges the mode
   left-to-right rather than flashing at once.

   TWO THINGS HERE ARE LOAD-BEARING. It runs on the CARD, not the slot, because
   the slot's transform belongs to the FLIP reflow — an animation on the same
   property would win the cascade and cards would stop animating to their new
   positions. And it has NO fill mode: `both` or `forwards` would leave the
   final keyframe latched on forever, permanently overriding any transform set
   later from script. */
body.is-editing .slot > .card {
  animation: settle var(--t-slow) var(--ease-out);
  animation-delay: calc(var(--i, 0) * 22ms);
}
@keyframes settle {
  0%   { transform: scale(1) rotate(0deg); }
  42%  { transform: scale(.972) rotate(-.55deg); }
  72%  { transform: scale(1.004) rotate(.2deg); }
  100% { transform: scale(1) rotate(0deg); }
}

body.is-editing .card { cursor: grab; }
body.is-editing .card:active { cursor: grabbing; transform: none; }

/* In edit mode a card must not respond to a pointer as if it were a link —
   it is a thing being moved, and the lift belongs to the drag proxy. */
body.is-editing .card:hover { transform: none; box-shadow: var(--e1); }

/* THE TOUCH-ACTION PROBLEM, AND WHY IT IS SOLVED IN TWO PLACES.
   `touch-action: none` on the cards would make dragging reliable and make the
   page impossible to scroll on an iPad — the grid is taller than the screen, so
   a finger landing on a card and swiping up must still scroll. But leaving
   scrolling on means Safari can begin one before we know a drag was intended,
   and once a scroll has started nothing cancels it.

   The resolution is the long press. A finger that has been still for 200ms is a
   finger that is not scrolling, so at that moment it is safe to take the
   gesture: the body switches to `touch-action: none` AND a non-passive
   `touchmove` handler starts calling preventDefault. Before that moment the
   page scrolls normally. */
body.is-editing .slot { touch-action: manipulation; }
body.is-dragging,
body.is-dragging .slot { touch-action: none; }
body.is-dragging { -webkit-user-select: none; user-select: none; cursor: grabbing; }

/* ── remove control ───────────────────────────────────────────────────────
   A minus, not a cross. A cross says "close"; a minus says "take this one
   away", which is what it does — and it is what a user coming off iPadOS
   already reads. Sits half outside the card corner so it never covers content,
   with an invisible 44px hit area so a thumb can find it. */
.slot__remove {
  position: absolute;
  top: -9px;
  left: -9px;
  z-index: 6;
  display: grid;
  place-items: center;
  width: 28px;
  height: 28px;
  padding: 0;
  border: 2px solid var(--canvas-2);
  border-radius: var(--r-pill);
  background: var(--ink);
  color: #fff;
  cursor: pointer;
  box-shadow: 0 2px 8px rgba(16, 55, 63, .3);
  animation: pop-in var(--t-base) var(--ease-out) both;
}
.slot__remove::before {
  /* the real touch target, larger than the visible button */
  content: '';
  position: absolute;
  inset: -8px;
  border-radius: inherit;
}
.slot__remove .icon { width: 16px; height: 16px; }
.slot__remove:hover { background: var(--clay); }
.slot__remove:active { transform: scale(.9); }

@keyframes pop-in {
  from { opacity: 0; transform: scale(.4); }
  to   { opacity: 1; transform: scale(1); }
}

/* A core card cannot be removed, and says so with a lock rather than with a
   disabled minus — a greyed-out button invites a tap that will do nothing. */
.slot__locked {
  position: absolute;
  top: -9px;
  left: -9px;
  z-index: 6;
  display: grid;
  place-items: center;
  width: 28px;
  height: 28px;
  border-radius: var(--r-pill);
  border: 2px solid var(--canvas-2);
  background: var(--petrol-200);
  color: var(--petrol-800);
  animation: pop-in var(--t-base) var(--ease-out) both;
}
.slot__locked .icon { width: 14px; height: 14px; }

/* A card being carried should not also be showing its remove button. */
.slot.is-source .slot__remove,
.slot.is-source .slot__locked { display: none; }

/* ── the add tile ─────────────────────────────────────────────────────────
   Lives in the grid as the last item so it is always where the next card will
   land, rather than in a fixed bar the user has to look away to find. */
.slot-add {
  grid-column: span 1;
  grid-row: span 1;
}

.add-tile {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: var(--s2);
  width: 100%;
  height: 100%;
  padding: var(--s4);
  border: 1.5px dashed color-mix(in srgb, var(--petrol-400) 34%, transparent);
  border-radius: var(--r-card);
  background: color-mix(in srgb, var(--surface) 45%, transparent);
  color: var(--petrol-500);
  font-size: var(--fs-label);
  font-weight: 600;
  cursor: pointer;
  animation: pop-in var(--t-base) var(--ease-out) both;
  transition: background var(--t-fast) var(--ease),
              border-color var(--t-fast) var(--ease),
              color var(--t-fast) var(--ease);
}
.add-tile:hover {
  background: color-mix(in srgb, var(--surface) 85%, transparent);
  border-color: var(--petrol-400);
  color: var(--petrol-700);
}
.add-tile:active { transform: scale(.97); }
.add-tile__ring {
  display: grid;
  place-items: center;
  width: 40px;
  height: 40px;
  border-radius: var(--r-pill);
  background: color-mix(in srgb, var(--petrol-400) 12%, transparent);
}
.add-tile__ring .icon { width: 21px; height: 21px; }

/* ── keyboard reordering ──────────────────────────────────────────────────
   A card picked up with the keyboard gets the same lift the pointer gives it,
   because the two interactions should not look like different features. */
.slot.is-grabbed .card {
  box-shadow: var(--e-drag);
  transform: scale(1.03);
  transition: transform var(--t-base) var(--ease-out), box-shadow var(--t-base) var(--ease);
}

/* A live region has to be in the document to be announced, and out of the way
   to not be laid out. */
.a11y-live {
  position: absolute;
  width: 1px; height: 1px;
  margin: -1px; padding: 0;
  overflow: hidden;
  clip: rect(0 0 0 0);
  white-space: nowrap;
}

/* ── edit-mode hint ───────────────────────────────────────────────────────*/
.edit-hint {
  display: flex;
  align-items: center;
  gap: var(--s2);
  margin: calc(var(--s3) * -1) 0 var(--s4);
  font-size: var(--fs-label);
  color: var(--ink-3);
  animation: pop-in var(--t-base) var(--ease-out) both;
}
.edit-hint .icon { width: 15px; height: 15px; color: var(--ink-4); }


/* ── resize control ───────────────────────────────────────────────────────
   Bottom-right, diagonally opposite the remove control, so the two can never
   be confused by a thumb. Same visual weight as remove — neither is the
   primary action in edit mode; dragging is. */
.slot__resize {
  position: absolute;
  right: -9px;
  bottom: -9px;
  z-index: 6;
  display: grid;
  place-items: center;
  width: 28px;
  height: 28px;
  padding: 0;
  border: 2px solid var(--canvas-2);
  border-radius: var(--r-pill);
  background: var(--petrol-600);
  color: #fff;
  cursor: pointer;
  box-shadow: 0 2px 8px rgba(16, 55, 63, .3);
  animation: pop-in var(--t-base) var(--ease-out) both;
}
.slot__resize::before { content: ''; position: absolute; inset: -8px; border-radius: inherit; }
.slot__resize .icon { width: 14px; height: 14px; }
.slot__resize:hover { background: var(--petrol-800); }
.slot__resize:active { transform: scale(.9); }
.slot.is-source .slot__resize { display: none; }

/* the popover it opens */
.size-pop {
  position: fixed;
  z-index: calc(var(--z-drag) + 10);
  padding: var(--s4);
  border-radius: 18px;
  background: rgba(255, 255, 255, .94);
  box-shadow: var(--e2), 0 24px 56px -18px rgba(16, 55, 63, .34);
  -webkit-backdrop-filter: blur(14px) saturate(1.1);
  backdrop-filter: blur(14px) saturate(1.1);
  opacity: 0;
  transform: translateY(-6px) scale(.97);
  transform-origin: top center;
  transition: opacity var(--t-fast) var(--ease-out), transform var(--t-fast) var(--ease-out);
}
.size-pop.is-open { opacity: 1; transform: translateY(0) scale(1); }
.size-pop[hidden] { display: none !important; }
.size-pop .size-picker__row { flex-wrap: nowrap; }
</style>

/* ══ css/profile-menu.css ══ */
/* ══════════════════════════════════════════════════════════════════════════

    height: 86dvh;
    grid-template-columns: 240px minmax(0, 1fr);
    grid-template-areas:
      'head    head'
      'side    body';
  }

  .sheet__head { border-bottom: 1px solid var(--line); }

  .sheet__side {
    padding: var(--s4) var(--s4) var(--s4) var(--pad-page);
    border-right: 1px solid var(--line);
  }

  /* both panes are live, so neither of the stacking rules applies */
  .sheet__body { grid-area: body; display: block; padding: 0 var(--s5) var(--s8); }
  .sheet:not(.is-detail) .sheet__body { display: block; }
  .sheet.is-detail .sheet__side { display: flex; }
  .detail-back { display: none; }
  .detail-head { padding-top: var(--s5); }

  /* the bar starts at the gallery's left edge, so the rail stays usable while
     it is up — you can keep browsing modules with a widget already chosen */
  .sheet__foot { left: 240px; }
  .widget__meta { max-width: 250px; }
}

/* ══ DESKTOP · the sheet becomes a centred panel · 1024px and up ═════════
   A presentation change, not a layout one: the panes were already side by side
   at 768. Above 1024 there is room to browse without covering the page, so the
   bottom sheet lifts off the edge and becomes a floating card. */
@media (min-width: 1024px) {
  .sheet {
    top: 50%;
    left: 50%;
    right: auto;
    bottom: auto;
    /* the same 1024 the page is capped at, so the gallery never overhangs the
       product it is adding to */
    width: min(1024px, calc(100vw - 64px));
    height: min(860px, calc(100dvh - 64px));
    border-radius: 24px;
    translate: -50% -50%;
    transform: translateY(24px) scale(.985);
    grid-template-columns: 316px minmax(0, 1fr);
  }
  .sheet.is-open { transform: translateY(0) scale(1); }
  .sheet__handle { display: none; }

  .sheet__head { padding: var(--s6) var(--s8) var(--s5); }
  .sheet__side { padding: var(--s5) var(--s5) var(--s5) var(--s8); }
  .sheet-search input { height: 44px; }
  .sheet__body { padding: 0 var(--s8) var(--s8); }
  .detail-head { padding-top: var(--s6); }

  .sheet__foot { left: 316px; padding: var(--s4) var(--s8); border-radius: 0 0 24px 0; }
  .widget__meta { max-width: 280px; }
}

/* ══ mobile ══════════════════════════════════════════════════════════════ */
@media (max-width: 767px) {
  .sheet { height: 94dvh; }
  .widget-row { gap: var(--s3); }
  .sheet__foot { grid-template-columns: minmax(0, 1fr); gap: var(--s3); }

  .sheet__actions .btn-primary { flex: 1; justify-content: center; }
}

/**
 * THE PACKER
 * ───────────────────────────────────────────────────────────────────────────
 * Turns an ordered list of cards into concrete {x, y, w, h} grid positions.
 *
 * WHY A PACKER AND NOT CSS AUTO-PLACEMENT. Three candidates were on the table:
 *
 *   1. DOM order + `grid-auto-flow: row`. Predictable, but a 3-wide card that
 *      cannot fit in the tail of a row leaves a visible hole, and the grid ends
 *      up full of gaps the moment sizes are mixed.
 *   2. DOM order + `grid-auto-flow: row dense`. No holes, but the browser owns
 *      the placement and will not tell you what it decided. Drag-and-drop needs
 *      to know where every card actually IS to work out where a drop should
 *      land, and "ask the browser" is not an available call.
 *   3. Compute it. Chosen.
 *
 * First-fit packing gives the same hole-free result as `dense` while leaving
 * the positions in our hands — so the drag controller can hit-test against real
 * coordinates, the picker can preview a layout before committing it, and the
 * saved file stays a plain ordered list.
 *
 * WHAT IS PERSISTED IS THE ORDER, NOT THE COORDINATES. Coordinates are derived,
 * every time, from (order × column count). That is what makes an iPad rotation
 * free: 6 columns becomes 4, every card re-resolves its span, the packer runs
 * again, and the layout is correct with nothing stored, migrated or repaired.

  /* occupancy grid, grown a row at a time — the layout is never taller than a
     few dozen rows so a plain array of boolean arrays beats anything clever */
  const grid = []
  const rowAt = (y) => {
    while (grid.length <= y) grid.push(new Array(cols).fill(false))

/**
 * Fill in what every variant has in common so the catalogue above only has to
 * state what is unusual. A missing `treatment` is `gradient`; a missing
 * `priority` is `optional`; a missing `data.blocks` is an empty card.
 */
const CARD_VARIANTS = [...DOORS, ...VARIANTS].map((v) => ({
  treatment: 'gradient',
  priority: 'optional',
  ...v,
  data: { blocks: [], ...(v.data || {}) },
}))

/**
 * id → variant. The saved layout stores variant ids, so this is the hot path.
 *
 * NULL PROTOTYPE, DELIBERATELY. A plain object inherits from Object.prototype,
 * so `VARIANT_BY_ID['toString']` would return a function rather than undefined,
 * `getVariant` would hand back something truthy, and repair() would then read
 * `.supportedSizes` off it and throw — during module evaluation, before app.js
 * runs. One junk value in localStorage would take down the whole page.
 */
const VARIANT_BY_ID = Object.assign(
  Object.create(null),
  Object.fromEntries(CARD_VARIANTS.map((v) => [v.id, v])),
)

function getVariant(id) {
  return (typeof id === 'string' && VARIANT_BY_ID[id]) || null
}

/**
 * A module's cards in the order the picker shows them: the door first, then by
 * purpose, then by priority. That ordering is the reason a module's shelf reads
 * as a sentence — here is the module, here is what it knows, here is what is
 * waiting, here is what you can do, here is what just happened.
 */
function variantsForModule(moduleId) {
  return CARD_VARIANTS
    .filter((v) => v.moduleId === moduleId)
    .sort((a, b) =>
      (PURPOSES[a.purpose]?.rank ?? 9) - (PURPOSES[b.purpose]?.rank ?? 9) ||
      PRIORITY_RANK[a.priority] - PRIORITY_RANK[b.priority] ||
      a.name.localeCompare(b.name))
}

/** Every card the default home page is allowed to seed itself from. */
function primaryVariants() {
  return CARD_VARIANTS.filter((v) => v.priority === 'primary')
}

  __x.VARIANT_BY_ID = VARIANT_BY_ID;
  __x.getVariant = getVariant;
  __x.variantsForModule = variantsForModule;

/**
 * A MINIMAL OBSERVABLE STORE
 * ───────────────────────────────────────────────────────────────────────────
 * Thirty lines instead of a framework. State goes in one place, mutations go
 * through one function, and anything that cares subscribes. That is the entire
 * contract, and for a page with one grid and one sheet it is enough.
 *
 * The one non-obvious rule: `set` REPLACES the slice it is given rather than
 * deep-merging it. Deep merges are where stores like this quietly go wrong —
 * an array that should have shrunk instead keeps its tail. Callers hand over
 * the new value outright.
 */
function createStore(initial) {
  let state = initial
  const listeners = new Set()

  return {
    get: () => state,

    /**
     * @param {object|function} patch  a partial slice, or (state) => partial
     * @param {object} meta            passed to listeners; the render layer uses
     *                                 `meta.reason` to decide whether a change
     *                                 needs a full rebuild or a cheap touch-up
     */
    set(patch, meta = {}) {
      const next = typeof patch === 'function' ? patch(state) : patch
      const prev = state
      state = { ...state, ...next }
      for (const fn of listeners) fn(state, prev, meta)
    },

    subscribe(fn) {
      listeners.add(fn)
      return () => listeners.delete(fn)
    },
  }
}

 * the whole document. Positions are not in it — they are derived by the packer

 * saved layout be correct on a phone, an iPad in both orientations and a wall
 * display without a single stored coordinate.

 * that no longer exists, or a size a card no longer offers. Rather than throw —
 * which on a home page means a blank screen — `repair()` drops what it cannot
 * resolve and coerces what it can, then reports what it did. A user who last

 * handful of retired ids and keep the rest — but it is not WANTED: it leaves

  /* THE DEFAULT HOME PAGE IS A BALANCE, NOT A DUMP.
     ─────────────────────────────────────────────────────────────────────────
     There are 71 cards in the catalogue and 15 of them are here. The brief is
     explicit that not every widget goes on the home page automatically, and the

     no hierarchy, which is the same as having no home page.

     a command centre has to answer before anyone has typed anything:

                  Mortality · Eggs · Administer · Users · Security ·

       UNDERSTAND Species Statistics
       ATTENTION  Pending Approvals

     — there is no third state and no exception list, so the rule can be checked
     rather than remembered. `antz.checkDefaults()` in the console asserts the
     two files still agree in both directions: nothing primary is missing from
     this list, and nothing on this list has quietly stopped being primary,
     stopped existing, or lost the size it is seeded at.

  { variantId: 'hospital.photo',      size: 'medium' },   /* NAVIGATE  */
  { variantId: 'species.stats',       size: 'large'  },   /* UNDERSTAND */
  { variantId: 'pharmacy.default',    size: 'small'  },   /* NAVIGATE  */
  { variantId: 'diet.photo',          size: 'medium' },   /* NAVIGATE  */

 * MODULE CARD
 * ───────────────────────────────────────────────────────────────────────────
 * One renderer for every card in the product. It takes a variant definition and
 * a resolved span and returns an element; it does not know whether that element
 * is going on the home page, into a drag proxy, or into a preview frame in the
 * picker.
 *

 * required to look like the real thing, and the only way to keep that true as
 * the design changes is for the preview to BE the card. There is no second
 * renderer here to drift out of step with the first.
 *
 * ═══ THE CARD IS A COMPOSITION, NOT A DESIGN ═══════════════════════════════
 *
 * There are 71 card variants and there is no `switch` with 71 arms. A card is
 * a FILL — the module's gradient or a photograph — carrying a HEAD and then a
 * list of BLOCKS, and a variant is just which blocks in which order:
 *
 *   Species Statistics    head · hero · hero
 *   Hospital Capacity     head · hero · bar
 *   Medical Requests      head · count · rows(breakdown) · link
 *   Medical Activity      head · rows(timeline) · link
 *   Mortality Overview    head · hero · delta
 *   Pharmacy Actions      head · actions
 *
