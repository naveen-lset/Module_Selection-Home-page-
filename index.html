<style>
/* ══ css/edit.css ══ */
/* ══════════════════════════════════════════════════════════════════════════
   EDIT MODULES MODE
   ──────────────────────────────────────────────────────────────────────────
   "Do not overuse borders. Keep the editing controls subtle and clean."

   So edit mode is announced by four things and no chrome: the page desaturates
   very slightly so the cards read as objects rather than destinations, the
   cards take up a continuous jiggle, each removable card grows a remove
   control, and Add Module appears in the header. There is no outline around the
   grid, no toolbar, no banner.

   THE JIGGLE, AND WHY IT IS THIS SMALL. An earlier pass argued against having
   one at all: this product has a header that changes to read "Edit Modules", a
   Done button and remove controls, so the state is already legible. That was
   true and still missed the point — those all say "the PAGE is in edit mode",
   and the jiggle is the only one that says "THIS CARD is the thing you can
   move". It is the affordance, not the announcement.

   The amplitude is the whole argument. Nothing here exceeds 0.75° of rotation
   or 0.6px of travel, which is under what the eye resolves as motion on a
   stationary object and over what it resolves as life. Push it to the 3° and
   5px that a naive "shake" keyframe uses and a command centre looks broken —
   the cards read as malfunctioning rather than as editable.

   Three keyframe sets, not one, and a per-card delay computed from the card's
   uid in ModuleGrid.js. Fourteen cards on one synchronised animation is not
   fourteen jiggling cards, it is one jiggling grid, and it looks like the page
   is vibrating.

   THE BATTERY OBJECTION IS REAL and is answered rather than dismissed: only
   `transform` is animated, so the whole thing lives on the compositor and never
   touches layout or paint; it runs only inside edit mode, which is transient;
   `prefers-reduced-motion` stops it via the global block; and it is paused
   outright when the tab is hidden — see `body.is-hidden`.
   ══════════════════════════════════════════════════════════════════════════ */

body.is-editing .updates,
body.is-editing .search {
  opacity: .5;
  filter: saturate(.72);
  pointer-events: none;
  transition: opacity var(--t-base) var(--ease), filter var(--t-base) var(--ease);
}

.updates, .search {
  transition: opacity var(--t-base) var(--ease), filter var(--t-base) var(--ease);
}

/* TWO THINGS HERE ARE LOAD-BEARING, and were load-bearing for the one-shot
   settle this replaced. It runs on the CARD, not the slot, because the slot's
   transform belongs to the FLIP reflow — an animation on the same property
   would win the cascade and cards would stop animating to their new positions.
   And it has NO fill mode: `both` or `forwards` would latch the final keyframe
   on forever, permanently overriding any transform set later from script. */
body.is-editing .slot > .card {
  animation: jiggle-a var(--jiggle-dur, 1.9s) ease-in-out infinite;
  animation-delay: var(--jiggle-delay, 0ms);
  will-change: transform;
}
body.is-editing .slot[data-jiggle='b'] > .card { animation-name: jiggle-b; }
body.is-editing .slot[data-jiggle='c'] > .card { animation-name: jiggle-c; }

/* The card being dragged must not jiggle — the proxy follows the pointer and a
   second transform underneath it would fight the drag. The source slot is
   invisible during a drag anyway, but stopping it here means the transform is
   released cleanly rather than being overridden. */
body.is-editing .slot.is-source > .card,
body.is-editing .slot.is-grabbed > .card { animation: none; }

/* Paused rather than stopped when the tab goes away: `paused` keeps the
   compositor from doing any work at all, and resuming picks up mid-cycle so
   coming back to the tab does not re-synchronise every card into one beat. */
body.is-hidden .slot > .card { animation-play-state: paused; }

/* Three phases of the same tiny idea, offset from each other so no two cards
   are ever at the same point in the same shape. Rotation does most of the work
   — a pure translate reads as sliding, and a pure rotate as pivoting; together
   at this amplitude they read as "held loosely". */
@keyframes jiggle-a {
  0%   { transform: rotate(-.62deg) translate(0, .18px); }
  25%  { transform: rotate(.34deg)  translate(.22px, -.30px); }
  50%  { transform: rotate(.60deg)  translate(0, .26px); }
  75%  { transform: rotate(-.30deg) translate(-.22px, -.18px); }
  100% { transform: rotate(-.62deg) translate(0, .18px); }
}
@keyframes jiggle-b {
  0%   { transform: rotate(.55deg)  translate(.18px, -.22px); }
  25%  { transform: rotate(-.40deg) translate(0, .30px); }
  50%  { transform: rotate(-.70deg) translate(-.20px, -.14px); }
  75%  { transform: rotate(.36deg)  translate(.16px, .24px); }
  100% { transform: rotate(.55deg)  translate(.18px, -.22px); }
}
@keyframes jiggle-c {
  0%   { transform: rotate(-.44deg) translate(.20px, .24px); }
  25%  { transform: rotate(.58deg)  translate(-.16px, -.20px); }
  50%  { transform: rotate(.30deg)  translate(.14px, .28px); }
  75%  { transform: rotate(-.66deg) translate(-.18px, -.12px); }
  100% { transform: rotate(-.44deg) translate(.20px, .24px); }
}

body.is-editing .card { cursor: grab; }
body.is-editing .card:active { cursor: grabbing; transform: none; }

/* In edit mode a card must not respond to a pointer as if it were a link —
   it is a thing being moved, and the lift belongs to the drag proxy. */
body.is-editing .card:hover { transform: none; box-shadow: var(--e1); }

/* THE TOUCH-ACTION PROBLEM, AND WHY IT IS SOLVED IN TWO PLACES.
   `touch-action: none` on the cards would make dragging reliable and make the
   page impossible to scroll on an iPad — the grid is taller than the screen, so
   a finger landing on a card and swiping up must still scroll. But leaving
   scrolling on means Safari can begin one before we know a drag was intended,
   and once a scroll has started nothing cancels it.

   The resolution is the long press. A finger that has been still for 200ms is a
   finger that is not scrolling, so at that moment it is safe to take the
   gesture: the body switches to `touch-action: none` AND a non-passive
   `touchmove` handler starts calling preventDefault. Before that moment the
   page scrolls normally. */
body.is-editing .slot { touch-action: manipulation; }
body.is-dragging,
body.is-dragging .slot { touch-action: none; }
body.is-dragging { -webkit-user-select: none; user-select: none; cursor: grabbing; }

/* ── remove control ───────────────────────────────────────────────────────
   A minus, not a cross. A cross says "close"; a minus says "take this one
   away", which is what it does — and it is what a user coming off iPadOS
   already reads. Sits half outside the card corner so it never covers content,
   with an invisible 44px hit area so a thumb can find it. */
.slot__remove {
  position: absolute;
  top: -9px;
  left: -9px;
  z-index: 6;
  display: grid;
  place-items: center;
  width: 28px;
  height: 28px;
  padding: 0;
  border: 2px solid var(--canvas-2);
  border-radius: var(--r-pill);
  background: var(--ink);
  color: #fff;
  cursor: pointer;
  box-shadow: 0 2px 8px rgba(16, 55, 63, .3);
  animation: pop-in var(--t-base) var(--ease-out) both;
}
.slot__remove::before {
  /* the real touch target, larger than the visible button */
  content: '';
  position: absolute;
  inset: -8px;
  border-radius: inherit;
}
.slot__remove .icon { width: 16px; height: 16px; }
.slot__remove:hover { background: var(--clay); }
.slot__remove:active { transform: scale(.9); }

@keyframes pop-in {
  from { opacity: 0; transform: scale(.4); }
  to   { opacity: 1; transform: scale(1); }
}

/* A core card cannot be removed, and says so with a lock rather than with a
   disabled minus — a greyed-out button invites a tap that will do nothing. */
.slot__locked {
  position: absolute;
  top: -9px;
  left: -9px;
  z-index: 6;
  display: grid;
  place-items: center;
  width: 28px;
  height: 28px;
  border-radius: var(--r-pill);
  border: 2px solid var(--canvas-2);
  background: var(--petrol-200);
  color: var(--petrol-800);
  animation: pop-in var(--t-base) var(--ease-out) both;
}
.slot__locked .icon { width: 14px; height: 14px; }

/* A card being carried should not also be showing its remove button. */
.slot.is-source .slot__remove,
.slot.is-source .slot__locked { display: none; }

/* ── the add tile ─────────────────────────────────────────────────────────
   Lives in the grid as the last item so it is always where the next card will
   land, rather than in a fixed bar the user has to look away to find. */

/* ── keyboard reordering ──────────────────────────────────────────────────
   A card picked up with the keyboard gets the same lift the pointer gives it,
   because the two interactions should not look like different features. */
.slot.is-grabbed .card {
  box-shadow: var(--e-drag);
  transform: scale(1.03);
  transition: transform var(--t-base) var(--ease-out), box-shadow var(--t-base) var(--ease);
}

/* A live region has to be in the document to be announced, and out of the way
   to not be laid out. */
.a11y-live {
  position: absolute;
  width: 1px; height: 1px;
  margin: -1px; padding: 0;
  overflow: hidden;
  clip: rect(0 0 0 0);
  white-space: nowrap;
}

/* ── edit-mode hint ───────────────────────────────────────────────────────*/
.edit-hint {
  display: flex;
  align-items: center;
  gap: var(--s2);
  margin: calc(var(--s3) * -1) 0 var(--s4);
  font-size: var(--fs-label);
  color: var(--ink-3);
  animation: pop-in var(--t-base) var(--ease-out) both;
}
.edit-hint .icon { width: 15px; height: 15px; color: var(--ink-4); }


/* ── resize control ───────────────────────────────────────────────────────
   Bottom-right, diagonally opposite the remove control, so the two can never
   be confused by a thumb. Same visual weight as remove — neither is the
   primary action in edit mode; dragging is. */
.slot__resize {
  position: absolute;
  right: -9px;
  bottom: -9px;
  z-index: 6;
  display: grid;
  place-items: center;
  width: 28px;
  height: 28px;
  padding: 0;
  border: 2px solid var(--canvas-2);
  border-radius: var(--r-pill);
  background: var(--petrol-600);
  color: #fff;
  cursor: pointer;
  box-shadow: 0 2px 8px rgba(16, 55, 63, .3);
  animation: pop-in var(--t-base) var(--ease-out) both;
}
.slot__resize::before { content: ''; position: absolute; inset: -8px; border-radius: inherit; }
.slot__resize .icon { width: 14px; height: 14px; }
.slot__resize:hover { background: var(--petrol-800); }
.slot__resize:active { transform: scale(.9); }
.slot.is-source .slot__resize { display: none; }

/* the popover it opens */
.size-pop {
  position: fixed;
  z-index: calc(var(--z-drag) + 10);
  padding: var(--s4);
  border-radius: 18px;
  background: rgba(255, 255, 255, .94);
  box-shadow: var(--e2), 0 24px 56px -18px rgba(16, 55, 63, .34);
  -webkit-backdrop-filter: blur(14px) saturate(1.1);
  backdrop-filter: blur(14px) saturate(1.1);
  opacity: 0;
  transform: translateY(-6px) scale(.97);
  transform-origin: top center;
  transition: opacity var(--t-fast) var(--ease-out), transform var(--t-fast) var(--ease-out);
}
.size-pop.is-open { opacity: 1; transform: translateY(0) scale(1); }
.size-pop[hidden] { display: none !important; }
.size-pop .size-picker__row { flex-wrap: nowrap; }
</style>
<style>
/* ══ css/profile-menu.css ══ */
/* ══════════════════════════════════════════════════════════════════════════
   THE PROFILE MENU
   A popover under the avatar, holding everything the user can do to their own
   home page. Positioned in JS because it hangs off an element in a flex row
   whose position depends on the greeting's length; styled here.
   ══════════════════════════════════════════════════════════════════════════ */

/* The click-outside layer. Transparent, full-page, and only present while the
   menu is — see the note in ProfileMenu.js for why this is a layer and not a
   document listener. */
.pmenu-catcher { position: fixed; inset: 0; z-index: calc(var(--z-sheet) - 1); }
.pmenu-catcher[hidden] { display: none; }

.pmenu {
  position: fixed;
  z-index: var(--z-sheet);
  width: min(304px, calc(100vw - 24px));
  padding: var(--s2);
  border-radius: 18px;
  background: rgba(255, 255, 255, .94);
  -webkit-backdrop-filter: blur(20px) saturate(1.6);
  backdrop-filter: blur(20px) saturate(1.6);
  box-shadow: 0 1px 2px rgba(31, 65, 91, .1), 0 24px 60px -18px rgba(31, 65, 91, .38);
  /* the hairline is a ring rather than a border so it does not join the
     backdrop blur's edge and read as a double line */
  outline: 1px solid rgba(31, 65, 91, .07);
  outline-offset: -1px;
  opacity: 0;
  transform: scale(.96) translateY(-6px);
  transform-origin: top right;
  transition: opacity var(--t-fast) var(--ease-out), transform var(--t-fast) var(--ease-out);
}
.pmenu[hidden] { display: none; }
.pmenu.is-open { opacity: 1; transform: scale(1) translateY(0); }

.pmenu__head {
  display: flex;
  align-items: center;
  gap: var(--s3);
  padding: var(--s3) var(--s3) var(--s4);
  min-width: 0;
}
.pmenu__avatar { flex: none; width: 40px; height: 40px; border-radius: var(--r-pill); display: block; }
.pmenu__who { display: flex; flex-direction: column; min-width: 0; gap: 1px; }
.pmenu__name {
  font-size: var(--fs-body);
  font-weight: 650;
  color: var(--ink);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.pmenu__role { font-size: var(--fs-micro); color: var(--ink-3); }

.pmenu__rule {
  display: block;
  height: 1px;
  margin: var(--s2) var(--s3);
  background: var(--line);
}

.pmenu__item {
  display: flex;
  align-items: center;
  gap: var(--s3);
  width: 100%;
  min-width: 0;
  padding: 9px var(--s3);
  border: none;
  border-radius: 12px;
  background: transparent;
  cursor: pointer;
  text-align: left;
  transition: background var(--t-fast) var(--ease);
}
.pmenu__item:hover, .pmenu__item:focus-visible { background: var(--petrol-050); }

.pmenu__icon {
  flex: none;
  display: grid;
  place-items: center;
  width: 34px;
  height: 34px;
  border-radius: 10px;
  background: var(--petrol-050);
  color: var(--petrol-700);
}
.pmenu__item:hover .pmenu__icon { background: var(--petrol-100); }
.pmenu__icon .icon { width: 17px; height: 17px; }

.pmenu__text { display: flex; flex-direction: column; min-width: 0; gap: 1px; }
.pmenu__label { font-size: var(--fs-label); font-weight: 600; color: var(--ink); }
.pmenu__note { font-size: var(--fs-micro); color: var(--ink-3); line-height: 1.3; }

/* Reset is the one item here that throws work away, so it is the one item that
   is allowed to look different. Warm rather than red: it is undoable in the
   sense that the default is always one tap away, and a scarlet row in a
   four-item menu reads as "danger" when it means "start again". */
.pmenu__item.is-danger .pmenu__icon { background: #FFF1DC; color: #A9660F; }
.pmenu__item.is-danger:hover { background: #FFF6E9; }
.pmenu__item.is-danger:hover .pmenu__icon { background: #FFE7C4; }
.pmenu__item.is-danger .pmenu__label { color: #8A5A16; }

/* The avatar reads as pressed while its menu is open — without it the button
   looks untouched and the popover looks like it belongs to nothing. */
.avatar-btn[aria-expanded='true'] { box-shadow: 0 0 0 3px color-mix(in srgb, var(--sig) 34%, transparent); }

<style>
/* ══ css/picker.css ══ */
/* ══════════════════════════════════════════════════════════════════════════
   THE WIDGET GALLERY
   ──────────────────────────────────────────────────────────────────────────
   One markup tree, and TWO INDEPENDENT THINGS change across it — which is the
   mistake this file made for a while, by writing them as one 1024px block:

     the LAYOUT, at 768px
       ≥768   the module rail is anchored to the left and the selected
              module's widgets sit beside it. Both panes on screen, always.
       <768   the same two panes stacked, one at a time: the rail, then the
              widgets sliding over it. A phone has no room for two columns.

     the PRESENTATION, at 1024px
       ≥1024  the sheet lifts off the bottom edge and becomes a centred panel.
       <1024  a sheet from the bottom of the screen.

   Tying the layout to 1024 put every iPad in portrait — 768, 810, 820, 834pt —
   into the phone's stacked arrangement, when all of them have room for the
   rail. Only the 12.9" is 1024 in portrait, so it was the one tablet the old
   breakpoint got right.

   The rail is the point. Every module is in it, always, grouped under its
   category, and clicking one swaps the pane beside it rather than navigating.
   Two earlier versions of this screen hid modules — one below the fold, one
   behind a Back button — and the note at the top of the component says how.

   The previews are real cards. Not pictures of cards, not approximations: the
   same renderer the home page uses, built at real size and scaled down (see
   ModulePreview.js). It is the only way "the preview looks like what you get"
   survives contact with a changing design.
   ══════════════════════════════════════════════════════════════════════════ */

/* Below the split breakpoint the two panes are stacked and only one is on
   screen at a time; from 768px up they sit side by side. The picker's script
   needs to know which, so the stylesheet states it here and the script reads
   it — see the note on the media query at the foot of this file. */
:root { --picker-split: 0; }

/* `hidden` sets `display:none` at the UA level, which any class selector that
   sets `display` beats. Both of these do. Without this the sheet is on the page
   from first paint, parked at the foot of the document. */
.scrim[hidden], .sheet[hidden] { display: none !important; }

.scrim {
  position: fixed;
  inset: 0;
  z-index: var(--z-sheet);
  background: rgba(10, 38, 44, .34);
  -webkit-backdrop-filter: blur(3px) saturate(.9);
  backdrop-filter: blur(3px) saturate(.9);
  opacity: 0;
  transition: opacity var(--t-sheet) var(--ease-sheet);
}
.scrim.is-open { opacity: 1; }

.sheet {
  position: fixed;
  z-index: calc(var(--z-sheet) + 1);
  left: 0;
  right: 0;
  bottom: 0;
  height: 92dvh;
  display: grid;
  /* `minmax(0, 1fr)`, not `1fr`. A grid column sized `auto`/`1fr` takes its
     minimum from the max-content of its items, so a column holding the module
     rail would grow to the width of the longest module name plus its chrome and
     push the widget pane off the right of a 390px phone. */
  grid-template-columns: minmax(0, 1fr);
  grid-template-rows: auto minmax(0, 1fr);
  grid-template-areas:
    'head'
    'side';
  border-radius: var(--r-sheet) var(--r-sheet) 0 0;
  background: linear-gradient(180deg, #FFFFFF 0%, #F7FCFB 100%);
  box-shadow: 0 -8px 60px -12px rgba(10, 38, 44, .34);
  overflow: hidden;
  transform: translateY(100%);
  transition: transform var(--t-sheet) var(--ease-sheet);
}
.sheet.is-open { transform: translateY(0); }

/* the grab handle — only on touch, where it means something */
.sheet__handle {
  position: absolute;
  top: 9px;
  left: 50%;
  translate: -50% 0;
  width: 40px;
  height: 4px;
  border-radius: var(--r-pill);
  background: var(--petrol-200);
  z-index: 3;
}

/* ── header ───────────────────────────────────────────────────────────────*/
.sheet__head {
  grid-area: head;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--s4);
  padding: var(--s6) var(--pad-page) var(--s3);
  min-width: 0;
}
.sheet__title {
  font-size: clamp(20px, 1.1rem + .8vw, 26px);
  font-weight: 700;
  letter-spacing: -.02em;
  color: var(--ink);
}
.sheet__close {
  width: var(--btn);
  height: var(--btn);
  display: grid;
  place-items: center;
  border: none;
  border-radius: var(--r-pill);
  background: var(--petrol-050);
  color: var(--ink-2);
  cursor: pointer;
  transition: background var(--t-fast) var(--ease), color var(--t-fast) var(--ease);
}
.sheet__close:hover { background: var(--petrol-100); color: var(--ink); }
.sheet__close .icon { width: 19px; height: 19px; }

/* ── the module rail ──────────────────────────────────────────────────────*/
.sheet__side {
  grid-area: side;
  display: flex;
  flex-direction: column;
  min-width: 0;
  min-height: 0;
  padding: 0 var(--pad-page) var(--s4);
}

.sheet-search { position: relative; flex: none; }
.sheet-search .icon {
  position: absolute;
  left: 16px;
  top: 50%;
  translate: 0 -50%;
  width: 19px;
  height: 19px;
  color: var(--ink-4);
  pointer-events: none;
}
/* The clear button is only in the flow once there is something to clear, so
   reserving its 44px unconditionally just narrowed the field. */
.sheet-search input {
  width: 100%;
  height: 48px;
  padding: 0 16px 0 46px;
  border: 1px solid var(--line);
  border-radius: var(--r-field);
  background: var(--surface);
  font: inherit;
  font-size: var(--fs-body);
  color: var(--ink);
  transition: border-color var(--t-fast) var(--ease), box-shadow var(--t-fast) var(--ease);
}
.sheet-search input::placeholder { color: var(--ink-3); }
.sheet-search input:focus {
  outline: none;
  border-color: color-mix(in srgb, var(--sig) 45%, transparent);
  box-shadow: 0 0 0 4px color-mix(in srgb, var(--sig) 11%, transparent);
}
.sheet-search__clear {
  position: absolute;
  right: 8px;
  top: 50%;
  translate: 0 -50%;
  width: 32px;
  height: 32px;
  display: none;
  place-items: center;
  border: none;
  border-radius: var(--r-pill);
  background: var(--petrol-050);
  color: var(--ink-3);
  cursor: pointer;
}
.sheet-search.has-value .sheet-search__clear { display: grid; }
.sheet-search.has-value input { padding-right: 44px; }
.sheet-search__clear .icon { width: 15px; height: 15px; }

.mod-rail {
  flex: 1 1 auto;
  min-height: 0;
  overflow-y: auto;
  overscroll-behavior: contain;
  -webkit-overflow-scrolling: touch;
  margin-top: var(--s4);
  /* bleed so the hover fill on a row reaches the pane edge */
  margin-inline: calc(var(--s2) * -1);
  padding-inline: var(--s2);
}
.mod-rail::-webkit-scrollbar { width: 8px; }
.mod-rail::-webkit-scrollbar-thumb { background: var(--petrol-100); border-radius: var(--r-pill); }

/* A gradient over the last few pixels of the rail. It is the cheapest honest
   signal that the list continues — a scrollbar says the same thing, but only
   once you have already looked for it. */
.sheet__side { position: relative; }
.sheet__side::after {
  content: '';
  position: absolute;
  left: 0;
  right: 0;
  bottom: 0;
  height: 40px;
  background: linear-gradient(180deg, rgba(250, 253, 253, 0), rgba(250, 253, 253, .95));
  pointer-events: none;
}

/* Sticky, so you always know which category the row under your finger is in
   while scrolling seventeen of them. */
.mod-rail__heading {
  position: sticky;
  top: 0;
  z-index: 1;
  padding: var(--s3) var(--s2) 5px;
  background: linear-gradient(180deg, #FBFEFE 72%, rgba(251, 254, 254, 0) 100%);
  font-size: var(--fs-micro);
  font-weight: 700;
  letter-spacing: .07em;
  text-transform: uppercase;
  color: var(--ink-3);
}
.mod-rail__heading:first-child { padding-top: var(--s2); }

/* 44px rows, not 50. Seventeen modules and four headings is 850px of rail;
   trimming six pixels a row is the difference between two modules below the
   fold and five. The rail scrolls either way — but a list you can nearly see
   the end of reads as a list, and one you cannot reads as a hole. */
.mod-row {
  display: flex;
  align-items: center;
  gap: var(--s3);
  width: 100%;
  min-width: 0;
  padding: 4px var(--s2);
  border: none;
  border-radius: 12px;
  background: transparent;
  cursor: pointer;
  text-align: left;
  transition: background var(--t-fast) var(--ease);
}
.mod-row:hover { background: var(--petrol-050); }
.mod-row[aria-selected='true'] { background: var(--petrol-100); }

.mod-row__icon {
  flex: none;
  display: grid;
  place-items: center;
  width: 34px;
  height: 34px;
  border-radius: 10px;
}
.mod-row__icon img { display: block; width: 19px; height: 19px; }
.mod-row__name {
  flex: 1 1 auto;
  min-width: 0;
  font-size: var(--fs-body);
  font-weight: 550;
  color: var(--ink);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.mod-row__chev { flex: none; width: 16px; height: 16px; color: var(--ink-4); }

/* ── the widget pane ──────────────────────────────────────────────────────*/
/* The gallery pane takes focus when the sheet opens, so that Escape reaches
   the dialog and the arrow keys scroll the right thing. It is a scroll
   container, not a control, so it does not draw a focus ring — the global
   :focus-visible rule was painting a cyan rectangle around the whole gallery
   on every open. Everything a keyboard actually lands on inside here — the
   search field, the rail rows, the widget tiles — keeps its own. */
.sheet__body:focus, .sheet__body:focus-visible { outline: none; }

.sheet__body {
  grid-area: side;                 /* stacked over the rail below the split */
  min-width: 0;
  min-height: 0;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  overscroll-behavior: contain;
  padding: 0 var(--pad-page) var(--s8);
  background: inherit;
}

/* Below 1024 the two panes occupy the same grid cell and this decides which
   one you are looking at. One class, two states, no second markup tree. */
.sheet:not(.is-detail) .sheet__body { display: none; }
.sheet.is-detail .sheet__side { display: none; }

.detail-back {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  align-self: flex-start;
  height: 36px;
  margin-block: var(--s2) var(--s4);
  padding: 0 var(--s3) 0 var(--s2);
  border: none;
  border-radius: var(--r-pill);
  background: var(--petrol-050);
  color: var(--petrol-800);
  font-size: var(--fs-label);
  font-weight: 550;
  cursor: pointer;
  transition: background var(--t-fast) var(--ease);
}
.detail-back:hover { background: var(--petrol-100); }
.detail-back .icon { width: 17px; height: 17px; }

.detail-head {
  display: flex;
  align-items: center;
  gap: var(--s4);
  min-width: 0;
  padding-bottom: var(--s5);
  border-bottom: 1px solid var(--line);
}
.detail-head__icon {
  flex: none;
  display: grid;
  place-items: center;
  width: 48px;
  height: 48px;
  border-radius: 13px;
}
.detail-head__icon img { display: block; width: 26px; height: 26px; }
.detail-head__text { display: flex; flex-direction: column; min-width: 0; gap: 2px; }
.detail-head__name {
  font-size: clamp(18px, 1.05rem + .5vw, 23px);
  font-weight: 700;
  letter-spacing: -.017em;
  color: var(--ink);
}
.detail-head__blurb { font-size: var(--fs-label); color: var(--ink-3); line-height: 1.35; }

.widget-row {
  display: flex;
  flex-wrap: wrap;
  gap: var(--s4);
  align-items: flex-start;
  padding-block: var(--s6) var(--s2);
}

/* A widget tile is a button wrapping a real card. The card inside is inert —
   the button takes the interaction, so a preview can never be tabbed into. */
.widget {
  display: flex;
  flex-direction: column;
  gap: var(--s3);
  padding: var(--s3);
  border: none;
  border-radius: calc(var(--r-card) + 6px);
  background: transparent;
  cursor: pointer;
  text-align: left;
  transition: background var(--t-fast) var(--ease), box-shadow var(--t-fast) var(--ease);
}
.widget:hover { background: color-mix(in srgb, var(--petrol-400) 7%, transparent); }

/* ── the selected state ───────────────────────────────────────────────────
   "Do not make the selected state overly colorful." So it is an outline, a
   tick and about a millimetre of lift — no flooded tint over the top of a
   preview whose whole job is to show the card's own colour. The ring is on the
   STAGE rather than the tile, so it traces the card's rounded rectangle
   instead of a larger invisible box around it. */
.widget[aria-pressed='true'] { background: color-mix(in srgb, var(--sig) 6%, transparent); }
.widget[aria-pressed='true'] .variant__stage {
  box-shadow: 0 0 0 2px var(--sig),
              0 2px 4px rgba(31, 65, 91, .10),
              0 14px 30px -16px rgba(31, 65, 91, .38);
  transform: translateY(-2px);
}
.widget[aria-pressed='true'] .widget__name { color: var(--petrol-800); }

/* The one the size control is currently pointed at. A second, quieter ring —
   it has to be distinguishable from plain selection without competing with it,
   because every sizing card is also a selected one. */
.widget.is-sizing .variant__stage {
  box-shadow: 0 0 0 2px var(--sig),
              0 0 0 5px color-mix(in srgb, var(--sig) 26%, transparent),
              0 2px 4px rgba(31, 65, 91, .10),
              0 14px 30px -16px rgba(31, 65, 91, .38);
}

.variant__stage { transition: transform var(--t-fast) var(--ease-out), box-shadow var(--t-fast) var(--ease); }

/* The tick. Sits over the card's own top-right corner; the ring around it is
   the sheet's surface colour so it reads on a photograph as well as a fill. */
.widget__check {
  position: absolute;
  top: 8px;
  right: 8px;
  z-index: 3;
  display: grid;
  place-items: center;
  width: 24px;
  height: 24px;
  border-radius: 50%;
  border: 2px solid var(--surface);
  /* --ui-link, not --sig. The tick is a meaningful graphic, so WCAG 1.4.11
     wants 3:1 both for the glyph against its disc and for the disc against the
     surface behind it — and the signal cyan gives 2.59:1 on both counts. The
     same darker cyan the Edit control already uses gives 4.61:1 on both. */
  background: var(--ui-link);
  color: #fff;
  opacity: 0;
  transform: scale(.6);
  transition: opacity var(--t-fast) var(--ease), transform var(--t-fast) var(--ease-out);
  pointer-events: none;
}
.widget__check .icon { width: 13px; height: 13px; stroke-width: 3; }
.widget[aria-pressed='true'] .widget__check { opacity: 1; transform: scale(1); }

.variant__stage {
  position: relative;
  overflow: hidden;
  border-radius: var(--r-card);
  /* the real card lives inside at real size and is scaled down; the stage is
     sized to the scaled result so the row packs tightly */
  flex: none;
  box-shadow: 0 1px 2px rgba(31, 65, 91, .07), 0 10px 24px -14px rgba(31, 65, 91, .3);
}
.variant__stage .card {
  position: absolute;
  top: 0;
  left: 0;
  transform-origin: 0 0;
  pointer-events: none;
}

.widget__meta { display: flex; flex-direction: column; max-width: 240px; }
.widget__name { font-size: var(--fs-label); font-weight: 650; color: var(--ink); }

/* ── empty state ──────────────────────────────────────────────────────────*/
.sheet-empty {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: var(--s3);
  padding: var(--s16) var(--s6);
  text-align: center;
}
.sheet-empty__icon {
  display: grid;
  place-items: center;
  width: 52px;
  height: 52px;
  border-radius: var(--r-pill);
  background: var(--petrol-050);
  color: var(--petrol-300);
}
.sheet-empty__icon .icon { width: 24px; height: 24px; }
.sheet-empty__title { font-size: var(--fs-title); font-weight: 600; color: var(--ink); }
.sheet-empty__note { font-size: var(--fs-body); color: var(--ink-3); max-width: 34ch; }

/* ── footer: size selection and commit ────────────────────────────────────
   Hidden until a widget is chosen, because "Choose Size" with nothing chosen
   is a control that cannot be used, and a disabled Add button is a question
   the user cannot answer. */
/**
 * THE ACTION BAR FLOATS.
 *
 * It used to be a third grid row that slid out of view when nothing was
 * selected — which left a hundred-pixel band of empty white across the bottom
 * of the sheet at all times, waiting for a footer that was not there.
 *
 * Absolute, over the gallery, is both tidier and the behaviour iOS has: the
 * bar appears on top of what you are browsing the moment you pick something,
 * and the gallery gains the padding it needs so the last row can still be
 * scrolled clear of it.
 */
.sheet__foot {
  position: absolute;
  left: 0;
  right: 0;
  bottom: 0;
  z-index: 4;
  display: grid;
  min-width: 0;
  grid-template-columns: minmax(0, 1fr) auto;
  align-items: center;
  gap: var(--s4);
  padding: var(--s4) var(--pad-page);
  padding-bottom: max(var(--s4), env(safe-area-inset-bottom));
  border-top: 1px solid var(--line);
  background: rgba(255, 255, 255, .88);
  -webkit-backdrop-filter: blur(12px);
  backdrop-filter: blur(12px);
  transform: translateY(100%);
  transition: transform var(--t-base) var(--ease-out);
}
.sheet.has-selection .sheet__foot { transform: translateY(0); }
.sheet:not(.has-selection) .sheet__foot { pointer-events: none; }
/* room to scroll the last widget clear of the bar that just appeared. Taller
   than it was: the bar now carries a tray of chips above the size control. */
.sheet.has-selection .sheet__body { padding-bottom: 210px; }

.sheet__foot-main { display: flex; flex-direction: column; gap: var(--s3); min-width: 0; }

/* ── the selection tray ───────────────────────────────────────────────────
   The count and the basket, above the size control and below nothing. It
   scrolls sideways rather than wrapping: a wrapping tray changes the height of
   a fixed bar as cards are added, which moves the Add button out from under
   the thumb that is aiming at it. */
.sel-tray { display: flex; align-items: center; gap: var(--s3); min-width: 0; }
.sel-tray__count {
  flex: none;
  font-size: var(--fs-label);
  font-weight: 700;
  color: var(--ink);
  font-variant-numeric: tabular-nums;
}
.sel-tray__chips {
  display: flex;
  gap: var(--s2);
  min-width: 0;
  overflow-x: auto;
  scrollbar-width: none;
  padding-block: 2px;
  scroll-behavior: smooth;
  /* A hard cut reads as a clipping bug; a fade reads as "there is more this
     way". Masked rather than covered with a painted gradient, because the bar
     behind it is translucent and a painted fade would show as a pale block
     over the blur.

     Both edges, and only when there is actually something past them — a fixed
     right-hand fade left the tray looking cut on the left the moment it
     scrolled to bring the active chip into view, which turned the first chip
     into a nameless pill reading just "Medium". The two widths are set from
     script on scroll; see renderTray(). */
  --fade-l: 0px;
  --fade-r: 0px;
  -webkit-mask-image: linear-gradient(to right, transparent 0, #000 var(--fade-l),
                      #000 calc(100% - var(--fade-r)), transparent 100%);
  mask-image: linear-gradient(to right, transparent 0, #000 var(--fade-l),
              #000 calc(100% - var(--fade-r)), transparent 100%);
}
.sel-tray__chips::-webkit-scrollbar { display: none; }

.sel-chip {
  display: inline-flex;
  align-items: stretch;
  flex: none;
  border: 1px solid var(--line);
  border-radius: 11px;
  background: var(--surface);
  overflow: hidden;
  transition: border-color var(--t-fast) var(--ease), background var(--t-fast) var(--ease);
}
.sel-chip.is-active {
  border-color: var(--sig);
  background: color-mix(in srgb, var(--sig) 10%, transparent);
}
.sel-chip__pick {
  display: flex;
  align-items: baseline;
  gap: 6px;
  padding: 6px var(--s2) 6px var(--s3);
  border: none;
  background: none;
  cursor: pointer;
  font: inherit;
  white-space: nowrap;
}
.sel-chip__name { font-size: var(--fs-label); font-weight: 600; color: var(--ink); }
.sel-chip__size { font-size: var(--fs-micro); color: var(--ink-3); }
.sel-chip.is-active .sel-chip__size { color: var(--petrol-800); }
.sel-chip__drop {
  display: grid;
  place-items: center;
  width: 26px;
  padding: 0;
  border: none;
  border-left: 1px solid var(--line);
  background: none;
  color: var(--ink-3);
  cursor: pointer;
}
.sel-chip__drop:hover { background: var(--petrol-050); color: var(--ink); }
.sel-chip__drop .icon { width: 13px; height: 13px; }

.btn-primary[disabled] { opacity: .45; pointer-events: none; }

/* THE TRAY GETS THE FULL WIDTH OF THE BAR WHENEVER THE BAR IS NARROW.
   Side by side, the actions take about 250px of it — and on a split layout the
   rail has already taken 240 off the left, which on an iPad in portrait left
   the chips 128px to hold three chips totalling 562. The active chip could not
   be scrolled into view because there was no view to scroll it into. Below
   1024 the actions go on their own row and the tray gets the lot. */
@media (max-width: 1023px) {
  .sheet__foot { grid-template-columns: minmax(0, 1fr); }
  .sheet__actions { justify-content: flex-end; }
  .sheet.has-selection .sheet__body { padding-bottom: 268px; }
}

.size-picker { min-width: 0; }
.size-picker__label {
  display: block;
  font-size: var(--fs-label);
  font-weight: 600;
  color: var(--ink-3);
  margin-bottom: 7px;
}
.size-picker__row { display: flex; gap: var(--s2); flex-wrap: wrap; }

/* Each option draws its own footprint. "Medium" being literally twice as wide
   as "Small" says more than the word does, and it says it before it is read. */
.size-opt {
  display: flex;
  align-items: center;
  gap: 9px;
  min-height: var(--btn);
  padding: 6px var(--s3) 6px 9px;
  border: 1px solid var(--line);
  border-radius: 12px;
  background: var(--surface);
  color: var(--ink-2);
  font-size: var(--fs-label);
  font-weight: 550;
  cursor: pointer;
  transition: background var(--t-fast) var(--ease), border-color var(--t-fast) var(--ease),
              color var(--t-fast) var(--ease);
}
.size-opt:hover { background: var(--petrol-050); color: var(--ink); }
.size-opt[aria-checked='true'] {
  border-color: var(--sig);
  background: color-mix(in srgb, var(--sig) 9%, transparent);
  color: var(--petrol-800);
}
.size-opt__glyph {
  display: grid;
  gap: 2px;
  flex: none;
}
.size-opt__glyph i {
  display: block;
  width: 9px;
  height: 9px;
  border-radius: 2.5px;
  background: var(--petrol-200);
}
.size-opt[aria-checked='true'] .size-opt__glyph i { background: var(--sig); }

.sheet__actions { display: flex; align-items: center; gap: var(--s2); }

.btn-ghost, .btn-primary {
  height: var(--btn);
  padding: 0 var(--s5);
  border: none;
  border-radius: 13px;
  font-size: var(--fs-body);
  font-weight: 600;
  cursor: pointer;
  transition: background var(--t-fast) var(--ease), transform var(--t-fast) var(--ease);
}
.btn-ghost { background: transparent; color: var(--ink-2); }
.btn-ghost:hover { background: var(--petrol-050); color: var(--ink); }
.btn-primary {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  background: var(--petrol-700);
  color: var(--on-dark);
  box-shadow: var(--e0);
}
.btn-primary .icon { width: 18px; height: 18px; }
.btn-primary:hover { background: var(--petrol-800); }
.btn-primary:active { transform: scale(.97); }

/* ══ SPLIT PANES · 768px AND UP ══════════════════════════════════════════
   The rail is anchored to the left and the gallery sits beside it. Both are
   on screen at once and neither ever hides the other, which is the whole
   reason this screen was rebuilt.

   768, NOT 1024. This used to start at 1024 and it put every iPad in portrait
   into the stacked arrangement — the rail filling the sheet, then sliding away
   to reveal the widgets. A 768, 810, 820 or 834pt portrait tablet has ample
   room for two columns; it was being given a phone's layout because the
   breakpoint was set by the OTHER thing that changes at 1024 (the sheet
   becoming a floating panel), and the two were written as one block. They are
   two separate decisions and they are now two separate blocks.

   Only the 12.9" iPad is 1024pt in portrait, so at the old breakpoint it was
   the single tablet that got this right. */
@media (min-width: 768px) {
  /* The flag the picker's JS reads to know which arrangement is live. Same
     idea as --grid-cols: the stylesheet decides, and the script asks the
     cascade rather than keeping its own copy of the breakpoint. */
  :root { --picker-split: 1; }

  .sheet {
    height: 86dvh;
    grid-template-columns: 240px minmax(0, 1fr);
    grid-template-areas:
      'head    head'
      'side    body';
  }

  .sheet__head { border-bottom: 1px solid var(--line); }

  .sheet__side {
    padding: var(--s4) var(--s4) var(--s4) var(--pad-page);

<style>
/* ══ css/site.css ══ */
/* ══════════════════════════════════════════════════════════════════════════

   The workspace switcher, the Site header, and the two card compositions the

   Two backgrounds cross-fading would say "two buttons, one lit". A single
   surface that slides says "one control with a position", which is what a
   segmented switch is. It is also why the transform is on a pseudo-free
   element rather than on a `left` — a transform does not lay out. */
.wswitch__plate {
  position: absolute;
  z-index: 0;
  top: 4px;
  bottom: 4px;

/* ══ 6 · HEALTH — one index and the domains it is made of ════════════════ */

.l-health { position: relative; z-index: 2; display: flex; flex: 1 0 0; flex-direction: column; min-height: 0; }
.l-health__body { display: flex; align-items: center; gap: var(--s6); flex: 1 0 0; min-height: 0; }

.l-health__read {

  flex-direction: column;
  align-items: center;

  font-family: var(--font-num);
  font-size: var(--fs-stat);

/* SIX ROWS IN TWO COLUMNS. Stacked they are 6 x 24px plus gaps against the
   132px a two-row card gives — they do not fit, and the card is wide enough
   that pairing them costs nothing. The `data-n` hook lets a shorter list stay
   in one column rather than leaving a ragged second one. */
/* ONE COLUMN BY DEFAULT, TWO ONLY WHEN THERE IS ROOM FOR TWO.
   This was written the other way round — two columns down to a 460px card —
   and the sweep found why that is wrong. `large` is 2 columns on the reference
   grid (374px) and THREE columns at the 768px band (536px), so a card that had
   comfortably gone single-column at 1024 came back as two 164px columns on an
   iPad in portrait, and "Maintenance / Attention" does not fit in 164px.

   the 128px dial and its gap, over two columns, needing ~200px each — puts it
   at 620px, which only `full` reaches. Measured, then set. */
.l-health__rows {
  display: grid;
  grid-template-columns: 1fr;
  gap: var(--s2) var(--s6);
  align-content: center;
  flex: 1 1 auto;
  min-width: 0;
}

}

.l-health__row { display: flex; align-items: baseline; gap: var(--s2); min-width: 0; }

  width: 8px;

.l-health__name {
  flex: 1 1 auto;
  font-size: var(--fs-body);
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.l-health__state {
  flex: none;
  font-size: var(--fs-label);
  font-weight: 600;
  opacity: .8;
  white-space: nowrap;
}

/* A large card is half the width of a full one, so the pairs go back to a
   single column and the dial gives up size first — it is still legible at
   96px and "Maintenance  Attention" is not legible clipped. */
/* A large card is half the width of a full one. The dial gives up size first,

   legible clipped. */
@container card (max-width: 460px) {

/* ══ 7 · INSIGHT — what changed, in sentences ════════════════════════════
   No badge, no sparkle, no phrasing that pretends to advise. The brief's own
   warning — "do not make this look like an AI gimmick" — is the entire design
   note, and the way to honour it is for the card to look like the operations
   report it is quoting. */

.l-insight { position: relative; z-index: 2; display: flex; flex: 1 0 0; flex-direction: column; min-height: 0; }
.l-insight__items {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: var(--s3) var(--s8);
  align-content: center;
  flex: 1 1 auto;
  min-height: 0;
  margin-top: var(--s2);
}
.l-insight__item { display: flex; align-items: baseline; gap: var(--s2); min-width: 0; }

/* The arrow carries direction and nothing else — no colour, because a 6%
   fall in electricity is good and an 18% rise in maintenance is not, and a
   card cannot know which way round the reader wants it. */
.l-insight__arrow {
  flex: none;
  width: 18px;
  font-family: var(--font-num);
  font-size: var(--fs-label);
  font-weight: 700;
  opacity: .55;
  text-align: center;
}
.l-insight__text {
  font-size: var(--fs-body);
  line-height: 1.34;
  opacity: .88;
  min-width: 0;
}
.l-insight__figure { font-weight: 700; opacity: 1; font-variant-numeric: tabular-nums; }
.l-insight__caption {
  flex: none;
  margin-top: var(--s3);
  font-size: var(--fs-micro);
  opacity: .62;
}

@container card (max-width: 520px) {
  .l-insight__items { grid-template-columns: 1fr; gap: var(--s2); }
  .l-insight__text { font-size: var(--fs-label); }
}

/* ══ 8 · EMPTY — a Site that does not have this yet ══════════════════════
   Section 15 of the brief. A neutral outlined surface rather than the domain
   gradient under a veil: an empty card is not a quiet version of a full one,
   it is a different thing, and on a workspace where a third of the cards have
   nothing to say the ones that DO must still be the ones that carry. */

.card[data-fill='empty'] {
  background: rgba(255, 255, 255, .58);
  border: 1px dashed var(--line-2);
  color: var(--ink-2);
  box-shadow: none;
}
.card[data-fill='empty']:hover { background: rgba(255, 255, 255, .78); }

.l-empty { position: relative; z-index: 2; display: flex; flex: 1 0 0; flex-direction: column; min-height: 0; }
.l-empty .c-head { color: var(--petrol-700); }
.l-empty__body {
  display: flex;
  flex: 1 1 auto;
  flex-direction: column;
  justify-content: center;
  gap: var(--s2);
  min-height: 0;
}
.l-empty__mark { display: flex; color: var(--ink-4); }
.l-empty__glyph { width: 26px; height: 26px; }
.l-empty__glyph .glyph { width: 100%; height: 100%; stroke-width: 1.5; }
.l-empty__note {
  font-size: var(--fs-label);
  line-height: 1.35;
  color: var(--ink-2);
  /* Three lines at most. A fourth means the copy is explaining rather than
     naming, and an empty card is not the place for a paragraph. */
  display: -webkit-box;
  -webkit-line-clamp: 3;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
.l-empty__action {
  flex: none;
  align-self: flex-start;
  margin-top: var(--s3);
  padding: 6px var(--s3);
  border: 1px solid var(--line-2);
  border-radius: var(--r-pill);
  background: var(--surface);
  font-size: var(--fs-micro);
  font-weight: 650;
  color: var(--ui-link);
  white-space: nowrap;
}
.card[data-fill='empty']:hover .l-empty__action { border-color: var(--petrol-200); }

/* One row tall leaves 132px: the glyph is the first thing out, because the
   sentence is the content and a decorative mark is not. */
.card[data-h='1'] .l-empty__mark { display: none; }
.card[data-h='1'] .l-empty__note { -webkit-line-clamp: 2; }
.card[data-h='1'] .l-empty__action { margin-top: var(--s2); }

/* ══ 8b · two narrow-card rules the overflow sweep asked for ═════════════ */

/* A 1x1 METRICS CARD CANNOT PUT THREE FIGURES SIDE BY SIDE.
   147px of content box over three columns is 36px each, and "Managers" is 66.
   Stacked, each metric becomes one line — figure then label — and three of them
   come to 72px against the 132px a one-row card gives.

   No module card reaches this: metrics variations in the module catalogue
   support medium and large only, so the smallest they are ever drawn is 374px.
   The KPI band the brief asks for (`Small = KPI / Status`) is what brought a
   1x1 metrics card into existence at all. */
@container card (max-width: 215px) {
  .card[data-h='1'] .l-metrics__row { flex-direction: column; gap: 3px; }
  .card[data-h='1'] .metric {
    flex: none;
    flex-direction: row;
    align-items: baseline;
    gap: 6px;
  }
  .card[data-h='1'] .metric__value { font-size: var(--fs-body); }
  .card[data-h='1'] .metric__label { font-size: var(--fs-micro); opacity: .8; }
}

/* A WORDY QUEUE STACKS ON A NARROW CARD — see the note in ModuleCard.js for
   what "wordy" means and why it is detected rather than declared. "Site
   In-charge" beside "Ramesh Kumar" in a 200px content box left the label 66px;
   over two lines they both fit whole, which is the only version of this card
   worth showing. */
@container card (max-width: 300px) {
  .l-queue[data-wordy] .l-queue__row { flex-direction: column; align-items: flex-start; gap: 0; }
  .l-queue[data-wordy] .l-queue__value { font-size: var(--fs-label); opacity: .82; }
}

/* ══ 9 · the workspace grid ══════════════════════════════════════════════
   Nothing to redefine — #siteGrid gets `.module-grid` from createModuleGrid and
   inherits the column count, the row height and every drag affordance. This is
   the whole visible proof that it is one engine. The only addition is the
   bottom breathing room the home page gets from the page's own padding. */
#panel-site { padding-bottom: var(--s6); }
</style>

<main class="page">

       Two views of the same working day. It sits between the search field and

       ~60px once, and — unlike a left rail — it does not touch the 960px

  <div class="wswitch-row">

  <div class="main-frame">

   <!-- ══ PANEL · MODULE SELECTION ════════════════════════════════════════
        Untouched. Everything the artboard draws is inside here, in the order
        it draws it; the panel wrapper adds no box, no padding and no margin,
        so the measured page is still the measured page. -->
   <div id="panel-modules" role="tabpanel" aria-label="Module Selection">

    <!-- ══ hero banner ═════════════════════════════════════════════════
         Figma "Egg Module": the leopard photograph under a flat 40% black,
         the mark rotated −45°, the title at 36px, carousel dots at the foot.

         AN ANCHOR, NOT A BUTTON. It navigates, so it is a link — which is not
         pedantry: an <a href> gets cmd-click, middle-click, "Open in New Tab",
         the destination in the status bar on hover, and Enter from the
         keyboard, all for nothing. A <button> with a click handler has to
         re-implement each of those and never does.

         A NEW TAB, so the dashboard is still there to come back to.

         `rel="noopener"` comes with it. Without it the opened page gets a live
         `window.opener` handle back to this one and can redirect it — current
         browsers imply noopener for `target="_blank"`, but the ones that do not
         are exactly the ones that matter here, so it is written down.

         `noreferrer` is deliberately NOT added: it would strip the Referer, and
         the Command Centre is this dashboard's own sibling rather than a third
         party we are hiding from.

         The new tab is also announced. A link that behaves differently from
         every other link should say so, and the only readers who cannot see it
         happen are the ones being told here — the span is visually hidden, so
         the banner is unchanged to the eye. -->
    <a class="hero" href="https://antz-command-centre-v5.vercel.app/"

 *   compact    the same, laid on its side, one row high.
 *   photo      a photograph with the name in a scrim band.
 *   stat       one number, as large as the card allows.
 *   metrics    two to four numbers side by side, separated by space alone.
 *   chart      a trend line that owns the card, with a summary under it.
 *   queue      a total, then named rows with their figures right-aligned.
 *   status     dotted rows — a state, not a measurement.

/** Fill in what every variation has in common so the catalogue states only
    what is unusual. `fill` is derived from the layout unless overridden. */
const CARD_VARIANTS = [...DOORS, ...COMPACT, ...VARIANTS].map((v) => ({
  priority: 'optional',
  ...v,
  fill: v.fill || LAYOUT_FILL[v.layout] || 'solid',
  data: v.data || {},
}))

/**
 * id → variation. The saved layout stores ids, so this is the hot path.
 *
 * NULL PROTOTYPE, DELIBERATELY. A plain object inherits from Object.prototype,
 * so `VARIANT_BY_ID['toString']` would return a function rather than undefined,
 * `getVariant` would hand back something truthy, and repair() would then read
 * `.supportedSizes` off it and throw — during module evaluation, before app.js
 * runs. One junk value in localStorage would take down the whole page.
 */
const VARIANT_BY_ID = Object.assign(
  Object.create(null),
  Object.fromEntries(CARD_VARIANTS.map((v) => [v.id, v])),
)

function getVariant(id) {
  return (typeof id === 'string' && VARIANT_BY_ID[id]) || null
}

/** A module's cards in the order the picker shows them: doors first, then what
    the module knows, then what is waiting, then what you can do, then what
    just happened. */
function variantsForModule(moduleId) {
  return CARD_VARIANTS
    .filter((v) => v.moduleId === moduleId)
    .sort((a, b) =>
      (PURPOSES[a.purpose]?.rank ?? 9) - (PURPOSES[b.purpose]?.rank ?? 9) ||
      PRIORITY_RANK[a.priority] - PRIORITY_RANK[b.priority] ||
      a.name.localeCompare(b.name))
}

/** Every card the default home page is allowed to seed itself from. */
function primaryVariants() {
  return CARD_VARIANTS.filter((v) => v.priority === 'primary')
}

/**
 * REGISTER A SECOND CATALOGUE.
 *
 * The Site Command Centre has its own widgets, and they go through this same
 * renderer, packer and grid — see the note on registerGroups() in modules.js
 * for why they share one id space rather than being threaded through the
 * engine as a parameter.
 *

/**
 * A MINIMAL OBSERVABLE STORE
 * ───────────────────────────────────────────────────────────────────────────
 * Thirty lines instead of a framework. State goes in one place, mutations go
 * through one function, and anything that cares subscribes. That is the entire
 * contract, and for a page with one grid and one sheet it is enough.
 *
 * The one non-obvious rule: `set` REPLACES the slice it is given rather than
 * deep-merging it. Deep merges are where stores like this quietly go wrong —
 * an array that should have shrunk instead keeps its tail. Callers hand over
 * the new value outright.
 */
function createStore(initial) {
  let state = initial
  const listeners = new Set()

  return {
    get: () => state,

    /**
     * @param {object|function} patch  a partial slice, or (state) => partial
     * @param {object} meta            passed to listeners; the render layer uses
     *                                 `meta.reason` to decide whether a change
     *                                 needs a full rebuild or a cheap touch-up
     */
    set(patch, meta = {}) {
      const next = typeof patch === 'function' ? patch(state) : patch
      const prev = state
      state = { ...state, ...next }
      for (const fn of listeners) fn(state, prev, meta)
    },

    subscribe(fn) {
      listeners.add(fn)
      return () => listeners.delete(fn)
    },
  }
}

/**
 * Fill in what every widget has in common, so the catalogue above states only
 * what is unusual. `requires` defaults to the widget's own domain, which is
 * true of all but one — Procurement is inside Finance and is gated with it.
 */
const SITE_WIDGETS = WIDGETS.map((w) => ({
  level: 3,
  priority: 'secondary',
  ...w,
  requires: w.requires || w.moduleId,
  fill: w.fill || LAYOUT_FILL[w.layout] || 'solid',
  data: w.data || {},
}))

const WIDGET_BY_ID = Object.assign(
  Object.create(null),
  Object.fromEntries(SITE_WIDGETS.map((w) => [w.id, w])),
)

function getWidget(id) {
  return (typeof id === 'string' && WIDGET_BY_ID[id]) || null
}

function widgetsForDomain(domainId) {
  return SITE_WIDGETS.filter((w) => w.moduleId === domainId)
}

/**
 * EMPTINESS IS A PROPERTY OF THE SITE, NOT OF THE WIDGET.
 * ───────────────────────────────────────────────────────────────────────────
 * The brief asks for real empty states and forbids fake zero values. The
 * temptation is to add an `isEmpty` flag to a widget, which is exactly the
 * fake: the widget is not empty, the SITE has no data for it. Hesaraghatta was
 * commissioned three weeks ago and has no asset register — the same Asset
 * Health card that is full at Bannerghatta has nothing to draw there, and
 * should say so rather than draw 0 of 0.
 *
 * So switching Site re-registers the catalogue with an `empty` marker on every
 * widget that Site lists as absent, and ModuleCard renders the empty
 * composition instead of the layout. One pass over ~70 objects on a switch the
 * user makes by hand: cheaper than any of the alternatives, and it keeps the
 * grid, the packer and the store completely unaware that emptiness exists.
 */

/**
 * THE PRISTINE CATALOGUE.
 *
 * applySite() rewrites `data` in place, so the values it starts from cannot be
 * the values it last wrote — two Site switches in a row would compound. This is
 * the catalogue as authored, cloned once, and every switch rebuilds from it.
 */
const BASE_DATA = new Map(SITE_WIDGETS.map((w) => [w.id, JSON.parse(JSON.stringify(w.data))]))

/**
 * FIGURES THAT ARE ALREADY IN THE SITE RECORD ARE DERIVED, NOT RE-TYPED.
 * ───────────────────────────────────────────────────────────────────────────
 * The Site header reads "19 Staff" from `site.counts` and the People widget
 * used to read "86 Staff" from the catalogue, on the same screen. That is the
 * worst class of bug this page can have — not a crash, a page that looks
 * completely fine and is wrong — and re-typing the numbers into four Sites'
 * worth of widget data would only move it to whichever one got edited last.
 *
 * So anything the Site record already knows is computed from it here, once, and
 * anything it does not know is written per Site in `figures` (see sites.js).
 * The split is not stylistic: a count that appears twice must have one source,
 * and a judgement — which two domains are dragging the health score down —
 * cannot be computed and has to be authored.
 *
 * The team mix holds its shape across Sites (roughly half keepers, a quarter
 * support) and the remainder is forced onto the largest group so the parts
 * always sum to the whole. A donut whose segments add up to 85 of 86 is a
 * rounding error the reader has no way to explain.
 */
function derive(site) {
  const c = site.counts
  const share = (pct) => Math.max(1, Math.round(c.staff * pct))
  const support = share(0.24), bio = share(0.14), clinical = share(0.13)
  const keepers = Math.max(1, c.staff - support - bio - clinical)
  const onLeave = Math.max(0, Math.round(c.staff * 0.09))
  const managers = Math.max(1, Math.round(c.staff * 0.05))
  const occupied = Math.max(0, c.enclosures - site.free - site.restricted)
  const band = site.health >= 85 ? 'Healthy' : site.health >= 70 ? 'Fair' : 'At Risk'

  return {
    'site.overview.health':    { value: `${site.health}%`, pct: site.health, label: band },
    'site.overview.attention': { value: String(site.attention) },
    'site.overview.structure': { levels: [
      { value: String(c.sections),   label: 'Sections' },
      { value: String(c.enclosures), label: 'Enclosures' },
      { value: String(c.animals),    label: 'Animals' },
    ] },
    'site.people.count':  { value: String(c.staff) },
    'site.animal.count':  { value: String(c.animals) },
    'site.space.count':   { value: String(c.enclosures), label: `Across ${c.sections} Sections` },
    'site.people.mix': { total: String(c.staff), segments: [
      { label: 'Keepers',    n: keepers,  value: String(keepers) },
      { label: 'Support',    n: support,  value: String(support) },
      { label: 'Biologists', n: bio,      value: String(bio) },
      { label: 'Clinical',   n: clinical, value: String(clinical) },
    ] },
    'site.people.today': { items: [
      { value: String(c.staff - onLeave), label: 'Active' },
      { value: String(onLeave),           label: 'On Leave', tone: 'warn' },
      { value: String(managers),          label: 'Managers' },
    ] },
    'site.people.roles': { total: String(c.staff), rows: [
      { text: 'Keepers',    value: String(keepers) },
      { text: 'Support',    value: String(support) },
      { text: 'Biologists', value: String(bio) },
      { text: 'Clinical',   value: String(clinical) },
    ] },
    'site.space.util': {
      value: `${Math.round((occupied / Math.max(1, c.enclosures)) * 100)}%`,
      pct: Math.round((occupied / Math.max(1, c.enclosures)) * 100),
      facts: [
        { value: String(occupied),        label: 'Occupied' },
        { value: String(site.free),       label: 'Available' },
        { value: String(site.restricted), label: 'Restricted' },
      ],
    },
    'site.space.sections': { total: String(c.sections) },
    'site.animal.summary': { items: [
      { value: String(c.species), label: 'Species' },
      { value: String(c.animals), label: 'Animals' },
      ...(BASE_DATA.get('site.animal.summary').items.slice(2)),
    ] },
    'site.animal.ops':     { total: String(c.animals) },
    'site.animal.classes': { total: String(c.species) },
  }
}

function applySite(siteId) {
  const site = getSite(siteId)
  const absent = new Set(site?.absent || [])
  const derived = site ? derive(site) : {}
  const authored = (site && site.figures) || {}

  for (const w of SITE_WIDGETS) {
    /* Base, then what the Site record already knows, then what had to be
       written by hand. A shallow merge on purpose: `rows` and `items` are
       replaced outright rather than merged element by element, because a Site

  const c = sec.counts
  const encl = enclosuresIn(sec.id)
  const occupied = encl.filter((e) => !e.vacant).length
  const defects = encl.filter((e) => e.condition < 75).length
  const minor = encl.filter((e) => e.condition >= 75 && e.condition < 88).length
  const welfare = encl.filter((e) => e.welfare)
  const band = sec.health >= 85 ? 'Healthy' : sec.health >= 70 ? 'Fair' : 'At Risk'
  const pct = (n) => Math.round((n / Math.max(1, c.enclosures)) * 100)

  return {
    'sec.overview.health':    { value: `${sec.health}%`, pct: sec.health, label: band },
    'sec.overview.attention': { value: String(sec.attention) },
    'sec.overview.structure': { levels: [
      { value: String(c.enclosures), label: 'Enclosures' },
      { value: String(c.species),    label: 'Species' },
      { value: String(c.animals),    label: 'Animals' },
    ] },
    'sec.space.count':  { value: String(c.enclosures) },
    'sec.people.count': { value: String(c.staff) },
    'sec.animal.count': { value: String(c.animals) },
    'sec.space.util': {
      value: `${pct(occupied)}%`, pct: pct(occupied),
      facts: [
        { value: String(occupied),       label: 'Occupied' },
        { value: String(sec.free),       label: 'Available' },
        { value: String(sec.restricted), label: 'Restricted' },
      ],
    },
    /* THE ENCLOSURE LIST IS THE ENCLOSURES. Five rows, because a queue card
       shows five — the rest are one tap away through the card itself. */
    'sec.space.enclosures': { total: String(c.enclosures), rows: encl.slice(0, 5).map((e) => ({
      text: e.code, value: e.vacant ? 'Vacant' : String(e.occupants),
    })) },
    'sec.cond.summary': { total: String(c.enclosures), rows: [
      { text: 'Sound',         value: String(c.enclosures - minor - defects),
        pct: pct(c.enclosures - minor - defects) },
      { text: 'Minor defects', value: String(minor),   pct: pct(minor), tone: 'warn' },
      { text: 'Needs repair',  value: String(defects), pct: pct(defects), tone: 'alert' },
    ] },
    'sec.animal.summary': { items: [
      { value: String(c.species), label: 'Species' },
      { value: String(c.animals), label: 'Animals' },
      { value: String(Math.max(0, Math.round(c.animals * 0.06))), label: 'Vet Cases', tone: 'warn' },
      { value: String(welfare.length), label: 'Welfare',
        tone: welfare.length ? 'alert' : 'ok' },
    ] },
    'sec.animal.welfare': welfare.length
      ? { value: String(welfare.length), label: 'Raised',
          items: welfare.slice(0, 4).map((e) => ({
            text: `${e.code} · ${e.note ? 'Observation' : 'Review due'}`,
            tone: e.welfare === 'alert' ? 'alert' : 'warn' })) }
      : { value: '0', label: 'None Raised',
          items: [{ text: 'No welfare alerts in this section', tone: 'ok' }] },
    'sec.people.roster': { total: String(c.staff) },
    'sec.people.allocation': { total: String(c.staff), rows: allocation(c.staff) },
    'sec.resp.incharge': { name: sec.inCharge,
      meta: `Section In-charge · ${sec.name}` },
    'sec.resp.duties': { rows: [
      { text: 'Rounds',      value: sec.inCharge },
      { text: 'Feeding',     value: 'Ramya Prasad' },
      { text: 'Enrichment',  value: 'Vinod Hegde' },
      { text: 'Night Watch', value: 'Latha Murthy' },
    ] },
    'sec.cond.defects': defects + minor
      ? { value: String(defects + minor), label: 'Logged',
          items: encl.filter((e) => e.condition < 88).slice(0, 4).map((e) => ({
            text: `${e.code} · ${e.condition < 75 ? 'Barrier' : 'Fittings'}`,
            value: e.condition < 75 ? 'Repair' : 'Minor',
            tone: e.condition < 75 ? 'alert' : 'warn' })) }
      : { value: '0', label: 'None Logged',
          items: [{ text: 'Every enclosure here is sound', tone: 'ok' }] },
  }
}

function allocation(staff) {
  const keepers = Math.max(1, Math.round(staff * 0.57))
  const drivers = Math.max(0, Math.round(staff * 0.21))
  const maint = Math.max(0, Math.round(staff * 0.14))
  const vet = Math.max(0, staff - keepers - drivers - maint)
  return [
    { text: 'Keepers',     value: String(keepers) },
    { text: 'Drivers',     value: String(drivers) },
    { text: 'Maintenance', value: String(maint) },
    { text: 'Veterinary',  value: String(vet) },
  ]
}

const EMPTY_NOTES = {

const EMPTY_ACTIONS = {
  'd.maintenance': 'Raise Work Order',
  'd.environment': 'Install Sensor',
  'd.inventory':   'Open Store',
  'd.safety':      'Start Checks',
  'd.assets':      'Add Equipment',
  'd.animal':      'Record Assessment',
}

function applySection(sectionId) {
  const sec = getSection(sectionId)
  const absent = new Set(sec?.absent || [])
  const derived = sec ? derive(sec) : {}

  for (const w of SECTION_WIDGETS) {
    w.data = { ...BASE_DATA.get(w.id), ...(derived[w.id] || {}) }
    if (absent.has(w.id)) {
      w.empty = {
        note: EMPTY_NOTES[w.moduleId] || 'Nothing recorded for this section yet.',
        action: EMPTY_ACTIONS[w.moduleId] || 'Add Data',
      }
    } else {
      delete w.empty
    }
  }
  registerVariants(SECTION_WIDGETS)
  return SECTION_WIDGETS
}

/* Individual names, so an enclosure's occupants are named rather than counted.
   Drawn deterministically from the enclosure code — the same FNV hash the rest
   of the hierarchy uses — so Bhima is always in CAR-02. */
const NAMES = ['Bhima', 'Kaveri', 'Arjun', 'Meenakshi', 'Raja', 'Tara', 'Shakti',
               'Nandini', 'Veera', 'Ganga', 'Surya', 'Chitra', 'Anand', 'Lakshmi',
               'Dhruva', 'Ira', 'Kabir', 'Nila', 'Ravi', 'Saanvi', 'Teja', 'Uma']

function hash(str) {
  let h = 2166136261
  for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619) }
  return h >>> 0
}

function individuals(enc) {
  const out = []
  const h = hash(enc.code)
  /* Six named, then a count — a card cannot list twenty-two peafowl, and a
     reader does not want it to. `enc.occ.list` shows what a `recent` card shows. */
  const n = Math.min(enc.occupants, 6)

  /* NO TWO ANIMALS IN ONE ENCLOSURE SHARE A NAME. The first version indexed the
     name table with a hash slice per position, and slices collide — HRB-03 came
     out holding two animals called Shakti, which is the kind of detail that
     makes a reader stop believing the rest of the page. Walk forward from the
     collision instead of rehashing, so the result is still deterministic. */
  const used = new Set()
  for (let i = 0; i < n; i++) {
    let k = ((h >>> (i * 3)) + i * 7) % NAMES.length
    while (used.has(NAMES[k])) k = (k + 1) % NAMES.length
    used.add(NAMES[k])
    const sex = ((h >>> (i * 5)) & 1) ? 'Male' : 'Female'
    const age = 2 + (((h >>> (i * 7)) & 0xff) % 16)
    out.push({ name: NAMES[k], kind: `${sex} · ${age} yrs`, when: `ID ${2200 + ((h >>> i) % 780)}` })
  }
  return out
}

 * because the real ANTZ taxonomy lives in a system this prototype cannot read.

 *

 *

/**
 * MODULE CARD
 * ───────────────────────────────────────────────────────────────────────────
 * One renderer for every card in the product. It takes a variation and a

 * is for the preview to BE the card. There is no second renderer here.
 *
 * ═══ A FUNCTION PER LAYOUT, NOT A TEMPLATE WITH SLOTS ══════════════════════
 *
 * The previous version had one skeleton — label row, then a stack of content
 * blocks — and every card in the product went through it. It made the data
 * tidy and the design uniform in the worst way: five Medical cards that were
 * five green rectangles with different words in them.
 *

 * aligned rows; a stat is one number with the title above it; a timeline is
 * entries down a rule; a chart is an SVG that owns the card. They share
 * tokens, type, radius, icon and fill family — and nothing else. That is the
 * difference between cards that belong to a family and cards that are the
 * same card.
 *

        (data.rows || []).slice(0, 8).map((r) =>
          `<span class="l-health__row" data-tone="${esc(r.tone || 'ok')}">` +

            `<span class="l-health__name">${esc(r.text)}</span>` +
            `<span class="l-health__state">${esc(r.value)}</span>` +

/**
 * MOTION PREFERENCE
 * ───────────────────────────────────────────────────────────────────────────
 * `prefers-reduced-motion` is honoured in CSS by zeroing the transition
 * durations, but that block cannot reach an animation started from script.
 * `Element.animate()` takes its duration as a number, and a number does not
 * consult a media query — so the CSS rule silences every transition in the
 * product and leaves the two Web Animations calls (a card being dismissed, a
 * card arriving) running at full tilt.
 *
 * Anyone who has asked their operating system to calm things down has asked for
 * all of it, not the parts that were convenient to implement. This is the one
 * place that question is answered, and it is live: the matcher is kept so a
 * user who changes the setting mid-session is respected without a reload.
 */

const query = typeof matchMedia === 'function'
  ? matchMedia('(prefers-reduced-motion: reduce)')
  : null

function prefersReducedMotion() {
  return !!query && query.matches
}

/**
 * `Element.animate()`, but a no-op when motion is unwelcome.
 * Always returns something with a `finished` promise so callers can chain
 * without branching on whether the animation actually ran.
 */
function animate(el, keyframes, options) {
  if (prefersReducedMotion() || !el || typeof el.animate !== 'function') {
    return { finished: Promise.resolve(), cancel() {} }
  }
  return el.animate(keyframes, options)
}
  __x.prefersReducedMotion = prefersReducedMotion;
  __x.animate = animate;
});

/**
 * MODULE GRID
 * ───────────────────────────────────────────────────────────────────────────
 * Owns the DOM for the home page's card layout: packs the ordered card list
 * into positions, reconciles those against the elements already on screen, and
 * animates whatever moved.
 *
 * WHY RECONCILE INSTEAD OF REBUILD. Wiping and re-rendering the grid on every
 * state change is four lines and it is wrong here for three separate reasons.
 * It would destroy the element being dragged mid-gesture, along with its
 * pointer capture. It would restart every CSS transition, so nothing could ever
 * animate between two states. And it would throw away scroll position and focus
 * — a keyboard user reordering a card would be dumped back at the top of the
 * page after each keystroke.
 *
 * So slots are keyed by uid and reused. A card that only moved keeps its
 * element and gets a transform; a card whose variant or size actually changed
 * gets its inner card element replaced and nothing else.
 *
 * FLIP. Positions come from `grid-area`, which is not an animatable property —
 * a card told to move from column 1 to column 4 simply appears there. So the
 * grid measures every slot before the change (First), applies it, measures
 * again (Last), sets a transform that puts each slot visually back where it
 * started (Invert), and clears it on the next frame with a transition attached
 * (Play). Two measurement passes, one style write, no layout in a pointermove.
 */

const { currentColumns } = __req('js/lib/sizes.js');

const { isCore: isCoreModule } = __req('js/state/layoutStore.js');
const { renderCard } = __req('js/components/ModuleCard.js');
const { icon } = __req('js/icons.js');
const { animate } = __req('js/lib/motion.js');

 * WHICH WORKSPACE IT IS DRAWING.
 *
 * The home page locks two cards; the Site Workspace locks none, because which
 * widget is indispensable is exactly what differs between a veterinarian and a
 * facility manager. Every other difference between the two — the catalogue, the
 * store, the persistence key — is resolved before anything reaches here: cards
 * arrive as {uid, variantId, size} and variantIds resolve through one shared

       and the one action a person opens Edit Modules to perform is the one they

      if (!slot) {
