    level,
    site, section, enclosure,
    subjectName: subject.name,
    sectionName: section?.name || '',
    code: subject.code || '',
    inCharge: subject.inCharge || site?.inCharge || '—',
    area: level === 'enclosure' ? enclosure.area : null,
    inspected: enclosure?.inspected || null,
    keeper: enclosure?.keeper || null,
    welfare: enclosure?.welfare || null,

    animals, species, staff,
    enclosures: encl,
    sections: level === 'site' ? (counts.sections || 0) : 0,
    free, restricted,
    occupied: Math.max(0, encl - free - restricted),

    onLeave: Math.max(0, Math.round(staff * 0.09)),
    present: Math.max(0, staff - Math.round(staff * 0.09) - Math.max(0, Math.round(staff * 0.04))),
    keepers: Math.max(1, staff - support - bio - clinical),
    bio, clinical,

    open: subject.attention ?? 0,
    maintOpen: read('maintOpen', Math.max(1, Math.round(encl * 0.25))),
    maintOverdue: readSub('maintOpen', 0),
    assets: read('assets', Math.max(4, Math.round(encl * 5.2))),
    criticalDown: readSub('assets', 1),
    vetCases: read('vetCases', Math.max(0, Math.round(animals * 0.022))),
    tasks: read('tasks', Math.max(1, Math.round(encl * 0.7))),
    overdue: read('overdue', 0),
    approvals: read('approvals', 2),
    incidents: read('incidents', 0),

    /* Tables whose rows are the hierarchy itself rather than authored data. */
    sectionRows: sections.map((s) => ({
      t: s.attention > 2 ? 'warn' : null,
      c: [s.name, String(s.counts.enclosures),
          pc(Math.max(0, s.counts.enclosures - s.free - s.restricted), s.counts.enclosures),
          s.attention ? String(s.attention) : 'None'],
    })),
    enclosureRows: enclosures.map((e) => ({
      t: e.status === 'attention' ? 'warn' : e.status === 'closed' ? 'alert' : null,
      c: [e.code, e.housing, e.vacant ? 'Vacant' : String(e.occupants), `${e.condition}`],
    })),
    occupantRows: occupants,
    /**
     * THE PROFILE IS OF AN ANIMAL THAT IS ACTUALLY IN HERE.
     * ─────────────────────────────────────────────────────────────────────
     * The first pass authored a name — "Kaveri, female, 7 years" — and CAR-02
     * holds Anand and Bhima. That is the failure this build has a standing rule
     * about: a record that names something the level above cannot show teaches
     * the reader not to trust either. So the identity comes out of the same
     * occupant list the card draws, and only what a list cannot hold —
     * pedigree, temperament, paperwork — is authored.
     */
    lead: (() => {
      const row = occupants[0]
      if (!row) return null
      const [id, name, sexAge] = row.c
      const age = Number((/(\d+)\s*yr/.exec(sexAge) || [])[1] || 0)
      return {
        id, name,
        sex: String(sexAge).split('·')[0].trim(),
        age: age ? `${age} years` : '—',
        born: age ? `2026 − ${age} = ${2026 - age}` : '—',
        year: age ? String(2026 - age) : '—',
      }
    })(),
    weightRows: occupants.slice(0, 4).map((r, i) => ({
      c: [r.c ? `${r.c[1]} · ${r.c[0]}` : `Animal ${i + 1}`,
          `${140 + i * 17} kg`, i === 2 ? '−3 kg' : `+${1 + i} kg`,
          i === 2 ? '2 of 5 · lean' : '3 of 5 · ideal'],
      t: i === 2 ? 'warn' : null,
    })),
  }
  return x
}

/**
 * A row's cells may be values or functions of the subject. Resolving happens
 * once, on open, rather than in the renderer — the sheet draws strings.
 */
const val = (v, x) => (typeof v === 'function' ? v(x) : v)

function resolveRows(group, x) {
  const raw = typeof group.rows === 'function' ? group.rows(x) : group.rows
  const rows = Array.isArray(raw) ? raw : []

  if (group.kind === 'table') {
    return rows.map((r) => {
      const cells = Array.isArray(r) ? r : r.c || []
      return { tone: val(Array.isArray(r) ? null : r.t, x) || null, cells: cells.map((c) => String(val(c, x) ?? '')) }
    })
  }
  if (group.kind === 'items') {
    return rows.map(([text, value, tone]) => ({
      text: String(val(text, x) ?? ''),
      value: String(val(value, x) ?? ''),
      tone: val(tone, x) || null,
    }))
  }
  return rows.map(([label, value, sub, tone]) => ({
    label: String(val(label, x) ?? ''),
    value: String(val(value, x) ?? ''),
    sub: String(val(sub, x) ?? ''),
    tone: val(tone, x) || null,
  }))
}

/**
 * The record for one domain at one depth, resolved against one subject.
 * `only` and `not` are how a group states the depths it belongs to — a Sections
 * table is meaningless at a Section, and an occupant list is meaningless above
 * an enclosure.
 */
function detailFor(domainId, x) {
  const src = DETAIL[domainId]
  if (!src || !x) return null

  const groups = src.groups
    .filter((g) => (!g.only || g.only.includes(x.level)) && (!g.not || !g.not.includes(x.level)))
    .map((g) => ({
      name: g.name,
      note: g.note || '',
      kind: g.kind,
      cols: g.cols || null,
      rows: resolveRows(g, x),
    }))
    /* A group whose rows all came from an empty hierarchy is not a group. */
    .filter((g) => g.rows.length)

  return {
    question: src.question,
    tiles: src.tiles.map((t) => ({
      label: val(t.label, x),
      value: String(val(t.value, x) ?? ''),
      sub: String(val(t.sub, x) ?? ''),
      tone: val(t.tone, x) || null,
    })),
    groups,
    /* What the sheet counts in its own header, so the reader knows the size of
       what they opened before they start scrolling it. */
    fields: groups.reduce((sum, g) => sum + g.rows.length, 0),
  }
}

const hasDetail = (domainId) => !!DETAIL[domainId]

  __x.DOMAIN_DETAIL = DETAIL;
  __x.buildContext = buildContext;
  __x.detailFor = detailFor;
  __x.hasDetail = hasDetail;

/**
 * ROLES, PERMISSIONS AND DEFAULT WORKSPACES
 * ───────────────────────────────────────────────────────────────────────────
 * The most important requirement in the brief, and the one most easily got
 * wrong: "the same Site should feel different to different users because their
 * responsibilities are different."
 *
 * ═══ NOT FIVE DASHBOARDS ═══════════════════════════════════════════════════
 *
 * The wrong implementation is five separate screens. It looks the same on the
 * first day and diverges forever after: a widget added to the manager view is
 * missing from the vet's, a fix lands in three of five, and within a quarter
 * they are five products.

     preview is neither — see the note in the picker. */
  const isLink = !isStatic && !!mod?.href
  const el = document.createElement(isStatic ? 'div' : isLink ? 'a' : 'button')
  el.className = 'card'
  if (isLink) {
    el.href = mod.href
    el.target = '_blank'
    el.rel = 'noopener'
    /* Chrome starts its own drag from an anchor, which would land on top of
       the pointer-driven reordering the grid uses. */
    el.draggable = false
  } else if (!isStatic) {
    el.type = 'button'
  }

  el.dataset.layout = variant.layout
  el.dataset.fill = variant.fill
  el.dataset.size = size
  el.dataset.w = String(w)
  el.dataset.h = String(h)
  el.dataset.variant = variant.id
  if (uid) el.dataset.uid = uid
  if (data.bandSize) el.dataset.bandSize = data.bandSize

  /* The module's Figma fill and glyph size. A variation may override either —
     the wide Parivesh card is drawn at a different gradient angle. */
  const gradient = variant.gradient || mod?.gradient
  if (gradient) el.style.setProperty('--card-bg', `var(${gradient})`)
  const iconSize = variant.iconSize || mod?.iconSize
  if (iconSize) el.style.setProperty('--icon-size', `${iconSize}px`)

  el.setAttribute('aria-label',
    spokenName(mod, variant, data) + (isLink ? '. Opens in a new tab' : ''))
  if (isStatic) el.setAttribute('aria-hidden', 'true')

  /**
   * NOTHING TO DRAW IS A DESIGN, NOT A FALLBACK.
   *
   * Section 15 of the brief: some Sites have incomplete data, and a widget
   * with none must not show fake zero values. "0 assets, 0 operational, 0
   * critical" is not an empty state, it is a lie that happens to be rendered
   * correctly — a reader has no way to tell it from a Site whose asset register
   * really is empty because everything was scrapped.
   *
   * A NEUTRAL SURFACE, NOT THE DOMAIN GRADIENT UNDER A VEIL. The veiled-
   * gradient treatment was tried on this product once before, for data cards,
   * and reverted: on a desaturated fill it does not soften the colour, it
   * removes it, and the page's premise is that colour identifies its subject.
   * This sidesteps that entirely — an empty card is not a quiet version of a
   * full one, it is a different thing, so it gets a plain outlined surface and
   * recedes. Which is also what it should do: on a workspace where a third of
   * the cards have no data yet, the ones that DO have something to say must
   * still be the ones that carry.
   */
  if (variant.empty) {
    el.dataset.fill = 'empty'
    el.innerHTML =
      `<span class="l-empty">${head(mod, variant, data)}` +
        `<span class="l-empty__body">` +
          `<span class="l-empty__mark" aria-hidden="true">${glyph(mod, variant, 'l-empty__glyph')}</span>` +
          `<span class="l-empty__note">${esc(variant.empty.note)}</span>` +
        `</span>` +
        (variant.empty.action
          ? `<span class="l-empty__action">${esc(variant.empty.action)}</span>`
          : '') +
      `</span>`
    return el
  }

  /**
   * THE WHOLE CARD IS THE BUTTON, AND NOTHING INSIDE IT IS.
   *
   * A previous pass put a `View Maintenance ›` floor at the foot of every large
   * widget, reading the brief's `[View X]` sketches literally. It was wrong for
   * a reason worth keeping: the card is ALREADY a button — it has been since
   * the first line of this file — so the floor was a control inside a control,
   * and twenty of them turned a workspace into a page of links. The affordance
   * belongs to the surface, which is what the press and hover states are for.
   */
  const build = LAYOUTS[variant.layout] || LAYOUTS.door
  el.innerHTML = build(mod, variant, data)
  return el
}

/* What a screen reader reads: the module, the card, then its actual content,
   so nobody has to open Pharmacy to learn that 42 requests are waiting. */
function spokenName(mod, variant, data) {
  /* An empty card reads as its title and the reason it is empty. Falling
     through to the content branches below would announce a card's name and
     then nothing at all, which is indistinguishable from a broken one. */
  if (variant.empty) {
    return [mod?.name, variant.name, variant.empty.note].filter(Boolean).join('. ')
  }
  const bits = [data.label || mod?.name]
  if (variant.layout !== 'door' && variant.layout !== 'compact') bits.push(variant.name)
  if (data.value) bits.push(`${data.value}${data.of ? ' of ' + data.of : ''} ${data.label || ''}`)
  if (data.sub) bits.push(data.sub)
  if (data.total) bits.push(`${data.total} total`)
  if (data.caption) bits.push(data.caption)
  if (data.summary) bits.push(data.summary)
  for (const i of data.items || []) bits.push([i.value, i.label, i.text, i.name, i.kind, i.meta, i.when].filter(Boolean).join(' '))
  for (const r of data.rows || []) bits.push(`${r.text} ${r.value}`)
  for (const f of data.figures || []) bits.push(`${f.value} ${f.label}`)
  for (const s of data.segments || []) bits.push(`${s.label} ${s.value ?? s.n}`)
  for (const s of data.stages || []) bits.push(`${s.label} ${s.value}`)
  for (const f of data.facts || []) bits.push(`${f.value} ${f.label}`)
  for (const l of data.levels || []) bits.push(`${l.value} ${l.label}`)
  if (data.name) bits.push(data.name)
  if (data.meta) bits.push(data.meta)
  if (data.foot) bits.push(`${data.foot.label} ${data.foot.value}`)
  for (const a of data.actions || []) bits.push(a)
  return bits.filter(Boolean).join('. ')
}

/* ── shared parts ───────────────────────────────────────────────────────── */

function glyph(mod, variant, cls = 'card__icon') {
  /* A SPRITE SYMBOL OR AN EXPORTED FILE, AND THE GROUP DECIDES.
     Modules carry `icon`, a file exported from Figma, because a hand-drawn
     approximation of a designer's icon is just a wrong icon. Site domains carry
     `sprite`, a symbol drawn in icons.js, because the artboard has no Site
     Workspace and there is nothing to export. The card does not care which — it
     asks for a glyph and gets one. */
  const symbol = variant.sprite || mod?.sprite
  if (symbol) return `<span class="${cls} ${cls}--sprite">${icon(symbol, 'glyph')}</span>`

  const file = variant.icon || mod?.icon
  if (!file) return ''
  const fish = mod?.iconShape === 'fish' && !variant.icon
  return `<span class="${cls}${fish ? ' card__icon--fish' : ''}">` +
         `<img src="${ASSET_ICON}${esc(file)}" alt="" aria-hidden="true"></span>`
}

/** The title line on a data card. A small glyph, then the card's own name. */
function head(mod, variant, data) {
  return `<span class="c-head">${glyph(mod, variant, 'c-head__icon')}` +
         `<span class="c-head__text">${esc(data.title || mod?.name || '')}</span></span>`
}

function media(variant) {
  if (!variant.image) return ''
  const pos = variant.imagePosition ? ` style="object-position:${esc(variant.imagePosition)}"` : ''
  let out = `<img class="card__media"${pos} src="${ASSET_IMG}${esc(variant.image)}" alt="" aria-hidden="true">`
  /* Figma stacks two exported layers on the Species card, a leaf plate under a
     tint pass. Both are real layers in the file, so both are drawn. */
  if (variant.imageOver) {
    out += `<img class="card__media" src="${ASSET_IMG}${esc(variant.imageOver)}" alt="" aria-hidden="true">`
  }
  if (variant.wash) out += `<span class="card__wash" style="background:${esc(variant.wash)}"></span>`
  return out
}

/* ───────────────────────────────────────────────────────────────────────────
   THE LAYOUTS
   Nineteen compositions. Each owns its markup; none is a variation of another.
   The last seven draw their visualisations in white at an opacity, directly on
   the module's gradient — a donut, a gauge, a track. None of them puts a pale
   plate under itself to sit on, which is the line between a card that belongs
   to this system and a dashboard tile that has been dropped into it.
   ─────────────────────────────────────────────────────────────────────────── */

const LAYOUTS = {

  /* A glyph and a name, pushed to opposite ends of the card — the artboard's
     own module tile, and the whole of a navigation card. No figures, no
     description, no arrow: the card is the link. */
  /* `data.label` OVERRIDES THE GROUP NAME, and only the Site Workspace uses it.
     A module's door IS the module, so its name is the right label and every
     module card leaves this unset. A domain can have more than one door —
     Site Overview holds both the Site Map tile and the workspace's summary
     cards — and a tile reading "Site Overview" when it opens the map is a door
     with the wrong sign on it. */
  door: (mod, variant, data) =>
    `<span class="l-door">${glyph(mod, variant)}` +
    `<span class="l-door__name">${esc(data.label || mod?.name || '')}</span></span>`,

  /* The same entry point on its side, one row high, for a page that wants many
     modules visible at once. */
  compact: (mod, variant, data) =>
    `<span class="l-compact">${glyph(mod, variant, 'l-compact__icon')}` +
    `<span class="l-compact__name">${esc(data.label || mod?.name || '')}</span></span>`,

  /* A photograph with its name in a scrim band — or, on the Species card, with
     the collection's two figures over it. */
  photo: (mod, variant, data) => {
    if (data.figures) {
      return media(variant) +
        `<span class="l-photo-stat">${head(mod, variant, data)}` +
        `<span class="l-photo-stat__figures">` +
        data.figures.map((f) =>
          `<span class="figure"><span class="figure__value">${esc(f.value)}</span>` +
          `<span class="figure__label">${esc(f.label)}</span></span>`).join('') +
        `</span></span>`
    }
    return media(variant) +
      `<span class="l-photo">${glyph(mod, variant)}</span>` +
      `<span class="card__band"><span class="l-door__name">${esc(mod?.name || '')}</span></span>`
  },

  /* ONE number, as large as the card allows, with its caption under it and the
     supporting figure demoted to a quiet line at the foot. The hierarchy is
     the point: primary, secondary, tertiary, and nothing else competing. */
  stat: (mod, variant, data) =>
    `<span class="l-stat">${head(mod, variant, data)}` +
      `<span class="l-stat__body">` +
        `<span class="l-stat__value">${esc(data.value)}</span>` +
        `<span class="l-stat__label">${esc(data.label || '')}</span>` +
      `</span>` +
      (data.sub ? `<span class="l-stat__sub"${data.subTone ? ` data-tone="${esc(data.subTone)}"` : ''}>${esc(data.sub)}</span>` : '') +
    `</span>`,

  /* Two to four figures side by side, separated by whitespace alone — no
     boxes, no dividers, no card-within-a-card. */
  metrics: (mod, variant, data) =>
    `<span class="l-metrics">${head(mod, variant, data)}` +
      `<span class="l-metrics__row" data-n="${(data.items || []).length}">` +
      (data.items || []).map((m) =>
        `<span class="metric"${m.tone ? ` data-tone="${esc(m.tone)}"` : ''}>` +
          `<span class="metric__value">${esc(m.value)}</span>` +
          `<span class="metric__label">${esc(m.label)}</span></span>`).join('') +
      `</span></span>`,

  /**
   * A trend line that owns the card, with the summary beneath it.
   *
   * SCALED FROM ZERO, NOT FROM THE MINIMUM. Mortality's three months are 18,
   * 15 and 12; scaled from the minimum the last point would sit on the floor
   * and the card would read as a collapse rather than as a 33% improvement.
   * Truncated axes are how honest data becomes a lie.
   */
  chart: (mod, variant, data) => {
    const s = data.series || []
    const max = Math.max(1, ...s.map((p) => p.value))
    const W = 100, H = 34
    const pts = s.map((p, i) => [
      s.length > 1 ? (i / (s.length - 1)) * W : W / 2,
      H - (p.value / max) * (H - 4) - 2,
    ])
    const line = pts.map((p, i) => `${i ? 'L' : 'M'}${p[0].toFixed(1)} ${p[1].toFixed(1)}`).join('')
    const area = `${line}L${W} ${H}L0 ${H}Z`
    return `<span class="l-chart">${head(mod, variant, data)}` +
      `<span class="l-chart__plot">` +
        `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-hidden="true" focusable="false">` +
          `<path class="l-chart__area" d="${area}"/>` +
          `<path class="l-chart__line" d="${line}" vector-effect="non-scaling-stroke"/>` +
        `</svg>` +
      `</span>` +
      `<span class="l-chart__foot">` +
        `<span class="l-chart__summary">${esc(data.summary || '')}</span>` +
        (data.delta ? `<span class="l-chart__delta" data-dir="${esc(data.delta.dir)}">` +
          `${data.delta.dir === 'down' ? '↓' : '↑'} ${esc(data.delta.text)}</span>` : '') +
      `</span></span>`
  },

  /* A total at the top right of its title, then named rows with their figures
     right-aligned on a common edge — the shape of a work queue. */
  queue: (mod, variant, data) => {
    /**
     * A QUEUE WHOSE VALUES ARE WORDS IS NOT THE SAME CARD AS ONE WHOSE VALUES
     * ARE COUNTS, AND ON A NARROW CARD IT CANNOT BEHAVE LIKE ONE.
     *
     * "Electrical  4" and "Site In-charge  Ramesh Kumar" are the same markup and
     * completely different width problems: the second's value is six times wider
     * and it squeezed the label to "Site In-c…" on a one-column card. Detected
     * rather than declared, because it is a property of the content and a flag
     * in the catalogue would be one more thing to get wrong — and detected here
     * rather than in CSS, because CSS cannot ask what a string looks like.
     *
     * Every module queue card's values are counts, so none of them is affected.
     */
    const rows = data.rows || []
    const wordy = rows.some((r) => !/^[\d.,%+\-\u20B9 ]+$/.test(String(r.value ?? '')))
    return `<span class="l-queue"${wordy ? ' data-wordy="1"' : ''}>` +
      `<span class="l-queue__head">${head(mod, variant, data)}` +
        (data.total ? `<span class="l-queue__total">${esc(data.total)}</span>` : '') +
      `</span>` +
      `<span class="l-queue__rows">` +
      rows.map((r) =>
        `<span class="l-queue__row"><span class="l-queue__text">${esc(r.text)}</span>` +
        `<span class="l-queue__value">${esc(r.value)}</span></span>`).join('') +
      `</span></span>`
  },

  /* Dotted rows. A state rather than a measurement, so the dot carries the
     meaning and the card is never repainted by its worst line. */
  status: (mod, variant, data) =>
    `<span class="l-status">${head(mod, variant, data)}` +
      /* `data-n` is read by CSS: four rows in a 2x2 card leave a third of it
         empty above and below them, and the honest fix is to let them breathe
         rather than to pool the slack. Six rows already fill the card and are
         left alone. */
      `<span class="l-status__rows" data-n="${(data.items || []).length}">` +
      (data.items || []).map((i) =>
        `<span class="l-status__row" data-tone="${esc(i.tone || 'ok')}">` +
          `<i class="l-status__dot"></i>` +
          `<span class="l-status__value">${esc(i.value)}</span>` +
          `<span class="l-status__text">${esc(i.text)}</span></span>`).join('') +
      `</span></span>`,

  /* A ratio, a full-width track, a caption. The track is the largest thing on
     the card because the card is about how far along something is. */
  progress: (mod, variant, data) =>
    `<span class="l-progress">${head(mod, variant, data)}` +
      `<span class="l-progress__ratio">` +
        `<span class="l-progress__value">${esc(data.value)}</span>` +
        `<span class="l-progress__of">/ ${esc(data.of)}</span>` +
      `</span>` +
      `<span class="l-progress__track"><i style="width:${Math.max(0, Math.min(100, data.pct))}%"></i></span>` +
      /* SPENT AGAINST WHAT, AND BY WHEN. A budget bar on its own says how full
         it is; what makes it a decision is the same bar read against how much
         of the year has gone. So the layout takes up to three facts under the
         track, and the third one on every Site Budget in this product is Year
         Elapsed — 73% spent at 78% through is fine, 93% spent at 78% through
         is the conversation. */
      (data.facts
        ? `<span class="l-progress__facts">` +
          data.facts.slice(0, 3).map((f) =>
            `<span class="l-progress__fact"${f.tone ? ` data-tone="${esc(f.tone)}"` : ''}>` +
              `<span class="l-progress__fact-value">${esc(f.value)}</span>` +
              `<span class="l-progress__fact-label">${esc(f.label)}</span>` +
            `</span>`).join('') +
          `</span>`
        : '') +
      `<span class="l-progress__caption">${esc(data.caption || '')}</span>` +
    `</span>`,

  /* Entries down a hairline rule, newest first. */
  timeline: (mod, variant, data) =>
    `<span class="l-timeline">${head(mod, variant, data)}` +
      `<span class="l-timeline__items">` +
      (data.items || []).map((i) =>
        `<span class="l-timeline__item"${i.tone ? ` data-tone="${esc(i.tone)}"` : ''}>` +
          `<i class="l-timeline__dot"></i>` +
          `<span class="l-timeline__text">${esc(i.text)}</span>` +
          `<span class="l-timeline__meta">${esc(i.meta || '')}</span></span>`).join('') +
      `</span></span>`,

  /* The objects you were last working on, so the card is a way back into work
     rather than a log of it. */
  recent: (mod, variant, data) =>
    `<span class="l-recent">${head(mod, variant, data)}` +
      `<span class="l-recent__items">` +
      (data.items || []).map((i) =>
        `<span class="l-recent__item">` +
          `<span class="l-recent__main">` +
            `<span class="l-recent__name">${esc(i.name)}</span>` +
            `<span class="l-recent__kind">${esc(i.kind)}</span></span>` +
          `<span class="l-recent__when">${esc(i.when)}</span></span>`).join('') +
      `</span></span>`,

  /* Controls, and the controls are the content — not a footer under something
     else. Two to four; a fifth would make the card a menu. */
  actions: (mod, variant, data) =>
    `<span class="l-actions">${head(mod, variant, data)}` +
      `<span class="l-actions__set" data-n="${(data.actions || []).length}">` +
      (data.actions || []).slice(0, 4).map((a) =>
        `<span class="l-action">${esc(a)}</span>`).join('') +
      `</span></span>`,

  /**
   * COMPOSITION · a donut, and a legend that names the parts.
   *
   * SEGMENTS ARE ONE WHITE AT FOUR OPACITIES. Four hues would read as four
   * categories with meanings of their own, and would collide with whichever
   * module the card belongs to — a green wedge inside a green card. Opacity
   * ranks the parts, which is what a composition is actually saying.
   *
   * The circle is drawn at r = 15.9155 so its circumference is 100 and a
   * segment's dash length IS its percentage. Nothing has to be scaled.
   */
  ring: (mod, variant, data) => {
    const segs = (data.segments || []).slice(0, 4)
    const sum = segs.reduce((n, s) => n + (Number(s.n) || 0), 0) || 1
    let at = 0
    const arcs = segs.map((s, i) => {
      const len = ((Number(s.n) || 0) / sum) * 100
      /* a 1% gap so two adjacent segments never fuse into one wedge */
      const draw = Math.max(0, len - 1)
      const el = `<circle class="l-ring__seg" data-i="${i}" cx="20" cy="20" r="15.9155"` +
        ` stroke-width="5.2" stroke-dasharray="${draw.toFixed(2)} ${(100 - draw).toFixed(2)}"` +
        ` stroke-dashoffset="${(-at).toFixed(2)}" transform="rotate(-90 20 20)"/>`
      at += len
      return el
    }).join('')
    return `<span class="l-ring">${head(mod, variant, data)}` +
      `<span class="l-ring__body">` +
        `<span class="l-ring__dial">` +
          `<svg viewBox="0 0 40 40" aria-hidden="true" focusable="false">` +
            `<circle class="l-ring__track" cx="20" cy="20" r="15.9155" stroke-width="5.2"/>` +
            arcs +
          `</svg>` +
          `<span class="l-ring__centre">` +
            `<span class="l-ring__total">${esc(data.total)}</span>` +
            (data.unit ? `<span class="l-ring__unit">${esc(data.unit)}</span>` : '') +
          `</span>` +
        `</span>` +
        `<span class="l-ring__legend">` +
        segs.map((s, i) =>
          `<span class="l-ring__key" data-i="${i}"><i class="l-ring__swatch"></i>` +
          `<span class="l-ring__name">${esc(s.label)}</span>` +
          `<span class="l-ring__val">${esc(s.value ?? s.n)}</span></span>`).join('') +
        `</span>` +
      `</span></span>`
  },

  /**
   * CAPACITY · a 240° gauge with the percentage inside it.
   *
   * `pathLength="100"` lets the dash length be the percentage directly, the
   * same trick the ring uses, so neither the arc's radius nor its sweep can
   * drift out of step with the number printed in the middle of it.
   */
  arc: (mod, variant, data) => {
    const pct = Math.max(0, Math.min(100, Number(data.pct) || 0))
    const d = 'M15.36 70A40 40 0 1 1 84.64 70'
    return `<span class="l-arc">${head(mod, variant, data)}` +
      `<span class="l-arc__body">` +
        `<span class="l-arc__dial">` +
          `<svg viewBox="0 0 100 78" aria-hidden="true" focusable="false">` +
            `<path class="l-arc__track" d="${d}" pathLength="100" stroke-width="8"/>` +
            `<path class="l-arc__value" d="${d}" pathLength="100" stroke-width="8"` +
            ` stroke-dasharray="${pct.toFixed(1)} 100"/>` +
          `</svg>` +
          `<span class="l-arc__read">` +
            `<span class="l-arc__pct">${esc(data.value ?? pct + '%')}</span>` +
          `</span>` +
        `</span>` +
        `<span class="l-arc__facts">` +
        (data.facts || []).slice(0, 3).map((f) =>
          `<span class="l-arc__fact"><span class="l-arc__fact-value">${esc(f.value)}</span>` +
          `<span class="l-arc__fact-label">${esc(f.label)}</span></span>`).join('') +
        `</span>` +
      `</span></span>`
  },

  /* FLOW · the stages one population moves through, counted at each. The
     chevrons are what make four figures a pipeline rather than four
     measurements; a card whose stages are not sequential passes
     `dir: 'none'` and gets arrows on the stages instead. */
  flow: (mod, variant, data) => {
    const stages = (data.stages || []).slice(0, 5)
    const ARROW = { in: '↓', out: '↑', across: '↔' }
    return `<span class="l-flow">${head(mod, variant, data)}` +
      `<span class="l-flow__stages" data-n="${stages.length}"${data.dir ? ` data-dir="${esc(data.dir)}"` : ''}>` +
      stages.map((s) =>
        `<span class="l-flow__stage">` +
          `<span class="l-flow__value">` +
            (s.dir ? `<span class="l-flow__arrow">${ARROW[s.dir] || ''}</span> ` : '') +
            `${esc(s.value)}</span>` +
          `<span class="l-flow__label">${esc(s.label)}</span></span>`).join('') +
      `</span></span>`
  },

  /* ATTENTION · one count that is the reason the card is on the page, then
     the named things inside it. Tone sits on the dot and nowhere else. */
  attention: (mod, variant, data) =>
    `<span class="l-attn">${head(mod, variant, data)}` +
      `<span class="l-attn__hero">` +
        `<span class="l-attn__value">${esc(data.value)}</span>` +
        `<span class="l-attn__label">${esc(data.label || '')}</span>` +
      `</span>` +
      /* THE OPTIONAL SPLIT · how the total divides, between the figure and the
         named things inside it.
         This exists because section 10 of the brief draws Maintenance as ONE
         component carrying three things — the count, the split by urgency, and
         the next few jobs — and the product had it as two cards sitting in
         different parts of the same page. Two cards headed "Maintenance" with
         different numbers on them is the reader's problem to reconcile, and
         they should not have been given it. */
      (data.split
        ? `<span class="l-attn__split">` +
          data.split.slice(0, 3).map((sp) =>
            `<span class="l-attn__part"${sp.tone ? ` data-tone="${esc(sp.tone)}"` : ''}>` +
              `<span class="l-attn__part-value">${esc(sp.value)}</span>` +

/**
 * MOTION PREFERENCE
 * ───────────────────────────────────────────────────────────────────────────
 * `prefers-reduced-motion` is honoured in CSS by zeroing the transition
 * durations, but that block cannot reach an animation started from script.
 * `Element.animate()` takes its duration as a number, and a number does not
 * consult a media query — so the CSS rule silences every transition in the
 * product and leaves the two Web Animations calls (a card being dismissed, a
 * card arriving) running at full tilt.
 *
 * Anyone who has asked their operating system to calm things down has asked for
 * all of it, not the parts that were convenient to implement. This is the one
 * place that question is answered, and it is live: the matcher is kept so a
 * user who changes the setting mid-session is respected without a reload.
 */

const query = typeof matchMedia === 'function'
  ? matchMedia('(prefers-reduced-motion: reduce)')
  : null

function prefersReducedMotion() {
  return !!query && query.matches
}

/**
 * `Element.animate()`, but a no-op when motion is unwelcome.
 * Always returns something with a `finished` promise so callers can chain
 * without branching on whether the animation actually ran.
 */
function animate(el, keyframes, options) {
  if (prefersReducedMotion() || !el || typeof el.animate !== 'function') {
    return { finished: Promise.resolve(), cancel() {} }
  }
  return el.animate(keyframes, options)
}

  __x.animate = animate;

/**
 * MODULE GRID
 * ───────────────────────────────────────────────────────────────────────────
 * Owns the DOM for the home page's card layout: packs the ordered card list
 * into positions, reconciles those against the elements already on screen, and
 * animates whatever moved.
 *
 * WHY RECONCILE INSTEAD OF REBUILD. Wiping and re-rendering the grid on every
 * state change is four lines and it is wrong here for three separate reasons.
 * It would destroy the element being dragged mid-gesture, along with its
 * pointer capture. It would restart every CSS transition, so nothing could ever
 * animate between two states. And it would throw away scroll position and focus
 * — a keyboard user reordering a card would be dumped back at the top of the
 * page after each keystroke.
 *
 * So slots are keyed by uid and reused. A card that only moved keeps its
 * element and gets a transform; a card whose variant or size actually changed
 * gets its inner card element replaced and nothing else.
 *
 * FLIP. Positions come from `grid-area`, which is not an animatable property —
 * a card told to move from column 1 to column 4 simply appears there. So the
 * grid measures every slot before the change (First), applies it, measures
 * again (Last), sets a transform that puts each slot visually back where it
 * started (Invert), and clears it on the next frame with a transition attached
 * (Play). Two measurement passes, one style write, no layout in a pointermove.

const { isCore: isCoreModule } = __req('js/state/layoutStore.js');

 * WHICH WORKSPACE IT IS DRAWING.

 * The home page locks two cards; the Site Workspace locks none, because which
 * widget is indispensable is exactly what differs between a veterinarian and a
 * facility manager. Every other difference between the two — the catalogue, the
 * store, the persistence key — is resolved before anything reaches here: cards
 * arrive as {uid, variantId, size} and variantIds resolve through one shared
 * lookup. So this is the only seam, and it defaults to the home page's rule so
 * that the original caller did not have to change.

    /* ADD MODULE IS NOT IN HERE ANY MORE.
       It used to be packed as a tile after the last card, on the theory that it
       lands in the first free slot rather than in a bar you go looking for. On
       a fifteen-card page that theory is wrong: the tile sits below the fold,
       and the one action a person opens Edit Modules to perform is the one they
       have to scroll to find. It is now a header action — see
       EditModulesMode.js — and the grid holds only the user's own modules. */

    const next = pack(list, cols)

    const first = animate ? measure() : null

      live.add(item.uid)
      let slot = slots.get(item.uid)

      if (!slot) {

        slots.set(item.uid, slot)

   * would be re-assigned a new phase, so the whole page would visibly
   * re-synchronise on every drop. Random is wrong because the grid reconciles
   * rather than rebuilds — a card that survives a render keeps its element and
   * would keep its old value, while a new neighbour would get a fresh one, and
   * the two would drift apart for no reason a user could see.
   *
   * Hashed from the uid, the phase is a property OF THE CARD. It survives

  }

   * Bring an existing slot up to date. Only the two things that can actually
   * change are checked, and the card is rebuilt only if one of them did —
   * rebuilding on every render would defeat the whole point of keying.
   */
  function syncSlot(slot, item) {
    const spanChanged = slot.dataset.w !== String(item.w) || slot.dataset.h !== String(item.h)
    const identityChanged = slot.dataset.variant !== item.variantId || slot.dataset.size !== item.size

    slot.dataset.w = String(item.w)
    slot.dataset.h = String(item.h)

    if (identityChanged || spanChanged) {
      const variant = getVariant(item.variantId)
      const old = slot.querySelector('.card')
      if (variant && old) {
        if (identityChanged) {
          const card = renderCard(variant, { size: item.size, w: item.w, h: item.h, uid: item.uid })
          card.addEventListener('click', (e) => {
            if (editing) { e.preventDefault(); return }
            onActivate?.(variant, item)
          })
          old.replaceWith(card)
        } else {
          /* span changed but the card did not — the container query and the
             `data-h` selector do the rest, so only the attributes move */
          old.dataset.w = String(item.w)
          old.dataset.h = String(item.h)
        }
      }
      slot.dataset.variant = item.variantId
      slot.dataset.size = item.size
    }

    /* edit affordances are added and removed as the mode changes */
    const hasControl = slot.querySelector('.slot__remove, .slot__locked')
    if (editing && !hasControl) decorate(slot, item)
    if (!editing) for (const c of slot.querySelectorAll('.slot__remove, .slot__locked, .slot__resize')) c.remove()
  }

  function decorate(slot, item) {
    /* Resize is offered on every card that has more than one size to offer —
       including the two core cards, which cannot be removed but can certainly
       be made smaller. */

    if (variant && variant.supportedSizes.length > 1) {
      const size = document.createElement('button')
      size.type = 'button'
      size.className = 'slot__resize'
      size.innerHTML = icon('resize')

        e.stopPropagation()

      })

    }

      const lock = document.createElement('span')
      lock.className = 'slot__locked'
      lock.title = 'This module is always on your home page'
      lock.innerHTML = icon('security')
      slot.append(lock)

    }

    btn.type = 'button'
    btn.className = 'slot__remove'
    btn.innerHTML = icon('minus')

    btn.setAttribute('aria-label', `Remove ${name}`)

      e.stopPropagation()

    slot.append(btn)
  }

   * Removing a slot outright makes the cards around it jump. Fading it first
   * and taking it out of the packer on the next render lets the FLIP pass
   * animate the survivors into the space it left.

      slot,

    ).finished.catch(() => {}).finally(() => slot.remove())

   * Which card should take focus when `uid` is removed?
   *
   * Asked BEFORE the removal, because afterwards the card is gone from the
   * placement and there is no longer anything to be next to. Left alone, focus
   * falls to <body> and a keyboard user removing three cards has to tab in from
   * the top of the page each time.
   *
   * The card after it is the natural landing place; the one before it if it was
   * last.
   */

    const order = placed.slice()
    const i = order.findIndex((p) => p.uid === uid)
    if (i < 0) return null
    return order[i + 1]?.uid || order[i - 1]?.uid || null
  }

  /** Hand focus to a uid captured earlier, falling back to the Add tile. */
  function restoreFocus(uid) {

      uid && slots.get(uid)?.querySelector('.card')
    target?.focus({ preventScroll: true })

  }

       `getBoundingClientRect` forces it once, here, and not again. */
    const moves = []
    for (const [uid, slot] of slots) {
      const f = first.get(uid)
      if (!f) continue
      const l = slot.getBoundingClientRect()
      const dx = f.left - l.left
      const dy = f.top - l.top
      if (Math.abs(dx) < 0.5 && Math.abs(dy) < 0.5) continue
      moves.push([slot, dx, dy])

    for (const [slot, dx, dy] of moves) {
      slot.classList.remove('is-flipping')
      slot.style.transform = `translate3d(${dx}px, ${dy}px, 0)`
    }

    requestAnimationFrame(() => {
      for (const [slot] of moves) {
        slot.classList.add('is-flipping')
        slot.style.transform = ''
        const done = () => {
          slot.classList.remove('is-flipping')
          slot.style.willChange = ''
          slot.removeEventListener('transitionend', done)
        }
        slot.addEventListener('transitionend', done)
      }
    })

  return {
    render,

    setEditing(on) {
      editing = on

    get columns() { return cols },
    get placement() { return placed },
    get slots() { return slots },

    slotFor(uid) { return slots.get(uid) || null },

        .map((p) => ({ ...p, el: slots.get(p.uid) }))
        .filter((p) => p.el)
    },

    destroy() {
      slots.clear()
      root.replaceChildren()
    },
  }
}

 *           taller than an iPad. Move more than 8px inside those 200ms and the
 *           press is abandoned as a scroll.

 * grid re-laying-out on every frame and the card being clipped the moment it
 * left the container.

 * is over, and if that has changed it reorders a working copy of the card list

 * into its new place — so "other cards move to create space" is not a special

      active.cards = moveItem(active.cards, active.index, idx)
      active.index = idx

         slot survives, keeps `is-source`, and every other card FLIPs into its
         new position. */

   * Scroll the page when the pointer is held near an edge, so a card can be
   * carried from the bottom of a long grid to the top. The speed ramps with how

   */

    const h = window.innerHeight
    let dir = 0
    if (active.y < EDGE) dir = -(1 - active.y / EDGE)
    else if (active.y > h - EDGE) dir = 1 - (h - active.y) / EDGE

       live. A card lifted from the last row is otherwise dragged straight into
       a scroll it never asked for. */

    if (!active.scrollArmed) dir = 0

    active.scrollDir = dir
    if (dir) window.scrollBy(0, Math.sign(dir) * Math.min(1, Math.abs(dir)) ** 1.6 * EDGE_MAX_SPEED)
  }

  /* ── hit testing ────────────────────────────────────────────────────── */

  /**
   * Which index should the card land at?

   * Element-based rather than arithmetic. The geometric alternative — turning
   * clientX/Y into a {col,row} and looking up what occupies it — has to
   * reproduce the packer's decisions exactly, and it goes wrong at precisely
   * the places that matter: over a hole, over a card twice the height of its
   * neighbour, past the end of the last row. Asking the rendered rectangles is
   * both simpler and always right, because they ARE the layout.
   *
   * Cards are in visual order, and the list is normalised into visual order
   * after every commit, so a visual index and a list index are the same number.
   */
  function targetIndex(x, y) {
    const items = grid.orderedSlots()
    if (!items.length) return 0

    let nearest = null
    let nearestDist = Infinity

    for (let i = 0; i < items.length; i++) {
      const r = items[i].el.getBoundingClientRect()

      if (x >= r.left && x <= r.right && y >= r.top && y <= r.bottom) {
        if (items[i].uid === active.uid) return active.index    // still over itself
        /* Left half means "take this card's place", right half means "go after
           it" — the standard insertion-caret reading, and the one that makes a
           wide card feel like it has two halves rather than one target. */
        const before = x < r.left + r.width / 2
        const idx = before ? i : i + 1
        return normaliseIndex(idx, items)
      }

      const cx = r.left + r.width / 2
      const cy = r.top + r.height / 2
      const d = Math.hypot(x - cx, y - cy)
      if (d < nearestDist) { nearestDist = d; nearest = { i, r } }
    }

    /* In a gap, or past the end of the grid. Fall to the nearest card and use
       the same half-rect rule against it, so dropping into the empty tail of
       the last row appends rather than doing nothing. */
    if (!nearest) return null
    if (items[nearest.i].uid === active.uid) return active.index
    const before = y < nearest.r.top + nearest.r.height / 2
      ? true
      : y > nearest.r.bottom
        ? false
        : x < nearest.r.left + nearest.r.width / 2
    const idx = before ? nearest.i : nearest.i + 1
    return normaliseIndex(idx, items)
  }

  /**
   * `items` excludes nothing, but the dragged card has been spliced out of the
   * working list before reinsertion, so an index computed against the rendered
   * order needs adjusting once the target is past the card's current home.
   */
  function normaliseIndex(idx, items) {
    const current = items.findIndex((it) => it.uid === active.uid)
    if (current < 0) return Math.max(0, Math.min(idx, active.cards.length - 1))
    if (idx > current) idx -= 1
    return Math.max(0, Math.min(idx, active.cards.length - 1))
  }

  function restoreOriginal() {
    return moveItem(active.cards, active.index, active.fromIndex)
  }

  /* ── drop ───────────────────────────────────────────────────────────── */

  function finish() {
    if (!active) return
    const a = active

    clearTimeout(holdTimer)
    if (raf) { cancelAnimationFrame(raf); raf = 0 }
    document.removeEventListener('touchmove', blockScroll)
    document.body.classList.remove('is-dragging')
    try { a.slot.releasePointerCapture(a.pointerId) } catch { /* already gone */ }

    if (!a.started) { active = null; return }

    const slot = grid.slotFor(a.uid) || a.slot
    const rest = slot.getBoundingClientRect()

    /* Fly the proxy home rather than letting it vanish. The card should look
       like it was placed, not like it was deleted and redrawn. */
    if (a.proxy) {
      a.proxy.classList.add('is-landing')
      a.proxy.style.width = `${rest.width}px`
      a.proxy.style.height = `${rest.height}px`
      a.proxy.style.transform = `translate3d(${rest.left}px, ${rest.top}px, 0) scale(1) rotate(0deg)`
    }

    const cleanup = () => {
      slot.classList.remove('is-source', 'is-placeholder')
      layer?.remove()
      layer = null
    }

    if (a.proxy) {
      let done = false
      const end = () => { if (done) return; done = true; cleanup() }
      a.proxy.addEventListener('transitionend', end, { once: true })
      setTimeout(end, 420)     // transitionend never fires if nothing changed
    } else cleanup()

    active = null

    /* ALWAYS notify, even when nothing moved.
       This used to be `if (a.index !== a.fromIndex) onCommit(...)`, and the two
       endings that skipped it — dragging a card back onto its own slot, and a
       pointercancel — left the caller's scratch copy of the card list alive
       forever. From that moment the grid was pinned to a stale array: removing
       a card, adding one from the picker, resizing, all wrote to the store and
       to localStorage while the screen showed the frozen layout, and the two
       only agreed again after a reload.
       The `changed` flag carries what the old condition decided, so the caller
       can still tell a real move from a no-op. */
    onCommit?.(a.cards, { changed: a.index !== a.fromIndex })

    announce?.(
      a.index !== a.fromIndex
        ? `Moved ${labelFor(slot)} to position ${a.index + 1} of ${a.cards.length}.`
        : 'Returned to its original position.',
    )
  }

  function cancel() {
    clearTimeout(holdTimer)
    if (!active) return
    try { active.slot.releasePointerCapture(active.pointerId) } catch { /* fine */ }
    active = null
  }

  function labelFor(slot) {
    return slot?.querySelector('.card')?.getAttribute('aria-label') || 'card'
  }

  /* ── wiring ─────────────────────────────────────────────────────────── */

  root.addEventListener('pointerdown', onPointerDown)
  root.addEventListener('pointermove', onPointerMove)
  root.addEventListener('pointerup', onPointerUp)
  root.addEventListener('pointercancel', onPointerCancel)

  /* A card lifted when the window was 6 columns wide, dropped after a rotation
     to 4, would be landing against rectangles that no longer exist. Abandon the
     gesture and let the layout settle. */
  const onResize = () => { if (active?.started) { active.cards = restoreOriginal(); finish() } }
  window.addEventListener('resize', onResize)
  window.addEventListener('orientationchange', onResize)

    get dragging() { return !!active?.started },
    abort() { if (active?.started) { active.cards = restoreOriginal(); finish() } else cancel() },
    destroy() {
      root.removeEventListener('pointerdown', onPointerDown)
      root.removeEventListener('pointermove', onPointerMove)
      root.removeEventListener('pointerup', onPointerUp)
      root.removeEventListener('pointercancel', onPointerCancel)
      window.removeEventListener('resize', onResize)
      window.removeEventListener('orientationchange', onResize)

/**
 * EDIT MODULES MODE
 * ───────────────────────────────────────────────────────────────────────────
 * Owns the difference between reading the home page and rearranging it: the
 * section header's copy, the edit affordances on the grid, the Add Module action,
 * and a keyboard route through the whole thing.
 *
 * KEYBOARD REORDERING IS NOT A CONSOLATION PRIZE. A drag-and-drop grid that can
 * only be operated by a pointer is a grid a keyboard user cannot arrange at
 * all — there is no "other way" to do it, the way there is usually a link
 * beside a hover menu. So Space picks a card up, the arrow keys move it, Space
 * puts it down and Escape abandons the move, and every step is announced. It is
 * the same state and the same commit path as the pointer drag; only the input
 * differs.
 */

const { moveItem } = __req('js/lib/pack.js');
const { icon } = __req('js/icons.js');

/**
 * `labels` IS THE ONLY THING THE TWO WORKSPACES DISAGREE ABOUT HERE.
 *
 * The mode is identical — same affordances, same drag, same keyboard route,
 * same commit path. What differs is the noun: the home page arranges MODULES
 * and the Site Command Centre arranges WIDGETS, and calling a site widget a
 * module in the one place the user is being told what to do would be a small
 * lie that costs them a moment every time. Defaults are the home page's, so the
 * original caller passes nothing.
 */
const DEFAULT_LABELS = {
  title:     'Modules',
  editTitle: 'Edit Modules',
  add:       'Add Module',
  hint:      'Drag cards to rearrange. Press space on a card to move it with the arrow keys.',
  entered:   'Editing modules. Drag cards to rearrange, or use the remove buttons.',
  saved:     'Layout saved.',
}

function createEditMode({ head, grid, root, getCards, onCommit, onExit, onAdd, labels }) {
  const L = { ...DEFAULT_LABELS, ...(labels || {}) }
  const title = head.querySelector('.section-head__title')
  const actions = head.querySelector('.section-head__actions')

  /* One live region for the whole feature. Screen readers need it present in
     the document before the message arrives, so it is built up front and only
     its text changes. */
  const live = document.createElement('div')
  live.className = 'a11y-live'
  live.setAttribute('role', 'status')
  live.setAttribute('aria-live', 'polite')
  document.body.append(live)

  let announceTimer = 0
  function announce(message) {
    /* Re-setting identical text does not re-announce, and a burst of messages
       during a drag would trample each other. One message per idle moment. */
    clearTimeout(announceTimer)
    announceTimer = window.setTimeout(() => {
      live.textContent = ''
      live.textContent = message
    }, 60)
  }

  const editBtn = document.createElement('button')
  editBtn.type = 'button'
  editBtn.className = 'link-btn'
  editBtn.innerHTML = `${icon('pencil')}<span>Edit</span>`

  const doneBtn = document.createElement('button')
  doneBtn.type = 'button'
  doneBtn.className = 'link-btn link-btn--done'
  doneBtn.textContent = 'Done'

  /**
   * ADD MODULE, AT THE TOP.
   *
   * This was a tile at the end of the grid. With fifteen modules on the page
   * that put the primary action of the whole mode below the fold: you entered
   * Edit Modules to add something and had to scroll past everything you already
   * had to find out how. It now sits beside the title, where it is the first
   * thing in the mode after the mode's own name.
   *
   * It is an ACTION and is dressed as one — an outlined control next to Done,
   * not another module card. Making it look like a card would put it in
   * competition with the things it adds.
   */
  const addBtn = document.createElement('button')
  addBtn.type = 'button'
  addBtn.className = 'add-module-btn'
  addBtn.innerHTML = `${icon('plus')}<span>${L.add}</span>`
  addBtn.addEventListener('click', () => onAdd?.())

  const hint = document.createElement('p')
  hint.className = 'edit-hint'
  hint.innerHTML = `${icon('grip')}<span>${L.hint}</span>`

  let editing = false
  let grabbed = null                // { uid, index } while a keyboard move runs

  actions.append(editBtn)

  editBtn.addEventListener('click', () => enter())
  doneBtn.addEventListener('click', () => exit())

  function enter() {
    if (editing) return
    editing = true
    document.body.classList.add('is-editing')
    title.textContent = L.editTitle
    editBtn.replaceWith(doneBtn)
    actions.insertBefore(addBtn, doneBtn)
    head.classList.add('section-head--editing')
    head.after(hint)
    grid.setEditing(true)
    onCommit?.(getCards(), { rerender: true })
    doneBtn.focus()
    announce(L.entered)
  }

  function exit() {
    if (!editing) return
    editing = false
    releaseGrab({ commit: false })
    document.body.classList.remove('is-editing')
    title.textContent = L.title
    addBtn.remove()
    head.classList.remove('section-head--editing')
    doneBtn.replaceWith(editBtn)
    hint.remove()
    grid.setEditing(false)
    onExit?.()
    editBtn.focus()
    announce(L.saved)
  }

  /* ── keyboard reordering ────────────────────────────────────────────── */

  root.addEventListener('keydown', (e) => {
    if (!editing) return

    /* The controls inside a slot are buttons, and buttons are activated by
       Enter and Space — the same two keys that pick a card up. Without this
       guard the grab handler calls preventDefault first and swallows the
       activation, so Remove and Resize simply do nothing from a keyboard while
       working perfectly under a pointer. */
    if (e.target.closest?.('.slot__remove, .slot__resize, .slot__locked')) return

    const slot = e.target.closest?.('.slot')
    if (!slot) return

    const cards = getCards()
    const uid = slot.dataset.uid
    const index = cards.findIndex((c) => c.uid === uid)
    if (index < 0) return

    /* pick up / put down */
    if (e.key === ' ' || e.key === 'Enter') {
      e.preventDefault()
      if (grabbed && grabbed.uid === uid) releaseGrab({ commit: true })
      else grab(uid, index, slot)
      return
    }

    if (e.key === 'Escape' && grabbed) {
      e.preventDefault()
      releaseGrab({ commit: false, restore: true })
      return
    }

    if (!grabbed || grabbed.uid !== uid) return

    /* Left and right step by one place. Up and down step by a whole row's worth
       of cards, which is the closest honest analogue of "the card above" in a
       layout where the cards are not all the same width. */
    const perRow = Math.max(1, estimateRowLength(uid))
    const delta = {
      ArrowLeft: -1, ArrowRight: 1,
      ArrowUp: -perRow, ArrowDown: perRow,
      Home: -index, End: cards.length - 1 - index,
    }[e.key]
    if (delta == null) return

    e.preventDefault()
    const to = Math.max(0, Math.min(cards.length - 1, index + delta))
    if (to === index) return

    onCommit?.(moveItem(cards, index, to), { rerender: true, keepFocus: uid })
    announce(`Position ${to + 1} of ${cards.length}.`)
  })

  function grab(uid, index, slot) {
    releaseGrab({ commit: false })
    grabbed = { uid, index }
    slot.classList.add('is-grabbed')
    announce(`Picked up ${label(slot)}. Use the arrow keys to move it, space to drop it, escape to cancel.`)
  }

  function releaseGrab({ commit, restore } = {}) {
    if (!grabbed) return
    const slot = grid.slotFor(grabbed.uid)
    slot?.classList.remove('is-grabbed')
    if (restore) {
      const cards = getCards()
      const now = cards.findIndex((c) => c.uid === grabbed.uid)
      if (now >= 0 && now !== grabbed.index) {
        onCommit?.(moveItem(cards, now, grabbed.index), { rerender: true, keepFocus: grabbed.uid })
        announce('Move cancelled.')
      }
    } else if (commit && slot) {
      announce(`Dropped ${label(slot)}.`)
    }
    grabbed = null
  }

  /** How many cards share the grabbed card's row — used for up/down stepping. */
  function estimateRowLength(uid) {
    const items = grid.placement.filter((p) => p.uid !== '__add__')
    const me = items.find((p) => p.uid === uid)
    if (!me) return 1
    return items.filter((p) => p.y === me.y).length
  }

  function label(slot) {
    return slot?.querySelector('.card')?.getAttribute('aria-label') || 'card'
  }

  return {
    get editing() { return editing },
    enter,
    exit,
    announce,
  }
}
  __x.createEditMode = createEditMode;
});

/**
 * MODULE PREVIEW
 * ───────────────────────────────────────────────────────────────────────────
 * A preview of a card variant at a given size — rendered by building the REAL
 * card at its REAL pixel size and scaling it down with a transform.
 *
 * WHY NOT A SEPARATE PREVIEW RENDERER. Because it would be wrong within a
 * month. The brief asks for previews that "represent the real module card
 * design, not generic placeholders"; a second renderer is a promise to keep two
 * files in step forever, and nobody ever does. The preview here cannot drift
 * from the card because it is the card.
 *
 * THE SCALE TRICK. `transform: scale()` is a paint operation — it does not
 * change the element's layout width, and it does not change what a container
 * query sees. So a "Full Width" card built at 960px still reports 960px to its
 * own container queries and lays itself out exactly as it will on the home
 * page: figures side by side, list in two columns. Then it is painted at 30%.
 * A preview that was instead BUILT at 290px would report 290px, take the small
 * card's layout, and show the user something they are not going to get.
 *
 * Sizes are computed against the 6-column reference grid, so the proportions
 * between Small, Medium, Large, Tall and Full are the true ones — the user is
 * comparing real footprints, not icons of footprints.
 */

const { resolveSpan } = __req('js/lib/sizes.js');
const { renderCard } = __req('js/components/ModuleCard.js');

/* The reference grid the previews are measured in: the tablet-landscape band,
   which is the device this product is designed on. */
/* The reference grid the previews are measured in: the Figma artboard's own
   band — five columns of 179.2px, 16px gutters, 164px rows. This said 146.7
   while the grid was six columns wide, and kept saying it after the grid became
   five, so every preview was built at the wrong width and its container queries
   dressed it for a card size that no longer exists. */
const REF_COL = 179.2
const REF_ROW = 164
const REF_GAP = 16

function previewMetrics(size) {
  const { w, h } = resolveSpan(size, 6)

    w,
    h,
    width: w * REF_COL + (w - 1) * REF_GAP,
    height: h * REF_ROW + (h - 1) * REF_GAP,
  }
}

/**
 * @param {object} variant
 * @param {string} size

     preview in the gallery lying about its size. */

  stage.style.width = `${Math.round(m.width * scale)}px`
  stage.style.height = `${Math.round(m.height * scale)}px`

  card.style.height = `${m.height}px`
  card.style.transform = `scale(${scale})`

/**
 * MODULE SIZE SELECTOR
 * ───────────────────────────────────────────────────────────────────────────
 * Offers exactly the sizes a variant declares and nothing else — the brief is
 * firm that unavailable sizes must not appear, and enforcing it here means no
 * caller has to remember.
 *
 * Each option draws its own footprint next to its name: the Medium glyph is
 * literally twice the width of the Small one, and Tall is one wide by two high.
 * A word tells you the name of a size; the glyph tells you the shape, before
 * the word has been read.
 *
 * Built as a real radiogroup rather than a row of buttons, so arrow keys move
 * between options the way a keyboard user expects and the current choice is
 * announced as one.
 */

const { orderedSizes, glyphSpan } = __req('js/lib/sizes.js');
const { SIZE_LABELS } = __req('js/data/cardVariants.js');

   label's id is per instance for the same reason the gallery's title is. */
let selectorSeq = 0

function createSizeSelector({ onChange }) {
  const root = document.createElement('div')
  root.className = 'size-picker'

  const labelId = `size-picker-label-${++selectorSeq}`

  const label = document.createElement('span')
  label.className = 'size-picker__label'
  label.id = labelId
  label.textContent = 'Choose Size'

  const row = document.createElement('div')
  row.className = 'size-picker__row'
  row.setAttribute('role', 'radiogroup')
  row.setAttribute('aria-labelledby', labelId)

  root.append(label, row)

  let sizes = []
  let value = null

  function render(supported, selected) {
    sizes = orderedSizes(supported || [])
    value = sizes.includes(selected) ? selected : sizes[0] || null
    row.replaceChildren()

    for (const size of sizes) {
      const { w, h } = glyphSpan(size)
      const btn = document.createElement('button')
      btn.type = 'button'
      btn.className = 'size-opt'
      btn.setAttribute('role', 'radio')
      btn.setAttribute('aria-checked', String(size === value))
      /* only the selected option is a tab stop; the arrows move within the group */
      btn.tabIndex = size === value ? 0 : -1
      btn.dataset.size = size

      const glyph = document.createElement('span')
      glyph.className = 'size-opt__glyph'
      glyph.style.gridTemplateColumns = `repeat(${w}, 9px)`
      glyph.style.gridTemplateRows = `repeat(${h}, 9px)`
      for (let i = 0; i < w * h; i++) glyph.append(document.createElement('i'))

      const text = document.createElement('span')
      text.textContent = SIZE_LABELS[size] || size

      btn.append(glyph, text)
      btn.addEventListener('click', () => select(size))
      row.append(btn)
    }
  }

  function select(size) {
    if (!sizes.includes(size) || size === value) return
    value = size
    for (const btn of row.querySelectorAll('.size-opt')) {
      const on = btn.dataset.size === size
      btn.setAttribute('aria-checked', String(on))
      btn.tabIndex = on ? 0 : -1

    const step = { ArrowRight: 1, ArrowDown: 1, ArrowLeft: -1, ArrowUp: -1 }[e.key]
    if (!step) return
    e.preventDefault()
    const i = sizes.indexOf(value)
    const next = sizes[(i + step + sizes.length) % sizes.length]
    select(next)
    row.querySelector(`[data-size="${next}"]`)?.focus()
  })

  return {
    root,
    render,

    /* With a basket of cards rather than one, "Choose Size" no longer says
       enough — the control has to name which card it is about, or a curator
       who picked four widgets has no way to know what they are resizing. */

__def('js/components/ModulePickerBottomSheet.js', function (__x, __req) {
/**
 * THE WIDGET GALLERY
 * ───────────────────────────────────────────────────────────────────────────
 * "Add Module" — a sheet on touch, a panel on desktop, one component.
 *
 * ═══ WHY THIS IS A RAIL AND NOT A GRID OF FOLDERS ══════════════════════════
 *
 * There have been two versions of this before and both hid modules.
 *
 *   v1  every module's widgets in one scroll. Fifteen modules came to 5,308px
 *       of gallery inside a 902px window: three visible, twelve below the fold
 *       with nothing to suggest they existed.
 *   v2  a grid of module tiles you clicked into. All fifteen were on screen —
 *       but only until you opened one, at which point the other fourteen
 *       vanished behind a Back button, and comparing Pharmacy's queue card with
 *       Medical's meant two navigations and a memory test.
 *
 * This is the shape Apple's widget gallery has settled on, and for the same
 * reason: a PERSISTENT VERTICAL LIST of every module down one side, and the
 * selected module's widgets beside it. The list never goes away. Choosing a
 * module is a click, not a navigation, so moving between them costs nothing
 * and no module is ever more than a scroll from being seen.
 *
 * On a phone there is not room for both at once, so the rail is the sheet and
 * the widgets slide in over it — which is exactly what iOS does at that width.
 * It is the same two panes; only one of them is on screen at a time.
 *
 * ═══ WIDGETS ARE GROUPED BY PURPOSE ════════════════════════════════════════
 *
 * Within a module, the widgets are grouped under Navigate / Understand /
 * Attention / Act / Monitor with a line of copy on each. Seventy-one cards is
 * too many to present as a flat shelf; grouped, a module reads as a sentence —
 * here is the door, here is what it knows, here is what is waiting, here is
 * what you can do, here is what just happened.
 *
 * ═══ WHAT IS SEARCHED ══════════════════════════════════════════════════════
 *
 * Not just module names. A curator looking for the pending queue types
 * "pending", not "Medical" — so the haystack includes variant names,
 * descriptions, keywords, purposes, and every figure and label the card shows.
 * Typing "population", "hatch", "overdue", "incubation" or "critical" all find
 * the right card, and the rail narrows to the modules that have one.
 */

const { MODULES, CATEGORIES, getModule } = __req('js/data/modules.js');
const { CARD_VARIANTS, variantsForModule, PURPOSES, SIZE_LABELS } = __req('js/data/cardVariants.js');
const { icon } = __req('js/icons.js');
const { renderPreview } = __req('js/components/ModulePreview.js');
const { createSizeSelector } = __req('js/components/ModuleSizeSelector.js');

/**
 * THE GALLERY IS THE SAME GALLERY FOR BOTH WORKSPACES.
 * ───────────────────────────────────────────────────────────────────────────
 * A `source` describes what is being browsed: a persistent rail of GROUPS down
 * one side, and the selected group's widgets beside it. On the home page a
 * group is a module; in the Site Command Centre it is a domain. Nothing else
 * about the component differs — not the basket, not the size tray, not the
 * previews, not the search.
 *
 * A SECOND PICKER WAS THE OBVIOUS SHORTCUT AND WOULD HAVE BEEN A SLOW MISTAKE.
 * This file is seven hundred lines of behaviour that took three attempts to get
 * right — the basket that survives browsing, the tray that lets you re-size a
 * card you picked four tiles ago, the split that becomes a stack on a phone,
 * the search that indexes what a card SHOWS rather than what it is called.
 * Copying it for site widgets would have meant maintaining both forever, and
 * the copy would have started drifting on the first bug fixed in one of them.
 *
 * So the only thing that varies is DATA, and it is one object.
 */
const MODULE_SOURCE = {
  id: 'modules',
  groups: MODULES,
  categories: CATEGORIES,
  categoryOf: (g) => g.category,
  getGroup: getModule,
  variants: CARD_VARIANTS,
  variantsFor: variantsForModule,
  title: 'Add Module',
  searchLabel: 'Search modules',
  railLabel: 'Modules',
  backLabel: 'All Modules',
  addOne: 'Add to Home',
  addMany: (n) => `Add ${n} Modules`,
  emptyHint: 'Try a module name, or something the card shows — ' +
             '\u201Coverdue\u201D, \u201Cpopulation\u201D, \u201Clow stock\u201D.',

function createModulePicker({ onAdd, source = MODULE_SOURCE }) {
  const src = source
  /* ── state ──────────────────────────────────────────────────────────── */
  let open = false
  let query = ''
  let activeId = src.groups[0].id   // the group the detail pane is showing

  /**
   * THE SELECTION IS A BASKET, NOT A CURSOR.
   *
   * This used to be a single `{ variantId, size }`, so adding three cards meant
   * open → pick → Add → reopen → pick → Add → reopen → pick → Add: the gallery
   * threw away everything you had learned about it twice, and the module you
   * were comparing against was two navigations behind you.
   *
   * A Map, because the order a curator picks things in is the order they should
   * arrive on the page, and insertion order is the one thing a Map guarantees.
   * Keyed by variant id, holding the size chosen for that variant — so the sizes
   * genuinely are per-card and not one setting shared across the basket.

     recently touched one owns it — and the tray below lets you hand it to
     another without disturbing the selection. */

  let restoreFocusTo = null
  /* Only meaningful under the phone breakpoint, where the two panes are
     stacked: false = looking at the rail, true = looking at the widgets. */

  /* ── nodes ──────────────────────────────────────────────────────────── */
  const scrim = document.createElement('div')
  scrim.className = 'scrim'

  const sheet = document.createElement('div')
  sheet.className = 'sheet'
  sheet.setAttribute('role', 'dialog')
  sheet.setAttribute('aria-modal', 'true')

     widgets — and both used to write `id="picker-title"`. Duplicate ids are not
     a style question here: `aria-labelledby` resolves to the FIRST match in the
     document, so the site widget sheet announced itself as "Add Module" to
     anybody using a screen reader, and every scoped `getElementById` in a test
     or a console session silently read the other sheet. */
  const titleId = `picker-title-${src.id}`
  sheet.setAttribute('aria-labelledby', titleId)
  sheet.hidden = true

  sheet.innerHTML = `
    <span class="sheet__handle" aria-hidden="true"></span>
    <div class="sheet__head">
      <h2 class="sheet__title" id="${titleId}">${esc(src.title)}</h2>
      <button type="button" class="sheet__close" aria-label="Close">${icon('close')}</button>
    </div>

    <div class="sheet__side">
      <div class="sheet-search">
        ${icon('search')}
        <input type="search" placeholder="${esc(src.searchLabel)}" aria-label="${esc(src.searchLabel)}"
               autocomplete="off" autocorrect="off" spellcheck="false">
        <button type="button" class="sheet-search__clear" aria-label="Clear search">${icon('close')}</button>
      </div>
      <div class="mod-rail" role="tablist" aria-label="${esc(src.railLabel)}" aria-orientation="vertical"></div>
    </div>

    <div class="sheet__body" tabindex="-1"></div>
    <div class="sheet__foot"></div>`

  const closeBtn = sheet.querySelector('.sheet__close')
  const searchWrap = sheet.querySelector('.sheet-search')
  const searchInput = sheet.querySelector('.sheet-search input')
  const searchClear = sheet.querySelector('.sheet-search__clear')
  const rail = sheet.querySelector('.mod-rail')
  const body = sheet.querySelector('.sheet__body')
  const foot = sheet.querySelector('.sheet__foot')

  /* Changing the size re-renders the chosen widget's preview. A size control
     that changes nothing you can see is a control you have to take on faith,
     and the whole point of this gallery is that you do not have to. */

    onChange(size) {

  /**
   * THE TRAY — what is in the basket, and which one the size control is on.
   *
   * Without it, multi-select has a hole in it: clicking a selected tile
   * deselects (it has to — the way out of a selection should be the gesture
   * that made it), so there would be no way to go back and re-size a card you
   * picked three tiles ago short of removing and re-adding it. Each chip is
   * that way back. It also keeps the basket visible while you scroll a long
   * gallery, which is the actual reason iOS shows one.
   */

  tray.className = 'sel-tray'

  const trayCount = document.createElement('span')
  trayCount.className = 'sel-tray__count'

  const trayChips = document.createElement('div')
  trayChips.className = 'sel-tray__chips'
  tray.append(trayCount, trayChips)

  const actions = document.createElement('div')
  actions.className = 'sheet__actions'
  const cancelBtn = document.createElement('button')
  cancelBtn.type = 'button'
  cancelBtn.className = 'btn-ghost'
  cancelBtn.textContent = 'Cancel'
  const addBtn = document.createElement('button')
  addBtn.type = 'button'
  addBtn.className = 'btn-primary'
  addBtn.textContent = 'Add to Home'
  actions.append(cancelBtn, addBtn)

  const footMain = document.createElement('div')
  footMain.className = 'sheet__foot-main'
  footMain.append(tray, sizeSelector.root)
  foot.append(footMain, actions)

  document.body.append(scrim, sheet)

  /* ── search ─────────────────────────────────────────────────────────── */

  /**
   * Everything about a variant that a person might type. Built once per
   * variant and cached, because it is re-scanned on every keystroke.
   */
  /**
   * REBUILT WHEN THE SOURCE CHANGES, NOT ONCE AT CONSTRUCTION.
   *
   * One gallery now serves four catalogues — modules, and the Site, Section and
   * Enclosure workspaces — and it learns which one it is browsing from
   * `src.revision`, a value the caller changes when the level does. Built once
   * per catalogue and cached, because it is re-scanned on every keystroke.
   *
   * The alternative was four picker instances. That would have been four sheets
   * in the document, four sets of duplicate ids to keep unique, and four copies
   * of a basket that took three attempts to get right.
   */
  const haystack = new Map()
  let builtFor = null

  function buildHaystack() {

    builtFor = src.revision
    haystack.clear()
  for (const v of src.variants) {
    const mod = src.getGroup(v.moduleId)
    const d = v.data || {}
    const bits = [
      mod?.name, mod?.blurb, ...(mod?.keywords || []),
      v.name, v.description, PURPOSES[v.purpose]?.label,
      /* The card's own heading. Left out of the first version of this index,
         which meant "low stock" — the heading on Pharmacy's alert card, and one
         of the three examples the empty state suggests typing — found nothing
         at all. */
      d.title,
    ]
    /* Everything the card actually shows, so the figures are searchable too. */
    for (const blk of d.blocks || []) {
      bits.push(blk.label, blk.caption, blk.text, blk.value)
      for (const it of blk.items || []) bits.push(it.label, it.text, it.lead, it.value)
    }
    /* Strip soft hyphens: the index is matched against what people type, and
       nobody types U+00AD. Without this, searching "communication" finds
       nothing. */
    haystack.set(v.id, bits.filter(Boolean).join(' ').toLowerCase().replace(/\u00AD/g, ''))
  }

  /**
   * Every word in the query must appear somewhere. Substring rather than fuzzy:
   * on a seventeen-module product fuzzy matching mostly produces surprises, and
   * "lab" quietly matching "Follow Up" would be worse than finding nothing.
   */
  function matches(variantId) {

    const hay = haystack.get(variantId) || ''
    return query.split(/\s+/).filter(Boolean).every((term) => hay.includes(term))
  }

  /** A module's widgets that survive the current query. */
  function hits(moduleId) {
    return src.variantsFor(moduleId).filter((v) => matches(v.id))

  searchInput.addEventListener('input', () => {
    query = searchInput.value.trim().toLowerCase()
    searchWrap.classList.toggle('has-value', !!searchInput.value)
    /* If the module being shown has nothing left that matches, move to the
       first one that does. A search that leaves you staring at an empty pane
       while the answer sits three rows up the rail is a search that failed. */
    if (query && !hits(activeId).length) {
      const first = src.groups.find((m) => hits(m.id).length)
      if (first) activeId = first.id

    renderDetail()

    query = ''
    searchWrap.classList.remove('has-value')
    renderRail()
    renderDetail()
    searchInput.focus()

  /* ── the rail · every module, always ─────────────────────────────────── */

  function renderRail() {
    rail.replaceChildren()
    let any = false

    for (const cat of src.categories) {
      const mods = src.groups.filter((m) => src.categoryOf(m) === cat.id && hits(m.id).length)
      if (!mods.length) continue
      any = true

      const heading = document.createElement('div')
      heading.className = 'mod-rail__heading'
      heading.textContent = cat.name
      rail.append(heading)

      for (const mod of mods) {
        const row = document.createElement('button')
        row.type = 'button'
        row.className = 'mod-row'
        row.setAttribute('role', 'tab')
        row.setAttribute('aria-selected', String(mod.id === activeId))
        row.tabIndex = mod.id === activeId ? 0 : -1
        row.dataset.module = mod.id
        row.innerHTML =
          groupTile(mod, 'mod-row__icon') +
          `<span class="mod-row__name">${esc(mod.name)}</span>` +
          `${icon('chev-right', 'icon mod-row__chev')}`
        row.addEventListener('click', () => selectModule(mod.id))
        rail.append(row)
      }
    }

    if (!any) rail.append(emptyState())
  }

  function selectModule(id) {
    activeId = id
    /* and it survives moving between modules, which is the whole point */

    const step = { ArrowDown: 1, ArrowUp: -1 }[e.key]
    if (!step) return
    e.preventDefault()
