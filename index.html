 * is what keeps seventeen modules visually one product while saying seventeen
 * different things, and it is why adding a card to the catalogue is a data
 * edit rather than a component.
 *
 * A card with no blocks is a DOOR — the icon-and-name card the artboard draws.
 * Nothing declares "I am a door"; having nothing to say is what makes it one.
 *
 * ═══ WHY THE ACTION PILLS ARE NOT BUTTONS ══════════════════════════════════
 *
 * The card itself is a `<button>`, and a button inside a button is invalid
 * markup that browsers resolve by dropping one of them — usually not the one
 * you wanted. The pills on a Quick Actions card are spans that LOOK like
 * controls and the whole card activates; wiring them individually means making

      case 'status':  bits.push(blk.text); break

   * in what is in it, which is why a timeline and a breakdown sit on the same

   *   list       text · figure, no track, tone-coloured figure

/**
 * MOTION PREFERENCE
 * ───────────────────────────────────────────────────────────────────────────
 * `prefers-reduced-motion` is honoured in CSS by zeroing the transition
 * durations, but that block cannot reach an animation started from script.
 * `Element.animate()` takes its duration as a number, and a number does not
 * consult a media query — so the CSS rule silences every transition in the
 * product and leaves the two Web Animations calls (a card being dismissed, a
 * card arriving) running at full tilt.
 *
 * Anyone who has asked their operating system to calm things down has asked for
 * all of it, not the parts that were convenient to implement. This is the one
 * place that question is answered, and it is live: the matcher is kept so a
 * user who changes the setting mid-session is respected without a reload.
 */

const query = typeof matchMedia === 'function'
  ? matchMedia('(prefers-reduced-motion: reduce)')
  : null

  return !!query && query.matches
}

 * `Element.animate()`, but a no-op when motion is unwelcome.
 * Always returns something with a `finished` promise so callers can chain
 * without branching on whether the animation actually ran.
 */
function animate(el, keyframes, options) {
  if (prefersReducedMotion() || !el || typeof el.animate !== 'function') {
    return { finished: Promise.resolve(), cancel() {} }
  }
  return el.animate(keyframes, options)
}

  __x.animate = animate;

/**
 * MODULE GRID
 * ───────────────────────────────────────────────────────────────────────────

 * into positions, reconciles those against the elements already on screen, and
 * animates whatever moved.
 *

 * pointer capture. It would restart every CSS transition, so nothing could ever
 * animate between two states. And it would throw away scroll position and focus
 * — a keyboard user reordering a card would be dumped back at the top of the
 * page after each keystroke.

 * element and gets a transform; a card whose variant or size actually changed
 * gets its inner card element replaced and nothing else.

 * a card told to move from column 1 to column 4 simply appears there. So the
 * grid measures every slot before the change (First), applies it, measures
 * again (Last), sets a transform that puts each slot visually back where it
 * started (Invert), and clears it on the next frame with a transition attached

/**
 * DRAG CONTROLLER
 * ───────────────────────────────────────────────────────────────────────────
 * Pointer-Events drag and drop for the module grid. One code path serves a
 * finger on an iPad and a mouse on a desktop, because Pointer Events unify
 * them — which is also why the HTML5 drag-and-drop API is not used here: it has
 * never worked on touch and never will.
 *

 *   mouse   a drag starts as soon as the pointer has moved 4px with the button
 *           down. There is nothing else a press-and-move on a card in edit mode
 *           could mean.
 *   touch   a drag starts after the finger has been still for 200ms. Before
 *           that the page scrolls normally, which it has to — the grid is
 *           taller than an iPad. Move more than 8px inside those 200ms and the
 *           press is abandoned as a scroll.
 *
 * WHAT MOVES. The card is cloned into a fixed layer above the page and the
 * clone follows the pointer; the original stays in the grid at zero opacity so
 * its slot can draw the hole. Moving the real element instead would mean the
 * grid re-laying-out on every frame and the card being clipped the moment it
 * left the container.
 *
 * WHAT REFLOWS. On each frame the controller works out which index the pointer
 * is over, and if that has changed it reorders a working copy of the card list
 * and re-renders the grid. The grid's own FLIP pass animates every other card
 * into its new place — so "other cards move to create space" is not a special
 * case in here at all, it is what the grid already does when its input changes.

         slot survives, keeps `is-source`, and every other card FLIPs into its

   * clientX/Y into a {col,row} and looking up what occupies it — has to

   * neighbour, past the end of the last row. Asking the rendered rectangles is

   * after every commit, so a visual index and a list index are the same number.

    if (idx > current) idx -= 1
    return Math.max(0, Math.min(idx, active.cards.length - 1))

    return moveItem(active.cards, active.index, active.fromIndex)

      a.proxy.style.width = `${rest.width}px`
      a.proxy.style.height = `${rest.height}px`
      a.proxy.style.transform = `translate3d(${rest.left}px, ${rest.top}px, 0) scale(1) rotate(0deg)`
    }

      layer?.remove()

    }

/**
 * EDIT MODULES MODE
 * ───────────────────────────────────────────────────────────────────────────
 * Owns the difference between reading the home page and rearranging it: the
 * section header's copy, the edit affordances on the grid, the Add Widget tile,
 * and a keyboard route through the whole thing.
 *
 * KEYBOARD REORDERING IS NOT A CONSOLATION PRIZE. A drag-and-drop grid that can
 * only be operated by a pointer is a grid a keyboard user cannot arrange at
 * all — there is no "other way" to do it, the way there is usually a link
 * beside a hover menu. So Space picks a card up, the arrow keys move it, Space
 * puts it down and Escape abandons the move, and every step is announced. It is
 * the same state and the same commit path as the pointer drag; only the input
 * differs.

  const actions = head.querySelector('.section-head__actions')

     the document before the message arrives, so it is built up front and only
     its text changes. */

       during a drag would trample each other. One message per idle moment. */

    announceTimer = window.setTimeout(() => {
      live.textContent = ''
      live.textContent = message

  editBtn.type = 'button'
  editBtn.className = 'link-btn'
  editBtn.innerHTML = `${icon('pencil')}<span>Edit</span>`

  doneBtn.type = 'button'
  doneBtn.className = 'link-btn link-btn--done'

}

/**
 * MODULE PREVIEW
 * ───────────────────────────────────────────────────────────────────────────
 * A preview of a card variant at a given size — rendered by building the REAL
 * card at its REAL pixel size and scaling it down with a transform.
 *
 * WHY NOT A SEPARATE PREVIEW RENDERER. Because it would be wrong within a
 * month. The brief asks for previews that "represent the real module card
 * design, not generic placeholders"; a second renderer is a promise to keep two
 * files in step forever, and nobody ever does. The preview here cannot drift
 * from the card because it is the card.
 *

 * ───────────────────────────────────────────────────────────────────────────
 * Offers exactly the sizes a variant declares and nothing else — the brief is
 * firm that unavailable sizes must not appear, and enforcing it here means no
 * caller has to remember.
 *

 * literally twice the width of the Small one, and Tall is one wide by two high.
 * A word tells you the name of a size; the glyph tells you the shape, before
 * the word has been read.

 * between options the way a keyboard user expects and the current choice is
 * announced as one.

/**
 * THE WIDGET GALLERY
 * ───────────────────────────────────────────────────────────────────────────
 * "Add Widget" — a sheet on touch, a panel on desktop, one component.
 *
 * ═══ WHY THIS IS A RAIL AND NOT A GRID OF FOLDERS ══════════════════════════
 *
 * There have been two versions of this before and both hid modules.
 *
 *   v1  every module's widgets in one scroll. Fifteen modules came to 5,308px
 *       of gallery inside a 902px window: three visible, twelve below the fold
 *       with nothing to suggest they existed.
 *   v2  a grid of module tiles you clicked into. All fifteen were on screen —
 *       but only until you opened one, at which point the other fourteen
 *       vanished behind a Back button, and comparing Pharmacy's queue card with
 *       Medical's meant two navigations and a memory test.
 *
 * This is the shape Apple's widget gallery has settled on, and for the same
 * reason: a PERSISTENT VERTICAL LIST of every module down one side, and the
 * selected module's widgets beside it. The list never goes away. Choosing a
 * module is a click, not a navigation, so moving between them costs nothing
 * and no module is ever more than a scroll from being seen.
 *
 * On a phone there is not room for both at once, so the rail is the sheet and
 * the widgets slide in over it — which is exactly what iOS does at that width.
 * It is the same two panes; only one of them is on screen at a time.
 *
 * ═══ WIDGETS ARE GROUPED BY PURPOSE ════════════════════════════════════════
 *
 * Within a module, the widgets are grouped under Navigate / Understand /
 * Attention / Act / Monitor with a line of copy on each. Seventy-one cards is
 * too many to present as a flat shelf; grouped, a module reads as a sentence —
 * here is the door, here is what it knows, here is what is waiting, here is
 * what you can do, here is what just happened.
 *
 * ═══ WHAT IS SEARCHED ══════════════════════════════════════════════════════
 *
 * Not just module names. A curator looking for the pending queue types

    </div>

    <div class="sheet__side">

               autocomplete="off" autocorrect="off" spellcheck="false">

      heading.textContent = cat.name
      rail.append(heading)

    btn.className = 'widget'
    btn.dataset.variant = v.id
    btn.setAttribute('aria-pressed', String(selected?.variantId === v.id))

    const size = selected?.variantId === v.id ? selected.size : v.defaultSize
    const stage = renderPreview(v, size, previewBounds())
    stage.classList.add('widget__stage-wrap')
    btn.append(stage)

    /* The name, and nothing else. The description and the size count were
       three lines of prose under a picture that already says what the widget
       is — and with 3 to 6 widgets a module, that prose was most of the pane.
       The sizes are still on the footer's selector, where they are a choice
       rather than a fact to read. */

    meta.className = 'widget__meta'
    meta.innerHTML = `<span class="widget__name">${esc(v.name)}</span>`

    const stage = renderPreview(variant, selected.size, previewBounds())
    stage.classList.add('widget__stage-wrap')
    btn.querySelector('.variant__stage')?.replaceWith(stage)

  }

  })

     that is what the control reads as. Deselecting without leaving is still
     available by tapping the chosen widget again, which is the gesture that
     selected it. */

  closeBtn.addEventListener('click', close)

       on it cannot also be scrolled. */

    if (e.key === 'Escape') { e.preventDefault(); close(); return }
    if (e.key !== 'Tab') return

       only — a keyboard user ends up editing a form they cannot see. */
    const items = focusables()
    if (!items.length) return
    const first = items[0]
    const last = items[items.length - 1]
    if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus() }
    else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus() }
  }

  /* ── open / close ───────────────────────────────────────────────────── */

  function show() {
    if (open) return
    open = true
    restoreFocusTo = document.activeElement

    query = ''
    searchInput.value = ''
    searchWrap.classList.remove('has-value')
    activeId = MODULES[0].id
    /* Where the panes are side by side, open with the first module already
       showing so the gallery is never empty. Where they are stacked — a phone —
       open on the rail, because there the rail IS the gallery and landing
       inside one module would hide the other sixteen. */
    detailOpen = isSplit()
    sheet.classList.toggle('is-detail', detailOpen)
    clearSelection()
    renderRail()
    renderDetail()

    scrim.hidden = false

 * curator who put Follow Up on as a Tall card and finds it dominating the grid

 * remove the card and add it again from the picker, which is four taps to

/**
 * THE PROFILE MENU
 * ───────────────────────────────────────────────────────────────────────────
 * A popover under the avatar. It exists because the home page had no visible
 * way into editing it.
 *
 * WHAT WAS THERE BEFORE, AND WHY IT WAS NOT ENOUGH. Edit mode was reachable by
 * pressing and holding a card, right-clicking one, or pressing E. All three

 * from every phone home screen they have ever used, and it should not stop
 * working because a menu appeared. But every one of those is INVISIBLE. A
 * feature whose only affordance is a gesture you have to already know about is
 * a feature most people never find, and "how do I change my home page" is not
 * a question a command centre should answer with "hold something".
 *
 * The avatar is the right place for it. It is where a person looks for the
 * things that are theirs rather than the organisation's — their account, their
 * preferences, and their home page is one of those.
 *
 * WHY A POPOVER AND NOT A DIALOG. Nothing here is a decision. Every item either
 * opens something or toggles a mode, and all of them are reversible, so the
 * modal's job — stopping you until you have committed — is not wanted. Escape,

      `<img class="pmenu__avatar" src="assets/img/avatar.png" alt="">` +
      `<span class="pmenu__who">` +
        `<span class="pmenu__name">Sourav Tambe</span>` +
        `<span class="pmenu__role">Curator · Command Centre</span>` +
      `</span>`
    menu.append(head)

    for (const item of items) {
      if (!item) {
        const rule = document.createElement('span')
        rule.className = 'pmenu__rule'
        rule.setAttribute('role', 'separator')
        menu.append(rule)

      const btn = document.createElement('button')
      btn.type = 'button'
      btn.className = 'pmenu__item'

__def('js/app.js', function (__x, __req) {
/**
 * ANTZ COMMAND CENTRE · HOME
 * ───────────────────────────────────────────────────────────────────────────
 * Wiring. Every piece of behaviour lives in its own module; this file is the
 * place they are introduced to each other, and it is deliberately the shortest
 * interesting file in the project.
 *
 * THE ONE IDEA WORTH READING. There are two sources of card order and only ever
 * one of them is live. Normally it is the store — the saved, persisted layout.
 * During a drag it is `working`, a scratch copy the drag controller mutates
 * dozens of times a second without touching localStorage. When the finger
 * lifts, `working` is committed to the store and thrown away. That split is
 * what lets the grid animate continuously through a drag while the saved
 * document is only written once, at the end, with a result the user chose.
 */

const { mountIconSprite } = __req('js/icons.js');
const { createModuleGrid } = __req('js/components/ModuleGrid.js');
const { createDragController } = __req('js/components/DragController.js');
const { createEditMode } = __req('js/components/EditModulesMode.js');
const { createModulePicker } = __req('js/components/ModulePickerBottomSheet.js');
const { createSizePopover } = __req('js/components/ModuleSizePopover.js');
const { createProfileMenu } = __req('js/components/ProfileMenu.js');
const { layoutStore, reorder, addCard, removeCard, resizeCard, setEditing, resetLayout } = __req('js/state/layoutStore.js');
const { currentColumns } = __req('js/lib/sizes.js');
const { animate, prefersReducedMotion } = __req('js/lib/motion.js');

mountIconSprite()

/* ── greeting ───────────────────────────────────────────────────────────
   Left exactly as the artboard has it. A time-of-day greeting was the obvious
   thing to add and it was wrong: the status bar above is frozen at 9:41, so
   "Good Evening," under a 9:41 clock reads as a bug rather than as a feature.
   Hand it real time and it should have both. */

/* ── the modules section ────────────────────────────────────────────────── */
const gridRoot = document.getElementById('moduleGrid')
const head = document.getElementById('modulesHead')

/** Non-null only while a drag is in flight. See the note at the top. */
let working = null
const cards = () => working ?? layoutStore.get().cards

const grid = createModuleGrid({
  root: gridRoot,
  onActivate(variant) {
    /* No router in a prototype — say what would happen and leave it there. */
    edit.announce(`Opening ${variant.name}.`)
  },
  onAdd: () => picker.open(),
  onRemove(uid) {
    /* Work out where focus should land while the card is still on the grid —
       once it is gone there is nothing left to be adjacent to. */
    const neighbour = grid.neighbourOf(uid)
    if (!removeCard(uid)) {
      edit.announce('This module is always on your home page.')
      return
    }
    grid.restoreFocus(neighbour)
    edit.announce('Card removed.')
  },
  onResize(uid, size, slot) {
    sizePopover.open(uid, size, slot)
  },
})

const sizePopover = createSizePopover({
  onResize(uid, size) {
    resizeCard(uid, size)
    edit.announce(`Resized to ${size}.`)
  },
})

const picker = createModulePicker({
  onAdd(variantId, size) {
    const card = addCard(variantId, size)
    if (!card) return
    /* Put the new card in front of the user rather than leaving them to find
       it — it lands at the end of a grid that may be below the fold. */
    requestAnimationFrame(() => {
      const slot = grid.slotFor(card.uid)
      slot?.scrollIntoView({
        behavior: prefersReducedMotion() ? 'auto' : 'smooth',
        block: 'center',
      })
      animate(
        slot,
        [{ transform: 'scale(.86)', opacity: 0 }, { transform: 'scale(1)', opacity: 1 }],
        { duration: 320, easing: 'cubic-bezier(.16,1,.3,1)' },
      )
      edit.announce('Card added to your home page.')
    })
  },
})

const edit = createEditMode({
  head,
  grid,
  root: gridRoot,
  getCards: () => layoutStore.get().cards,
  onCommit(next, opts = {}) {
    reorder(next, grid.columns)
    if (opts.keepFocus) {
      requestAnimationFrame(() => grid.slotFor(opts.keepFocus)?.querySelector('.card')?.focus())
    }
  },
  onExit: () => paint(),
})

/* ── the profile menu ───────────────────────────────────────────────────
   The one visible way in. Everything the user can do to their own home page
   hangs off their own avatar: edit it, add to it, or put it back.

   `label` is a function rather than a string on the first item because the
   menu has to name the state it is going TO. "Edit Modules" while already
   editing would look like a control that does nothing. */
const profileMenu = createProfileMenu({
  anchor: document.getElementById('avatarBtn'),
  getState: () => ({ editing: edit.editing }),
  items: [
    {
      id: 'edit',
      icon: 'pencil',
      label: (s) => (s.editing ? 'Done Editing' : 'Edit Modules'),
      note: (s) => (s.editing ? 'Save the arrangement' : 'Rearrange, resize or remove cards'),
    },
    { id: 'add', icon: 'widgets', label: 'Add Widget', note: 'Browse every module’s widgets' },
    null,
    {
      id: 'reset',
      icon: 'refresh',
      label: 'Reset Home Page',
      note: 'Back to the default arrangement',
      danger: true,
    },
  ],
  onSelect(id) {
    if (id === 'edit') { edit.editing ? edit.exit() : edit.enter(); return }
    if (id === 'add') {
      /* Adding a card is an edit, so arrive in edit mode — otherwise the new
         card lands on a page with no visible way to move it. */
      if (!edit.editing) edit.enter()
      picker.open()
      return
    }
    if (id === 'reset') {
      resetLayout()
      edit.announce('Home page reset to the default arrangement.')
    }
  },
})

/* ── the three gestures that were already there ─────────────────────────
   The artboard has no Edit button, and the profile menu above is now the
   visible route, but these stay: a long press on a card is the gesture people
   bring with them from every phone home screen they have used, and it should
   not stop working because a menu appeared.

     press and hold a card   500ms, finger or mouse, ≤8px of drift
     right-click a card      the desktop equivalent of the same intent
     press E                 anywhere outside a text field

   500ms is deliberately longer than the 200ms the drag controller uses. The two
   never overlap — the drag long-press only arms once editing is already on —
   but a shorter hold here would make an ordinary tap feel like it might do
   something else.

   The gesture is announced on arrival, because a mode you entered by holding
   something is a mode you might not have meant to enter. */
const EDIT_HOLD_MS = 500

let holdTimer = 0
let holdFrom = null

function cancelHold() {
  clearTimeout(holdTimer)
  holdTimer = 0
  holdFrom = null
}

gridRoot.addEventListener('pointerdown', (e) => {
  if (edit.editing) return
  if (!e.target.closest('.card')) return
  if (e.button != null && e.button > 0) return
  holdFrom = { x: e.clientX, y: e.clientY }
  holdTimer = window.setTimeout(() => {
    cancelHold()
    edit.enter()
    if (navigator.vibrate) { try { navigator.vibrate(12) } catch { /* unsupported */ } }
  }, EDIT_HOLD_MS)
})

gridRoot.addEventListener('pointermove', (e) => {
  if (!holdFrom) return
  if (Math.hypot(e.clientX - holdFrom.x, e.clientY - holdFrom.y) > 8) cancelHold()
})

for (const ev of ['pointerup', 'pointercancel', 'pointerleave']) {
  gridRoot.addEventListener(ev, cancelHold)
}
/* a scroll under the finger is not a hold */
window.addEventListener('scroll', cancelHold, { passive: true })

gridRoot.addEventListener('contextmenu', (e) => {
  if (edit.editing || !e.target.closest('.card')) return
  e.preventDefault()
  edit.enter()
})

document.addEventListener('keydown', (e) => {
  if (e.key !== 'e' && e.key !== 'E') return
  if (e.metaKey || e.ctrlKey || e.altKey) return
  const t = document.activeElement
  if (t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.isContentEditable)) return
  if (picker.isOpen || profileMenu.isOpen) return
  e.preventDefault()
  if (edit.editing) edit.exit()
  else edit.enter()
})

createDragController({
  grid,
  root: gridRoot,
  canDrag: () => edit.editing,
  getCards: () => layoutStore.get().cards,
  announce: (m) => edit.announce(m),
  /* Nothing may outlive a gesture. `working` is cleared before a drag starts
     and again the moment one ends, whatever the ending was. */
  onGrab() {
    working = null
  },
  onPreview(next) {
    working = next
    paint({ animate: true })
  },
  onCommit(next, { changed } = {}) {
    working = null
    /* A drag that ended where it began still has to release the grid — commit
       the order when it changed, and simply repaint from the store when it did
       not, so the subscriber guard above stops swallowing updates. */
    if (changed) reorder(next, grid.columns)
    else paint({ animate: true })
  },
})

/* ── render ─────────────────────────────────────────────────────────────── */

function paint(opts = { animate: true }) {
  grid.render(cards(), opts)
}

layoutStore.subscribe(() => {
  /* A store change that arrives mid-drag is the drag's own preview being
     committed; the grid is already showing it. */
  if (working) return
  paint()
})

/* Edit mode is a session state, not a saved one — a user who leaves the page
   mid-edit should come back to a readable home page. */
setEditing(false)
paint({ animate: false })

/* ── responsive reflow ──────────────────────────────────────────────────── */

/**
 * Nothing needs to happen on most resize events: the CSS handles the columns,
 * and the packer only has to re-run when the COLUMN COUNT changes. Dragging a
 * desktop window across two hundred pixels fires a hundred resize events and
 * should cause exactly zero repacks.
 */
let lastCols = currentColumns()
let resizeTimer = 0

function onResize() {
  clearTimeout(resizeTimer)
  resizeTimer = window.setTimeout(() => {
    const cols = currentColumns()
    if (cols === lastCols) return
    lastCols = cols
    paint({ animate: false })
  }, 120)
}

window.addEventListener('resize', onResize)
window.addEventListener('orientationchange', onResize)

/* ── developer conveniences ─────────────────────────────────────────────── */
Object.assign(window, {
  antz: {
    reset: resetLayout,
    state: () => layoutStore.get(),
    columns: currentColumns,
    /* test hook: put every variant on the grid at every size it declares, so a
       clipping regression cannot hide behind the default layout */
    allVariants() {
      const all = __req('js/data/cardVariants.js').CARD_VARIANTS
      const out = []
      let i = 0
      for (const v of all) for (const sz of v.supportedSizes) out.push({ uid: 'x' + (i++), variantId: v.id, size: sz })
      __req('js/state/layoutStore.js').setCards(out, { reason: 'stress' })
    },

    /**
     * The catalogue and the default home page have to agree, and there are two
     * files where they could quietly stop agreeing: a card promoted to
     * `priority: 'primary'` in cardVariants.js that nobody seeded, or a card
     * seeded in layoutStore.js that is no longer primary — or no longer exists.
     *
     * Cheap to check, invisible when it passes, and it names the file to open
     * when it fails.
     */
    checkDefaults() {
      const { primaryVariants, getVariant } = __req('js/data/cardVariants.js')
      const { DEFAULT_LAYOUT } = __req('js/state/layoutStore.js')

      const seeded = new Set(DEFAULT_LAYOUT.map((d) => d.variantId))
      const problems = []

      for (const v of primaryVariants()) {
        if (!seeded.has(v.id)) problems.push(`primary but not on the default home page: ${v.id}`)
      }
      for (const d of DEFAULT_LAYOUT) {
        const v = getVariant(d.variantId)
        if (!v) { problems.push(`seeded but not in the catalogue: ${d.variantId}`); continue }
        if (v.priority !== 'primary') problems.push(`seeded but ${v.priority}, not primary: ${d.variantId}`)
        if (!v.supportedSizes.includes(d.size)) {
          problems.push(`seeded at a size it does not support: ${d.variantId} @ ${d.size}`)
        }
      }

      if (problems.length) console.warn('[antz] default layout:\n  ' + problems.join('\n  '))
      else console.info('[antz] default layout agrees with the catalogue.')
      return problems
    },
  },
})

});

__req('js/app.js');
})();
</script>
