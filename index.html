<style>
/* ══ css/edit.css ══ */
/* ══════════════════════════════════════════════════════════════════════════
   EDIT MODULES MODE
   ──────────────────────────────────────────────────────────────────────────
   "Do not overuse borders. Keep the editing controls subtle and clean."

   So edit mode is announced by four things and no chrome: the page desaturates
   very slightly so the cards read as objects rather than destinations, the
   cards take up a continuous jiggle, each removable card grows a remove
   control, and Add Module appears in the header. There is no outline around the
   grid, no toolbar, no banner.

   THE JIGGLE, AND WHY IT IS THIS SMALL. An earlier pass argued against having
   one at all: this product has a header that changes to read "Edit Modules", a
   Done button and remove controls, so the state is already legible. That was
   true and still missed the point — those all say "the PAGE is in edit mode",
   and the jiggle is the only one that says "THIS CARD is the thing you can
   move". It is the affordance, not the announcement.

   The amplitude is the whole argument. Nothing here exceeds 0.75° of rotation
   or 0.6px of travel, which is under what the eye resolves as motion on a
   stationary object and over what it resolves as life. Push it to the 3° and
   5px that a naive "shake" keyframe uses and a command centre looks broken —
   the cards read as malfunctioning rather than as editable.

   Three keyframe sets, not one, and a per-card delay computed from the card's
   uid in ModuleGrid.js. Fourteen cards on one synchronised animation is not
   fourteen jiggling cards, it is one jiggling grid, and it looks like the page
   is vibrating.

   THE BATTERY OBJECTION IS REAL and is answered rather than dismissed: only
   `transform` is animated, so the whole thing lives on the compositor and never
   touches layout or paint; it runs only inside edit mode, which is transient;
   `prefers-reduced-motion` stops it via the global block; and it is paused
   outright when the tab is hidden — see `body.is-hidden`.
   ══════════════════════════════════════════════════════════════════════════ */

body.is-editing .updates,
body.is-editing .search {
  opacity: .5;
  filter: saturate(.72);
  pointer-events: none;
  transition: opacity var(--t-base) var(--ease), filter var(--t-base) var(--ease);
}

.updates, .search {
  transition: opacity var(--t-base) var(--ease), filter var(--t-base) var(--ease);
}

/* TWO THINGS HERE ARE LOAD-BEARING, and were load-bearing for the one-shot
   settle this replaced. It runs on the CARD, not the slot, because the slot's
   transform belongs to the FLIP reflow — an animation on the same property
   would win the cascade and cards would stop animating to their new positions.
   And it has NO fill mode: `both` or `forwards` would latch the final keyframe
   on forever, permanently overriding any transform set later from script. */
body.is-editing .slot > .card {
  animation: jiggle-a var(--jiggle-dur, 1.9s) ease-in-out infinite;
  animation-delay: var(--jiggle-delay, 0ms);
  will-change: transform;
}
body.is-editing .slot[data-jiggle='b'] > .card { animation-name: jiggle-b; }
body.is-editing .slot[data-jiggle='c'] > .card { animation-name: jiggle-c; }

/* The card being dragged must not jiggle — the proxy follows the pointer and a
   second transform underneath it would fight the drag. The source slot is
   invisible during a drag anyway, but stopping it here means the transform is
   released cleanly rather than being overridden. */
body.is-editing .slot.is-source > .card,
body.is-editing .slot.is-grabbed > .card { animation: none; }

/* Paused rather than stopped when the tab goes away: `paused` keeps the
   compositor from doing any work at all, and resuming picks up mid-cycle so
   coming back to the tab does not re-synchronise every card into one beat. */
body.is-hidden .slot > .card { animation-play-state: paused; }

/* Three phases of the same tiny idea, offset from each other so no two cards
   are ever at the same point in the same shape. Rotation does most of the work
   — a pure translate reads as sliding, and a pure rotate as pivoting; together
   at this amplitude they read as "held loosely". */
@keyframes jiggle-a {
  0%   { transform: rotate(-.62deg) translate(0, .18px); }
  25%  { transform: rotate(.34deg)  translate(.22px, -.30px); }
  50%  { transform: rotate(.60deg)  translate(0, .26px); }
  75%  { transform: rotate(-.30deg) translate(-.22px, -.18px); }
  100% { transform: rotate(-.62deg) translate(0, .18px); }
}
@keyframes jiggle-b {
  0%   { transform: rotate(.55deg)  translate(.18px, -.22px); }
  25%  { transform: rotate(-.40deg) translate(0, .30px); }
  50%  { transform: rotate(-.70deg) translate(-.20px, -.14px); }
  75%  { transform: rotate(.36deg)  translate(.16px, .24px); }
  100% { transform: rotate(.55deg)  translate(.18px, -.22px); }
}
@keyframes jiggle-c {
  0%   { transform: rotate(-.44deg) translate(.20px, .24px); }
  25%  { transform: rotate(.58deg)  translate(-.16px, -.20px); }
  50%  { transform: rotate(.30deg)  translate(.14px, .28px); }
  75%  { transform: rotate(-.66deg) translate(-.18px, -.12px); }
  100% { transform: rotate(-.44deg) translate(.20px, .24px); }
}

body.is-editing .card { cursor: grab; }
body.is-editing .card:active { cursor: grabbing; transform: none; }

/* In edit mode a card must not respond to a pointer as if it were a link —
   it is a thing being moved, and the lift belongs to the drag proxy. */
body.is-editing .card:hover { transform: none; box-shadow: var(--e1); }

/* THE TOUCH-ACTION PROBLEM, AND WHY IT IS SOLVED IN TWO PLACES.
   `touch-action: none` on the cards would make dragging reliable and make the
   page impossible to scroll on an iPad — the grid is taller than the screen, so
   a finger landing on a card and swiping up must still scroll. But leaving
   scrolling on means Safari can begin one before we know a drag was intended,
   and once a scroll has started nothing cancels it.

   The resolution is the long press. A finger that has been still for 200ms is a
   finger that is not scrolling, so at that moment it is safe to take the
   gesture: the body switches to `touch-action: none` AND a non-passive
   `touchmove` handler starts calling preventDefault. Before that moment the
   page scrolls normally. */
body.is-editing .slot { touch-action: manipulation; }
body.is-dragging,
body.is-dragging .slot { touch-action: none; }
body.is-dragging { -webkit-user-select: none; user-select: none; cursor: grabbing; }

/* ── remove control ───────────────────────────────────────────────────────
   A minus, not a cross. A cross says "close"; a minus says "take this one
   away", which is what it does — and it is what a user coming off iPadOS
   already reads. Sits half outside the card corner so it never covers content,
   with an invisible 44px hit area so a thumb can find it. */
.slot__remove {
  position: absolute;
  top: -9px;
  left: -9px;
  z-index: 6;
  display: grid;
  place-items: center;
  width: 28px;
  height: 28px;
  padding: 0;
  border: 2px solid var(--canvas-2);
  border-radius: var(--r-pill);
  background: var(--ink);
  color: #fff;
  cursor: pointer;
  box-shadow: 0 2px 8px rgba(16, 55, 63, .3);
  animation: pop-in var(--t-base) var(--ease-out) both;
}
.slot__remove::before {
  /* the real touch target, larger than the visible button */
  content: '';
  position: absolute;
  inset: -8px;
  border-radius: inherit;
}
.slot__remove .icon { width: 16px; height: 16px; }
.slot__remove:hover { background: var(--clay); }
.slot__remove:active { transform: scale(.9); }

@keyframes pop-in {
  from { opacity: 0; transform: scale(.4); }
  to   { opacity: 1; transform: scale(1); }
}

/* A core card cannot be removed, and says so with a lock rather than with a
   disabled minus — a greyed-out button invites a tap that will do nothing. */
.slot__locked {
  position: absolute;
  top: -9px;
  left: -9px;
  z-index: 6;
  display: grid;
  place-items: center;
  width: 28px;
  height: 28px;
  border-radius: var(--r-pill);
  border: 2px solid var(--canvas-2);
  background: var(--petrol-200);
  color: var(--petrol-800);
  animation: pop-in var(--t-base) var(--ease-out) both;
}
.slot__locked .icon { width: 14px; height: 14px; }

/* A card being carried should not also be showing its remove button. */
.slot.is-source .slot__remove,
.slot.is-source .slot__locked { display: none; }

/* ── the add tile ─────────────────────────────────────────────────────────
   Lives in the grid as the last item so it is always where the next card will
   land, rather than in a fixed bar the user has to look away to find. */

/* ── keyboard reordering ──────────────────────────────────────────────────
   A card picked up with the keyboard gets the same lift the pointer gives it,
   because the two interactions should not look like different features. */
.slot.is-grabbed .card {
  box-shadow: var(--e-drag);
  transform: scale(1.03);
  transition: transform var(--t-base) var(--ease-out), box-shadow var(--t-base) var(--ease);
}

/* A live region has to be in the document to be announced, and out of the way
   to not be laid out. */
.a11y-live {
  position: absolute;
  width: 1px; height: 1px;
  margin: -1px; padding: 0;
  overflow: hidden;
  clip: rect(0 0 0 0);
  white-space: nowrap;
}

/* ── edit-mode hint ───────────────────────────────────────────────────────*/
.edit-hint {
  display: flex;
  align-items: center;
  gap: var(--s2);
  margin: calc(var(--s3) * -1) 0 var(--s4);
  font-size: var(--fs-label);
  color: var(--ink-3);
  animation: pop-in var(--t-base) var(--ease-out) both;
}
.edit-hint .icon { width: 15px; height: 15px; color: var(--ink-4); }


/* ── resize control ───────────────────────────────────────────────────────
   Bottom-right, diagonally opposite the remove control, so the two can never
   be confused by a thumb. Same visual weight as remove — neither is the
   primary action in edit mode; dragging is. */
.slot__resize {
  position: absolute;
  right: -9px;
  bottom: -9px;
  z-index: 6;
  display: grid;
  place-items: center;
  width: 28px;
  height: 28px;
  padding: 0;
  border: 2px solid var(--canvas-2);
  border-radius: var(--r-pill);
  background: var(--petrol-600);
  color: #fff;
  cursor: pointer;
  box-shadow: 0 2px 8px rgba(16, 55, 63, .3);
  animation: pop-in var(--t-base) var(--ease-out) both;
}
.slot__resize::before { content: ''; position: absolute; inset: -8px; border-radius: inherit; }
.slot__resize .icon { width: 14px; height: 14px; }
.slot__resize:hover { background: var(--petrol-800); }
.slot__resize:active { transform: scale(.9); }
.slot.is-source .slot__resize { display: none; }

/* the popover it opens */
.size-pop {
  position: fixed;
  z-index: calc(var(--z-drag) + 10);
  padding: var(--s4);
  border-radius: 18px;
  background: rgba(255, 255, 255, .94);
  box-shadow: var(--e2), 0 24px 56px -18px rgba(16, 55, 63, .34);
  -webkit-backdrop-filter: blur(14px) saturate(1.1);
  backdrop-filter: blur(14px) saturate(1.1);
  opacity: 0;
  transform: translateY(-6px) scale(.97);
  transform-origin: top center;
  transition: opacity var(--t-fast) var(--ease-out), transform var(--t-fast) var(--ease-out);
}
.size-pop.is-open { opacity: 1; transform: translateY(0) scale(1); }
.size-pop[hidden] { display: none !important; }
.size-pop .size-picker__row { flex-wrap: nowrap; }
</style>
<style>
/* ══ css/profile-menu.css ══ */
/* ══════════════════════════════════════════════════════════════════════════
   THE PROFILE MENU
   A popover under the avatar, holding everything the user can do to their own
   home page. Positioned in JS because it hangs off an element in a flex row
   whose position depends on the greeting's length; styled here.
   ══════════════════════════════════════════════════════════════════════════ */

/* The click-outside layer. Transparent, full-page, and only present while the
   menu is — see the note in ProfileMenu.js for why this is a layer and not a
   document listener. */
.pmenu-catcher { position: fixed; inset: 0; z-index: calc(var(--z-sheet) - 1); }
.pmenu-catcher[hidden] { display: none; }

.pmenu {
  position: fixed;
  z-index: var(--z-sheet);
  width: min(304px, calc(100vw - 24px));
  padding: var(--s2);
  border-radius: 18px;
  background: rgba(255, 255, 255, .94);
  -webkit-backdrop-filter: blur(20px) saturate(1.6);
  backdrop-filter: blur(20px) saturate(1.6);
  box-shadow: 0 1px 2px rgba(31, 65, 91, .1), 0 24px 60px -18px rgba(31, 65, 91, .38);
  /* the hairline is a ring rather than a border so it does not join the
     backdrop blur's edge and read as a double line */
  outline: 1px solid rgba(31, 65, 91, .07);
  outline-offset: -1px;
  opacity: 0;
  transform: scale(.96) translateY(-6px);
  transform-origin: top right;
  transition: opacity var(--t-fast) var(--ease-out), transform var(--t-fast) var(--ease-out);
}
.pmenu[hidden] { display: none; }
.pmenu.is-open { opacity: 1; transform: scale(1) translateY(0); }

.pmenu__head {
  display: flex;
  align-items: center;
  gap: var(--s3);
  padding: var(--s3) var(--s3) var(--s4);
  min-width: 0;
}
.pmenu__avatar { flex: none; width: 40px; height: 40px; border-radius: var(--r-pill); display: block; }
.pmenu__who { display: flex; flex-direction: column; min-width: 0; gap: 1px; }
.pmenu__name {
  font-size: var(--fs-body);
  font-weight: 650;

   Side by side, the actions take about 250px of it — and on a split layout the
   rail has already taken 240 off the left, which on an iPad in portrait left
   the chips 128px to hold three chips totalling 562. The active chip could not
   be scrolled into view because there was no view to scroll it into. Below
   1024 the actions go on their own row and the tray gets the lot. */
@media (max-width: 1023px) {
  .sheet__foot { grid-template-columns: minmax(0, 1fr); }
  .sheet__actions { justify-content: flex-end; }
  .sheet.has-selection .sheet__body { padding-bottom: 268px; }
}

.size-picker { min-width: 0; }
.size-picker__label {
  display: block;
  font-size: var(--fs-label);
  font-weight: 600;
  color: var(--ink-3);
  margin-bottom: 7px;
}
.size-picker__row { display: flex; gap: var(--s2); flex-wrap: wrap; }

/* Each option draws its own footprint. "Medium" being literally twice as wide
   as "Small" says more than the word does, and it says it before it is read. */
.size-opt {
  display: flex;
  align-items: center;
  gap: 9px;
  min-height: var(--btn);
  padding: 6px var(--s3) 6px 9px;
  border: 1px solid var(--line);
  border-radius: 12px;
  background: var(--surface);
  color: var(--ink-2);
  font-size: var(--fs-label);
  font-weight: 550;
  cursor: pointer;
  transition: background var(--t-fast) var(--ease), border-color var(--t-fast) var(--ease),
              color var(--t-fast) var(--ease);
}
.size-opt:hover { background: var(--petrol-050); color: var(--ink); }
.size-opt[aria-checked='true'] {
  border-color: var(--sig);
  background: color-mix(in srgb, var(--sig) 9%, transparent);
  color: var(--petrol-800);
}
.size-opt__glyph {
  display: grid;
  gap: 2px;
  flex: none;
}
.size-opt__glyph i {
  display: block;
  width: 9px;
  height: 9px;
  border-radius: 2.5px;
  background: var(--petrol-200);
}
.size-opt[aria-checked='true'] .size-opt__glyph i { background: var(--sig); }

.sheet__actions { display: flex; align-items: center; gap: var(--s2); }

.btn-ghost, .btn-primary {
  height: var(--btn);
  padding: 0 var(--s5);
  border: none;
  border-radius: 13px;
  font-size: var(--fs-body);
  font-weight: 600;
  cursor: pointer;
  transition: background var(--t-fast) var(--ease), transform var(--t-fast) var(--ease);
}
.btn-ghost { background: transparent; color: var(--ink-2); }
.btn-ghost:hover { background: var(--petrol-050); color: var(--ink); }
.btn-primary {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  background: var(--petrol-700);
  color: var(--on-dark);
  box-shadow: var(--e0);
}
.btn-primary .icon { width: 18px; height: 18px; }
.btn-primary:hover { background: var(--petrol-800); }
.btn-primary:active { transform: scale(.97); }

/* ══ SPLIT PANES · 768px AND UP ══════════════════════════════════════════
   The rail is anchored to the left and the gallery sits beside it. Both are
   on screen at once and neither ever hides the other, which is the whole
   reason this screen was rebuilt.

   768, NOT 1024. This used to start at 1024 and it put every iPad in portrait
   into the stacked arrangement — the rail filling the sheet, then sliding away
   to reveal the widgets. A 768, 810, 820 or 834pt portrait tablet has ample
   room for two columns; it was being given a phone's layout because the
   breakpoint was set by the OTHER thing that changes at 1024 (the sheet
   becoming a floating panel), and the two were written as one block. They are
   two separate decisions and they are now two separate blocks.

   Only the 12.9" iPad is 1024pt in portrait, so at the old breakpoint it was
   the single tablet that got this right. */
@media (min-width: 768px) {
  /* The flag the picker's JS reads to know which arrangement is live. Same
     idea as --grid-cols: the stylesheet decides, and the script asks the
     cascade rather than keeping its own copy of the breakpoint. */
  :root { --picker-split: 1; }

  .sheet {
    height: 86dvh;
    grid-template-columns: 240px minmax(0, 1fr);
    grid-template-areas:
      'head    head'
      'side    body';
  }

  .sheet__head { border-bottom: 1px solid var(--line); }

  .sheet__side {
    padding: var(--s4) var(--s4) var(--s4) var(--pad-page);
    border-right: 1px solid var(--line);
  }

  /* both panes are live, so neither of the stacking rules applies */
  .sheet__body { grid-area: body; display: block; padding: 0 var(--s5) var(--s8); }
  .sheet:not(.is-detail) .sheet__body { display: block; }
  .sheet.is-detail .sheet__side { display: flex; }
  .detail-back { display: none; }
  .detail-head { padding-top: var(--s5); }

  /* the bar starts at the gallery's left edge, so the rail stays usable while
     it is up — you can keep browsing modules with a widget already chosen */
  .sheet__foot { left: 240px; }
  .widget__meta { max-width: 250px; }
}

/* ══ DESKTOP · the sheet becomes a centred panel · 1024px and up ═════════
   A presentation change, not a layout one: the panes were already side by side
   at 768. Above 1024 there is room to browse without covering the page, so the
   bottom sheet lifts off the edge and becomes a floating card. */
@media (min-width: 1024px) {
  .sheet {
    top: 50%;
    left: 50%;
    right: auto;
    bottom: auto;
    /* the same 1024 the page is capped at, so the gallery never overhangs the
       product it is adding to */
    width: min(1024px, calc(100vw - 64px));
    height: min(860px, calc(100dvh - 64px));
    border-radius: 24px;
    translate: -50% -50%;
    transform: translateY(24px) scale(.985);
    grid-template-columns: 316px minmax(0, 1fr);
  }
  .sheet.is-open { transform: translateY(0) scale(1); }
  .sheet__handle { display: none; }

  .sheet__head { padding: var(--s6) var(--s8) var(--s5); }
  .sheet__side { padding: var(--s5) var(--s5) var(--s5) var(--s8); }
  .sheet-search input { height: 44px; }
  .sheet__body { padding: 0 var(--s8) var(--s8); }
  .detail-head { padding-top: var(--s6); }

  .sheet__foot { left: 316px; padding: var(--s4) var(--s8); border-radius: 0 0 24px 0; }
  .widget__meta { max-width: 280px; }
}

/* ══ mobile ══════════════════════════════════════════════════════════════ */
@media (max-width: 767px) {
  .sheet { height: 94dvh; }
  .widget-row { gap: var(--s3); }
  .sheet__foot { grid-template-columns: minmax(0, 1fr); gap: var(--s3); }
  .sheet__actions { width: 100%; }
  .sheet__actions .btn-primary { flex: 1; justify-content: center; }
}

  <!-- ══ search ════════════════════════════════════════════════════════ -->

  <div class="main-frame">

    <!-- ══ hero banner ═════════════════════════════════════════════════
         Figma "Egg Module": the leopard photograph under a flat 40% black,
         the mark rotated −45°, the title at 36px, carousel dots at the foot.

         AN ANCHOR, NOT A BUTTON. It navigates, so it is a link — which is not
         pedantry: an <a href> gets cmd-click, middle-click, "Open in New Tab",
         the destination in the status bar on hover, and Enter from the
         keyboard, all for nothing. A <button> with a click handler has to
         re-implement each of those and never does.

         A NEW TAB, so the dashboard is still there to come back to.

         `rel="noopener"` comes with it. Without it the opened page gets a live
         `window.opener` handle back to this one and can redirect it — current
         browsers imply noopener for `target="_blank"`, but the ones that do not
         are exactly the ones that matter here, so it is written down.

         `noreferrer` is deliberately NOT added: it would strip the Referer, and
         the Command Centre is this dashboard's own sibling rather than a third
         party we are hiding from.

         The new tab is also announced. A link that behaves differently from
         every other link should say so, and the only readers who cannot see it
         happen are the ones being told here — the span is visually hidden, so
         the banner is unchanged to the eye. -->
    <a class="hero" href="https://antz-command-centre-v5.vercel.app/"
       target="_blank" rel="noopener">

    </a>

 * ───────────────────────────────────────────────────────────────────────────
 * Turns an ordered list of cards into concrete {x, y, w, h} grid positions.
 *

 *
 *   1. DOM order + `grid-auto-flow: row`. Predictable, but a 3-wide card that
 *      cannot fit in the tail of a row leaves a visible hole, and the grid ends
 *      up full of gaps the moment sizes are mixed.
 *   2. DOM order + `grid-auto-flow: row dense`. No holes, but the browser owns
 *      the placement and will not tell you what it decided. Drag-and-drop needs
 *      to know where every card actually IS to work out where a drop should
 *      land, and "ask the browser" is not an available call.
 *   3. Compute it. Chosen.

 * the positions in our hands — so the drag controller can hit-test against real
 * coordinates, the picker can preview a layout before committing it, and the
 * saved file stays a plain ordered list.

/**
 * A MINIMAL OBSERVABLE STORE
 * ───────────────────────────────────────────────────────────────────────────
 * Thirty lines instead of a framework. State goes in one place, mutations go
 * through one function, and anything that cares subscribes. That is the entire
 * contract, and for a page with one grid and one sheet it is enough.
 *
 * The one non-obvious rule: `set` REPLACES the slice it is given rather than
 * deep-merging it. Deep merges are where stores like this quietly go wrong —
 * an array that should have shrunk instead keeps its tail. Callers hand over
 * the new value outright.
 */
function createStore(initial) {
  let state = initial
  const listeners = new Set()

  return {
    get: () => state,

    /**
     * @param {object|function} patch  a partial slice, or (state) => partial
     * @param {object} meta            passed to listeners; the render layer uses
     *                                 `meta.reason` to decide whether a change
     *                                 needs a full rebuild or a cheap touch-up
     */
    set(patch, meta = {}) {
      const next = typeof patch === 'function' ? patch(state) : patch
      const prev = state
      state = { ...state, ...next }
      for (const fn of listeners) fn(state, prev, meta)
    },

    subscribe(fn) {
      listeners.add(fn)
      return () => listeners.delete(fn)
    },
  }
}
  __x.createStore = createStore;
});

  return CORE_VARIANTS.has(variantId)
}

/* uids are per-instance, so the same variant can legitimately appear twice at
   two different sizes. A counter is enough — these never leave the browser. */
let seq = 0
function newUid() {
  return `c${(++seq).toString(36)}${Math.floor(performance.now() % 1e6).toString(36)}`
}

/**
 * Coerce whatever came out of storage into something renderable.
 * Returns the cleaned list plus a note of what was dropped, so the caller can
 * decide whether to tell anyone.
 */
function repair(raw) {
  const dropped = []
  const seen = new Set()
  const cards = []

  if (!Array.isArray(raw)) return { cards: seed(), dropped }

  for (const item of raw) {
    if (!item || typeof item.variantId !== 'string') { dropped.push('malformed'); continue }

    const variant = getVariant(item.variantId)
    if (!variant || !Array.isArray(variant.supportedSizes)) {
      dropped.push(item.variantId)                              // retired or malformed
      continue
    }

    /* a size the variant no longer offers falls back to its default rather
       than rendering at a span the card was never designed for */
    const size = variant.supportedSizes.includes(item.size) ? item.size : variant.defaultSize

    const uid = typeof item.uid === 'string' && !seen.has(item.uid) ? item.uid : newUid()
    seen.add(uid)
    const card = { uid, variantId: variant.id, size }
    if (item.newRow) card.newRow = true
    cards.push(card)
  }

  /* a locked card that was somehow removed comes back — the guarantee is about
     the product, not about one write of localStorage */
  for (const variantId of CORE_VARIANTS) {
    if (!cards.some((c) => c.variantId === variantId)) {
      const v = getVariant(variantId)
      if (v) cards.unshift({ uid: newUid(), variantId, size: defaultSizeFor(variantId) })
    }
  }

  return { cards: cards.length ? cards : seed(), dropped }
}

function defaultSizeFor(variantId) {
  const seeded = DEFAULT_LAYOUT.find((d) => d.variantId === variantId)
  return seeded ? seeded.size : getVariant(variantId).defaultSize
}

function seed() {
  /* Spread, not a hand-listed set of three fields. The explicit version dropped
     `newRow`, so the artboard's deliberate gap in the last two rows was packed
     away on a fresh install and only appeared after a save/reload — the flag
     survived repair() but never made it out of the default. */
  return DEFAULT_LAYOUT.map((d) => ({ ...d, uid: newUid() }))
}

function load() {
  let raw = null
  try {
    const text = localStorage.getItem(KEY)
    if (text) {
      const parsed = JSON.parse(text)
      /* Version gate. A layout saved by THIS schema is loaded; anything else
         falls through to the seed. Note the deliberate lack of a
         forward-compatible read — an earlier build had one, and it is why a
         version bump would otherwise not have reached anybody who had ever
         dragged a card. */
      if (parsed && parsed.version === VERSION) raw = parsed.cards
    }
  } catch {
    /* private mode, a full quota, a hand-edited value — none of them are worth
       a broken home page. Fall through to the default layout. */
  }
  /* repair() is the last thing between a corrupt saved layout and a blank home
     page, so it is not allowed to throw either. */
  try {
    return repair(raw).cards
  } catch {
    return seed()
  }
}

function save(cards) {
  try {
    localStorage.setItem(KEY, JSON.stringify({ version: VERSION, savedAt: Date.now(), cards }))
    return true
  } catch {
    return false   // the layout still works this session; it just will not persist
  }
}

function clear() {
  try { localStorage.removeItem(KEY) } catch { /* nothing to do */ }
}

/* ── the store itself ───────────────────────────────────────────────────── */

const layoutStore = createStore({
  cards: load(),
  editing: false,
  cols: 6,
  /* the layout as it was when Edit was pressed, so Done can be a real commit
     and a future Cancel has something to restore */
  snapshot: null,
})

/* Every mutation goes through one of these. Nothing else writes `cards`, which
   is why persistence can live in exactly one place. */

function setCards(cards, meta = {}) {
  layoutStore.set({ cards }, meta)
  save(cards)
}

/**
 * Add several cards in ONE write.
 *
 * The picker lets a curator build a selection and add it in a single action.
 * This replaced a single-card add() that the caller would have had to run in a
 * loop, which would have been a different thing wearing the same name: n writes
 * to localStorage, n store notifications, n renders, and n separate FLIP passes
 * fighting each other while the grid reflowed underneath the last card's
 * arrival animation. One commit means the packer sees the whole batch at once
 * and every new card animates in together. A single add is addCards([one]).
 *
 * Appended in the order they were picked, which is what puts them in the first
 * free positions the packer can find rather than scattering them.
 */
function addCards(list) {
  const made = []
  for (const item of list || []) {
    const variant = getVariant(item && item.variantId)
    if (!variant) continue
    made.push({
      uid: newUid(),
      variantId: variant.id,
      size: variant.supportedSizes.includes(item.size) ? item.size : variant.defaultSize,
    })
  }
  if (!made.length) return []
  setCards([...layoutStore.get().cards, ...made], { reason: 'add-many', uids: made.map((c) => c.uid) })
  return made
}

function removeCard(uid) {
  const { cards } = layoutStore.get()
  const card = cards.find((c) => c.uid === uid)
  if (!card || isCore(card.variantId)) return false
  setCards(cards.filter((c) => c.uid !== uid), { reason: 'remove', uid })
  return true
}

function resizeCard(uid, size) {
  const { cards } = layoutStore.get()
  setCards(
    cards.map((c) => {
      if (c.uid !== uid) return c
      const v = getVariant(c.variantId)
      return { ...c, size: v && v.supportedSizes.includes(size) ? size : c.size }
    }),
    { reason: 'resize', uid },
  )
}

function reorder(nextCards, cols) {
  setCards(normalise(nextCards, cols), { reason: 'reorder' })
}

function setEditing(editing) {
  const state = layoutStore.get()
  layoutStore.set(
    { editing, snapshot: editing ? state.cards.slice() : null },
    { reason: 'edit-mode' },
  )
}

function resetLayout() {
  clear()
  setCards(seed(), { reason: 'reset' })
}

__def('js/components/ModuleCard.js', function (__x, __req) {
/**
 * MODULE CARD
 * ───────────────────────────────────────────────────────────────────────────
 * One renderer for every card in the product. It takes a variation and a
 * resolved span and returns an element; it does not know whether that element
 * is going on the home page, into a drag proxy, or into a preview in the
 * picker. That last one is why the file is worth its length — the picker's
 * previews must look like the real thing, and the only way to keep that true
 * is for the preview to BE the card. There is no second renderer here.
 *
 * ═══ A FUNCTION PER LAYOUT, NOT A TEMPLATE WITH SLOTS ══════════════════════
 *
 * The previous version had one skeleton — label row, then a stack of content
 * blocks — and every card in the product went through it. It made the data
 * tidy and the design uniform in the worst way: five Medical cards that were
 * five green rectangles with different words in them.
 *
 * So each layout below builds its own DOM. A queue is a total and right-
 * aligned rows; a stat is one number with the title above it; a timeline is
 * entries down a rule; a chart is an SVG that owns the card. They share
 * tokens, type, radius, icon and fill family — and nothing else. That is the
 * difference between cards that belong to a family and cards that are the
 * same card.
 *
 * ═══ TWO FILLS ════════════════════════════════════════════════════════════
 *
 * `solid` is the module's gradient with white text: cards you go through.
 * `soft` is the same gradient under a white veil, dark text: cards you read.
 * The veil is applied in CSS so one rule serves all seventeen modules and no
 * second palette has to be maintained. See cards.css.
 */

const { getModule } = __req('js/data/modules.js');
const { icon } = __req('js/icons.js');

const ASSET_ICON = 'assets/icon/'
const ASSET_IMG = 'assets/img/'

/**
 * @param {object} variant
 * @param {object} opts  {size, w, h, uid, static}
 * @returns {HTMLElement}
 */
function renderCard(variant, opts = {}) {
  const { size = variant.defaultSize, w = 1, h = 1, uid = '', static: isStatic = false } = opts
  const mod = getModule(variant.moduleId)
  const data = variant.data || {}

  /* A card with a destination is a link, one without is a button, and a
     preview is neither — see the note in the picker. */
  const isLink = !isStatic && !!mod?.href
  const el = document.createElement(isStatic ? 'div' : isLink ? 'a' : 'button')
  el.className = 'card'
  if (isLink) {
    el.href = mod.href
    el.target = '_blank'
    el.rel = 'noopener'
    /* Chrome starts its own drag from an anchor, which would land on top of
       the pointer-driven reordering the grid uses. */
    el.draggable = false
  } else if (!isStatic) {
    el.type = 'button'
  }

  el.dataset.layout = variant.layout
  el.dataset.fill = variant.fill
  el.dataset.size = size
  el.dataset.w = String(w)
  el.dataset.h = String(h)
  el.dataset.variant = variant.id
  if (uid) el.dataset.uid = uid
  if (data.bandSize) el.dataset.bandSize = data.bandSize

  /* The module's Figma fill and glyph size. A variation may override either —
     the wide Parivesh card is drawn at a different gradient angle. */
  const gradient = variant.gradient || mod?.gradient
  if (gradient) {
    el.style.setProperty('--card-bg', `var(${gradient})`)
    /* Every fill carries a legibility veil sized to its own lightest stop, so
       `--g-lab` is darkened by `--k-lab`. The fallback is the heaviest alpha in
       the set: a fill added without its partner is over-veiled rather than
       silently illegible. */
    el.style.setProperty('--card-scrim', `var(${gradient.replace('--g-', '--k-')}, .535)`)
  }
  const iconSize = variant.iconSize || mod?.iconSize
  if (iconSize) el.style.setProperty('--icon-size', `${iconSize}px`)

  el.setAttribute('aria-label',
    spokenName(mod, variant, data) + (isLink ? '. Opens in a new tab' : ''))
  if (isStatic) el.setAttribute('aria-hidden', 'true')

  const build = LAYOUTS[variant.layout] || LAYOUTS.door
  el.innerHTML = build(mod, variant, data)
  return el
}

/* What a screen reader reads: the module, the card, then its actual content,
   so nobody has to open Pharmacy to learn that 42 requests are waiting. */
function spokenName(mod, variant, data) {
  const bits = [mod?.name]
  if (variant.layout !== 'door' && variant.layout !== 'compact') bits.push(variant.name)
  if (data.value) bits.push(`${data.value}${data.of ? ' of ' + data.of : ''} ${data.label || ''}`)
  if (data.sub) bits.push(data.sub)
  if (data.total) bits.push(`${data.total} total`)
  if (data.caption) bits.push(data.caption)
  if (data.summary) bits.push(data.summary)
  for (const i of data.items || []) bits.push([i.value, i.label, i.text, i.name, i.kind, i.meta, i.when].filter(Boolean).join(' '))
  for (const r of data.rows || []) bits.push(`${r.text} ${r.value}`)
  for (const f of data.figures || []) bits.push(`${f.value} ${f.label}`)
  for (const a of data.actions || []) bits.push(a)
  return bits.filter(Boolean).join('. ')
}

/* ── shared parts ───────────────────────────────────────────────────────── */

function glyph(mod, variant, cls = 'card__icon') {
  const file = variant.icon || mod?.icon
  if (!file) return ''
  const fish = mod?.iconShape === 'fish' && !variant.icon
  return `<span class="${cls}${fish ? ' card__icon--fish' : ''}">` +
         `<img src="${ASSET_ICON}${esc(file)}" alt="" aria-hidden="true"></span>`
}

/** The title line on a data card. A small glyph, then the card's own name. */
function head(mod, variant, data) {
  return `<span class="c-head">${glyph(mod, variant, 'c-head__icon')}` +
         `<span class="c-head__text">${esc(data.title || mod?.name || '')}</span></span>`
}

function media(variant) {
  if (!variant.image) return ''
  const pos = variant.imagePosition ? ` style="object-position:${esc(variant.imagePosition)}"` : ''
  let out = `<img class="card__media"${pos} src="${ASSET_IMG}${esc(variant.image)}" alt="" aria-hidden="true">`
  /* Figma stacks two exported layers on the Species card, a leaf plate under a
     tint pass. Both are real layers in the file, so both are drawn. */
  if (variant.imageOver) {
    out += `<img class="card__media" src="${ASSET_IMG}${esc(variant.imageOver)}" alt="" aria-hidden="true">`
  }
  if (variant.wash) out += `<span class="card__wash" style="background:${esc(variant.wash)}"></span>`
  return out
}

/* ───────────────────────────────────────────────────────────────────────────
   THE LAYOUTS
   Twelve compositions. Each owns its markup; none is a variation of another.
   ─────────────────────────────────────────────────────────────────────────── */

const LAYOUTS = {

  /* A glyph and a name, pushed to opposite ends of the card — the artboard's
     own module tile, and the whole of a navigation card. No figures, no
     description, no arrow: the card is the link. */
  door: (mod, variant) =>
    `<span class="l-door">${glyph(mod, variant)}` +
    `<span class="l-door__name">${esc(mod?.name || '')}</span></span>`,

  /* The same entry point on its side, one row high, for a page that wants many
     modules visible at once. */
  compact: (mod, variant) =>
    `<span class="l-compact">${glyph(mod, variant, 'l-compact__icon')}` +
    `<span class="l-compact__name">${esc(mod?.name || '')}</span></span>`,

  /* A photograph with its name in a scrim band — or, on the Species card, with
     the collection's two figures over it. */
  photo: (mod, variant, data) => {
    if (data.figures) {
      return media(variant) +

/**
 * MOTION PREFERENCE
 * ───────────────────────────────────────────────────────────────────────────
 * `prefers-reduced-motion` is honoured in CSS by zeroing the transition
 * durations, but that block cannot reach an animation started from script.
 * `Element.animate()` takes its duration as a number, and a number does not
 * consult a media query — so the CSS rule silences every transition in the
 * product and leaves the two Web Animations calls (a card being dismissed, a
 * card arriving) running at full tilt.
 *
 * Anyone who has asked their operating system to calm things down has asked for
 * all of it, not the parts that were convenient to implement. This is the one
 * place that question is answered, and it is live: the matcher is kept so a
 * user who changes the setting mid-session is respected without a reload.
 */

const query = typeof matchMedia === 'function'
  ? matchMedia('(prefers-reduced-motion: reduce)')
  : null

function prefersReducedMotion() {
  return !!query && query.matches
}

/**
 * `Element.animate()`, but a no-op when motion is unwelcome.
 * Always returns something with a `finished` promise so callers can chain
 * without branching on whether the animation actually ran.
 */
function animate(el, keyframes, options) {
  if (prefersReducedMotion() || !el || typeof el.animate !== 'function') {
    return { finished: Promise.resolve(), cancel() {} }
  }
  return el.animate(keyframes, options)
}

  __x.animate = animate;

__def('js/components/ModuleGrid.js', function (__x, __req) {
/**
 * MODULE GRID
 * ───────────────────────────────────────────────────────────────────────────
 * Owns the DOM for the home page's card layout: packs the ordered card list
 * into positions, reconciles those against the elements already on screen, and
 * animates whatever moved.
 *
 * WHY RECONCILE INSTEAD OF REBUILD. Wiping and re-rendering the grid on every
 * state change is four lines and it is wrong here for three separate reasons.
 * It would destroy the element being dragged mid-gesture, along with its
 * pointer capture. It would restart every CSS transition, so nothing could ever
 * animate between two states. And it would throw away scroll position and focus
 * — a keyboard user reordering a card would be dumped back at the top of the
 * page after each keystroke.
 *
 * So slots are keyed by uid and reused. A card that only moved keeps its
 * element and gets a transform; a card whose variant or size actually changed
 * gets its inner card element replaced and nothing else.
 *
 * FLIP. Positions come from `grid-area`, which is not an animatable property —
 * a card told to move from column 1 to column 4 simply appears there. So the
 * grid measures every slot before the change (First), applies it, measures
 * again (Last), sets a transform that puts each slot visually back where it
 * started (Invert), and clears it on the next frame with a transition attached
 * (Play). Two measurement passes, one style write, no layout in a pointermove.

const { currentColumns } = __req('js/lib/sizes.js');
const { getVariant } = __req('js/data/cardVariants.js');

       It used to be packed as a tile after the last card, on the theory that it
       lands in the first free slot rather than in a bar you go looking for. On
       a fifteen-card page that theory is wrong: the tile sits below the fold,
       and the one action a person opens Edit Modules to perform is the one they
       have to scroll to find. It is now a header action — see
       EditModulesMode.js — and the grid holds only the user's own modules. */

    const next = pack(list, cols)

    const first = animate ? measure() : null

    /* ── reconcile ─────────────────────────────────────────────────────── */

    for (const item of next) {
      live.add(item.uid)
      let slot = slots.get(item.uid)

        slot = buildSlot(item)

   * would be re-assigned a new phase, so the whole page would visibly
   * re-synchronise on every drop. Random is wrong because the grid reconciles
   * rather than rebuilds — a card that survives a render keeps its element and
   * would keep its old value, while a new neighbour would get a fresh one, and
   * the two would drift apart for no reason a user could see.

   * change are checked, and the card is rebuilt only if one of them did —
   * rebuilding on every render would defeat the whole point of keying.
   */

    const identityChanged = slot.dataset.variant !== item.variantId || slot.dataset.size !== item.size

    slot.dataset.w = String(item.w)
    slot.dataset.h = String(item.h)

    if (identityChanged || spanChanged) {
      const variant = getVariant(item.variantId)
      const old = slot.querySelector('.card')
      if (variant && old) {
        if (identityChanged) {
          const card = renderCard(variant, { size: item.size, w: item.w, h: item.h, uid: item.uid })
          card.addEventListener('click', (e) => {
            if (editing) { e.preventDefault(); return }
            onActivate?.(variant, item)

        } else {
          /* span changed but the card did not — the container query and the
             `data-h` selector do the rest, so only the attributes move */
          old.dataset.w = String(item.w)
          old.dataset.h = String(item.h)
        }
      }
      slot.dataset.variant = item.variantId
      slot.dataset.size = item.size
    }

    /* edit affordances are added and removed as the mode changes */
    const hasControl = slot.querySelector('.slot__remove, .slot__locked')

  }

  function decorate(slot, item) {

       including the two core cards, which cannot be removed but can certainly
       be made smaller. */

      const size = document.createElement('button')

      size.className = 'slot__resize'
      size.innerHTML = icon('resize')

        e.stopPropagation()

    }

    if (isCore(item.variantId)) {
      const lock = document.createElement('span')
      lock.className = 'slot__locked'
      lock.title = 'This module is always on your home page'
      lock.innerHTML = icon('security')
      slot.append(lock)
      return
    }

    btn.type = 'button'
    btn.className = 'slot__remove'
    btn.innerHTML = icon('minus')

   * and taking it out of the packer on the next render lets the FLIP pass
   * animate the survivors into the space it left.

    ).finished.catch(() => {}).finally(() => slot.remove())

   * Which card should take focus when `uid` is removed?

   * Asked BEFORE the removal, because afterwards the card is gone from the
   * placement and there is no longer anything to be next to. Left alone, focus
   * falls to <body> and a keyboard user removing three cards has to tab in from

    for (const [uid, slot] of slots) m.set(uid, slot.getBoundingClientRect())

       `getBoundingClientRect` forces it once, here, and not again. */

    for (const [uid, slot] of slots) {
      const f = first.get(uid)
      if (!f) continue
      const l = slot.getBoundingClientRect()
      const dx = f.left - l.left

      moves.push([slot, dx, dy])

        slot.style.transform = ''

          slot.classList.remove('is-flipping')
          slot.style.willChange = ''
          slot.removeEventListener('transitionend', done)
        }
        slot.addEventListener('transitionend', done)

  return {
    render,

    setEditing(on) {
      editing = on

    get columns() { return cols },

/**

 * ───────────────────────────────────────────────────────────────────────────
 * Pointer-Events drag and drop for the module grid. One code path serves a
 * finger on an iPad and a mouse on a desktop, because Pointer Events unify
 * them — which is also why the HTML5 drag-and-drop API is not used here: it has
 * never worked on touch and never will.
 *

 *           down. There is nothing else a press-and-move on a card in edit mode
 *           could mean.
 *   touch   a drag starts after the finger has been still for 200ms. Before
 *           that the page scrolls normally, which it has to — the grid is
 *           taller than an iPad. Move more than 8px inside those 200ms and the
 *           press is abandoned as a scroll.
 *

 * clone follows the pointer; the original stays in the grid at zero opacity so
 * its slot can draw the hole. Moving the real element instead would mean the
 * grid re-laying-out on every frame and the card being clipped the moment it
 * left the container.
 *
 * WHAT REFLOWS. On each frame the controller works out which index the pointer
 * is over, and if that has changed it reorders a working copy of the card list
 * and re-renders the grid. The grid's own FLIP pass animates every other card
 * into its new place — so "other cards move to create space" is not a special
 * case in here at all, it is what the grid already does when its input changes.

 * EDIT MODULES MODE
 * ───────────────────────────────────────────────────────────────────────────

 * section header's copy, the edit affordances on the grid, the Add Module action,
 * and a keyboard route through the whole thing.
 *

 * only be operated by a pointer is a grid a keyboard user cannot arrange at
 * all — there is no "other way" to do it, the way there is usually a link
 * beside a hover menu. So Space picks a card up, the arrow keys move it, Space
 * puts it down and Escape abandons the move, and every step is announced. It is

  editBtn.className = 'link-btn'
  editBtn.innerHTML = `${icon('pencil')}<span>Edit</span>`

  doneBtn.className = 'link-btn link-btn--done'
  doneBtn.textContent = 'Done'

   * that put the primary action of the whole mode below the fold: you entered
   * Edit Modules to add something and had to scroll past everything you already
   * had to find out how. It now sits beside the title, where it is the first
   * thing in the mode after the mode's own name.

   * not another module card. Making it look like a card would put it in
   * competition with the things it adds.

/**
 * MODULE PREVIEW
 * ───────────────────────────────────────────────────────────────────────────
 * A preview of a card variant at a given size — rendered by building the REAL
 * card at its REAL pixel size and scaling it down with a transform.
 *
 * WHY NOT A SEPARATE PREVIEW RENDERER. Because it would be wrong within a
 * month. The brief asks for previews that "represent the real module card
 * design, not generic placeholders"; a second renderer is a promise to keep two
 * files in step forever, and nobody ever does. The preview here cannot drift
 * from the card because it is the card.
 *
 * THE SCALE TRICK. `transform: scale()` is a paint operation — it does not
 * change the element's layout width, and it does not change what a container
 * query sees. So a "Full Width" card built at 960px still reports 960px to its
 * own container queries and lays itself out exactly as it will on the home
 * page: figures side by side, list in two columns. Then it is painted at 30%.
 * A preview that was instead BUILT at 290px would report 290px, take the small
 * card's layout, and show the user something they are not going to get.
 *
 * Sizes are computed against the 6-column reference grid, so the proportions
 * between Small, Medium, Large, Tall and Full are the true ones — the user is
 * comparing real footprints, not icons of footprints.
 */

const { renderCard } = __req('js/components/ModuleCard.js');

/* The reference grid the previews are measured in: the tablet-landscape band,
   which is the device this product is designed on. */
/* The reference grid the previews are measured in: the Figma artboard's own
   band — five columns of 179.2px, 16px gutters, 164px rows. This said 146.7
   while the grid was six columns wide, and kept saying it after the grid became
   five, so every preview was built at the wrong width and its container queries
   dressed it for a card size that no longer exists. */

const REF_ROW = 164
const REF_GAP = 16

function previewMetrics(size) {

    w,
    h,
    width: w * REF_COL + (w - 1) * REF_GAP,
    height: h * REF_ROW + (h - 1) * REF_GAP,

  stage.style.height = `${Math.round(m.height * scale)}px`

__def('js/components/ModulePickerBottomSheet.js', function (__x, __req) {
/**
 * THE WIDGET GALLERY
 * ───────────────────────────────────────────────────────────────────────────
 * "Add Module" — a sheet on touch, a panel on desktop, one component.
 *
 * ═══ WHY THIS IS A RAIL AND NOT A GRID OF FOLDERS ══════════════════════════
 *
 * There have been two versions of this before and both hid modules.
 *
 *   v1  every module's widgets in one scroll. Fifteen modules came to 5,308px
 *       of gallery inside a 902px window: three visible, twelve below the fold
 *       with nothing to suggest they existed.
 *   v2  a grid of module tiles you clicked into. All fifteen were on screen —
 *       but only until you opened one, at which point the other fourteen
 *       vanished behind a Back button, and comparing Pharmacy's queue card with
 *       Medical's meant two navigations and a memory test.
 *
 * This is the shape Apple's widget gallery has settled on, and for the same
 * reason: a PERSISTENT VERTICAL LIST of every module down one side, and the
 * selected module's widgets beside it. The list never goes away. Choosing a
 * module is a click, not a navigation, so moving between them costs nothing
 * and no module is ever more than a scroll from being seen.
 *
 * On a phone there is not room for both at once, so the rail is the sheet and
 * the widgets slide in over it — which is exactly what iOS does at that width.
 * It is the same two panes; only one of them is on screen at a time.
 *
 * ═══ WIDGETS ARE GROUPED BY PURPOSE ════════════════════════════════════════
 *
 * Within a module, the widgets are grouped under Navigate / Understand /
 * Attention / Act / Monitor with a line of copy on each. Seventy-one cards is
 * too many to present as a flat shelf; grouped, a module reads as a sentence —
 * here is the door, here is what it knows, here is what is waiting, here is
 * what you can do, here is what just happened.
 *
 * ═══ WHAT IS SEARCHED ══════════════════════════════════════════════════════
 *
 * Not just module names. A curator looking for the pending queue types
 * "pending", not "Medical" — so the haystack includes variant names,
 * descriptions, keywords, purposes, and every figure and label the card shows.
 * Typing "population", "hatch", "overdue", "incubation" or "critical" all find
 * the right card, and the rail narrows to the modules that have one.
 */

const { MODULES, CATEGORIES, getModule } = __req('js/data/modules.js');
const { CARD_VARIANTS, variantsForModule, PURPOSES, SIZE_LABELS } = __req('js/data/cardVariants.js');
const { icon } = __req('js/icons.js');
const { renderPreview } = __req('js/components/ModulePreview.js');
const { createSizeSelector } = __req('js/components/ModuleSizeSelector.js');

function createModulePicker({ onAdd }) {
  /* ── state ──────────────────────────────────────────────────────────── */
  let open = false
  let query = ''
  let activeId = MODULES[0].id      // the module the detail pane is showing

  /**
   * THE SELECTION IS A BASKET, NOT A CURSOR.
   *
   * This used to be a single `{ variantId, size }`, so adding three cards meant
   * open → pick → Add → reopen → pick → Add → reopen → pick → Add: the gallery
   * threw away everything you had learned about it twice, and the module you
   * were comparing against was two navigations behind you.
   *
   * A Map, because the order a curator picks things in is the order they should
   * arrive on the page, and insertion order is the one thing a Map guarantees.
   * Keyed by variant id, holding the size chosen for that variant — so the sizes
   * genuinely are per-card and not one setting shared across the basket.
   */
  const selected = new Map()        // variantId → size, in the order picked

  /* Which selected card the footer's size control is currently editing. The

     recently touched one owns it — and the tray below lets you hand it to
     another without disturbing the selection. */
  let sizing = null

  let restoreFocusTo = null
  /* Only meaningful under the phone breakpoint, where the two panes are
     stacked: false = looking at the rail, true = looking at the widgets. */
  let detailOpen = false

  /* ── nodes ──────────────────────────────────────────────────────────── */
  const scrim = document.createElement('div')
  scrim.className = 'scrim'
  scrim.hidden = true

  const sheet = document.createElement('div')
  sheet.className = 'sheet'
  sheet.setAttribute('role', 'dialog')
  sheet.setAttribute('aria-modal', 'true')
  sheet.setAttribute('aria-labelledby', 'picker-title')
  sheet.hidden = true

  sheet.innerHTML = `
    <span class="sheet__handle" aria-hidden="true"></span>
    <div class="sheet__head">
      <h2 class="sheet__title" id="picker-title">Add Module</h2>
      <button type="button" class="sheet__close" aria-label="Close">${icon('close')}</button>
    </div>

    <div class="sheet__side">
      <div class="sheet-search">
        ${icon('search')}
        <input type="search" placeholder="Search modules" aria-label="Search modules"
               autocomplete="off" autocorrect="off" spellcheck="false">
        <button type="button" class="sheet-search__clear" aria-label="Clear search">${icon('close')}</button>
      </div>
      <div class="mod-rail" role="tablist" aria-label="Modules" aria-orientation="vertical"></div>
    </div>

    <div class="sheet__body" tabindex="-1"></div>
    <div class="sheet__foot"></div>`

  const closeBtn = sheet.querySelector('.sheet__close')
  const searchWrap = sheet.querySelector('.sheet-search')
  const searchInput = sheet.querySelector('.sheet-search input')
  const searchClear = sheet.querySelector('.sheet-search__clear')
  const rail = sheet.querySelector('.mod-rail')
  const body = sheet.querySelector('.sheet__body')
  const foot = sheet.querySelector('.sheet__foot')

  /* Changing the size re-renders the chosen widget's preview. A size control
     that changes nothing you can see is a control you have to take on faith,
     and the whole point of this gallery is that you do not have to. */

    onChange(size) {

      repaintPreview(sizing)
      renderTray()

  /**
   * THE TRAY — what is in the basket, and which one the size control is on.
   *
   * Without it, multi-select has a hole in it: clicking a selected tile
   * deselects (it has to — the way out of a selection should be the gesture
   * that made it), so there would be no way to go back and re-size a card you
   * picked three tiles ago short of removing and re-adding it. Each chip is
   * that way back. It also keeps the basket visible while you scroll a long
   * gallery, which is the actual reason iOS shows one.
   */
  const tray = document.createElement('div')
  tray.className = 'sel-tray'

  const trayCount = document.createElement('span')
  trayCount.className = 'sel-tray__count'

  const trayChips = document.createElement('div')
  trayChips.className = 'sel-tray__chips'
  tray.append(trayCount, trayChips)

  const actions = document.createElement('div')
  actions.className = 'sheet__actions'
  const cancelBtn = document.createElement('button')
  cancelBtn.type = 'button'
  cancelBtn.className = 'btn-ghost'
  cancelBtn.textContent = 'Cancel'
  const addBtn = document.createElement('button')
  addBtn.type = 'button'
  addBtn.className = 'btn-primary'
  addBtn.textContent = 'Add to Home'
  actions.append(cancelBtn, addBtn)

  const footMain = document.createElement('div')
  footMain.className = 'sheet__foot-main'
  footMain.append(tray, sizeSelector.root)

  document.body.append(scrim, sheet)

  /* ── search ─────────────────────────────────────────────────────────── */

  /**
   * Everything about a variant that a person might type. Built once per
   * variant and cached, because it is re-scanned on every keystroke.
   */
  const haystack = new Map()
  for (const v of CARD_VARIANTS) {
    const mod = getModule(v.moduleId)
    const d = v.data || {}
    const bits = [
      mod?.name, mod?.blurb, ...(mod?.keywords || []),
      v.name, v.description, PURPOSES[v.purpose]?.label,
      /* The card's own heading. Left out of the first version of this index,
         which meant "low stock" — the heading on Pharmacy's alert card, and one
         of the three examples the empty state suggests typing — found nothing
         at all. */
      d.title,
    ]
    /* Everything the card actually shows, so the figures are searchable too. */
    for (const blk of d.blocks || []) {

      for (const it of blk.items || []) bits.push(it.label, it.text, it.lead, it.value)

  }

  /**
   * Every word in the query must appear somewhere. Substring rather than fuzzy:
   * on a seventeen-module product fuzzy matching mostly produces surprises, and
   * "lab" quietly matching "Follow Up" would be worse than finding nothing.
   */

    if (!query) return true
    const hay = haystack.get(variantId) || ''
    return query.split(/\s+/).filter(Boolean).every((term) => hay.includes(term))
  }

  /** A module's widgets that survive the current query. */
  function hits(moduleId) {
    return variantsForModule(moduleId).filter((v) => matches(v.id))
  }

  searchInput.addEventListener('input', () => {
    query = searchInput.value.trim().toLowerCase()
    searchWrap.classList.toggle('has-value', !!searchInput.value)
    /* If the module being shown has nothing left that matches, move to the
       first one that does. A search that leaves you staring at an empty pane
       while the answer sits three rows up the rail is a search that failed. */

    }

    renderDetail()
  })

  searchClear.addEventListener('click', () => {
    searchInput.value = ''
    query = ''
    searchWrap.classList.remove('has-value')
    renderRail()
    renderDetail()
    searchInput.focus()
  })

  /* ── the rail · every module, always ─────────────────────────────────── */

  function renderRail() {
    rail.replaceChildren()
    let any = false

    for (const cat of CATEGORIES) {
      const mods = MODULES.filter((m) => m.category === cat.id && hits(m.id).length)
      if (!mods.length) continue
      any = true

      const heading = document.createElement('div')
      heading.className = 'mod-rail__heading'
      heading.textContent = cat.name
      rail.append(heading)

      for (const mod of mods) {
        const row = document.createElement('button')
        row.type = 'button'
        row.className = 'mod-row'
        row.setAttribute('role', 'tab')
        row.setAttribute('aria-selected', String(mod.id === activeId))
        row.tabIndex = mod.id === activeId ? 0 : -1
        row.dataset.module = mod.id
        row.innerHTML =
          `<span class="mod-row__icon" style="background:var(${mod.gradient})">` +
            `<img src="assets/icon/${esc(mod.icon)}" alt="" aria-hidden="true"></span>` +
          `<span class="mod-row__name">${esc(mod.name)}</span>` +
          `${icon('chev-right', 'icon mod-row__chev')}`
        row.addEventListener('click', () => selectModule(mod.id))
        rail.append(row)
      }
    }

    if (!any) rail.append(emptyState())
  }

  function selectModule(id) {
    activeId = id
    /* and it survives moving between modules, which is the whole point */

    sheet.classList.add('is-detail')
    for (const row of rail.querySelectorAll('.mod-row')) {
      const on = row.dataset.module === id
      row.setAttribute('aria-selected', String(on))
      row.tabIndex = on ? 0 : -1
    }
    renderDetail()
    body.scrollTop = 0
  }

  /* Arrow keys walk the rail, which is what a keyboard user will try on
     something marked up as a vertical tablist. */
  rail.addEventListener('keydown', (e) => {
    const step = { ArrowDown: 1, ArrowUp: -1 }[e.key]
    if (!step) return
    e.preventDefault()
    const rows = [...rail.querySelectorAll('.mod-row')]
    const i = rows.findIndex((r) => r.dataset.module === activeId)
    const next = rows[(i + step + rows.length) % rows.length]
    if (!next) return
    selectModule(next.dataset.module)
    next.focus()
  })

  /* ── the detail · one module's widgets, grouped by purpose ───────────── */

  function renderDetail() {
    body.replaceChildren()
    const mod = getModule(activeId)
    if (!mod) { body.append(emptyState()); return }

    /* On a phone the two panes are stacked, so the detail needs its own way
       back to the rail. On desktop the rail is right there and this is hidden
       by the stylesheet rather than by a second code path. */
    const back = document.createElement('button')
    back.type = 'button'
    back.className = 'detail-back'
    back.innerHTML = `${icon('chev-left')}<span>All Modules</span>`
    back.addEventListener('click', () => {
      detailOpen = false
      sheet.classList.remove('is-detail')
      rail.querySelector(`[data-module="${activeId}"]`)?.focus()
    })

    const head = document.createElement('div')
    head.className = 'detail-head'
    head.innerHTML =
      `<span class="detail-head__icon" style="background:var(${mod.gradient})">` +
        `<img src="assets/icon/${esc(mod.icon)}" alt="" aria-hidden="true"></span>` +
      `<span class="detail-head__text">` +
        `<span class="detail-head__name">${esc(mod.name)}</span>` +
        `<span class="detail-head__blurb">${esc(mod.blurb)}</span>` +
      `</span>`

    body.append(back, head)

    /* ONE SHELF, NOT FIVE SECTIONS.
       An earlier pass grouped these under NAVIGATE / UNDERSTAND / ATTENTION /
       ACT / MONITOR headings with a line of copy on each. It was a taxonomy the
       user had to read before they could look at anything, and the widgets are
       the point. The purposes still ORDER the shelf — door first, then the
       figures, then what is waiting, then what you can do, then what just
       happened — they just no longer announce themselves. */
    const variants = variantsForModule(mod.id).filter((v) => matches(v.id))
    if (!variants.length) { body.append(emptyState()); return }

    const row = document.createElement('div')
    row.className = 'widget-row'
    for (const v of variants) row.append(widgetTile(v))
    body.append(row)
  }

  /**
   * Are the rail and the gallery side by side, or stacked one over the other?
   *
   * THE STYLESHEET DECIDES AND THIS ASKS. It is the same arrangement as
   * `currentColumns()` in sizes.js, and for the same reason: there was a
   * hard-coded `innerWidth >= 1024` here and a `@media (min-width: 1024px)`
   * there, and when the CSS breakpoint moved to 768 this would have gone on
   * believing every iPad in portrait was stacked. One definition, in the place
   * that owns it.
   */

    return getComputedStyle(document.documentElement)
      .getPropertyValue('--picker-split').trim() === '1'
  }

  /* Wider viewports afford larger previews; these keep a Full Width card
     readable beside a Small one rather than shrinking it to a smear. */
  function previewBounds() {
    const w = window.innerWidth
    return w >= 1200 ? { maxWidth: 300, maxHeight: 218 }
      : w >= 768 ? { maxWidth: 272, maxHeight: 198 }
      : { maxWidth: 236, maxHeight: 172 }
  }

  function widgetTile(v) {
    const btn = document.createElement('button')
    btn.type = 'button'
    btn.className = 'widget'
    btn.dataset.variant = v.id
    const isOn = selected.has(v.id)
    btn.setAttribute('aria-pressed', String(isOn))
    if (isOn && v.id === sizing) btn.classList.add('is-sizing')

    /* The size the basket is holding for this card, so scrolling away and back
       shows the choice rather than resetting it. */
    const size = isOn ? selected.get(v.id) : v.defaultSize
    const stage = renderPreview(v, size, previewBounds())
    stage.classList.add('widget__stage-wrap')

    /* The tick lives on the stage, not the button, so it pins to the corner of
       the CARD rather than to the corner of the tile's padding box — which is
       where the eye expects it and where a Full Width preview's very different
       proportions would otherwise leave it stranded. */
    const check = document.createElement('span')
    check.className = 'widget__check'
    check.setAttribute('aria-hidden', 'true')
    check.innerHTML = icon('check')
    stage.append(check)

    btn.append(stage)

    /* The name, and nothing else. The description and the size count were
       three lines of prose under a picture that already says what the widget
       is — and with 3 to 6 widgets a module, that prose was most of the pane.
       The sizes are still on the footer's selector, where they are a choice
       rather than a fact to read. */
    const meta = document.createElement('span')
    meta.className = 'widget__meta'
    meta.innerHTML = `<span class="widget__name">${esc(v.name)}</span>`
    btn.append(meta)
    btn.addEventListener('click', () => toggleVariant(v))
    return btn
  }

  function emptyState() {
    const el = document.createElement('div')
    el.className = 'sheet-empty'
    el.innerHTML =
      `<span class="sheet-empty__icon">${icon('search')}</span>` +
      `<span class="sheet-empty__title">Nothing matches &ldquo;${esc(searchInput.value)}&rdquo;</span>` +
      `<span class="sheet-empty__note">Try a module name, or something the card shows — ` +
      `&ldquo;overdue&rdquo;, &ldquo;population&rdquo;, &ldquo;low stock&rdquo;.</span>`
    return el
  }

  /* ── selection ──────────────────────────────────────────────────────── */

  function variantById(id) {
    return CARD_VARIANTS.find((v) => v.id === id) || null
  }

  /** Toggle a widget in and out of the basket. */
  function toggleVariant(v) {
    if (selected.has(v.id)) {
      selected.delete(v.id)
      /* The size control cannot go on editing a card that is no longer in the
         basket — hand it to whatever is still there, newest first. */
      if (sizing === v.id) sizing = lastKey()
    } else {
      selected.set(v.id, v.defaultSize)
      sizing = v.id
    }
    syncSelectionUI()
  }

  /** The most recently added key, or null — Maps have no `last()`. */
  function lastKey() {
    let out = null
    for (const k of selected.keys()) out = k
    return out
  }

  /** Point the footer's size control at one card in the basket. */
  function focusSizing(variantId) {
    if (!selected.has(variantId)) return
    sizing = variantId
    syncSelectionUI()
  }

  /**
   * One function for every path that can change the basket, so the tile states,
   * the tray, the size control and the Add button can never disagree about what
   * is selected. Cheap enough to call on every toggle — the gallery is at most
   * six tiles.
   */
  function syncSelectionUI() {
    const n = selected.size
    sheet.classList.toggle('has-selection', n > 0)

    for (const btn of body.querySelectorAll('.widget')) {
      const on = selected.has(btn.dataset.variant)
      btn.setAttribute('aria-pressed', String(on))
      btn.classList.toggle('is-sizing', on && btn.dataset.variant === sizing)
    }

    renderTray()

    const v = sizing ? variantById(sizing) : null
    if (v) {
      sizeSelector.render(v.supportedSizes, selected.get(sizing))
      sizeSelector.setLabel(`Size for ${v.name}`)
      sizeSelector.root.hidden = v.supportedSizes.length < 2
    } else {
      sizeSelector.root.hidden = true
    }

    addBtn.textContent = n > 1 ? `Add ${n} Modules` : 'Add to Home'
    addBtn.disabled = n === 0
  }

  function renderTray() {
    const n = selected.size
    trayCount.textContent = n === 1 ? '1 Selected' : `${n} Selected`
    trayChips.replaceChildren()

    for (const [id, size] of selected) {
      const v = variantById(id)
      if (!v) continue

      const chip = document.createElement('span')
      chip.className = 'sel-chip'
      if (id === sizing) chip.classList.add('is-active')

      /* The chip body picks the card up for sizing; the × takes it out. Two
         targets in one chip, so neither gesture can be mistaken for the other. */
      const pick = document.createElement('button')
      pick.type = 'button'
      pick.className = 'sel-chip__pick'
      pick.innerHTML =
        `<span class="sel-chip__name">${esc(v.name)}</span>` +
        `<span class="sel-chip__size">${esc(SIZE_LABELS[size] || size)}</span>`
      pick.setAttribute('aria-label', `${v.name}, ${SIZE_LABELS[size] || size}. Choose a size for this card`)
      pick.addEventListener('click', () => focusSizing(id))

      const drop = document.createElement('button')
      drop.type = 'button'
      drop.className = 'sel-chip__drop'
      drop.innerHTML = icon('close')
      drop.setAttribute('aria-label', `Remove ${v.name} from the selection`)
      drop.addEventListener('click', () => {
        selected.delete(id)
        if (sizing === id) sizing = lastKey()
        syncSelectionUI()
      })

      chip.append(pick, drop)
      trayChips.append(chip)
    }

    /* Keep the card being sized where it can be seen. The tray scrolls
       sideways, so picking a fourth widget puts its chip past the right edge —
       and the size control below would then be labelled with a card the user
       cannot see. */
    const active = trayChips.querySelector('.sel-chip.is-active')
    if (active) {
      const box = trayChips.getBoundingClientRect()
      const it = active.getBoundingClientRect()
      if (it.right > box.right - 4 || it.left < box.left + 4) {
        /* FLUSH LEFT, NOT CENTRED. Centring leaves the previous chip cut down
           the middle at the left edge, and a chip cut after its name reads as a
           chip that has no name — the tray showed a pill saying just "Medium".
           Aligned to the leading edge, a chip is either wholly there or wholly
           gone, and only the trailing edge is ever partial, which is the one
           the fade is for. */
        trayChips.scrollLeft += it.left - box.left
      }
    }
    syncTrayFade()
  }

  /** Fade an edge only when there is something past it to scroll to. */
  function syncTrayFade() {
    const max = trayChips.scrollWidth - trayChips.clientWidth
    const x = trayChips.scrollLeft
    trayChips.style.setProperty('--fade-l', x > 2 ? '22px' : '0px')
    trayChips.style.setProperty('--fade-r', x < max - 2 ? '22px' : '0px')
  }
  trayChips.addEventListener('scroll', syncTrayFade, { passive: true })

  /** Redraw one widget's preview at the size the footer now says. */
  function repaintPreview(variantId) {
    const btn = body.querySelector(`.widget[data-variant="${cssEsc(variantId)}"]`)
    const variant = variantById(variantId)
    if (!btn || !variant) return
    const stage = renderPreview(variant, selected.get(variantId), previewBounds())
    stage.classList.add('widget__stage-wrap')
    btn.querySelector('.variant__stage')?.replaceWith(stage)
  }

  /**
   * Empty the basket.
   *
   * NOT called when the query changes or the module does. The whole point of a
   * basket is that it survives browsing — picking two Medical cards, searching
   * "overdue" and picking a Pharmacy one should give you three, not one.
   */
  function clearSelection() {
    selected.clear()
    sizing = null
    syncSelectionUI()
  }

  addBtn.addEventListener('click', () => {
    if (!selected.size) return
    const batch = [...selected].map(([variantId, size]) => ({ variantId, size }))
    onAdd?.(batch)
    close()

/**
 * ANTZ COMMAND CENTRE · HOME
 * ───────────────────────────────────────────────────────────────────────────
 * Wiring. Every piece of behaviour lives in its own module; this file is the
 * place they are introduced to each other, and it is deliberately the shortest
 * interesting file in the project.
 *
 * THE ONE IDEA WORTH READING. There are two sources of card order and only ever
 * one of them is live. Normally it is the store — the saved, persisted layout.
 * During a drag it is `working`, a scratch copy the drag controller mutates
 * dozens of times a second without touching localStorage. When the finger

  onPreview(next) {
    working = next
    paint({ animate: true })
  },
  onCommit(next, { changed } = {}) {
    working = null
    /* A drag that ended where it began still has to release the grid — commit
       the order when it changed, and simply repaint from the store when it did
       not, so the subscriber guard above stops swallowing updates. */
    if (changed) reorder(next, grid.columns)
    else paint({ animate: true })
  },
})

/* ── render ─────────────────────────────────────────────────────────────── */

function paint(opts = { animate: true }) {
  grid.render(cards(), opts)
}

layoutStore.subscribe(() => {
  /* A store change that arrives mid-drag is the drag's own preview being
     committed; the grid is already showing it. */
  if (working) return
  paint()
})

/* Edit mode is a session state, not a saved one — a user who leaves the page
   mid-edit should come back to a readable home page. */
setEditing(false)
paint({ animate: false })

/* ── responsive reflow ──────────────────────────────────────────────────── */

/**
 * Nothing needs to happen on most resize events: the CSS handles the columns,
 * and the packer only has to re-run when the COLUMN COUNT changes. Dragging a
 * desktop window across two hundred pixels fires a hundred resize events and
 * should cause exactly zero repacks.
 */
let lastCols = currentColumns()
let resizeTimer = 0

function onResize() {
  clearTimeout(resizeTimer)
  resizeTimer = window.setTimeout(() => {
    const cols = currentColumns()
    if (cols === lastCols) return
    lastCols = cols
    paint({ animate: false })
  }, 120)
}

window.addEventListener('resize', onResize)
window.addEventListener('orientationchange', onResize)

/* ── developer conveniences ─────────────────────────────────────────────── */
Object.assign(window, {
  antz: {
    reset: resetLayout,
    state: () => layoutStore.get(),
    columns: currentColumns,
    /* test hook: put every variant on the grid at every size it declares, so a
       clipping regression cannot hide behind the default layout */
    allVariants() {
      const all = __req('js/data/cardVariants.js').CARD_VARIANTS
      const out = []
      let i = 0
      for (const v of all) for (const sz of v.supportedSizes) out.push({ uid: 'x' + (i++), variantId: v.id, size: sz })
      __req('js/state/layoutStore.js').setCards(out, { reason: 'stress' })
    },

    /**
     * The catalogue and the default home page have to agree, and there are two
     * files where they could quietly stop agreeing: a card promoted to
     * `priority: 'primary'` in cardVariants.js that nobody seeded, or a card
     * seeded in layoutStore.js that is no longer primary — or no longer exists.
     *
     * Cheap to check, invisible when it passes, and it names the file to open
     * when it fails.
     */
    checkDefaults() {
      const { primaryVariants, getVariant } = __req('js/data/cardVariants.js')
      const { DEFAULT_LAYOUT } = __req('js/state/layoutStore.js')

      const seeded = new Set(DEFAULT_LAYOUT.map((d) => d.variantId))
      const problems = []

      for (const v of primaryVariants()) {
        if (!seeded.has(v.id)) problems.push(`primary but not on the default home page: ${v.id}`)
      }
      for (const d of DEFAULT_LAYOUT) {
        const v = getVariant(d.variantId)
        if (!v) { problems.push(`seeded but not in the catalogue: ${d.variantId}`); continue }
        if (v.priority !== 'primary') problems.push(`seeded but ${v.priority}, not primary: ${d.variantId}`)
        if (!v.supportedSizes.includes(d.size)) {
          problems.push(`seeded at a size it does not support: ${d.variantId} @ ${d.size}`)
        }
      }

      if (problems.length) console.warn('[antz] default layout:\n  ' + problems.join('\n  '))
      else console.info('[antz] default layout agrees with the catalogue.')
      return problems
    },
  },
})

});

__req('js/app.js');
})();
</script>
</body>
</html>
