/* ══ css/cards.css ══ */
/* ══════════════════════════════════════════════════════════════════════════
   MODULE CARDS
   ──────────────────────────────────────────────────────────────────────────
   Nineteen layouts, two fills, one design language.

   WHAT IS SHARED — and this is the whole of the family resemblance:
     type          Inter, one scale, one set of weights
     radius        16px, everywhere
     spacing       the 4px scale, and only values from it
     icon          the exported Figma glyph, one style
     colour        the module's own gradient, in one of two treatments
     elevation     one hover lift, one press
     interaction   the whole card is the target

   WHAT IS NOT — and this is where the variety comes from:
     the composition. A queue is a total and right-aligned rows; a stat is one
     number under a title; a chart is a plot that owns the card; a timeline is
     entries down a rule; a ring is what a total is made of; an arc is how
     full it is. Each has its own section below and shares nothing with the
     others but the tokens above.

   ═══ COLOUR IS THE ONE THING THAT DOES NOT VARY ════════════════════════════

   Every card is its module's own gradient, white text; a photograph is the
   only other fill. An earlier pass gave data cards a white-veiled version of
   the gradient with dark text, and it went wrong exactly where a module's
   colour is weakest — Follow Up's petrol and Approvals' slate came out grey.
   A module is recognised by its fill, so the fill is the wrong place to look
   for variety. The compositions provide it.
   ══════════════════════════════════════════════════════════════════════════ */

.card {
  container-type: inline-size;
  container-name: card;
  position: relative;
  display: flex;
  flex-direction: column;
  width: 100%;
  height: 100%;
  padding: var(--pad-card);
  border: none;
  border-radius: var(--r-card);
  overflow: hidden;
  isolation: isolate;
  text-align: left;
  cursor: pointer;
  background: transparent;
  -webkit-tap-highlight-color: transparent;
  /* a card may be an anchor; the reset only dresses `button` */
  font: inherit;
  color: var(--on-dark);
  text-decoration: none;
  -webkit-touch-callout: none;
  transition: box-shadow var(--t-base) var(--ease), transform var(--t-base) var(--ease-out);
}

@media (hover: hover) {
  .card:hover { transform: translateY(-2px); box-shadow: var(--shadow-card); }
}
.card:active { transform: translateY(0) scale(.985); }

/* ── PADDING BY SIZE, not by breakpoint ──────────────────────────────────
   A small card and a full-width one are different objects and want different
   air. 16 / 20 / 24 off the spacing scale. */
.card[data-size='medium'] { padding: var(--s5); }
.card[data-size='large'],
.card[data-size='tall'],
.card[data-size='full'] { padding: var(--s6); }
@media (max-width: 767px) {
  .card, .card[data-size='medium'] { padding: var(--s4); }
  .card[data-size='large'], .card[data-size='tall'], .card[data-size='full'] { padding: var(--s5); }
}

/* ── the two fills ───────────────────────────────────────────────────────*/
.card[data-fill='solid'] { background: var(--card-bg, var(--g-users)); }

/* ── the photograph ──────────────────────────────────────────────────────*/
.card__media {
  position: absolute;
  inset: 0;
  z-index: 0;
  border-radius: var(--r-card);
  object-fit: cover;
  width: 100%;
  height: 100%;
  display: block;
  transition: transform var(--t-slow) var(--ease-out);
}
@media (hover: hover) { .card[data-fill='image']:hover .card__media { transform: scale(1.035); } }
.card__wash { position: absolute; inset: 0; z-index: 1; border-radius: var(--r-card); }

/* ── the glyph ───────────────────────────────────────────────────────────
   Figma sizes these per module — 44 for most, 38 Hospital, 34 Users, 32
   Security, 28 Species, 24 Follow Up. The size travels with the module. */
.card__icon { position: relative; flex: none; display: block; width: var(--icon-size, 44px); height: var(--icon-size, 44px); }
.card__icon img { display: block; width: 100%; height: 100%; }

/* Mortality and Fetal Death reuse one dead-fish glyph, rotated a quarter turn
   and flipped inside a 44px box at a 4.162px offset. Figma's transform kept
   rather than re-drawn, so both cards match the artboard. */
.card__icon--fish { width: 44px; height: 44px; }
.card__icon--fish img {
  width: 39.838px; height: 39.838px; margin: 4.162px 0 0 4.162px;
  transform: rotate(-90deg) scaleY(-1);
}

/* ══════════════════════════════════════════════════════════════════════════
   THE TITLE LINE
   Every data card opens with the same small glyph and title. It is the one
   thing the twelve compositions have in common, and it is what makes them
   read as one family before anything else does.
   ══════════════════════════════════════════════════════════════════════════ */
.c-head {
  position: relative;
  z-index: 2;
  display: flex;
  align-items: center;
  gap: var(--s2);
  flex: none;
  min-width: 0;
  margin-bottom: var(--s3);
}
.c-head__icon { flex: none; width: 22px; height: 22px; display: block; }
.c-head__icon img { width: 100%; height: 100%; display: block; }
.c-head__text {
  font-size: var(--fs-card-title);
  font-weight: 600;
  line-height: 1.25;
  letter-spacing: -.01em;
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
/* ══ LAYOUT · door ════════════════════════════════════════════════════════
   Glyph at the top, name at the foot, the space between doing the work. The
   artboard's own module tile. ══════════════════════════════════════════════ */
.l-door {
  position: relative;
  z-index: 2;
  display: flex;
  flex: 1 0 0;
  flex-direction: column;
  align-items: flex-start;
  justify-content: space-between;
  width: 100%;
  min-height: 0;
}
.l-door__name {
  font-size: var(--fs-card);
  font-weight: 500;
  line-height: 1.18;
  width: 100%;
  overflow: hidden;
  text-overflow: ellipsis;
  hyphens: auto;
  -webkit-hyphens: auto;
}

/* ══ LAYOUT · compact ═════════════════════════════════════════════════════ */
.l-compact {
  position: relative;
  z-index: 2;
  display: flex;
  align-items: center;
  gap: var(--s3);
  flex: 1 0 0;
  min-width: 0;
}
.l-compact__icon { flex: none; width: 34px; height: 34px; display: block; }
.l-compact__icon img { width: 100%; height: 100%; display: block; }
.l-compact__name {
  font-size: var(--fs-card);
  font-weight: 500;
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

/* ══ LAYOUT · photo ═══════════════════════════════════════════════════════
   Figma's construction: a 113px band pinned to the bottom edge, wider than the
   card so its blur has no seam, transparent at 5.68% and 70% black by 64.48%.
   A full-height overlay would be simpler and would muddy the top of every
   photograph, which is the part the design is showing off. */
.l-photo { position: relative; z-index: 2; display: flex; flex: 1 0 0; align-items: flex-start; }
.card__band {
  position: absolute;
  bottom: 0;
  left: 50%;
  translate: -50% 0;
  z-index: 2;
  display: flex;
  align-items: center;
  width: calc(100% + 2px);
  height: var(--scrim-band-h);
  padding: 60px var(--pad-card) var(--pad-card);
  background: var(--scrim-band);
  -webkit-backdrop-filter: blur(2px);
  backdrop-filter: blur(2px);
  pointer-events: none;
}
.card[data-band-size='lg'] .card__band { padding: 61px var(--s5) var(--s5); }
.card[data-band-size='lg'] .l-door__name { font-size: var(--fs-card-lg); }

/* the Species card: the two figures of the whole collection, over foliage */
.l-photo-stat {
  position: relative;
  z-index: 2;
  display: flex;
  flex: 1 0 0;
  flex-direction: column;
  min-height: 0;
  text-shadow: 0 1px 10px rgba(0, 0, 0, .3);
}
.l-photo-stat__figures { display: flex; flex: 1 0 0; flex-direction: column; justify-content: space-between; }
.figure { display: flex; flex-direction: column; gap: var(--s1); }
.figure__value {
  font-family: var(--font-num);
  font-weight: 700;
  font-size: var(--fs-hero-num);
  line-height: 1;
  letter-spacing: -.02em;
  font-variant-numeric: tabular-nums;
  font-variation-settings: 'opsz' 14;
}
.figure__label { font-size: var(--fs-body); font-weight: 400; }

/* ══ LAYOUT · stat ════════════════════════════════════════════════════════
   One number, its caption, and a quiet supporting line. Primary, secondary,
   tertiary — and nothing given equal weight to anything else. ═══════════════ */
.l-stat { position: relative; z-index: 2; display: flex; flex: 1 0 0; flex-direction: column; min-height: 0; }
.l-stat__body { display: flex; flex: 1 0 0; flex-direction: column; justify-content: center; gap: var(--s1); min-height: 0; }
.l-stat__value {
  font-family: var(--font-num);
  font-weight: 700;
  font-size: var(--fs-hero-num);
  line-height: 1;
  letter-spacing: -.025em;
  font-variant-numeric: tabular-nums;
  font-variation-settings: 'opsz' 14;
}
.l-stat__label { font-size: var(--fs-body); font-weight: 500; }
.l-stat__sub { flex: none; margin-top: var(--s3); font-size: var(--fs-label); }
.l-stat__sub[data-tone='alert'] { color: var(--c-alert); font-weight: 550; }

/* ══ LAYOUT · metrics ═════════════════════════════════════════════════════
   Two to four figures side by side, separated by whitespace alone. No boxes,
   no dividers, no card inside a card. ══════════════════════════════════════ */
.l-metrics { position: relative; z-index: 2; display: flex; flex: 1 0 0; flex-direction: column; min-height: 0; }
.l-metrics__row {
  display: flex;
  flex: 1 0 0;
  align-items: center;
  flex-wrap: wrap;
  gap: var(--s3) var(--s6);
  min-height: 0;
}
.metric { display: flex; flex-direction: column; gap: var(--s1); min-width: 0; }
.metric__value {
  font-family: var(--font-num);
  font-weight: 700;
  font-size: var(--fs-metric);
  line-height: 1;
  letter-spacing: -.02em;
  font-variant-numeric: tabular-nums;
  font-variation-settings: 'opsz' 14;
}
.metric__label { font-size: var(--fs-label); line-height: 1.2; }
.metric[data-tone='alert'] .metric__value { color: var(--c-alert); }

/* ══ LAYOUT · chart ═══════════════════════════════════════════════════════ */
.l-chart { position: relative; z-index: 2; display: flex; flex: 1 0 0; flex-direction: column; min-height: 0; }
.l-chart__plot { flex: 1 1 auto; min-height: 34px; display: block; }
.l-chart__plot svg { width: 100%; height: 100%; display: block; overflow: visible; }
.l-chart__line { fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; opacity: .85; }
.l-chart__area { fill: currentColor; opacity: .10; }
.l-chart__foot { flex: none; display: flex; align-items: baseline; justify-content: space-between; gap: var(--s3); margin-top: var(--s3); }
.l-chart__summary { font-size: var(--fs-body); font-weight: 600; }
.l-chart__delta { font-size: var(--fs-label); font-weight: 600; font-variant-numeric: tabular-nums; }

/* ══ LAYOUT · queue ═══════════════════════════════════════════════════════
   A total beside the title, then rows on a common right edge. ══════════════ */
.l-queue { position: relative; z-index: 2; display: flex; flex: 1 0 0; flex-direction: column; min-height: 0; }
.l-queue__head { display: flex; align-items: flex-start; justify-content: space-between; gap: var(--s3); flex: none; }
.l-queue__head .c-head { margin-bottom: var(--s3); flex: 1 1 auto; }
.l-queue__total {
  flex: none;
  font-family: var(--font-num);
  font-weight: 700;
  font-size: var(--fs-metric);
  line-height: 1;
  letter-spacing: -.02em;
  font-variant-numeric: tabular-nums;
}
.l-queue__rows { display: flex; flex-direction: column; gap: var(--s3); flex: 0 1 auto; min-height: 0; overflow: hidden; }
.l-queue__row { display: flex; align-items: baseline; gap: var(--s3); }
.l-queue__text { flex: 1 1 auto; font-size: var(--fs-body); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.l-queue__value { flex: none; font-family: var(--font-num); font-weight: 650; font-size: var(--fs-body); font-variant-numeric: tabular-nums; }

/* ══ LAYOUT · status ══════════════════════════════════════════════════════
   A state, not a measurement. The dot carries the meaning, so the card is
   never repainted by its worst line. ══════════════════════════════════════ */
.l-status { position: relative; z-index: 2; display: flex; flex: 1 0 0; flex-direction: column; min-height: 0; }
.l-status__rows { display: flex; flex: 1 0 0; flex-direction: column; justify-content: center; gap: var(--s3); min-height: 0; }
.l-status__row { display: flex; align-items: baseline; gap: var(--s2); }
.l-status__dot { flex: none; width: 8px; height: 8px; border-radius: var(--r-pill); background: var(--c-ok); translate: 0 -2px; }
.l-status__row[data-tone='warn'] .l-status__dot { background: var(--c-warn); }
.l-status__row[data-tone='alert'] .l-status__dot { background: var(--c-alert); }
.l-status__value { font-family: var(--font-num); font-weight: 700; font-size: var(--fs-body); font-variant-numeric: tabular-nums; }
.l-status__text { font-size: var(--fs-body); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* ══ LAYOUT · progress ════════════════════════════════════════════════════ */
.l-progress { position: relative; z-index: 2; display: flex; flex: 1 0 0; flex-direction: column; justify-content: center; min-height: 0; }
.l-progress__ratio { display: flex; align-items: baseline; gap: var(--s2); }
.l-progress__value {
  font-family: var(--font-num);
  font-weight: 700;
  font-size: var(--fs-hero-num);
  line-height: 1;
  letter-spacing: -.025em;
  font-variant-numeric: tabular-nums;
  font-variation-settings: 'opsz' 14;
}
.l-progress__of { font-family: var(--font-num); font-weight: 500; font-size: var(--fs-body); }
.l-progress__track {
  display: block;
  width: 100%;
  height: 10px;
  margin-top: var(--s4);
  border-radius: var(--r-pill);
  background: rgba(255, 255, 255, .26);
  overflow: hidden;
}
.l-progress__track i { display: block; height: 100%; border-radius: var(--r-pill); background: #FFFFFF; }
.l-progress__facts {
  display: flex;
  gap: var(--s6);
  margin-top: var(--s4);
  padding-top: var(--s3);
  border-top: 1px solid rgba(255, 255, 255, .22);
}
.l-progress__fact { display: flex; flex-direction: column; gap: 1px; min-width: 0; }
.l-progress__fact-value {
  font-family: var(--font-num);
  font-size: var(--fs-body);
  font-weight: 700;
  font-variant-numeric: tabular-nums;
}
.l-progress__fact[data-tone='warn'] .l-progress__fact-value { color: var(--c-warn); }
.l-progress__fact[data-tone='alert'] .l-progress__fact-value { color: var(--c-alert); }
.l-progress__fact-label {
  font-size: var(--fs-micro);
  opacity: .74;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.l-progress__caption { margin-top: var(--s2); font-size: var(--fs-label); font-weight: 550; }

/* ══ LAYOUT · timeline ════════════════════════════════════════════════════
   Entries down a hairline rule. The rule is what makes it read as a sequence
   rather than as a list. ═══════════════════════════════════════════════════ */
.l-timeline { position: relative; z-index: 2; display: flex; flex: 1 0 0; flex-direction: column; min-height: 0; }
.l-timeline__items { position: relative; display: flex; flex-direction: column; gap: var(--s4); flex: 0 1 auto; min-height: 0; overflow: hidden; padding-left: var(--s4); }
.l-timeline__items::before {
  content: '';
  position: absolute;
  left: 3px;
  top: 4px;
  bottom: 4px;
  width: 1px;
  background: currentColor;
  opacity: .16;
}
.l-timeline__item { position: relative; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.l-timeline__dot {
  position: absolute;
  left: calc(var(--s4) * -1 + 1px);
  top: 5px;
  width: 7px;
  height: 7px;
  border-radius: var(--r-pill);
  background: currentColor;
  opacity: .5;
}
.l-timeline__item[data-tone='alert'] .l-timeline__dot { background: var(--c-alert); opacity: 1; }
.l-timeline__text { font-size: var(--fs-body); font-weight: 550; line-height: 1.25; overflow: hidden; text-overflow: ellipsis; }
.l-timeline__meta { font-size: var(--fs-label); line-height: 1.2; }
.l-timeline__item[data-tone='alert'] .l-timeline__meta { color: var(--c-alert); font-weight: 550; }

/* ══ LAYOUT · recent ══════════════════════════════════════════════════════ */
.l-recent { position: relative; z-index: 2; display: flex; flex: 1 0 0; flex-direction: column; min-height: 0; }
.l-recent__items { display: flex; flex-direction: column; gap: var(--s3); flex: 0 1 auto; min-height: 0; overflow: hidden; }
.l-recent__item { display: flex; align-items: baseline; justify-content: space-between; gap: var(--s3); }
.l-recent__main { display: flex; flex-direction: column; gap: 1px; min-width: 0; }
.l-recent__name { font-size: var(--fs-body); font-weight: 600; line-height: 1.2; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.l-recent__kind { font-size: var(--fs-label); }
.l-recent__when { flex: none; font-size: var(--fs-label); white-space: nowrap; }

/* ══ LAYOUT · actions ═════════════════════════════════════════════════════
   The controls ARE the content. They sit on the module's colour, translucent,
   so they read as controls without out-shouting the card. ══════════════════ */
.l-actions { position: relative; z-index: 2; display: flex; flex: 1 0 0; flex-direction: column; min-height: 0; }
.l-actions__set { display: flex; flex: 1 0 0; flex-direction: column; justify-content: center; gap: var(--s2); }
.l-action {
  display: flex;
  align-items: center;
  min-height: 36px;
  padding: var(--s2) var(--s3);
  border-radius: 10px;
  /* A DARK PLATE, NOT A LIGHT ONE. This chip used to be 18% white, which
     lightened the ground under its own white label and undid the veil exactly
     where a control needs contrast most: 4.03:1 at rest and 3.55:1 on hover,
     failing on all sixteen fills. Tinting the same amount of black instead
     takes it to about 8:1 everywhere. The hairline stays white and reads
     better against the darker plate than it did against the lighter one. */
  background: rgba(0, 0, 0, .18);
  box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .24);
  font-size: var(--fs-label);
  font-weight: 600;
  line-height: 1.2;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
/* hover deepens the plate rather than lightening it, for the same reason */
.card:hover .l-action { background: rgba(0, 0, 0, .26); }

/* ══════════════════════════════════════════════════════════════════════════
   SEVEN MORE COMPOSITIONS
   ──────────────────────────────────────────────────────────────────────────
   The first twelve answered "how much" and "what happened". These answer the
   questions an operational home page actually gets asked: what is this made
   of, how full is it, where has it got to, what needs me, which one is it.

   TWO RULES HOLD ACROSS ALL SEVEN, AND THEY ARE THE BRIEF'S:

   1 · NOTHING WHITE AND OPAQUE SITS ON THE GRADIENT. A donut, an arc, a
       track and a meter are all drawn in white at an opacity — the module's
       colour shows through every one of them. The moment a visualisation
       needs a white plate underneath, it has stopped being part of the card.

   2 · HIERARCHY COMES FROM TYPE AND OPACITY, NOT FROM BOXES. Primary text is
       white; a supporting label is ~78%; metadata is ~62%. Note that this is
       deliberately NOT what the twelve older layouts do — an accessibility
       pass took their opacity hierarchy out, and that decision still stands
       for them. These seven were specified with it, so they have it, and the
       two treatments are not mixed inside one card.
   ══════════════════════════════════════════════════════════════════════════ */

/* ══ LAYOUT · ring ════════════════════════════════════════════════════════
   COMPOSITION — what a total is made of. The dial is the card; the legend
   names the parts and is read second. Segments are one white at four
   opacities rather than four colours, because a module already has a colour
   and a second palette inside its own card is how a design system dies. ═══ */
.l-ring { position: relative; z-index: 2; display: flex; flex: 1 0 0; flex-direction: column; min-height: 0; }
.l-ring__body { display: flex; align-items: center; gap: var(--s4); flex: 1 0 0; min-height: 0; }
.l-ring__dial { position: relative; flex: none; width: 88px; height: 88px; }
.l-ring__dial svg { display: block; width: 100%; height: 100%; }
.l-ring__track { fill: none; stroke: rgba(255, 255, 255, .2); }
.l-ring__seg { fill: none; stroke: #FFFFFF; }
.l-ring__seg[data-i='1'] { opacity: .74; }
.l-ring__seg[data-i='2'] { opacity: .52; }
.l-ring__seg[data-i='3'] { opacity: .34; }
.l-ring__centre {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 1px;
  text-align: center;
}
.l-ring__total {
  font-family: var(--font-num);
  font-weight: 700;
  font-size: var(--fs-body);
  line-height: 1;
  letter-spacing: -.02em;
  font-variant-numeric: tabular-nums;
}
.l-ring__unit { font-size: var(--fs-micro); line-height: 1.1; opacity: .62; }
.l-ring__legend { display: flex; flex-direction: column; gap: var(--s2); flex: 1 1 auto; min-width: 0; }
.l-ring__key { display: flex; align-items: baseline; gap: var(--s2); min-width: 0; }
.l-ring__swatch { flex: none; width: 8px; height: 8px; border-radius: 3px; background: #FFFFFF; translate: 0 -1px; }
.l-ring__key[data-i='1'] .l-ring__swatch { opacity: .74; }
.l-ring__key[data-i='2'] .l-ring__swatch { opacity: .52; }
.l-ring__key[data-i='3'] .l-ring__swatch { opacity: .34; }
.l-ring__name {
  flex: 1 1 auto;
  font-size: var(--fs-label);
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  opacity: .78;
}
.l-ring__val {
  flex: none;
  font-family: var(--font-num);
  font-weight: 650;
  font-size: var(--fs-label);
  font-variant-numeric: tabular-nums;
}

/* ══ LAYOUT · arc ═════════════════════════════════════════════════════════
   CAPACITY — one ratio, drawn as a 240° gauge with the figure inside it. A
   gauge rather than a bar because "76% full" is a state you glance at, and an
   open arc reads as a dial where a straight track reads as a task in
   progress. The two figures under it are the arithmetic behind the number. ═ */
.l-arc { position: relative; z-index: 2; display: flex; flex: 1 0 0; flex-direction: column; min-height: 0; }
.l-arc__body { display: flex; align-items: center; gap: var(--s5); flex: 1 0 0; min-height: 0; }
.l-arc__dial { position: relative; flex: none; width: 108px; }
.l-arc__dial svg { display: block; width: 100%; height: auto; }
.l-arc__track { fill: none; stroke: rgba(255, 255, 255, .2); stroke-linecap: round; }
.l-arc__value { fill: none; stroke: #FFFFFF; stroke-linecap: round; }
/* THE PERCENTAGE, AND NOTHING ELSE, GOES INSIDE THE RING. A caption line was
   tried here and "Success Rate" is wider than the dial: it ran out over the
   stroke on both sides and read as a rendering fault. The card's own title
   already says what the ratio is of, and the facts beside it say what it is
   made of, so the middle of the gauge only ever has one job. */
.l-arc__read {
  position: absolute;
  left: 0;
  right: 0;
  top: 46%;
  transform: translateY(-50%);
  display: flex;
  justify-content: center;
}
.l-arc__pct {
  font-family: var(--font-num);
  font-weight: 700;
  font-size: var(--fs-metric);
  line-height: 1;
  letter-spacing: -.025em;
  font-variant-numeric: tabular-nums;
}
.l-arc__facts { display: flex; flex-direction: column; gap: var(--s3); flex: 1 1 auto; min-width: 0; }
.l-arc__fact { display: flex; flex-direction: column; gap: 1px; min-width: 0; }
.l-arc__fact-value {
  font-family: var(--font-num);
  font-weight: 700;
  font-size: var(--fs-body);
  line-height: 1.1;
  font-variant-numeric: tabular-nums;
}
.l-arc__fact-label {
  font-size: var(--fs-label);
  line-height: 1.15;
  opacity: .78;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

/* ══ LAYOUT · flow ════════════════════════════════════════════════════════
   A PIPELINE — the stages something passes through, with the count sitting at
   each. The chevrons are the content: they are what says these numbers are
   one population moving, not four unrelated measurements. ═════════════════ */
.l-flow { position: relative; z-index: 2; display: flex; flex: 1 0 0; flex-direction: column; min-height: 0; }
.l-flow__stages { display: flex; align-items: center; flex: 1 0 0; gap: var(--s5); min-height: 0; }
/* Five stages on a 2×2 card leave 43px a column once s5 gaps are out, which
   is narrower than the word "Reviewed". The gap gives way before the type
   does — a pipeline that has to be squinted at is not a pipeline. */
.l-flow__stages[data-n='4'] { gap: var(--s3); }
.l-flow__stages[data-n='5'] { gap: var(--s2); }
.l-flow__stages[data-n='4'] .l-flow__stage:not(:last-child)::after { right: calc(var(--s3) / -2 - 3px); }
.l-flow__stages[data-n='5'] .l-flow__stage:not(:last-child)::after { right: calc(var(--s2) / -2 - 3px); }
.l-flow__stage { position: relative; display: flex; flex-direction: column; gap: 2px; flex: 1 1 0; min-width: 0; }
.l-flow__stage:not(:last-child)::after {
  content: '';
  position: absolute;
  right: calc(var(--s5) / -2 - 3px);
  top: 50%;
  width: 6px;
  height: 6px;
  border-right: 1.5px solid currentColor;
  border-top: 1.5px solid currentColor;
  transform: translateY(-50%) rotate(45deg);
  opacity: .45;
}
.l-flow__value {
  font-family: var(--font-num);
  font-weight: 700;
  font-size: var(--fs-metric-sm);
  line-height: 1;
  letter-spacing: -.02em;
  font-variant-numeric: tabular-nums;
}
.l-flow__label {
  font-size: var(--fs-micro);
  line-height: 1.15;
  opacity: .78;
  /* A stage name may take two lines; a truncated one stops being a stage. And
     where even one word is wider than its column — "Reviewed" in a five-stage
     pipeline — it breaks rather than pushing the row wider than the card. */
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
  /* `break-word`, not `anywhere`: anywhere lets a flex item shrink below its
     longest word, which bought the sweep a pass and cost the card "Requeste /
     d". A stage whose name will not fit belongs at a wider size instead. */
  overflow-wrap: break-word;
}
/* the directional variant — arrivals in, departures out, transfers across */
.l-flow__stages[data-dir='none'] .l-flow__stage::after { display: none; }
.l-flow__arrow { font-size: var(--fs-label); line-height: 1; opacity: .62; }

/* ══ LAYOUT · attention ═══════════════════════════════════════════════════
   WHAT NEEDS SOMEONE — a count that is the whole point of the card, then the
   named things inside it. The tone lives on the dot, never on the card: a
   module does not turn red because one of its rows is. ════════════════════ */
.l-attn { position: relative; z-index: 2; display: flex; flex: 1 0 0; flex-direction: column; min-height: 0; }
.l-attn__hero { display: flex; align-items: baseline; gap: var(--s2); flex: none; }
.l-attn__value {
  font-family: var(--font-num);
  font-weight: 700;
  font-size: var(--fs-hero-num-sm);
  line-height: 1;
  letter-spacing: -.025em;
  font-variant-numeric: tabular-nums;
  font-variation-settings: 'opsz' 14;
}
.l-attn__label { font-size: var(--fs-label); font-weight: 550; opacity: .78; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
/* THE SPLIT · three figures under the hero, before the named rows.
   Separated from the rows by a hairline rather than by a gap, because it is a
   different KIND of information — a decomposition of the number above it, not
   another item in the list below. */
.l-attn__split {
  display: flex;
  flex: none;
  gap: var(--s5);
  margin-top: var(--s3);
  padding-bottom: var(--s3);
  border-bottom: 1px solid rgba(255, 255, 255, .22);
}
.l-attn__part { display: flex; align-items: baseline; gap: 5px; min-width: 0; }
.l-attn__part-value {
  font-family: var(--font-num);
  font-size: var(--fs-body);
  font-weight: 700;
  font-variant-numeric: tabular-nums;
}
.l-attn__part[data-tone='warn'] .l-attn__part-value { color: var(--c-warn); }
.l-attn__part[data-tone='alert'] .l-attn__part-value { color: var(--c-alert); }
.l-attn__part-label {
  font-size: var(--fs-micro);
  opacity: .74;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.l-attn__items { display: flex; flex-direction: column; gap: var(--s2); flex: 0 1 auto; min-height: 0; margin-top: var(--s3); overflow: hidden; }
.l-attn__item { display: flex; align-items: baseline; gap: var(--s2); min-width: 0; }
.l-attn__dot { flex: none; width: 6px; height: 6px; border-radius: var(--r-pill); background: currentColor; opacity: .55; translate: 0 -2px; }
.l-attn__item[data-tone='warn'] .l-attn__dot { background: var(--c-warn); opacity: 1; }
.l-attn__item[data-tone='alert'] .l-attn__dot { background: var(--c-alert); opacity: 1; }
.l-attn__text { flex: 1 1 auto; font-size: var(--fs-label); opacity: .78; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.l-attn__count {
  flex: none;
  font-family: var(--font-num);
  font-weight: 650;
  font-size: var(--fs-label);
  font-variant-numeric: tabular-nums;
}

/* ══ LAYOUT · meters ══════════════════════════════════════════════════════
   Named rows that each carry their own short track. For quantities where the
   REMAINDER is the story — shelf life, a batch running down — and a bare
   figure would not say whether 18 is comfortable or nearly out. ═══════════ */
.l-meters { position: relative; z-index: 2; display: flex; flex: 1 0 0; flex-direction: column; min-height: 0; }
.l-meters__hero { display: flex; align-items: baseline; gap: var(--s2); flex: none; margin-bottom: var(--s3); }
.l-meters__total {
  font-family: var(--font-num);
  font-weight: 700;
  font-size: var(--fs-metric);
  line-height: 1;
  letter-spacing: -.02em;
  font-variant-numeric: tabular-nums;
}
.l-meters__unit { font-size: var(--fs-label); opacity: .78; }
.l-meters__rows { display: flex; flex-direction: column; gap: var(--s3); flex: 0 1 auto; min-height: 0; overflow: hidden; }
.l-meters__row { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.l-meters__line { display: flex; align-items: baseline; justify-content: space-between; gap: var(--s3); min-width: 0; }
.l-meters__name { flex: 1 1 auto; font-size: var(--fs-label); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.l-meters__val { flex: none; font-size: var(--fs-micro); opacity: .78; font-variant-numeric: tabular-nums; }
.l-meters__track { display: block; width: 100%; height: 4px; border-radius: var(--r-pill); background: rgba(255, 255, 255, .22); overflow: hidden; }
.l-meters__track i { display: block; height: 100%; border-radius: var(--r-pill); background: #FFFFFF; opacity: .85; }
.l-meters__row[data-tone='warn'] .l-meters__track i { background: var(--c-warn); opacity: 1; }
.l-meters__row[data-tone='alert'] .l-meters__track i { background: var(--c-alert); opacity: 1; }

/* ══ LAYOUT · entity ══════════════════════════════════════════════════════
   ONE THING, NAMED — a batch, an animal, a result. Everything else on the
   home page counts; this card points. The module glyph is blown up behind it
   at low opacity so the card has a subject without needing a photograph the
   product may not have for that particular animal. ═══════════════════════ */
.l-entity { position: relative; z-index: 2; display: flex; flex: 1 0 0; flex-direction: column; min-height: 0; }
/* THE WATERMARK IS A CARD LAYER, NOT A COMPOSITION LAYER, and the difference
   matters twice. It is meant to run off the bottom-right corner into the
   card's own padding, which only the card clips — and while it lived inside
   `.l-entity` it made that element 18px taller than its box at every size,
   which is indistinguishable from a real clipping bug to anything measuring
   scrollHeight. Sat beside the composition instead, it bleeds where it should
   and the overflow sweep stays honest. */
.card__mark {
  position: absolute;
  z-index: 1;
  right: -14px;
  bottom: -18px;
  width: 108px;
  height: 108px;
  opacity: .12;
  pointer-events: none;
}
.card__mark img { width: 100%; height: 100%; display: block; }
.l-entity__body { position: relative; z-index: 1; display: flex; flex: 1 1 auto; flex-direction: column; justify-content: center; min-height: 0; }
.l-entity__name {
  font-size: var(--fs-card);
  font-weight: 650;
  line-height: 1.15;
  letter-spacing: -.015em;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.l-entity__meta { margin-top: 2px; font-size: var(--fs-label); opacity: .78; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.l-entity__facts { display: flex; gap: var(--s6); margin-top: var(--s3); min-width: 0; }
.l-entity__fact { display: flex; flex-direction: column; gap: 1px; min-width: 0; }
.l-entity__fact-value { font-family: var(--font-num); font-weight: 700; font-size: var(--fs-body); line-height: 1.1; font-variant-numeric: tabular-nums; }
.l-entity__fact-label { font-size: var(--fs-micro); opacity: .62; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.l-entity__foot {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: var(--s3);
  margin-top: var(--s3);
  padding-top: var(--s3);
  border-top: 1px solid rgba(255, 255, 255, .18);
}
.l-entity__foot-label { font-size: var(--fs-micro); opacity: .62; }
.l-entity__foot-value { font-size: var(--fs-label); font-weight: 600; }

/* ══ LAYOUT · hierarchy ═══════════════════════════════════════════════════
   STRUCTURE, NOT STATISTICS. Sites contain sections contain enclosures, and
   three counts in a row would say none of that. The indent and the elbow
   rules are the information; the figures are incidental to them. ══════════ */
.l-tree { position: relative; z-index: 2; display: flex; flex: 1 0 0; flex-direction: column; min-height: 0; }
.l-tree__levels { display: flex; flex-direction: column; flex: 1 0 0; justify-content: center; gap: var(--s2); min-height: 0; }
.l-tree__level { position: relative; display: flex; align-items: baseline; gap: var(--s2); min-width: 0; }
.l-tree__level[data-depth='1'] { padding-left: var(--s4); }
.l-tree__level[data-depth='2'] { padding-left: var(--s8); }
/* the elbow: down from the row above, then across to this one */
.l-tree__level[data-depth]:not([data-depth='0'])::before {
  content: '';
  position: absolute;
  top: -8px;
  bottom: 50%;
  width: 10px;
  border-left: 1.5px solid currentColor;
  border-bottom: 1.5px solid currentColor;
  border-bottom-left-radius: 5px;
  opacity: .45;
}
.l-tree__level[data-depth='1']::before { left: 4px; }
.l-tree__level[data-depth='2']::before { left: 20px; }
.l-tree__value {
  flex: none;
  font-family: var(--font-num);
  font-weight: 700;
  font-size: var(--fs-body);
  line-height: 1.2;
  font-variant-numeric: tabular-nums;
}
.l-tree__label { flex: 1 1 auto; font-size: var(--fs-label); opacity: .78; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* ══════════════════════════════════════════════════════════════════════════
   FITTING THE COMPOSITIONS TO THE SPACE
   A variation declares the sizes it supports, so no card is asked to draw
   itself somewhere absurd. These handle the widths inside that range.
   ══════════════════════════════════════════════════════════════════════════ */

/* one row tall — 132px of content box under a title line */
.card[data-h='1'] .c-head { margin-bottom: var(--s2); }
.card[data-h='1'] .l-stat__value,
.card[data-h='1'] .l-progress__value { font-size: var(--fs-hero-num-sm); }
.card[data-h='1'] .l-stat__sub { margin-top: var(--s2); }
.card[data-h='1'] .l-metrics__row { gap: var(--s2) var(--s5); flex-wrap: nowrap; }
.card[data-h='1'] .metric { flex: 1 1 0; }
.card[data-h='1'] .metric__value { font-size: var(--fs-metric-sm); }
.card[data-h='1'] .l-queue__rows,
.card[data-h='1'] .l-timeline__items,
.card[data-h='1'] .l-recent__items { gap: var(--s2); }
.card[data-h='1'] .l-progress__track { margin-top: var(--s3); height: 8px; }
/* ONE ROW HOLDS THE RATIO, THE TRACK AND THE CAPTION AND NOT THE FACTS. */
.card[data-h='1'] .l-progress__facts { display: none; }

/* four metrics will not sit in one line on a 2×1 card — 266px of content less
   three gaps leaves 54px a column, and "Recovering" is wider than that */
.card[data-h='1'] .l-metrics__row[data-n='4'] { flex-wrap: wrap; }
.card[data-h='1'] .l-metrics__row[data-n='4'] .metric { flex: 1 1 40%; }

/* THREE STACKED CONTROLS DO NOT FIT 132px. Head plus three 36px pills and
   their gaps comes to 158. Side by side they share the width instead, and the
   label takes a second line rather than an ellipsis — a truncated verb is not
   an action anyone can be sure of. */
.card[data-h='1'] .l-actions__set { flex-direction: row; gap: var(--s2); }
.card[data-h='1'] .l-action {
  flex: 1 1 0;
  justify-content: center;
  text-align: center;
  min-height: 40px;
  padding-inline: var(--s2);
  font-size: var(--fs-micro);
  white-space: normal;
  line-height: 1.15;
}

/* Four status rows stacked come to 146px against the same 132. Two columns
   halves it and leaves the dots aligned, which is what the row is for. */
.card[data-h='1'] .l-status__rows {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: var(--s2) var(--s4);
  align-content: center;
}

/* ── the seven newer compositions in one row ─────────────────────────────
   Same 132px of content box. A dial is the first thing to give up size,
   because it is still legible small and a figure beside it is not. */
.card[data-h='1'] .l-ring__dial { width: 70px; height: 70px; }
.card[data-h='1'] .l-ring__legend { gap: 5px; }
.card[data-h='1'] .l-arc__dial { width: 92px; }
.card[data-h='1'] .l-arc__facts { gap: var(--s2); }
.card[data-h='1'] .l-arc__pct { font-size: var(--fs-metric-sm); }
.card[data-h='1'] .l-flow__value { font-size: var(--fs-body); }
.card[data-h='1'] .l-attn__value { font-size: var(--fs-metric); }
.card[data-h='1'] .l-attn__items { gap: 5px; margin-top: var(--s2); }
/* ONE ROW IS 132px AND THE SPLIT IS THE THIRD THING IN. Hero, split, rows and
   a title do not fit; the split goes, because at 2x1 the card is a summary and
   the named jobs are the part worth keeping. */
.card[data-h='1'] .l-attn__split { display: none; }
.card[data-h='1'] .l-meters__hero { margin-bottom: var(--s2); }
.card[data-h='1'] .l-meters__rows { gap: var(--s2); }
/* ONE ROW LEAVES 124px, AND A FEATURED ENTITY WANTS MORE THAN THAT.
   Name, subtitle, two facts and a footed line come to 168. So at 2×1 the
   card keeps its subject and its figures and gives up the two supporting
   lines — and the variations that HAVE a foot are not offered at 2×1 at all
   (see the catalogue), because a card should not quietly drop content it was
   asked to show. */
.card[data-h='1'] .l-entity__facts { margin-top: var(--s2); gap: var(--s5); }
.card[data-h='1'] .l-entity__fact-value { font-size: var(--fs-label); }
.card[data-h='1'] .l-entity__meta { display: none; }
.card[data-h='1'] .l-entity__foot { margin-top: var(--s2); padding-top: var(--s2); }
.card[data-h='1'] .l-entity__name { font-size: var(--fs-body); }

/* Four metrics in a 2×2 block at 2×1 land 2px over on a four-column screen. */
.card[data-h='1'] .l-metrics__row[data-n='4'] { gap: var(--s1) var(--s4); }
.card[data-h='1'] .l-tree__levels { gap: 5px; }

/* two rows tall — room to breathe under the title */
.card[data-h='2'] .c-head { margin-bottom: var(--s5); }

/* A PIPELINE TURNS THROUGH A RIGHT ANGLE WHEN THE CARD DOES.
   Five stages need width, not height, and a 5×2 card gives both — so the
   horizontal row sat in the middle of 344px of empty gradient looking like a
   mistake. Stacked, the same stages fill the card, the chevrons point down
   the way a pipeline reads, and the labels stop having to survive a 43px
   column. The value column is fixed so the stage names align down one edge. */
.card[data-h='2'] .l-flow__stages {
  flex-direction: column;
  align-items: stretch;
  justify-content: center;
  gap: var(--s5);
}
.card[data-h='2'] .l-flow__stages[data-n='4'],
.card[data-h='2'] .l-flow__stages[data-n='5'] { gap: var(--s5); }
.card[data-h='2'] .l-flow__stage {
  flex: 0 0 auto;
  flex-direction: row;
  align-items: baseline;
  gap: var(--s3);
}
.card[data-h='2'] .l-flow__value { flex: none; min-width: 3.4em; }
.card[data-h='2'] .l-flow__label {
  flex: 1 1 auto;
  font-size: var(--fs-label);
  -webkit-line-clamp: 1;
}
.card[data-h='2'] .l-flow__stage:not(:last-child)::after {
  right: auto;
  left: 7px;
  top: auto;
  bottom: calc(var(--s5) / -2 - 3px);
  transform: translateY(50%) rotate(135deg);
}

/* narrow cards */
@container card (max-width: 300px) {
  .l-door__name { white-space: normal; line-height: 1.18; }
  .c-head__text { font-size: var(--fs-label); }
  .l-metrics__row { gap: var(--s2) var(--s4); }

  /* A queue total set at figure size eats the title's width: "110,020" is
     105px of a 166px line, which left 49px for "Population Overview". The
     total steps down to body size on a narrow card — it is a count, and the
     rows underneath are the content. */
  .l-queue__total { font-size: var(--fs-body); }

  /* A recent item is a name, a kind and a time competing for one line. On a
     narrow card the time drops underneath instead of squeezing the name. */
  .l-recent__item { flex-direction: column; align-items: flex-start; gap: 2px; }
  .l-recent__name { white-space: normal; }

  /* A dial and a legend cannot both have their way on a narrow card. The
     dial shrinks, because it stays readable at 60px and "Under Incubation"
     does not survive being clipped. */
  .l-ring__dial { width: 64px; height: 64px; }
  .l-ring__body { gap: var(--s3); }
  .l-arc__dial { width: 84px; }
  .l-arc__body { gap: var(--s3); }
  .l-flow__stages { gap: var(--s4); }
  .l-flow__stage:not(:last-child)::after { right: calc(var(--s4) / -2 - 3px); }
  .l-flow__value { font-size: var(--fs-body); }
  .card__mark { width: 84px; height: 84px; }
  .l-entity__facts { gap: var(--s5); }
}
@container card (max-width: 145px) {
  .l-door__name { font-size: var(--fs-body); }
}
@container card (max-width: 110px) {
  .l-door__name { font-size: var(--fs-label); }
}

/* wide cards — room for the metrics to spread and the rows to pair up */
@container card (min-width: 520px) {
  .l-metrics__row { gap: var(--s4) var(--s10); }
  .l-queue__rows, .l-timeline__items, .l-recent__items {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: var(--s3) var(--s8);
  }
  .l-actions__set { flex-direction: row; }
  .l-action { flex: 1 1 0; justify-content: center; }
  /* `.l-status__rows` JOINED THIS LIST WHEN THE SITE WORKSPACE ARRIVED.
     Infrastructure Health is the one status card in the product that goes full
     width — six rows down one column of a 960px card, with a third of the card
     empty under them. It is the only variation this can reach: no module status
     card offers more than `large`, which is 374px. */
  .l-ring__legend, .l-attn__items, .l-meters__rows, .l-status__rows {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: var(--s3) var(--s8);
    align-content: center;
  }
  .l-arc__facts { flex-direction: row; gap: var(--s10); }
  .l-arc__fact { flex: 0 1 auto; }
}
</style>
<style>
/* ══ css/edit.css ══ */
/* ══════════════════════════════════════════════════════════════════════════
   EDIT MODULES MODE
   ──────────────────────────────────────────────────────────────────────────
   "Do not overuse borders. Keep the editing controls subtle and clean."

   So edit mode is announced by four things and no chrome: the page desaturates
   very slightly so the cards read as objects rather than destinations, the
   cards take up a continuous jiggle, each removable card grows a remove
   control, and Add Module appears in the header. There is no outline around the
   grid, no toolbar, no banner.

   THE JIGGLE, AND WHY IT IS THIS SMALL. An earlier pass argued against having
   one at all: this product has a header that changes to read "Edit Modules", a
   Done button and remove controls, so the state is already legible. That was
   true and still missed the point — those all say "the PAGE is in edit mode",
   and the jiggle is the only one that says "THIS CARD is the thing you can
   move". It is the affordance, not the announcement.

   The amplitude is the whole argument. Nothing here exceeds 0.75° of rotation
   or 0.6px of travel, which is under what the eye resolves as motion on a
   stationary object and over what it resolves as life. Push it to the 3° and
   5px that a naive "shake" keyframe uses and a command centre looks broken —
   the cards read as malfunctioning rather than as editable.

   Three keyframe sets, not one, and a per-card delay computed from the card's
   uid in ModuleGrid.js. Fourteen cards on one synchronised animation is not
   fourteen jiggling cards, it is one jiggling grid, and it looks like the page
   is vibrating.

   THE BATTERY OBJECTION IS REAL and is answered rather than dismissed: only
   `transform` is animated, so the whole thing lives on the compositor and never
   touches layout or paint; it runs only inside edit mode, which is transient;
   `prefers-reduced-motion` stops it via the global block; and it is paused
   outright when the tab is hidden — see `body.is-hidden`.
   ══════════════════════════════════════════════════════════════════════════ */

body.is-editing .updates,
body.is-editing .search {
  opacity: .5;
  filter: saturate(.72);
  pointer-events: none;
  transition: opacity var(--t-base) var(--ease), filter var(--t-base) var(--ease);
}

.updates, .search {
  transition: opacity var(--t-base) var(--ease), filter var(--t-base) var(--ease);
}

/* TWO THINGS HERE ARE LOAD-BEARING, and were load-bearing for the one-shot
   settle this replaced. It runs on the CARD, not the slot, because the slot's
   transform belongs to the FLIP reflow — an animation on the same property
   would win the cascade and cards would stop animating to their new positions.
   And it has NO fill mode: `both` or `forwards` would latch the final keyframe
   on forever, permanently overriding any transform set later from script. */
body.is-editing .slot > .card {
  animation: jiggle-a var(--jiggle-dur, 1.9s) ease-in-out infinite;
  animation-delay: var(--jiggle-delay, 0ms);
  will-change: transform;
}
body.is-editing .slot[data-jiggle='b'] > .card { animation-name: jiggle-b; }
body.is-editing .slot[data-jiggle='c'] > .card { animation-name: jiggle-c; }

/* The card being dragged must not jiggle — the proxy follows the pointer and a
   second transform underneath it would fight the drag. The source slot is
   invisible during a drag anyway, but stopping it here means the transform is
   released cleanly rather than being overridden. */
body.is-editing .slot.is-source > .card,
body.is-editing .slot.is-grabbed > .card { animation: none; }

/* Paused rather than stopped when the tab goes away: `paused` keeps the
   compositor from doing any work at all, and resuming picks up mid-cycle so
   coming back to the tab does not re-synchronise every card into one beat. */
body.is-hidden .slot > .card { animation-play-state: paused; }

/* Three phases of the same tiny idea, offset from each other so no two cards
   are ever at the same point in the same shape. Rotation does most of the work
   — a pure translate reads as sliding, and a pure rotate as pivoting; together
   at this amplitude they read as "held loosely". */
@keyframes jiggle-a {
  0%   { transform: rotate(-.62deg) translate(0, .18px); }
  25%  { transform: rotate(.34deg)  translate(.22px, -.30px); }
  50%  { transform: rotate(.60deg)  translate(0, .26px); }
  75%  { transform: rotate(-.30deg) translate(-.22px, -.18px); }
  100% { transform: rotate(-.62deg) translate(0, .18px); }
}
@keyframes jiggle-b {
  0%   { transform: rotate(.55deg)  translate(.18px, -.22px); }
  25%  { transform: rotate(-.40deg) translate(0, .30px); }
  50%  { transform: rotate(-.70deg) translate(-.20px, -.14px); }
  75%  { transform: rotate(.36deg)  translate(.16px, .24px); }
  100% { transform: rotate(.55deg)  translate(.18px, -.22px); }
}
@keyframes jiggle-c {
  0%   { transform: rotate(-.44deg) translate(.20px, .24px); }
  25%  { transform: rotate(.58deg)  translate(-.16px, -.20px); }
  50%  { transform: rotate(.30deg)  translate(.14px, .28px); }
  75%  { transform: rotate(-.66deg) translate(-.18px, -.12px); }
  100% { transform: rotate(-.44deg) translate(.20px, .24px); }
}

body.is-editing .card { cursor: grab; }
body.is-editing .card:active { cursor: grabbing; transform: none; }

/* In edit mode a card must not respond to a pointer as if it were a link —
   it is a thing being moved, and the lift belongs to the drag proxy. */
body.is-editing .card:hover { transform: none; box-shadow: var(--e1); }

/* THE TOUCH-ACTION PROBLEM, AND WHY IT IS SOLVED IN TWO PLACES.
   `touch-action: none` on the cards would make dragging reliable and make the
   page impossible to scroll on an iPad — the grid is taller than the screen, so
   a finger landing on a card and swiping up must still scroll. But leaving
   scrolling on means Safari can begin one before we know a drag was intended,
   and once a scroll has started nothing cancels it.

   The resolution is the long press. A finger that has been still for 200ms is a
   finger that is not scrolling, so at that moment it is safe to take the
   gesture: the body switches to `touch-action: none` AND a non-passive
   `touchmove` handler starts calling preventDefault. Before that moment the
   page scrolls normally. */
body.is-editing .slot { touch-action: manipulation; }
body.is-dragging,
body.is-dragging .slot { touch-action: none; }
body.is-dragging { -webkit-user-select: none; user-select: none; cursor: grabbing; }

/* ── remove control ───────────────────────────────────────────────────────
   A minus, not a cross. A cross says "close"; a minus says "take this one
   away", which is what it does — and it is what a user coming off iPadOS
   already reads. Sits half outside the card corner so it never covers content,
   with an invisible 44px hit area so a thumb can find it. */
.slot__remove {
  position: absolute;
  top: -9px;
  left: -9px;
  z-index: 6;
  display: grid;
  place-items: center;
  width: 28px;
  height: 28px;
  padding: 0;
  border: 2px solid var(--canvas-2);
  border-radius: var(--r-pill);
  background: var(--ink);
  color: #fff;
  cursor: pointer;
  box-shadow: 0 2px 8px rgba(16, 55, 63, .3);
  animation: pop-in var(--t-base) var(--ease-out) both;
}
.slot__remove::before {
  /* the real touch target, larger than the visible button */
  content: '';
  position: absolute;
  inset: -8px;
  border-radius: inherit;
}
.slot__remove .icon { width: 16px; height: 16px; }
.slot__remove:hover { background: var(--clay); }
.slot__remove:active { transform: scale(.9); }

@keyframes pop-in {
  from { opacity: 0; transform: scale(.4); }
  to   { opacity: 1; transform: scale(1); }
}

/* A core card cannot be removed, and says so with a lock rather than with a
   disabled minus — a greyed-out button invites a tap that will do nothing. */
.slot__locked {
  position: absolute;
  top: -9px;
  left: -9px;
  z-index: 6;
  display: grid;
  place-items: center;
  width: 28px;
  height: 28px;
  border-radius: var(--r-pill);
  border: 2px solid var(--canvas-2);
  background: var(--petrol-200);
  color: var(--petrol-800);
  animation: pop-in var(--t-base) var(--ease-out) both;
}
.slot__locked .icon { width: 14px; height: 14px; }

/* A card being carried should not also be showing its remove button. */
.slot.is-source .slot__remove,
.slot.is-source .slot__locked { display: none; }

/* ── the add tile ─────────────────────────────────────────────────────────
   Lives in the grid as the last item so it is always where the next card will
   land, rather than in a fixed bar the user has to look away to find. */

/* ── keyboard reordering ──────────────────────────────────────────────────
   A card picked up with the keyboard gets the same lift the pointer gives it,
   because the two interactions should not look like different features. */
.slot.is-grabbed .card {
  box-shadow: var(--e-drag);
  transform: scale(1.03);
  transition: transform var(--t-base) var(--ease-out), box-shadow var(--t-base) var(--ease);
}

/* A live region has to be in the document to be announced, and out of the way
   to not be laid out. */
.a11y-live {
  position: absolute;
  width: 1px; height: 1px;
  margin: -1px; padding: 0;
  overflow: hidden;
  clip: rect(0 0 0 0);
  white-space: nowrap;
}

/* ── edit-mode hint ───────────────────────────────────────────────────────*/
.edit-hint {
  display: flex;
  align-items: center;
  gap: var(--s2);
  margin: calc(var(--s3) * -1) 0 var(--s4);
  font-size: var(--fs-label);
  color: var(--ink-3);
  animation: pop-in var(--t-base) var(--ease-out) both;
}
.edit-hint .icon { width: 15px; height: 15px; color: var(--ink-4); }


/* ── resize control ───────────────────────────────────────────────────────
   Bottom-right, diagonally opposite the remove control, so the two can never
   be confused by a thumb. Same visual weight as remove — neither is the
   primary action in edit mode; dragging is. */
.slot__resize {
  position: absolute;
  right: -9px;
  bottom: -9px;
  z-index: 6;
  display: grid;
  place-items: center;
  width: 28px;
  height: 28px;
  padding: 0;
  border: 2px solid var(--canvas-2);
  border-radius: var(--r-pill);
  background: var(--petrol-600);
  color: #fff;
  cursor: pointer;
  box-shadow: 0 2px 8px rgba(16, 55, 63, .3);
  animation: pop-in var(--t-base) var(--ease-out) both;
}
.slot__resize::before { content: ''; position: absolute; inset: -8px; border-radius: inherit; }
.slot__resize .icon { width: 14px; height: 14px; }
.slot__resize:hover { background: var(--petrol-800); }
.slot__resize:active { transform: scale(.9); }
.slot.is-source .slot__resize { display: none; }

/* the popover it opens */
.size-pop {
  position: fixed;
  z-index: calc(var(--z-drag) + 10);
  padding: var(--s4);
  border-radius: 18px;
  background: rgba(255, 255, 255, .94);
  box-shadow: var(--e2), 0 24px 56px -18px rgba(16, 55, 63, .34);
  -webkit-backdrop-filter: blur(14px) saturate(1.1);
  backdrop-filter: blur(14px) saturate(1.1);
  opacity: 0;
  transform: translateY(-6px) scale(.97);
  transform-origin: top center;
  transition: opacity var(--t-fast) var(--ease-out), transform var(--t-fast) var(--ease-out);
}
.size-pop.is-open { opacity: 1; transform: translateY(0) scale(1); }
.size-pop[hidden] { display: none !important; }
.size-pop .size-picker__row { flex-wrap: nowrap; }
</style>
<style>
/* ══ css/profile-menu.css ══ */
/* ══════════════════════════════════════════════════════════════════════════
   THE PROFILE MENU
   A popover under the avatar, holding everything the user can do to their own
   home page. Positioned in JS because it hangs off an element in a flex row
   whose position depends on the greeting's length; styled here.
   ══════════════════════════════════════════════════════════════════════════ */

/* The click-outside layer. Transparent, full-page, and only present while the
   menu is — see the note in ProfileMenu.js for why this is a layer and not a
   document listener. */
.pmenu-catcher { position: fixed; inset: 0; z-index: calc(var(--z-sheet) - 1); }
.pmenu-catcher[hidden] { display: none; }

.pmenu {
  position: fixed;
  z-index: var(--z-sheet);
  width: min(304px, calc(100vw - 24px));
  padding: var(--s2);
  /* The cap itself is set in JS from the space under the anchor — see
     capToViewport() — and this is the promise that a menu taller than that
     scrolls rather than running off the bottom edge. It matters for the profile
     menu now: four items on the home page, eighteen on a Site. */
  overflow-y: auto;
  overscroll-behavior: contain;
  scrollbar-width: thin;
  border-radius: 18px;

   reason this screen was rebuilt.

   into the stacked arrangement — the rail filling the sheet, then sliding away
   to reveal the widgets. A 768, 810, 820 or 834pt portrait tablet has ample
   room for two columns; it was being given a phone's layout because the
   breakpoint was set by the OTHER thing that changes at 1024 (the sheet
   becoming a floating panel), and the two were written as one block. They are

/* ══════════════════════════════════════════════════════════════════════════

   The workspace switcher, the Site header, and the two card compositions the

/* ══ 1 · the workspace switcher ══════════════════════════════════════════ */

/* NO MARGIN BELOW. `.main-frame` already opens with the artboard's 32px of page
   padding, and the twenty this used to add on top of it made the gap before the
   hero 52 — the largest space on the page, sitting under its least important
   control. The space moved above the switcher instead, where it was missing. */

   The search field, the hero and the grid are all 960 inside the artboard's
   32px page padding; the switcher row had no `padding-inline`, so the pill ran
   the full 1024 and hung 32px past both edges of the field directly above it.
   Two full-width controls that do not share an edge read as a mistake even
   when nobody can say which one is wrong. */

   a smaller gap than the artboard's 32 — 20 above, 20 below. The vertical budget
   is real: on a 1024x768 tablet the status bar, this row, the greeting, the
   search field and the Site header all sit above the first card.

   `position: relative; z-index: 1` because the header planting is a POSITIONED
   element at z-index 0, and a positioned element paints above an unpositioned
   in-flow sibling whatever the source order says — without this the foliage
   would lie over the top of the switcher. */
.wswitch-row {

  z-index: 1;
  margin-bottom: 0;

.wswitch {

   surface that slides says "one control with a position", which is what a
   segmented switch is. It is also why the transform is on a pseudo-free
   element rather than on a `left` — a transform does not lay out. */
.wswitch__plate {

  z-index: 0;
