    const i = rows.findIndex((r) => r.dataset.module === activeId)
    const next = rows[(i + step + rows.length) % rows.length]
    if (!next) return
    selectModule(next.dataset.module)
    next.focus()
  })

  /* ── the detail · one module's widgets, grouped by purpose ───────────── */

  function renderDetail() {
    body.replaceChildren()
    const mod = src.getGroup(activeId)
    if (!mod) { body.append(emptyState()); return }

    /* On a phone the two panes are stacked, so the detail needs its own way
       back to the rail. On desktop the rail is right there and this is hidden
       by the stylesheet rather than by a second code path. */
    const back = document.createElement('button')
    back.type = 'button'
    back.className = 'detail-back'
    back.innerHTML = `${icon('chev-left')}<span>${esc(src.backLabel)}</span>`
    back.addEventListener('click', () => {
      detailOpen = false
      sheet.classList.remove('is-detail')
      rail.querySelector(`[data-module="${activeId}"]`)?.focus()
    })

    const head = document.createElement('div')
    head.className = 'detail-head'
    head.innerHTML =
      groupTile(mod, 'detail-head__icon') +
      `<span class="detail-head__text">` +
        `<span class="detail-head__name">${esc(mod.name)}</span>` +
        `<span class="detail-head__blurb">${esc(mod.blurb)}</span>` +
      `</span>`

    body.append(back, head)

    /* ONE SHELF, NOT FIVE SECTIONS.
       An earlier pass grouped these under NAVIGATE / UNDERSTAND / ATTENTION /
       ACT / MONITOR headings with a line of copy on each. It was a taxonomy the
       user had to read before they could look at anything, and the widgets are
       the point. The purposes still ORDER the shelf — door first, then the
       figures, then what is waiting, then what you can do, then what just
       happened — they just no longer announce themselves. */
    const variants = src.variantsFor(mod.id).filter((v) => matches(v.id))
    if (!variants.length) { body.append(emptyState()); return }

    const row = document.createElement('div')
    row.className = 'widget-row'
    for (const v of variants) row.append(widgetTile(v))
    body.append(row)
  }

  /**
   * Are the rail and the gallery side by side, or stacked one over the other?
   *
   * THE STYLESHEET DECIDES AND THIS ASKS. It is the same arrangement as
   * `currentColumns()` in sizes.js, and for the same reason: there was a
   * hard-coded `innerWidth >= 1024` here and a `@media (min-width: 1024px)`
   * there, and when the CSS breakpoint moved to 768 this would have gone on
   * believing every iPad in portrait was stacked. One definition, in the place
   * that owns it.
   */
  function isSplit() {
    return getComputedStyle(document.documentElement)
      .getPropertyValue('--picker-split').trim() === '1'
  }

  /* Wider viewports afford larger previews; these keep a Full Width card
     readable beside a Small one rather than shrinking it to a smear. */
  function previewBounds() {
    const w = window.innerWidth
    return w >= 1200 ? { maxWidth: 300, maxHeight: 218 }
      : w >= 768 ? { maxWidth: 272, maxHeight: 198 }
      : { maxWidth: 236, maxHeight: 172 }
  }

  function widgetTile(v) {
    const btn = document.createElement('button')
    btn.type = 'button'
    btn.className = 'widget'
    btn.dataset.variant = v.id
    const isOn = selected.has(v.id)
    btn.setAttribute('aria-pressed', String(isOn))
    if (isOn && v.id === sizing) btn.classList.add('is-sizing')

    /* The size the basket is holding for this card, so scrolling away and back
       shows the choice rather than resetting it. */
    const size = isOn ? selected.get(v.id) : v.defaultSize
    const stage = renderPreview(v, size, previewBounds())
    stage.classList.add('widget__stage-wrap')

    /* The tick lives on the stage, not the button, so it pins to the corner of
       the CARD rather than to the corner of the tile's padding box — which is
       where the eye expects it and where a Full Width preview's very different
       proportions would otherwise leave it stranded. */
    const check = document.createElement('span')
    check.className = 'widget__check'
    check.setAttribute('aria-hidden', 'true')
    check.innerHTML = icon('check')
    stage.append(check)

    btn.append(stage)

    /* The name, and nothing else. The description and the size count were
       three lines of prose under a picture that already says what the widget
       is — and with 3 to 6 widgets a module, that prose was most of the pane.
       The sizes are still on the footer's selector, where they are a choice
       rather than a fact to read. */
    const meta = document.createElement('span')
    meta.className = 'widget__meta'
    meta.innerHTML = `<span class="widget__name">${esc(v.name)}</span>`
    btn.append(meta)
    btn.addEventListener('click', () => toggleVariant(v))
    return btn
  }

  function emptyState() {
    const el = document.createElement('div')
    el.className = 'sheet-empty'
    el.innerHTML =
      `<span class="sheet-empty__icon">${icon('search')}</span>` +
      `<span class="sheet-empty__title">Nothing matches &ldquo;${esc(searchInput.value)}&rdquo;</span>` +
      `<span class="sheet-empty__note">${esc(src.emptyHint)}</span>`
    return el
  }

  /* ── selection ──────────────────────────────────────────────────────── */

  function variantById(id) {
    return src.variants.find((v) => v.id === id) || null
  }

  /**
   * A group's coloured tile. Modules wear an SVG exported from Figma; domains
   * wear a symbol from the sprite — see glyph() in ModuleCard.js, which makes
   * the same distinction for the same reason. One helper so the rail row and
   * the detail header cannot disagree about it.
   */
  function groupTile(g, cls) {
    const inner = g.sprite
      ? icon(g.sprite, 'glyph')
      : `<img src="assets/icon/${esc(g.icon)}" alt="" aria-hidden="true">`
    return `<span class="${cls}${g.sprite ? ' is-sprite' : ''}" ` +
           `style="background:var(${esc(g.gradient)})">${inner}</span>`
  }

  /** Toggle a widget in and out of the basket. */
  function toggleVariant(v) {
    if (selected.has(v.id)) {
      selected.delete(v.id)
      /* The size control cannot go on editing a card that is no longer in the
         basket — hand it to whatever is still there, newest first. */
      if (sizing === v.id) sizing = lastKey()
    } else {
      selected.set(v.id, v.defaultSize)
      sizing = v.id
    }
    syncSelectionUI()
  }

  /** The most recently added key, or null — Maps have no `last()`. */
  function lastKey() {
    let out = null
    for (const k of selected.keys()) out = k
    return out
  }

       on it cannot also be scrolled. */

/**
 * SIZE POPOVER
 * ───────────────────────────────────────────────────────────────────────────
 * Changes the size of a card that is ALREADY on the home page.
 *
 * WHY THIS EXISTS. The add flow ends with a size choice, so every card arrives
 * at a size the user picked. But a layout is not chosen once — it is tuned. A
 * curator who put Follow Up on as a Tall card and finds it dominating the grid
 * should be able to make it Medium, and without this the only route is to
 * remove the card and add it again from the picker, which is four taps to
 * change one number.

 * terms as in the picker: only the sizes the variant declares, never more.

const { createSizeSelector } = __req('js/components/ModuleSizeSelector.js');

  const el = document.createElement('div')
  el.className = 'size-pop'
  el.setAttribute('role', 'dialog')
  el.setAttribute('aria-label', 'Card size')
  el.hidden = true

  const selector = createSizeSelector({
    onChange(size) {
      if (current) onResize?.(current.uid, size)

  })

  document.body.append(el)

  let current = null
  let returnFocusTo = null

  function open(uid, size, anchor) {
    const slot = anchor
    const variant = getVariant(slot?.dataset.variant)
    if (!variant || variant.supportedSizes.length < 2) return

    current = { uid }
    returnFocusTo = document.activeElement
    selector.render(variant.supportedSizes, size)

    el.hidden = false
    place(slot)
    requestAnimationFrame(() => el.classList.add('is-open'))

    document.addEventListener('pointerdown', onOutside, true)
    document.addEventListener('keydown', onKey, true)

    /* `preventScroll`, and armed a frame late. Both matter.
       Moving focus into the popover can scroll the option into view, and the
       scroll-to-close listener below cannot tell that scroll from the user's —
       so without these two the popover closed itself in the same frame it
       opened, and choosing a size silently did nothing. */

       floating over an unrelated part of the grid, still claiming to be about
       a card it has drifted away from. Closing is the honest response —
       re-anchoring every frame would fight momentum scrolling on a tablet. */

      window.addEventListener('resize', close)

   * the element is visible, because a hidden element has no dimensions to
   * clamp against — the classic reason a popover ends up half off-screen.

    let top = r.bottom + 8
    if (top + h > window.innerHeight - margin) top = Math.max(margin, r.top - h - 8)

    el.style.left = `${Math.round(left)}px`
    el.style.top = `${Math.round(top)}px`

    if (el.hidden) return
    el.classList.remove('is-open')
    current = null
    document.removeEventListener('pointerdown', onOutside, true)
    document.removeEventListener('keydown', onKey, true)
    window.removeEventListener('scroll', close)
    window.removeEventListener('resize', close)

 * things that are theirs rather than the organisation's — their account, their
 * preferences, and their home page is one of those.

/**
 * THE WORKSPACE SWITCHER
 * ───────────────────────────────────────────────────────────────────────────
 * Two destinations, one control: Module Selection, and the Site Command Centre.
 *
 * ═══ WHY A SEGMENT UNDER THE SEARCH FIELD ══════════════════════════════════
 *
 * Three places were on the table and two of them break something.
 *
 *   A LEFT RAIL. It scales to a third and fourth workspace, and it costs
 *   72-88px of a 960px content width permanently. That width is not a
 *   preference — every card on this product is measured from it: 179.2px
 *   columns are (960 - 4x16) / 5 exactly, and the whole Figma artboard falls
 *   out of that arithmetic. A rail would have made every card the wrong size
 *   on the one page whose fidelity is measured in units.
 *
 *   TABS ON THE GREETING LINE. Free vertically, and that row already carries a
 *   two-line greeting plus three 44px controls. At 834px portrait it wraps, and
 *   what wraps is the switcher.
 *
 *   A SEGMENT BETWEEN SEARCH AND CONTENT. Costs about 60px once, sits exactly
 *   where the eye is already travelling on its way from the search field to the
 *   first card, and reads as what it is — two ways of looking at the same work,
 *   rather than a navigation to somewhere else.
 *
 * ═══ A TABLIST, AND ACTUALLY A TABLIST ═════════════════════════════════════
 *
 * Left and Right move between the two; the inactive tab is not a tab stop, so
 * Tab passes over the pair as one control. Both panels stay in the DOM and are
 * toggled with `hidden`, which is what makes the switch instant and what lets a
 * user come back to the scroll position they left.

 * Subject identity, and the way out of it. One component for all three levels of

 *
 * ═══ THREE LEVELS, ONE COMPONENT, AND WHY THAT IS NOT A COMPROMISE ═════════
 *
 * A Section header could have been its own component. It would have been the
 * third copy of a breadcrumb, a status pill, a sibling menu, a role chip and a
 * counts strip — and the fourth place to fix the next bug in any of them. What
 * actually differs between the levels is DATA:

 *

 * tight rows, about 150px, and the breadcrumb absorbs the extra depth rather

 *

       Enclosure its own, and offering "Medical" on an enclosure would be
       offering a card that cannot be built. The listing has no workspace at
       all, so it is out for the same reason Customize is. */
    modBtn.hidden = sub.level !== 'site'

    /* THE BREADCRUMB CARRIES THE DEPTH so the header does not have to grow a
       row per level. Every crumb but the last is a button; the last is the
       subject and is not a link to itself. */
    crumbEl.replaceChildren()
    sub.crumbs.forEach((c) => {
      const b = document.createElement('button')
      b.type = 'button'
      b.className = 'crumb__link'
      b.textContent = c.label
      b.addEventListener('click', c.go)
      crumbEl.append(b, sep())
    })
    const here = document.createElement('span')
    here.className = 'crumb__here'
    here.textContent = sub.here
    crumbEl.append(here)

    /* The kind sits before the name at the deeper levels — "CAR-02" before
       "Bengal Tiger" — because the code is how a keeper refers to the place and
       the species is what is in it. At the Site level the name is the whole
       identity and the label would be noise. */
    kindEl.textContent = sub.level === 'site' || sub.listing ? '' : sub.kind
    kindEl.hidden = sub.level === 'site' || !!sub.listing

    /* The name sits in a BUTTON at every level but this one, because at every
       level but this one it opens the siblings. Swapping the element would mean
       two render paths; disabling it is one line and keeps the type identical. */
    nameEl.textContent = sub.name

    metaEl.replaceChildren()
    if (!sub.listing) metaEl.append(pill(sub.status, sub.statusLabel))
    sub.meta.filter(Boolean).forEach((m, i) => {
      if (i || !sub.listing) metaEl.append(dot())
      metaEl.append(text(m))
    })

    statsEl.replaceChildren()
    for (const stat of sub.stats) {
      if (stat.value == null) continue
      const btn = document.createElement('button')
      btn.type = 'button'
      btn.className = 'site-stat'
      btn.innerHTML =
        `<span class="site-stat__value">${esc(stat.value)}</span>` +
        `<span class="site-stat__label">${esc(stat.label)}</span>`
      /* A COUNT WITHOUT A DESTINATION IS NOT A BUTTON. On the listing the four
         figures are the size of the estate and there is nowhere for "31
         Sections" to go — every one of those sections is in a different Site.
         Rendering it as a dead button would be the page offering an action it
         cannot perform. */
      if (stat.go) btn.addEventListener('click', stat.go)
      else { btn.disabled = true; btn.classList.add('site-stat--flat') }
      statsEl.append(btn)
    }

    /* LAST SYNCED IS CHROME, NOT A STATISTIC. It answers "can I trust this
       page", not "how big is this thing", so it sits at the end of the strip in
       the quiet style rather than beside the counts. */
    const sync = document.createElement('span')
    sync.className = 'site-sync'
    sync.innerHTML = `${icon('refresh', 'icon')}<span>Synced ${esc(sub.synced)}</span>`
    statsEl.append(sync)
  }

  function sep() {
    const s = document.createElement('span')
    s.className = 'crumb__sep'
    s.setAttribute('aria-hidden', 'true')
    s.textContent = '/'
    return s
  }
  function dot() {
    const s = document.createElement('span')
    s.className = 'site-head__dot'
    s.setAttribute('aria-hidden', 'true')
    s.textContent = '·'
    return s
  }
  function text(t) {
    const s = document.createElement('span')
    s.textContent = t
    return s
  }
  /* A STATUS PILL CARRIES ITS COLOUR IN THE DOT, NOT IN THE PILL. A fully tinted
     amber pill beside a subject's name would make "Needs Attention" the loudest
     thing on a page whose loudest thing is supposed to be the Needs Attention
     widget. */
  function pill(state, label) {
    const s = document.createElement('span')
    s.className = 'site-pill'
    s.dataset.state = state
    s.innerHTML = `<i></i><span>${esc(label)}</span>`
    return s
  }

  render()
  return {
    render,
    /* The modules menu ticks what is on the grid, and a widget can be removed
       from the grid while the menu is open. */
    refreshModules() { modulesMenu.refresh() },
    openModules() { modulesMenu.open() },
    /* Escape means "close this" while either menu is open, and "go up a level"
       only when neither is. Asked here because this is the only place that
       holds both. */
    get menuOpen() { return sibMenu.isOpen || modulesMenu.isOpen },
    closeMenus() { sibMenu.close(); modulesMenu.close() },
  }
}

function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, (c) => (
    { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]
  ))
}
  __x.createWorkspaceHeader = createWorkspaceHeader;
});

__def('js/components/SitesList.js', function (__x, __req) {
/**
 * HOUSING → SITES
 * ───────────────────────────────────────────────────────────────────────────
 * The listing between the home page and a Site Workspace. Its whole job is one
 * decision — WHICH SITE AM I WORKING IN THIS MORNING — and everything on it is
 * either an input to that decision or a way of acting on it.
 *
 * ═══ WHY THIS IS A LIST AND NOT A GRID OF CARDS ════════════════════════════
 *
 * Four Sites shown as four cards is four things read one at a time. The
 * question here is comparative — which of these needs me most — and a
 * comparison wants its values in COLUMNS, so that 41 staff under 147 animals
 * reads against 104 staff under 604 without the reader holding either in their
 * head. That is a table, and the product's own brief says so: use a table when
 * the information needs multiple columns or comparisons.
 *
 * It is not an HTML <table>, because each row is a single tap target that has
 * to reflow into a stack on a narrow tablet, and a table cannot do either.
 * It is a list of buttons laid out on a grid, which is the same information
 * with the tablet behaviour the brief asks for.
 *
 * ═══ RANKED BY WHAT IS OPEN, NOT ALPHABETICALLY ════════════════════════════
 *
 * A list in name order makes the reader do the comparison the page exists to
 * have already done. Mysuru is first because nineteen things are open on it
 * against Bannerghatta's twelve, on half the staff. Nothing here is a score:
 * the ordering is a real count of real open items, and the rows underneath
 * each figure say what those items are.
 *
 * ═══ AND NO SITE HEALTH ════════════════════════════════════════════════════
 *
 * There is no index, no percentage and no band. An overall figure is a number
 * you cannot act on and cannot check, and it hides the only thing that makes
 * two Sites different — Zoo Core's five open items are maintenance and
 * approvals, Mysuru's nineteen are assets and safety. Those go in different
 * directions on a Monday morning.
 */

const { icon } = __req('js/icons.js');
const { SITES } = __req('js/data/sites.js');

const STATUS_LABEL = {
  operational: 'Operational',
  attention: 'Needs Attention',
  commissioning: 'Commissioning',
  closed: 'Closed',
}

/* The listing's own view of a Site record. Everything the row draws comes out
   of here, so the row template has no arithmetic in it. */
function readSite(site) {
  const c = site.counts
  const items = site.openItems || []
  return {
    id: site.id,
    name: site.name,
    code: site.code,
    type: site.type,
    inCharge: site.inCharge,
    location: site.location,
    area: site.area,
    status: site.status,
    statusLabel: site.statusLabel || STATUS_LABEL[site.status] || site.status,
    synced: site.synced,
    open: site.attention,
    openLabel: site.attentionLabel || 'Open',
    /* TWO, AND THE WORST TWO. A row carrying all five open items stops being a
       row. These are already authored worst-first on the record. */
    items: items.slice(0, 2),
    more: Math.max(0, items.length - 2),
    figures: [
      { value: c.sections,   label: 'Sections' },
      { value: c.enclosures, label: 'Enclosures' },
      { value: c.staff,      label: 'Staff' },
      { value: c.animals,    label: 'Animals' },
    ],
  }
}

function esc(v) {
  return String(v ?? '').replace(/[&<>"']/g, (ch) => (
    { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]
  ))
}

/**
 * @param {object} opts {root, getState, onOpen}
 */
function createSitesList({ root, getState, onOpen }) {
  root.className = 'sites'
  root.innerHTML =
    `<div class="section-head sites-head">` +
      `<h2 class="section-head__title">Sites</h2>` +
      `<p class="sites-head__note">Ranked by what is open</p>` +
    `</div>` +
    `<ul class="sites-list" data-list></ul>`

  const listEl = root.querySelector('[data-list]')

  function render() {
    const current = getState().siteId
    const rows = SITES.map(readSite).sort((a, b) => b.open - a.open)

    listEl.replaceChildren()
    for (const site of rows) {
      const li = document.createElement('li')
      const btn = document.createElement('button')
      btn.type = 'button'
      btn.className = 'site-row'
      btn.dataset.site = site.id
      btn.dataset.state = site.status
      /* WHERE YOU WERE LAST IS MARKED, NOT SORTED TO THE TOP. Moving the row a
         reader is used to seeing in third place would break the one thing a
         ranked list promises. */
      if (site.id === current) btn.dataset.current = 'true'

      btn.innerHTML =
        `<span class="site-row__id">` +
          `<span class="site-row__title">` +
            `<span class="site-row__name">${esc(site.name)}</span>` +
            (site.id === current
              ? `<span class="site-row__last">Last opened</span>` : '') +
          `</span>` +
          /* TWO META LINES, AND WHAT THEY SPLIT ON IS WHAT THE SITE IS
             against WHO AND WHERE IT IS. Four facts on one line wrapped
             mid-phrase at every width the row is ever drawn at. */
          `<span class="site-row__meta">` +
            `<span class="site-row__code">${esc(site.code)}</span>` +
            `<span>${esc(site.type)}</span>` +
          `</span>` +
          /* NO LOCATION. It was the obvious third fact and it disambiguates
             nothing: the two Sites a reader could confuse are both at
             "Bannerghatta, Bengaluru South", and what tells them apart is
             Safari against Zoo Core, which is already the name. What the row
             needed instead was for the line to fit. */
          `<span class="site-row__where">` +
            `${esc(site.inCharge)} · Site In-charge · ${esc(site.area)}</span>` +
        `</span>` +

        `<span class="site-row__figs">` +
        site.figures.map((f) =>
          `<span class="site-fig">` +
            `<span class="site-fig__value">${esc(f.value)}</span>` +
            `<span class="site-fig__label">${esc(f.label)}</span>` +
          `</span>`).join('') +
        `</span>` +

        `<span class="site-row__open">` +
          `<span class="site-pill" data-state="${esc(site.status)}">` +
            `<i></i><span>${esc(site.statusLabel)}</span></span>` +
          (site.open
            ? `<span class="site-row__count">` +
                `<b>${esc(site.open)}</b> ${esc(site.openLabel)}</span>` +
              `<span class="site-row__items">` +
              site.items.map((i) =>
                `<span class="site-row__item" data-tone="${esc(i.tone || 'warn')}">` +
                  `<i></i><span>${esc(i.text)}</span>` +
                  (i.value ? `<b>${esc(i.value)}</b>` : '') +
                `</span>`).join('') +
              (site.more ? `<span class="site-row__more">+${site.more} more</span>` : '') +
              `</span>`
            /* §38 · A SITE WITH NOTHING OPEN SAYS SO IN WORDS. "0 Open" is a
               figure the reader has to interpret; "Nothing open" is the
               answer. */
            : `<span class="site-row__clear">Nothing open</span>`) +
        `</span>` +

        `<span class="site-row__go" aria-hidden="true">${icon('chev-right', 'icon')}</span>`

      btn.setAttribute('aria-label',
        `${site.name}. ${site.statusLabel}. ${site.open} open. ` +
        site.figures.map((f) => `${f.value} ${f.label}`).join(', ') +
        '. Open this Site.')

      btn.addEventListener('click', () => onOpen?.(site.id))
      li.append(btn)
      listEl.append(li)
    }
  }

  render()
  return { render }
}
  __x.createSitesList = createSitesList;
});

__def('js/components/WidgetDetail.js', function (__x, __req) {
/**
 * THE WIDGET, OPENED
 * ───────────────────────────────────────────────────────────────────────────
 * A widget is a summary. This is the record it summarised — the whole of what
 * the operation keeps for that dimension of this Site, Section or enclosure,
 * in the groups the discipline keeps it in. See domainDetail.js for the data.
 *
 * ═══ WHY A SHEET AND NOT A LEVEL ═══════════════════════════════════════════
 *
 * The workspace already has a way of going deeper: Site → Section → Enclosure,
 * with the breadcrumb as its spine. This is NOT that, and making it a fifth
 * level would have broken the one thing the hierarchy promises — that going
 * down means going somewhere smaller. Opening Maintenance at the Site does not
 * move you to a smaller place; it stays on the same subject and shows more of
 * it. That is a sheet over the page you are on, and the page stays visible
 * behind it, which is also the answer to "more of WHAT".
 *
 * So the two gestures stay distinct and both stay available:
 *
 *   the ten widgets that go DOWN     drill into the hierarchy (DRILL_IN)
 *   every other widget               opens its record, here
 *
 * ═══ IT IS THE SAME CHROME AS THE GALLERY, ON PURPOSE ══════════════════════
 *
 * Bottom sheet under 1024, centred panel above it, drag to dismiss on touch,
 * Escape to close, focus trapped while open, scroll locked behind it. The
 * widget gallery established every one of those in this product and a second
 * modal with its own manners would read as a second product. What is different
 * is only what a reader should notice: this one is headed by the DOMAIN, at the
 * domain's own gradient, so the sheet and the card that opened it are visibly
 * the same subject.
 *
 * ═══ AND IT SAYS WHERE IT CAME FROM ════════════════════════════════════════
 *
 * "From Open Jobs · 68 fields" under the title, and the group that widget
 * belongs to scrolled to rather than the top of the sheet. A person who taps
 * Open Jobs and lands at the top of a six-hundred-row record has been given a
 * document instead of an answer.
 */

const { icon } = __req('js/icons.js');
const { prefersReducedMotion } = __req('js/lib/motion.js');

function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, (c) => (
    { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]
  ))
}

const slug = (s) => String(s).toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '')

/* ── the three group compositions ──────────────────────────────────────────
   FACTS is a label and a figure, and it is most of the record. TABLE is for
   the groups whose rows have the same shape as each other — a work order, a
   contract, an occupant — which is the brief's own rule for when to use one.
   ITEMS is the dotted list the workspace already uses for what is open. */

function factsHTML(rows) {
  return `<dl class="dgroup__facts">` + rows.map((r) =>
    `<div class="dfact"${r.tone ? ` data-tone="${esc(r.tone)}"` : ''}>` +
      `<dt class="dfact__label">${esc(r.label)}</dt>` +
      `<dd class="dfact__value">${esc(r.value)}` +
        (r.sub ? `<span class="dfact__sub">${esc(r.sub)}</span>` : '') +
      `</dd>` +
    `</div>`).join('') + `</dl>`
}

function tableHTML(cols, rows) {
  /* A real <table>. The gallery's Sites listing is a grid of buttons because
     each row there is a tap target; nothing in here is, and a table is what
     the content is — so it gets the header association a screen reader needs
     and `overflow-x` on the wrapper for a phone. */
  return `<div class="dtable-wrap"><table class="dtable">` +
    `<thead><tr>` + cols.map((c) => `<th scope="col">${esc(c)}</th>`).join('') + `</tr></thead>` +
    `<tbody>` + rows.map((r) =>
      `<tr${r.tone ? ` data-tone="${esc(r.tone)}"` : ''}>` +
      r.cells.map((c, i) => (i === 0
        ? `<th scope="row">${esc(c)}</th>`
        : `<td>${esc(c)}</td>`)).join('') +
      `</tr>`).join('') +
    `</tbody></table></div>`
}

function itemsHTML(rows) {
  return `<ul class="dgroup__items">` + rows.map((r) =>
    `<li class="ditem"${r.tone ? ` data-tone="${esc(r.tone)}"` : ''}>` +
      `<i aria-hidden="true"></i><span>${esc(r.text)}</span>` +
      (r.value ? `<b>${esc(r.value)}</b>` : '') +
    `</li>`).join('') + `</ul>`
}

function groupHTML(g) {
  const body = g.kind === 'table' ? tableHTML(g.cols || [], g.rows)
             : g.kind === 'items' ? itemsHTML(g.rows)
             : factsHTML(g.rows)
  return `<section class="dgroup" id="dg-${esc(slug(g.name))}" data-group="${esc(g.name)}">` +
    `<header class="dgroup__head">` +
      `<h3 class="dgroup__name">${esc(g.name)}</h3>` +
      `<span class="dgroup__count">${g.rows.length}</span>` +
    `</header>` +
    (g.note ? `<p class="dgroup__note">${esc(g.note)}</p>` : '') +
    body +
  `</section>`
}

/**
 * @param {object} opts
 *   getContent(widget)  everything the sheet draws, resolved by the app
 *   onOpenModule(c)     the one action in the footer
 */
function createWidgetDetail({ getContent, onOpenModule }) {
  const scrim = document.createElement('div')
  scrim.className = 'scrim'
  scrim.hidden = true

  const sheet = document.createElement('section')
  sheet.className = 'wdetail'
  sheet.hidden = true
  sheet.setAttribute('role', 'dialog')
  sheet.setAttribute('aria-modal', 'true')
  sheet.setAttribute('aria-labelledby', 'wdetail-title')
  sheet.innerHTML =
    `<span class="sheet__handle" aria-hidden="true"></span>` +
    `<header class="wdetail__head">` +
      `<span class="wdetail__plate" aria-hidden="true">` +
        `<span class="wdetail__glyph" data-glyph></span>` +
      `</span>` +
      `<span class="wdetail__id">` +
        `<span class="wdetail__crumb" data-crumb></span>` +
        `<h2 class="wdetail__title" id="wdetail-title" data-title></h2>` +
        `<p class="wdetail__q" data-question></p>` +
      `</span>` +
      `<button type="button" class="wdetail__close" data-close aria-label="Close">` +
        `${icon('close', 'icon')}</button>` +
    `</header>` +
    `<div class="wdetail__from">` +
      `<span class="wdetail__source" data-source></span>` +
      `<nav class="wdetail__nav" data-nav aria-label="Sections of this record"></nav>` +
    `</div>` +
    `<div class="wdetail__body" data-body tabindex="-1"></div>` +
    `<footer class="wdetail__foot">` +
      `<button type="button" class="btn-ghost" data-close>Close</button>` +
      `<button type="button" class="wdetail__go" data-go></button>` +
    `</footer>`

  document.body.append(scrim, sheet)

  const els = {
    glyph: sheet.querySelector('[data-glyph]'),
    plate: sheet.querySelector('.wdetail__plate'),
    crumb: sheet.querySelector('[data-crumb]'),
    title: sheet.querySelector('[data-title]'),
    question: sheet.querySelector('[data-question]'),
    source: sheet.querySelector('[data-source]'),
    nav: sheet.querySelector('[data-nav]'),
    body: sheet.querySelector('[data-body]'),
    go: sheet.querySelector('[data-go]'),
  }

  let open = false
  let restoreFocusTo = null
  let content = null

  /* ── drawing ────────────────────────────────────────────────────────── */

  function draw(c) {
    els.glyph.innerHTML = icon(c.domain.sprite, 'glyph')
    els.plate.style.setProperty('--card-bg', `var(${c.domain.gradient})`)
    els.crumb.textContent = c.crumb
    els.title.textContent = c.title || c.domain.name
    els.question.textContent = c.question || ''

    els.source.innerHTML = c.empty
      ? `From <b>${esc(c.widgetName)}</b>`
      : `From <b>${esc(c.widgetName)}</b> · ${c.fields} fields in ${c.groups.length} groups`

    /* THE FOOTER'S ONE ACTION IS THE DOMAIN'S MODULE, not this sheet's own
       navigation. Overview is the exception it already is everywhere else in
       this product: its subject is the page you are on, so there is nowhere
       for it to send you. */
    els.go.hidden = !c.moduleName
    els.go.innerHTML = c.moduleName
      ? `${esc(`View ${c.moduleName}`)} ${icon('chev-right', 'icon')}`
      : ''

    if (c.empty) {
      els.nav.replaceChildren()
      els.body.innerHTML =
        `<div class="dempty">` +
          `<span class="dempty__mark" aria-hidden="true">${icon(c.domain.sprite, 'dempty__glyph')}</span>` +
          `<p class="dempty__note">${esc(c.empty.note)}</p>` +
          (c.empty.action ? `<p class="dempty__action">${esc(c.empty.action)}</p>` : '') +
        `</div>`
      return
    }

    els.body.innerHTML =
      `<div class="dtiles">` + c.tiles.map((t) =>
        `<div class="dtile"${t.tone ? ` data-tone="${esc(t.tone)}"` : ''}>` +
          `<span class="dtile__value">${esc(t.value)}</span>` +
          `<span class="dtile__label">${esc(t.label)}</span>` +
          (t.sub ? `<span class="dtile__sub">${esc(t.sub)}</span>` : '') +
        `</div>`).join('') + `</div>` +
      c.groups.map(groupHTML).join('')

    /* The chips are navigation inside one document, so they are buttons that
       scroll rather than links that change the address. */
    els.nav.replaceChildren()
    for (const g of c.groups) {
      const btn = document.createElement('button')
      btn.type = 'button'
      btn.className = 'wdetail__chip'
      btn.textContent = g.name
      btn.addEventListener('click', () => scrollToGroup(g.name))
      els.nav.append(btn)
    }
  }

  function scrollToGroup(name) {
    const el = els.body.querySelector(`#dg-${slug(name)}`)
    if (!el) return
    els.body.scrollTo({
      top: Math.max(0, el.offsetTop - 8),
      behavior: prefersReducedMotion() ? 'auto' : 'smooth',
    })
  }

  /* ── open / close ───────────────────────────────────────────────────── */

  function show(widget, item) {
    const c = getContent?.(widget, item)
    if (!c) return false

    content = c
    draw(c)

    scrim.hidden = false
    sheet.hidden = false
    document.body.style.overflow = 'hidden'
    document.addEventListener('keydown', onKeydown)
    if (!open) restoreFocusTo = document.activeElement
    open = true

    requestAnimationFrame(() => requestAnimationFrame(() => {
      scrim.classList.add('is-open')
      sheet.classList.add('is-open')
      els.body.focus({ preventScroll: true })
      /* WHERE THE WIDGET'S OWN GROUP IS, not the top. The reader tapped one
         card, not the whole record. */
      if (c.startGroup) scrollToGroup(c.startGroup)
    }))
    return true
  }

  function close() {
    if (!open) return
    open = false
    scrim.classList.remove('is-open')
    sheet.classList.remove('is-open')
    document.body.style.overflow = ''
    document.removeEventListener('keydown', onKeydown)

    const done = () => {
      if (open) return
      scrim.hidden = true
      sheet.hidden = true
      els.body.replaceChildren()
      els.nav.replaceChildren()
      content = null
    }
    sheet.addEventListener('transitionend', done, { once: true })
    setTimeout(done, 500)

    restoreFocusTo?.focus?.()
    restoreFocusTo = null
  }

  /* ── keyboard ───────────────────────────────────────────────────────── */

  function focusables() {
    return [...sheet.querySelectorAll(
      'button:not([disabled]), input, [href], [tabindex]:not([tabindex="-1"])',
    )].filter((el) => el.offsetParent !== null)
  }

  function onKeydown(e) {
    if (!open) return
    if (e.key === 'Escape') {
      /* Escape means "close this" here, and the app's own Escape — which goes
         UP a level — is guarded on `isOpen` so the two cannot both fire. */
      e.preventDefault()
      e.stopPropagation()
      close()
      return
    }
    if (e.key !== 'Tab') return
    const items = focusables()
    if (!items.length) return
    const first = items[0]
    const last = items[items.length - 1]
    if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus() }
    else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus() }

 * into once, and after that it gets ignored — the reader has no way to know

 *                 caret is the field arguing with the person using it

 *                 looking at is pure cost, and setInterval does not care

      /* Each term quoted, in both forms. Three of them under reduced motion,
         because three is enough to say what kind of index this is and it never
         moves again — and quoting each one keeps them reading as three separate

    const actions = QUICK_ACTIONS.filter(
      (a) => a.levels.includes(st.level) && role.permissions.includes(a.needs))

    return [
      /* NO NOTE ON THIS HEADING. It carried `role.title` — "Site Manager ·
         Command Centre" — which came out as "Site Manager · Command Ce…" at the
         menu's width, and was answering a question the ticked row directly
         below it already answers. A heading note earns its place by saying
         something the rows do not. */
      { heading: 'Viewing as' },
      ...ROLES.map((r) => ({
        id: `role:${r.id}`, label: r.name, note: r.person, checked: r.id === role.id,
      })),

      !listing ? null : false,
      !listing && {
        id: 'edit', icon: 'pencil',
        label: (x) => (x.editing ? 'Done Editing' : 'Customize Workspace'),
        note: (x) => (x.editing ? 'Save the arrangement' : 'Rearrange, resize or remove widgets'),
      },
      !listing && { id: 'add', icon: 'widgets', label: 'Add Widget',
                    note: `Choose a widget for this ${LEVEL_NOUN[st.level] || 'Site'}` },

      /* A HEADING WITH NOTHING UNDER IT IS WORSE THAN NO HEADING, so the
         actions group appears only when the role has actions here. §16 asks the
         product to cope with a role narrow enough for this to happen. */
      actions.length ? null : false,
      actions.length ? { heading: `On this ${LEVEL_NOUN[st.level] || 'Site'}` } : false,
      ...actions.map((a) => ({ id: `do:${a.id}`, icon: a.icon, label: a.label, note: a.note })),

      null,
      { id: 'report', icon: 'arrow-out', label: 'Open Report',
        note: listing ? 'Every Site, as a document' : 'This view, as a document' },
      !listing && { id: 'reset', icon: 'refresh', label: 'Reset Workspace',
                    note: 'Back to the default for your role at this level', danger: true },
    ]
  },
  onSelect(id) {
    const onSite = viewStore.get().view === 'site'
    const mode = onSite ? wsEdit : edit

    /* Two namespaced families, so a role id and an action id can never collide
       with a menu id — `admin` is a role and `map` is an action, and both are
       plausible names for something else this menu might grow. */
    if (id.startsWith('role:')) { setRole(id.slice(5)); return }
    if (id.startsWith('do:')) {
      const key = id.slice(3)
      wsEdit.announce(`${ACTION_NAMES[key] || key} — opening.`)
      return
    }
    if (id === 'report') { wsEdit.announce('Report — opening.'); return }

    if (id === 'edit') { mode.editing ? mode.exit() : mode.enter(); return }
    if (id === 'add') {
      /* Adding a card is an edit, so arrive in edit mode — otherwise the new
         card lands on a page with no visible way to move it. */
      if (!mode.editing) mode.enter()
      ;(onSite ? wsPicker : picker).open()
      return
    }
    if (id === 'reset') {
      if (onSite) {
        ws().resetWorkspace()
        wsEdit.announce('Workspace reset to the default for your role.')
      } else {
        resetLayout()
        edit.announce('Home page reset to the default arrangement.')
      }
    }
  },
})

/* ── the three gestures that were already there ─────────────────────────
   The artboard has no Edit button, and the profile menu above is now the
   visible route, but these stay: a long press on a card is the gesture people
   bring with them from every phone home screen they have used, and it should
   not stop working because a menu appeared.

     press and hold a card   500ms, finger or mouse, ≤8px of drift
     right-click a card      the desktop equivalent of the same intent
     press E                 anywhere outside a text field

   500ms is deliberately longer than the 200ms the drag controller uses. The two
   never overlap — the drag long-press only arms once editing is already on —
   but a shorter hold here would make an ordinary tap feel like it might do
   something else.

   The gesture is announced on arrival, because a mode you entered by holding
   something is a mode you might not have meant to enter. */
const EDIT_HOLD_MS = 500

/**
 * ONE BINDING, TWO GRIDS.
 *
 * This was written inline against the home page's grid. The Site Workspace
 * needs exactly the same three gestures on its own grid, and the honest way to
 * get them is not a second copy that will drift — the hold duration, the 8px
 * drift tolerance and the "a scroll under the finger is not a hold" rule are
 * one decision each, not two.
 */
function bindHoldToEdit(root, edit) {
  let holdTimer = 0
  let holdFrom = null

  function cancelHold() {
    clearTimeout(holdTimer)
    holdTimer = 0
    holdFrom = null
  }

  root.addEventListener('pointerdown', (e) => {
    if (edit.editing) return
    if (!e.target.closest('.card')) return
    if (e.button != null && e.button > 0) return
    holdFrom = { x: e.clientX, y: e.clientY }
    holdTimer = window.setTimeout(() => {
      cancelHold()
      edit.enter()
      if (navigator.vibrate) { try { navigator.vibrate(12) } catch { /* unsupported */ } }
    }, EDIT_HOLD_MS)
  })

  root.addEventListener('pointermove', (e) => {
    if (!holdFrom) return
    if (Math.hypot(e.clientX - holdFrom.x, e.clientY - holdFrom.y) > 8) cancelHold()
  })

  for (const ev of ['pointerup', 'pointercancel', 'pointerleave']) {
    root.addEventListener(ev, cancelHold)
  }
  /* a scroll under the finger is not a hold */
  window.addEventListener('scroll', cancelHold, { passive: true })

  root.addEventListener('contextmenu', (e) => {
    if (edit.editing || !e.target.closest('.card')) return
    e.preventDefault()
    edit.enter()
  })
}

bindHoldToEdit(gridRoot, edit)

/* E toggles the edit mode OF THE WORKSPACE YOU ARE LOOKING AT. Bound once at
   the document, resolved at press time — binding two document listeners and
   letting each decide whether to act is how a key ends up doing two things. */
document.addEventListener('keydown', (e) => {
  if (e.key !== 'e' && e.key !== 'E') return
  if (e.metaKey || e.ctrlKey || e.altKey) return
  const t = document.activeElement
  if (t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.isContentEditable)) return
  if (picker.isOpen || wsPicker.isOpen || profileMenu.isOpen) return
  e.preventDefault()
  const mode = viewStore.get().view === 'site' ? wsEdit : edit
  if (mode.editing) mode.exit()
  else mode.enter()
})

createDragController({
  grid,
  root: gridRoot,
  canDrag: () => edit.editing,
  getCards: () => layoutStore.get().cards,
  announce: (m) => edit.announce(m),
  /* Nothing may outlive a gesture. `working` is cleared before a drag starts
     and again the moment one ends, whatever the ending was. */
  onGrab() {
    working = null
  },
  onPreview(next) {
    working = next
    paint({ animate: true })
  },
  onCommit(next, { changed } = {}) {
    working = null
    /* A drag that ended where it began still has to release the grid — commit
       the order when it changed, and simply repaint from the store when it did
       not, so the subscriber guard above stops swallowing updates. */
    if (changed) reorder(next, grid.columns)
    else paint({ animate: true })
  },
})

/* ═══════════════════════════════════════════════════════════════════════════
   THE SITE COMMAND CENTRE · THREE LEVELS, ONE SET OF COMPONENTS
   ───────────────────────────────────────────────────────────────────────────
   Housing → Site → Section → Enclosure. There is ONE grid, ONE edit mode, ONE
   drag controller, ONE size popover, ONE header and ONE widget gallery, and
   they serve all three depths. What swaps when the level changes is three
   pieces of data:

     the CATALOGUE  which widgets exist here      (LEVELS below)
     the STORE      which document is being edited (workspaces.<level>)
     the SUBJECT    which Site/Section/Enclosure   (viewStore)

   Nothing else. Three grids would have meant three DOM subtrees to keep in
   step, three drag controllers racing for pointer capture, and three sheets
   with three sets of ids to keep unique — and the deeper two would have been
   copies of the first, diverging from it on the first bug fixed in either.
   ═══════════════════════════════════════════════════════════════════════════ */

const wsGridRoot = document.getElementById('siteGrid')
const wsHeadEl = document.getElementById('siteHead')

const siteCat = __req('js/data/siteWidgets.js')
const sectionCat = __req('js/data/sectionWidgets.js')
const enclosureCat = __req('js/data/enclosureWidgets.js')

/**
 * The three catalogues, behind one shape. `apply` is the function that rewrites
 * every widget's data for the current subject — see the note on applySite() for
 * why emptiness and figures are properties of the subject rather than of a
 * widget.
 */
const LEVELS = {
  site: {
    widgets: siteCat.SITE_WIDGETS,
    domains: DOMAINS.map((d) => d.id),
    widgetsForDomain: siteCat.widgetsForDomain,
    getWidget: siteCat.getWidget,
    apply: (st) => siteCat.applySite(st.siteId),
    noun: 'Site',
  },
  section: {
    widgets: sectionCat.SECTION_WIDGETS,
    domains: sectionCat.SECTION_DOMAINS,
    widgetsForDomain: sectionCat.widgetsForDomain,
    getWidget: sectionCat.getWidget,
    apply: (st) => sectionCat.applySection(st.sectionId),
    noun: 'Section',
  },
  enclosure: {
    widgets: enclosureCat.ENCLOSURE_WIDGETS,
    domains: enclosureCat.ENCLOSURE_DOMAINS,
    widgetsForDomain: enclosureCat.widgetsForDomain,
    getWidget: enclosureCat.getWidget,
    apply: (st) => enclosureCat.applyEnclosure(st.enclosureId),
    noun: 'Enclosure',
  },
}

const levelId = () => viewStore.get().level
const cat = () => LEVELS[levelId()] || LEVELS.site
const ws = () => forLevel(levelId())

let wsWorking = null
const wsCards = () => wsWorking ?? ws().store.get().cards

const PURPOSE_RANK = { NAVIGATE: 0, UNDERSTAND: 1, ATTENTION: 2, ACT: 3, MONITOR: 4 }

/**
 * PERMISSION IS APPLIED TO THE RAIL, NOT ONLY TO THE WIDGETS.
 *
 * Filtering widgets alone would leave a veterinarian browsing a Finance domain
 * that renders as an empty pane — the product telling them a thing exists and
 * that they may not have it, which is worse than not mentioning it. A domain is
 * in the rail only if it has widgets AT THIS LEVEL and this role may see it,
 * which is also what makes the gallery shrink as you go deeper: an enclosure has
 * no Finance, no Vendors and no Risk, so those domains are simply not there.
 */
function visibleDomains() {
  const role = getRole(viewStore.get().roleId)
  const here = new Set(cat().domains)
  return DOMAINS.filter((d) =>
    here.has(d.id) &&
    role.permissions.includes(d.id) &&
    /* AND IT HAS TO HAVE SOMETHING IN IT. The comment above has said this since
       the gallery was written and the code did not check it: at the Site level
       `domains` is every domain in the catalogue, including the ones whose
       widgets only exist a level down, so Responsibility, Area Operations,
       Occupancy and five others were rail rows that opened onto an empty pane.
       Asking the catalogue is one call and it is the only honest source. */
    cat().widgetsForDomain(d.id).length > 0)
}

/**
 * The gallery's view of whichever catalogue is live. `revision` is how the
 * picker knows to rebuild its search index — it changes when the level does.
 */
const WS_SOURCE = {
  id: 'site',
  get revision() { return levelId() },
  get groups() { return visibleDomains() },
  categories: DOMAIN_GROUPS,
  categoryOf: (d) => d.group,
  getGroup: getDomain,
  get variants() { return cat().widgets },
  /* Ordered by PURPOSE then LEVEL: the door first, then what the domain knows,
     then what is waiting in it, then what you can do about it. Level breaks the
     ties inside a purpose, so the critical card leads. */
  variantsFor: (domainId) =>
    cat().widgetsForDomain(domainId)
      .filter((w) => permits(getRole(viewStore.get().roleId), w))
      .sort((a, b) =>
        (PURPOSE_RANK[a.purpose] ?? 9) - (PURPOSE_RANK[b.purpose] ?? 9) ||
        a.level - b.level ||
        a.name.localeCompare(b.name)),
  title: 'Add Widget',
  searchLabel: 'Search widgets',
  railLabel: 'Domains',
  backLabel: 'All Domains',
  addOne: 'Add to Workspace',
  addMany: (n) => `Add ${n} Widgets`,
  emptyHint: 'Try a domain, or something the widget shows — ' +
             '“enrichment”, “barrier”, “overdue”.',
}

/**
 * WIDGETS THAT GO DOWN RATHER THAN OUT.
 *
 * Section 11 of the brief makes a widget "context, summary and navigation", and
 * at every level but the last, some of that navigation is INTO the hierarchy
 * rather than off to a module. The enclosure list in a Section is the way into an
 * enclosure; the structure card is the way into whatever it counts. Everything
 * else opens the module its domain names.
 */
const DRILL_IN = new Set([
  'site.space.sections', 'sec.space.enclosures', 'sec.space.door', 'sec.overview.structure',
])

/* AND THE ONE THAT GOES TWO LEVELS. Tapping Enclosures on a Site means "show
   me the enclosures", and the enclosures live under a Section — so it lands on
   an enclosure rather than stopping at the Section on the way past. */
const DRILL_DEEP = new Set(['site.space.count'])


/* ═══════════════════════════════════════════════════════════════════════════
   OPENING A WIDGET · from three lines and a figure to the record underneath
   ───────────────────────────────────────────────────────────────────────────
   Tapping a widget that does not drill into the hierarchy opens its DOMAIN's
   record on the current subject — see domainDetail.js for the data and
   WidgetDetail.js for the sheet. Everything level-aware is resolved here,
   because this is the only place that holds all four of the pieces: the view
   state, the three catalogues, the hierarchy and the role.
   ═══════════════════════════════════════════════════════════════════════════ */

/**
 * WHICH GROUP THE READER LANDS ON.
 *
 * They tapped ONE card, not the whole record, so the sheet opens at the group
 * that card belongs to. Matching the widget's name against the group names
 * rather than holding a table of 163 widget→group pairs is deliberate: a table
 * is a second place to edit every time a widget is renamed, and it would be
 * wrong silently. A near miss here costs a scroll.
 */
function startGroupFor(widget, groups) {
  const words = (s) => new Set(String(s).toLowerCase().match(/[a-z]{4,}/g) || [])
  const want = words(`${widget.name} ${widget.data?.title || ''}`)
  if (!want.size) return null

  let best = null, score = 0
  for (const g of groups) {
    let hit = 0
    for (const w of words(g.name)) if (want.has(w)) hit++
    if (hit > score) { score = hit; best = g.name }
  }
  return score ? best : null
}

/**
 * EMPTINESS IS STILL A PROPERTY OF THE SUBJECT, not of the sheet. A Site with
 * no asset register has no asset RECORD either, and the sheet says so in the
 * same words the cards do rather than drawing eighty rows of em dashes — which
 * is the "fake zero" §15 of the brief forbids, one level deeper.
 *
 * The whole DOMAIN has to be absent for this, not one widget: a domain with two
 * empty cards and four full ones has plenty to show.
 */
function domainRecordAbsent(domainId) {
  const list = cat().widgetsForDomain(domainId)
  return list.length > 0 && list.every((w) => w.empty)
}

/** The occupant table's rows, from the live card rather than re-invented. */
function occupantRows() {
  const items = enclosureCat.getWidget('enc.occ.list')?.data?.items || []
  return items
    .filter((i) => i.when && i.when !== '—')
    .map((i, idx) => ({
      c: [String(i.when).replace(/^ID\s*/, ''), i.name, i.kind,
          idx === 0 ? 'Microchip · verified' : 'Ear tag · verified'],
    }))
}

function detailContent(widget) {
  const st = viewStore.get()
  const level = st.level
  const domain = getDomain(widget.moduleId)
  if (!domain || !hasDetail(domain.id) || !LEVELS[level]) return null

  const site = getSite(st.siteId)
  const section = getSection(st.sectionId)
  const enclosure = getEnclosure(st.enclosureId)

  const x = buildContext({
    level, site, section, enclosure,
    getWidget: cat().getWidget,
    sections: level === 'site' ? sectionsForSite(st.siteId) : [],
    enclosures: level === 'section' ? enclosuresIn(st.sectionId) : [],
    occupants: level === 'enclosure' ? occupantRows() : [],
  })
  const record = detailFor(domain.id, x)
  if (!record) return null

  /* The breadcrumb, spelled out — the sheet covers the header that usually
     carries it, and a record with no subject on it is a record of nothing. */
  const crumb = [site?.short, level !== 'site' && section?.name,
                 level === 'enclosure' && enclosure?.code]
    .filter(Boolean).join(' › ')

  const absent = domainRecordAbsent(domain.id)
  const first = absent ? cat().widgetsForDomain(domain.id)[0] : null

  return {
    domain,
    /* "Site Overview" IS the domain's name, and it is wrong two levels down.
       Overview is the one domain whose subject is the page itself, so its title
       has to follow the page — the same reason the header's own subject line
       is level-aware. Every other domain is called the same thing at every
       depth, because it IS the same thing. */
    title: domain.here ? `${LEVELS[level].noun} Overview` : domain.name,
    widgetName: widget.name,
    crumb,
    question: record.question,
    tiles: record.tiles,
    groups: record.groups,
    fields: record.fields,
    startGroup: startGroupFor(widget, record.groups),
    /* Overview's subject IS the page behind the sheet, so it has nowhere to
       send anyone — the same exception it already is on every card. */
    moduleName: domain.here ? '' : domain.module,
    empty: absent && first?.empty ? first.empty : null,
  }
}

const wsDetail = createWidgetDetail({
  getContent: detailContent,
  onOpenModule(c) {
    /* No router in a prototype — the module is where the work is done, and
       saying so is as far as this build can honestly go. */
    wsEdit.announce(`Opening ${c?.moduleName || 'the module'}.`)
  },
})

const wsGrid = createModuleGrid({
  root: wsGridRoot,
  /* NOTHING IS LOCKED AT ANY LEVEL — see the note in siteWorkspaceStore.js. */
  isCore: () => false,
  onActivate(widget) {
    if (DRILL_DEEP.has(widget.id)) {
      if (goDown() && goDown()) return
    }
    if (DRILL_IN.has(widget.id)) {
      if (goDown()) return
    }
    /**
     * AND EVERYTHING ELSE OPENS ITS RECORD, in place, over the workspace.
     *
     * The destination is a property of the DOMAIN rather than of the card, so
     * every Maintenance widget opens the Maintenance record and adding a
     * seventh tomorrow does not mean remembering to wire it up. The card that
     * was tapped still decides where in the record the reader lands — see
     * startGroupFor().
     */
    const domain = getDomain(widget.moduleId)
    if (wsDetail.open(widget)) {
      wsEdit.announce(`${domain?.name || widget.name} record opened. ` +
                      'Escape closes it.')
      return
    }
    /* Nothing authored for this domain yet — say where it would have gone. */
    wsEdit.announce(`Opening ${domain?.module || widget.name}.`)
  },
  onRemove(uid) {
    const neighbour = wsGrid.neighbourOf(uid)
    if (!ws().removeCard(uid)) return
    wsGrid.restoreFocus(neighbour)
    /* If the modules menu is open behind this, its tick is now a lie. */
    wsHeader.refreshModules()
    wsEdit.announce('Widget removed from your workspace.')
  },
  onResize(uid, size, slot) {
    wsSizePopover.open(uid, size, slot)
  },
})

const wsSizePopover = createSizePopover({
  onResize(uid, size) {
    ws().resizeCard(uid, size)
    wsEdit.announce(`Resized to ${size}.`)
  },
})

const wsPicker = createModulePicker({
  source: WS_SOURCE,
  onAdd(batch) {
    const made = ws().addCards(batch)
    if (!made.length) return
    requestAnimationFrame(() => {
      wsGrid.slotFor(made[0].uid)?.scrollIntoView({
        behavior: prefersReducedMotion() ? 'auto' : 'smooth',
        block: 'center',
      })
      made.forEach((card, i) => {
        const slot = wsGrid.slotFor(card.uid)
        if (!slot) return
        animate(
          slot,
          [{ transform: 'scale(.86)', opacity: 0 }, { transform: 'scale(1)', opacity: 1 }],
          { duration: 320, delay: i * 45, easing: 'cubic-bezier(.16,1,.3,1)', fill: 'backwards' },
        )
      })
      wsEdit.announce(made.length === 1
        ? 'Widget added to your workspace.'
        : `${made.length} widgets added to your workspace.`)
    })
  },
})

const wsEdit = createEditMode({
  head: wsHeadEl,
  grid: wsGrid,
  root: wsGridRoot,
  onAdd: () => wsPicker.open(),
  getCards: () => ws().store.get().cards,
  /* Level-agnostic on purpose. "Customize Workspace" and "Add Widget" are the
     right words at all three depths, so the mode needs no per-level copy — the
     header above it already says what you are looking at. */
  labels: {
    title:     'Workspace',
    editTitle: 'Customize Workspace',
    add:       'Add Widget',
    hint:      'Drag widgets to rearrange. Press space on a widget to move it with the arrow keys.',
    entered:   'Customizing your workspace. Drag widgets to rearrange, or use the remove buttons.',
    saved:     'Workspace saved.',
  },
  onCommit(next, opts = {}) {
    ws().reorder(next, wsGrid.columns)
    if (opts.keepFocus) {
      requestAnimationFrame(() =>
        wsGrid.slotFor(opts.keepFocus)?.querySelector('.card')?.focus())
    }
  },
  onExit: () => paintWorkspace(),
})

bindHoldToEdit(wsGridRoot, wsEdit)

createDragController({
  grid: wsGrid,
  root: wsGridRoot,
  canDrag: () => wsEdit.editing,
  getCards: () => ws().store.get().cards,
  announce: (m) => wsEdit.announce(m),
  onGrab() { wsWorking = null },
  onPreview(next) {
    wsWorking = next
    paintWorkspace({ animate: true })
  },
  onCommit(next, { changed } = {}) {
    wsWorking = null
    if (changed) ws().reorder(next, wsGrid.columns)
    else paintWorkspace({ animate: true })
  },
})

/* ═══════════════════════════════════════════════════════════════════════════
   THE MODULES MENU · more modules, based on the role
   ───────────────────────────────────────────────────────────────────────────
   The header owns the button; this owns the answer. Two lists, because a
   priority is a suggestion and a permission is the rule:

     For <role>          the modules the ANTZ documents mark as this seat's own
     Everything else     the rest of what the role is allowed to open

   A module the role cannot see is in NEITHER, which is the difference between
   "not for you" and "not yours" — see modulesForRole() in siteModules.js.

   THE ROW IS A SWITCH, NOT A LINK. Tapping it puts the module's card on the
   workspace; tapping a ticked row takes it off again. That matters more than it
   sounds: a menu of thirty-four one-way adds is a menu you stop trusting after
   the first mistake, and the way back has to be the gesture that got you there.
   ═══════════════════════════════════════════════════════════════════════════ */

/** Which module cards are on the workspace right now. */
function modulesOnWorkspace() {
  return new Set(workspaces.site.store.get().cards.map((c) => c.variantId))
}

function moduleMenuItems() {
  const st = viewStore.get()
  const role = getRole(st.roleId)
  const { mine, rest } = modulesForRole(role.id, (d) => role.permissions.includes(d))
  const on = modulesOnWorkspace()

  const row = (m) => {
    const w = siteCat.getWidget(m.widget)
    const domain = getDomain(m.domain)
    return {
      id: m.key,
      /* The card's own glyph where it has one, the domain's otherwise — so a row
         and the card it puts on the page are recognisably the same thing. */
      icon: w?.sprite || domain?.sprite,
      label: m.name,
      /**
       * THE COUNT, AND NOTHING ELSE.
       *
       * The note carried the domain as well — "Site Overview · 6 widgets" —
       * which repeats a word on every row of a group whose HEADING already says
       * what these modules are, and pushes the one useful number to the far
       * side of a separator. Thirty-four rows of "<domain> · <n> widgets" is
       * thirty-four readings of something the reader did not come for.
       *
       * (It was a right-aligned badge before that, and it ellipsed the names it
       * sat beside. The count belongs under the name, small.)
       */
      note: `${m.catalog[0]} widgets`,
      on: on.has(m.widget),
    }
  }

  /* THE HEADING NOTE IS A COUNT AND NOTHING ELSE. It was a sentence — "8
     modules this role answers for" — and at the width the module NAMES need it
     came out as "8 modules this role answ…", which is a truncated explanation
     doing less than the number it was explaining. */
  const items = []
  if (mine.length) {
    items.push({ heading: `For the ${role.name}`, note: `${mine.length} modules` })
    items.push(...mine.map(row))
  }
  if (rest.length) {
    if (mine.length) items.push(null)
    items.push({ heading: 'Also available to you', note: `${rest.length} modules` })
    items.push(...rest.map(row))
  }
  /* A menu with nothing in it is worse than no menu — §16 of the brief asks the
     product to cope with a role narrow enough for this to happen. */
  if (!items.length) {
    items.push({
      id: 'none', label: 'No modules available',
      note: 'Your role cannot open any of the facility modules',
    })
  }
  return items
}

function toggleModule(key) {
  if (key === 'none') return
  const m = getV5Module(key)
  const w = m && siteCat.getWidget(m.widget)
  if (!w) return

  const role = getRole(viewStore.get().roleId)
  if (!permits(role, w)) {
    wsEdit.announce(`${m.name} is not available to your role.`)
    return
  }

  /* OFF, IF IT IS ALREADY ON. Every copy of it, because the gallery can put a
     second one on the page and a tick that only removes one of two would leave
     the menu telling the truth and the page not. */
  const here = workspaces.site.store.get().cards.filter((c) => c.variantId === m.widget)
  if (here.length) {
    for (const card of here) workspaces.site.removeCard(card.uid)
    wsEdit.announce(`${m.name} removed from your workspace.`)
    wsHeader.refreshModules()
    return
  }

  const made = workspaces.site.addCards([{ variantId: m.widget, size: w.defaultSize }])
  if (!made.length) return
  wsHeader.refreshModules()

  requestAnimationFrame(() => {
    const slot = wsGrid.slotFor(made[0].uid)
    /* SCROLLED TO, THEN LANDED. A card added from a menu at the top of the page
       arrives at the foot of the workspace, and a page that does not move has
       not told the reader anything happened. */
    slot?.scrollIntoView({
      behavior: prefersReducedMotion() ? 'auto' : 'smooth',
      block: 'center',
    })
    if (slot) {
      animate(
        slot,
        [{ transform: 'scale(.86)', opacity: 0 }, { transform: 'scale(1)', opacity: 1 }],
        { duration: 320, easing: 'cubic-bezier(.16,1,.3,1)', fill: 'backwards' },
      )
    }
    wsEdit.announce(`${m.name} added to your workspace.`)
  })
}

/* ── painting ───────────────────────────────────────────────────────────── */

function paintWorkspace(opts = { animate: true }) {
  wsGrid.render(wsCards(), opts)
}

/* All three stores feed the same grid, so all three are subscribed and the
   guard is which level is live. A write to the section store while the
   enclosure is showing is a write nobody is looking at. */
for (const key of ['site', 'section', 'enclosure']) {
  workspaces[key].store.subscribe(() => {
    if (wsWorking) return
    if (levelId() !== key) return
    paintWorkspace()
  })
