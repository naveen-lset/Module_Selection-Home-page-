   differ and all three are measurements rather than decoration.

   ═══ THE SPACING AND THE TYPE ARE THE SCALE, NOT NEW NUMBERS ═════════════

   Every value below is a token. That is worth stating because a long list is
   exactly where a component starts inventing its own scale — a 13px heading
   here, an 11px badge there — and thirty-four rows is enough repetition for a
   half-step to read as a mistake rather than as an accident.

     row height     44px minimum, the brief's touch floor, and the reason the
                    rows are `--s2` block padding on a 34px glyph rather than
                    something tighter that would have fitted more of them in
     row rhythm     --s3 between the glyph and the text, --s2 to the badge
     inset          --s3 inline, matching the compact menu it inherits from
     heading        --fs-micro, 650, tracked +.05em, in --petrol-600 with its
                    count in --ink-3 — so it reads as a label for the group and
                    never as a row you could tap. --s4 of air above it, --s1
                    below: a heading belongs to what FOLLOWS it, and equal space
                    either side is the commonest way that stops being legible
     label          --fs-label at 600 — the same as every other menu row in the
                    product, because it is the same kind of thing
     note           --fs-micro in --ink-3, one line, ellipsed — the domain and
                    the module's own widget count, which is the one number that
                    says how much is behind a row
     tick           the only thing on the right edge, so a ticked row and an
                    unticked one measure the same

   ═══ WIDTH ══════════════════════════════════════════════════════════════
   356px, not the compact menu's 304. Measured against the longest label in the
   catalogue — "Safety, Security & Emergency" — with the tick present, which is
   the widest a row ever gets. At 304 that name and "Medical & Veterinary Care"
   both ellipsed, and a module row that will not say which module it is has
   lost the only thing it was for. */
.pmenu--modules {
  width: min(356px, calc(100vw - 24px));
  /* The cap itself is set in JS from the space under the button; this is only
     the promise that the list scrolls rather than overflowing. */
  overflow-y: auto;
  overscroll-behavior: contain;
  scrollbar-width: thin;
}

/* A HEADING IS NOT A ROW, and it has to be impossible to mistake for one: no
   glyph column, no hover, no cursor, and the group count sitting after the name
   on the same line rather than under it. */
.pmenu__heading {
  display: flex;
  align-items: baseline;
  gap: var(--s2);
  padding: var(--s4) var(--s3) var(--s1);
  min-width: 0;
}
.pmenu__heading:first-child { padding-top: var(--s2); }
.pmenu__heading-text {
  flex: none;
  font-size: var(--fs-micro);
  font-weight: 650;
  letter-spacing: .05em;
  text-transform: uppercase;
  color: var(--petrol-600);
}
.pmenu__heading-note {
  font-size: var(--fs-micro);
  color: var(--ink-3);
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

/* A row in this menu is a switch, so a ticked one has to look SET rather than
   merely marked — the tick alone is easy to miss halfway down a long list. */
.pmenu--modules .pmenu__item { padding-block: var(--s2); min-height: 44px; }
.pmenu--modules .pmenu__item.is-checked { background: var(--petrol-050); }
.pmenu--modules .pmenu__item.is-checked:hover { background: var(--petrol-100); }
.pmenu--modules .pmenu__label,
.pmenu--modules .pmenu__note {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

/* ══ A MENU LONG ENOUGH TO BE A DIALOG ═══════════════════════════════════
   The modules menu is thirty-four rows in two groups, and it decides what the
   whole workspace contains. Hung off its button in the header it ran the full
   height of the screen and past the left edge of it. Centred it becomes what it
   already was — a dialog — and the page behind it is blurred, because a page
   that stays sharp behind a dialog still looks pressable.

   These come AFTER `.pmenu--modules` on purpose: same specificity, so source
   order is what lets the centred box win on width and position. */
.pmenu--centre {
  top: 50%;
  left: 50%;
  right: auto;
  /* 460, not the popover's 356. Off the anchor there is room for the longest
     name in the catalogue — "Safety, Security & Emergency", ticked — to sit on
     one line, which is the whole reason the width was ever measured. */
  width: min(460px, calc(100vw - 48px));
  /* The cap is stated here rather than measured in JS, because a centred box
     has no anchor to be capped against. 76dvh leaves the veil visible top and
     bottom, so the dialog reads as floating over the page rather than as a
     second page. */
  max-height: min(76dvh, 720px);
  padding: var(--s2) var(--s2) var(--s3);
  border-radius: 22px;
  overflow-y: auto;
  overscroll-behavior: contain;
  translate: -50% -50%;
  /* Scale only. The popover rises from its button because that is where it came
     from; a centred dialog comes from nowhere and should not appear to drift. */
  transform: scale(.97);
  transform-origin: center;
  box-shadow: 0 2px 6px rgba(31, 65, 91, .10), 0 40px 90px -28px rgba(31, 65, 91, .45);
}
.pmenu--centre.is-open { transform: scale(1); }

/* Sticky, because a thirty-four row list scrolls under it and the reader
   should never have to scroll BACK to find the way out. */
.pmenu__dhead {
  position: sticky;
  top: calc(var(--s2) * -1);
  z-index: 2;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--s3);
  margin: calc(var(--s2) * -1) calc(var(--s2) * -1) var(--s1);
  padding: var(--s4) var(--s4) var(--s3);
  border-bottom: 1px solid var(--line);
  border-radius: 22px 22px 0 0;
  background: rgba(255, 255, 255, .92);
  -webkit-backdrop-filter: blur(12px) saturate(1.4);
  backdrop-filter: blur(12px) saturate(1.4);
}
.pmenu__dtitle {
  font-size: var(--fs-card-title);
  font-weight: 650;
  letter-spacing: -.015em;
  color: var(--ink);
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.pmenu__dclose {
  flex: none;
  display: grid;
  place-items: center;
  width: 34px;
  height: 34px;
  border: 1px solid var(--line);
  border-radius: var(--r-pill);
  background: var(--surface);
  color: var(--ink-2);
  cursor: pointer;
  transition: background var(--t-fast) var(--ease), color var(--t-fast) var(--ease);
}
.pmenu__dclose:hover { background: var(--petrol-050); color: var(--ink); }
.pmenu__dclose .icon { width: 16px; height: 16px; }

/* The first group heading sits under the title now, so it does not need the
   extra air it was given for being first in the box. */
.pmenu--centre .pmenu__heading:first-child { padding-top: var(--s3); }

/* THE VEIL. Same values as the record sheet's scrim — one product, one way of
   saying "the thing in front is the thing you are dealing with". */
.pmenu-catcher--veil {
  z-index: calc(var(--z-sheet) - 1);
  background: rgba(10, 38, 44, .34);
  -webkit-backdrop-filter: blur(3px) saturate(.9);
  backdrop-filter: blur(3px) saturate(.9);
  opacity: 0;
  transition: opacity var(--t-base) var(--ease);
}
.pmenu-catcher--veil.is-open { opacity: 1; }

@media (max-width: 767px) {
  .pmenu--centre {
    width: calc(100vw - 32px);
    max-height: 82dvh;
  }
}

/* ══ 5 · sprite glyphs on cards and in the gallery ═══════════════════════
   A domain's mark is a sprite symbol rather than an exported file, so it
   inherits currentColor — white on a gradient card, petrol in a rail row —
   from one definition. See glyph() in ModuleCard.js. */
.card__icon--sprite,
.c-head__icon--sprite,
.l-compact__icon--sprite,
.l-empty__glyph {
  display: grid;
  place-items: center;
}
/* THE COMPACT DOOR NEEDED ITS OWN LINE AND IT IS WORTH SAYING WHY.
   glyph() names the wrapper after whatever the layout asked for and appends
   `--sprite`, so a sprite in a layout with no rule for it gets an <svg> with no
   width — which resolves to the viewport, not to 34px, and a 124px card came
   out 199px tall. It went unnoticed for two sessions because every group that
   carried a sprite was a Site DOMAIN, and no domain offers a compact card.
   Housing is the first MODULE with a sprite, so it is the first to reach here. */
.card__icon--sprite .glyph,
.l-compact__icon--sprite .glyph {
  width: 100%;
  height: 100%;
  stroke-width: 1.5;
}
.c-head__icon--sprite .glyph { width: 20px; height: 20px; }
.mod-row__icon.is-sprite,
.detail-head__icon.is-sprite { display: grid; place-items: center; color: var(--on-dark); }
.mod-row__icon.is-sprite .glyph { width: 20px; height: 20px; }
.detail-head__icon.is-sprite .glyph { width: 26px; height: 26px; }

/* ══ 6 · HEALTH — one index and the domains it is made of ════════════════ */

.l-health { position: relative; z-index: 2; display: flex; flex: 1 0 0; flex-direction: column; min-height: 0; }
.l-health__body { display: flex; align-items: center; gap: var(--s6); flex: 1 0 0; min-height: 0; }

.l-health__dial { position: relative; flex: none; width: 128px; }
.l-health__dial svg { display: block; width: 100%; height: auto; }

.l-health__read {
  position: absolute;
  left: 0;
  right: 0;
  top: 46%;
  transform: translateY(-50%);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 1px;
}
.l-health__pct {
  font-family: var(--font-num);
  font-size: var(--fs-stat);
  font-weight: 700;
  line-height: 1;
  letter-spacing: -.03em;
  font-variant-numeric: tabular-nums;
}
.l-health__word { font-size: var(--fs-label); font-weight: 550; opacity: .8; }

/* SIX ROWS IN TWO COLUMNS. Stacked they are 6 x 24px plus gaps against the
   132px a two-row card gives — they do not fit, and the card is wide enough
   that pairing them costs nothing. The `data-n` hook lets a shorter list stay
   in one column rather than leaving a ragged second one. */
/* ONE COLUMN BY DEFAULT, TWO ONLY WHEN THERE IS ROOM FOR TWO.
   This was written the other way round — two columns down to a 460px card —
   and the sweep found why that is wrong. `large` is 2 columns on the reference
   grid (374px) and THREE columns at the 768px band (536px), so a card that had
   comfortably gone single-column at 1024 came back as two 164px columns on an
   iPad in portrait, and "Maintenance / Attention" does not fit in 164px.
   Deriving the threshold from the space the rows actually get — the card less
   the 128px dial and its gap, over two columns, needing ~200px each — puts it
   at 620px, which only `full` reaches. Measured, then set. */
.l-health__rows {
  display: grid;
  grid-template-columns: 1fr;
  gap: var(--s2) var(--s6);
  align-content: center;
  flex: 1 1 auto;
  min-width: 0;
}
@container card (min-width: 620px) {
  .l-health__rows { grid-template-columns: 1fr 1fr; }
  .l-health__rows[data-n='1'],
  .l-health__rows[data-n='2'],
  .l-health__rows[data-n='3'] { grid-template-columns: 1fr; }
}

.l-health__row { display: flex; align-items: baseline; gap: var(--s2); min-width: 0; }
.l-health__dot {
  flex: none;
  width: 8px;
  height: 8px;
  border-radius: var(--r-pill);
  background: var(--c-ok);
  translate: 0 -2px;
}
.l-health__row[data-tone='warn'] .l-health__dot { background: var(--c-warn); }
.l-health__row[data-tone='alert'] .l-health__dot { background: var(--c-alert); }
.l-health__name {
  flex: 1 1 auto;
  font-size: var(--fs-body);
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.l-health__state {
  flex: none;
  font-size: var(--fs-label);
  font-weight: 600;
  opacity: .8;
  white-space: nowrap;
}

/* A large card is half the width of a full one, so the pairs go back to a
   single column and the dial gives up size first — it is still legible at
   96px and "Maintenance  Attention" is not legible clipped. */
/* A large card is half the width of a full one. The dial gives up size first,
   because it is still legible at 96px and "Maintenance  Attention" is not
   legible clipped. */
@container card (max-width: 460px) {
  .l-health__body { gap: var(--s4); }
  .l-health__dial { width: 96px; }
  .l-health__pct { font-size: var(--fs-stat-sm); }
  .l-health__rows { gap: 5px; }
  .l-health__name { font-size: var(--fs-label); }
  .l-health__state { font-size: var(--fs-micro); }
}
@container card (max-width: 330px) {
  .l-health__body { flex-direction: column; align-items: flex-start; gap: var(--s3); }
  .l-health__dial { width: 108px; align-self: center; }
}

/* ══ 7 · INSIGHT — what changed, in sentences ════════════════════════════
   No badge, no sparkle, no phrasing that pretends to advise. The brief's own
   warning — "do not make this look like an AI gimmick" — is the entire design
   note, and the way to honour it is for the card to look like the operations
   report it is quoting. */

.l-insight { position: relative; z-index: 2; display: flex; flex: 1 0 0; flex-direction: column; min-height: 0; }
.l-insight__items {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: var(--s3) var(--s8);
  align-content: center;
  flex: 1 1 auto;
  min-height: 0;
  margin-top: var(--s2);
}
.l-insight__item { display: flex; align-items: baseline; gap: var(--s2); min-width: 0; }

/* The arrow carries direction and nothing else — no colour, because a 6%
   fall in electricity is good and an 18% rise in maintenance is not, and a
   card cannot know which way round the reader wants it. */
.l-insight__arrow {
  flex: none;
  width: 18px;
  font-family: var(--font-num);
  font-size: var(--fs-label);
  font-weight: 700;
  opacity: .55;
  text-align: center;
}
.l-insight__text {
  font-size: var(--fs-body);
  line-height: 1.34;
  opacity: .88;
  min-width: 0;
}
.l-insight__figure { font-weight: 700; opacity: 1; font-variant-numeric: tabular-nums; }
.l-insight__caption {
  flex: none;
  margin-top: var(--s3);
  font-size: var(--fs-micro);
  opacity: .62;
}

@container card (max-width: 520px) {
  .l-insight__items { grid-template-columns: 1fr; gap: var(--s2); }
  .l-insight__text { font-size: var(--fs-label); }
}

/* ══ 8 · EMPTY — a Site that does not have this yet ══════════════════════
   Section 15 of the brief. A neutral outlined surface rather than the domain
   gradient under a veil: an empty card is not a quiet version of a full one,
   it is a different thing, and on a workspace where a third of the cards have
   nothing to say the ones that DO must still be the ones that carry. */

.card[data-fill='empty'] {
  background: rgba(255, 255, 255, .58);
  border: 1px dashed var(--line-2);
  color: var(--ink-2);
  box-shadow: none;
}
.card[data-fill='empty']:hover { background: rgba(255, 255, 255, .78); }

.l-empty { position: relative; z-index: 2; display: flex; flex: 1 0 0; flex-direction: column; min-height: 0; }
.l-empty .c-head { color: var(--petrol-700); }
.l-empty__body {
  display: flex;
  flex: 1 1 auto;
  flex-direction: column;
  justify-content: center;
  gap: var(--s2);
  min-height: 0;
}
.l-empty__mark { display: flex; color: var(--ink-4); }
.l-empty__glyph { width: 26px; height: 26px; }
.l-empty__glyph .glyph { width: 100%; height: 100%; stroke-width: 1.5; }
.l-empty__note {
  font-size: var(--fs-label);
  line-height: 1.35;
  color: var(--ink-2);
  /* Three lines at most. A fourth means the copy is explaining rather than
     naming, and an empty card is not the place for a paragraph. */
  display: -webkit-box;
  -webkit-line-clamp: 3;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
/* IT ELLIPSISES NOW, because a 1x1 card gives it 147px and "Schedule
   Inspection" was 144 before its own padding. Shortening the copy fixed the two
   that overflowed; this makes the next one impossible. */
.l-empty__action {
  flex: none;
  align-self: flex-start;
  max-width: 100%;
  overflow: hidden;
  text-overflow: ellipsis;
  margin-top: var(--s3);
  padding: 6px var(--s3);
  border: 1px solid var(--line-2);
  border-radius: var(--r-pill);
  background: var(--surface);
  font-size: var(--fs-micro);
  font-weight: 650;
  color: var(--ui-link);
  white-space: nowrap;
}
.card[data-fill='empty']:hover .l-empty__action { border-color: var(--petrol-200); }

/* One row tall leaves 132px: the glyph is the first thing out, because the
   sentence is the content and a decorative mark is not. */
.card[data-h='1'] .l-empty__mark { display: none; }
.card[data-h='1'] .l-empty__note { -webkit-line-clamp: 2; }
.card[data-h='1'] .l-empty__action { margin-top: var(--s2); }

/* ══ 8c · THE CARD IS THE CONTROL ════════════════════════════════════════
   No CTA, no arrow, no footer link — the whole surface navigates, so the
   affordance has to BE the surface. Three states and nothing drawn: hover
   lifts, press settles, focus rings.

   A little more press than the home page's, because on a workspace where every
   card is a destination the press is the only thing that says the tap landed —
   there is no label to grey and no ripple. */
.card:focus-visible { outline: 2px solid var(--ui-link); outline-offset: 3px; }
body.is-site .card:active { transform: scale(.978); }
@media (hover: hover) {
  body.is-site .card:hover { transform: translateY(-3px); }
}

/* FOUR STATUS ROWS IN A TWO-ROW CARD GET MORE AIR, NOT MORE MARGIN.
   The rows are centred, so a short list pools its slack in two thick bands
   above and below itself and reads as a card that was cut short. Opening the
   gap spends the same pixels on rhythm instead. Six rows need no help. */
.card[data-h='2'] .l-status__rows[data-n='3'] { gap: var(--s6); }
.card[data-h='2'] .l-status__rows[data-n='4'] { gap: var(--s5); }

/* A SHORT LIST IN A TALL CARD SITS IN THE MIDDLE OF IT, NOT AT THE TOP.
   Four work-order rows under a title, with a floor beneath them, left the
   whole lower half of the card empty and the rows crowded against the
   heading — which reads as content that was cut, not content that fits. The
   status and metrics layouts already centre; the queue and the meters were the
   two that did not. */
.card[data-h='2'] .l-queue__rows,
.card[data-h='2'] .l-meters__rows { flex: 1 1 auto; justify-content: center; }

/* ══ 8b · two narrow-card rules the overflow sweep asked for ═════════════ */

/* A 1x1 METRICS CARD CANNOT PUT THREE FIGURES SIDE BY SIDE.
   147px of content box over three columns is 36px each, and "Managers" is 66.
   Stacked, each metric becomes one line — figure then label — and three of them
   come to 72px against the 132px a one-row card gives.

   No module card reaches this: metrics variations in the module catalogue
   support medium and large only, so the smallest they are ever drawn is 374px.
   The KPI band the brief asks for (`Small = KPI / Status`) is what brought a
   1x1 metrics card into existence at all. */
@container card (max-width: 215px) {
  .card[data-h='1'] .l-metrics__row { flex-direction: column; gap: 3px; }
  .card[data-h='1'] .metric {
    flex: none;
    flex-direction: row;
    align-items: baseline;
    gap: 6px;
  }
  .card[data-h='1'] .metric__value { font-size: var(--fs-body); }
  .card[data-h='1'] .metric__label { font-size: var(--fs-micro); opacity: .8; }
}

/* A WORDY QUEUE STACKS ON A NARROW CARD — see the note in ModuleCard.js for
   what "wordy" means and why it is detected rather than declared. "Site
   In-charge" beside "Ramesh Kumar" in a 200px content box left the label 66px;
   over two lines they both fit whole, which is the only version of this card
   worth showing. */
@container card (max-width: 300px) {
  .l-queue[data-wordy] .l-queue__row { flex-direction: column; align-items: flex-start; gap: 0; }
  .l-queue[data-wordy] .l-queue__value { font-size: var(--fs-label); opacity: .82; }
}


/* ══ 10 · HOUSING → SITES · the listing ══════════════════════════════════
   The page between the home page and a Site Workspace. It is a table in
   everything but markup — four Sites in comparable columns, ranked by what is
   open — because the decision it serves is comparative and a comparison wants
   its values stacked under each other. See SitesList.js.

   THE SURFACE IS THE OPPOSITE OF A CARD. Every widget in this product is a
   saturated gradient you go INTO; the listing is a quiet sheet you read ACROSS.
   Putting four gradient cards here would have made the page look like a
   workspace one level too early, and made a Site's colour mean something (it
   does not — a Site is not a domain). */

/* NO `display` DECLARATION HERE, DELIBERATELY. The listing and the workspace
   are toggled with the `hidden` attribute, and `hidden` is only a UA rule of
   `display: none` — any class on the same element that sets `display` wins on
   specificity and the "hidden" panel stays on screen underneath the one that
   replaced it. A div is already a block; saying so cost an hour. */

.sites-head { align-items: baseline; }
.sites-head__note {
  margin: 0 0 0 auto;
  font-size: var(--fs-micro);
  color: var(--ink-3);
}

.sites-list {
  display: flex;
  flex-direction: column;
  gap: var(--s3);
  margin: 0;
  padding: 0;
  list-style: none;
}

/* ── one Site ──
   A grid rather than three floated blocks, so the four figures land in the
   same place on every row. That alignment is the whole reason this is a list:
   41 staff under 104 staff is a comparison; 41 staff wherever it happens to
   fall is a fact you have to hunt for. */
.site-row {
  position: relative;
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(0, 292px) minmax(0, 202px) 18px;
  align-items: center;
  gap: var(--s4);
  width: 100%;
  min-height: 104px;
  padding: var(--s4) var(--s4) var(--s4) var(--s5);
  border: 1px solid var(--line);
  border-radius: var(--r-card);
  background: linear-gradient(180deg, rgba(255, 255, 255, .94), rgba(255, 255, 255, .78));
  backdrop-filter: blur(10px);
  box-shadow: var(--e0);
  font-family: inherit;
  text-align: left;
  cursor: pointer;
  transition: border-color var(--t-fast) var(--ease), background var(--t-fast) var(--ease),
              transform var(--t-fast) var(--ease), box-shadow var(--t-fast) var(--ease);
}
.site-row:hover {
  border-color: var(--petrol-200);
  background: var(--surface);
  box-shadow: var(--e1);
}
.site-row:active { transform: scale(.995); }

/* NO RAIL DOWN THE EDGE. There was a 4px state bar at the leading edge of every
   row, and it was the third thing on the row saying the same word: the status
   PILL says "Needs Attention" in letters, the open-items list says what is
   actually open, and the count says how many. A colour a reader has to decode
   against two labels that already spell it out is decoration wearing a
   semantic's clothes — and it pushed the Site name off the row's own left edge,
   so nothing in the list lined up with anything above it. */

.site-row__id { min-width: 0; }
.site-row__title { display: flex; align-items: baseline; gap: var(--s2); min-width: 0; }
.site-row__name {
  font-size: var(--fs-title);
  font-weight: 650;
  letter-spacing: -.015em;
  color: var(--ink);
  min-width: 0;
  overflow: hidden;

       content, on the reasoning that it is a small control and the eye passes
       through there anyway. That was the wrong altitude for it: WHICH WORKSPACE
       is a bigger question than anything below it, and a control that decides
       what the whole page is should not be discovered after the page has been
       read. Above the greeting it also stops competing with the Site header a

  <div class="wswitch-row">

         to a page whose switcher was buried under the search field: with the
         switcher now FIRST, the selected tab already says which workspace this
         is, in more words than a title did — and the Site header below names

        so the measured page is still the measured page. -->

    <!-- ══ hero banner ═════════════════════════════════════════════════
         Figma "Egg Module": the leopard photograph under a flat 40% black,
         the mark rotated −45°, the title at 36px, carousel dots at the foot.

         AN ANCHOR, NOT A BUTTON. It navigates, so it is a link — which is not
         pedantry: an <a href> gets cmd-click, middle-click, "Open in New Tab",
         the destination in the status bar on hover, and Enter from the
         keyboard, all for nothing. A <button> with a click handler has to
         re-implement each of those and never does.

         A NEW TAB, so the dashboard is still there to come back to.

         `rel="noopener"` comes with it. Without it the opened page gets a live
         `window.opener` handle back to this one and can redirect it — current
         browsers imply noopener for `target="_blank"`, but the ones that do not
         are exactly the ones that matter here, so it is written down.

         `noreferrer` is deliberately NOT added: it would strip the Referer, and
         the Command Centre is this dashboard's own sibling rather than a third
         party we are hiding from.

         The new tab is also announced. A link that behaves differently from
         every other link should say so, and the only readers who cannot see it
         happen are the ones being told here — the span is visually hidden, so
         the banner is unchanged to the eye. -->
    <a class="hero" href="https://antz-command-centre-v5.vercel.app/"
       target="_blank" rel="noopener">

      <span class="hero__scrim" aria-hidden="true"></span>

    </a>

        supposed to feel like turning a page over, not like loading one. -->
   <div id="panel-site" role="tabpanel" aria-label="Site Command Centre" hidden>

    <div id="sitesList" hidden></div>

        <div class="section-head__actions"></div>
      </div>
      <div id="siteGrid"></div>
    </section>

   </div>

/* A stand-in for the module loader the file:// protocol will not provide.
   Modules are registered in dependency order and evaluated on first request,
   so `__req` never has to resolve anything that has not already been defined. */
var __mods = {};
function __def(id, fn) { __mods[id] = { fn: fn, ns: null }; }
function __req(id) {
  var m = __mods[id];
  if (!m) throw new Error('module not bundled: ' + id);
  if (!m.ns) { m.ns = {}; m.fn(m.ns, __req); }
  return m.ns;
}

 * ───────────────────────────────────────────────────────────────────────────
 * Turns an ordered list of cards into concrete {x, y, w, h} grid positions.

 *      up full of gaps the moment sizes are mixed.

 * module was actually made of. They answer the questions an operational home
 * page gets asked, which the first twelve could only answer as more numbers:
 *
 *   ring       a donut and a legend — what a total is MADE of.
 *   arc        a 240° gauge — how full something is.
 *   flow       stages with counts at each — where a population has got to.
 *   attention  one count that is the point, then the named things in it.
 *   meters     rows that each carry a track — when the remainder is the story.
 *   entity     one thing, named: a batch, an animal, a result.
 *   hierarchy  structure rather than statistics — what contains what.
 *
 * The test this has to pass is in the brief: looking at a module's five
 * previews, you should know they are five different KINDS of card before you
 * read a single label.
 *
 * ═══ FILL IS PART OF THE COMPOSITION ═══════════════════════════════════════
 *
 * Two families, and which one a layout gets is not decoration — it is what the
 * card is for:
 *
 *   solid   the module's full gradient, white text. Cards you go THROUGH:
 *           door, compact, and actions, whose controls sit on the colour.
 *   soft    the same gradient under a white veil — a pale tinted surface with
 *           dark text. Cards you READ: numbers, lists, charts, timelines.
 *
 * One module therefore has bold tiles and quiet data surfaces in the same hue,
 * which is where most of the visible variety comes from. See cards.css.
 *
 * ═══ NO "VIEW →" ANYWHERE ══════════════════════════════════════════════════
 *
 * The whole card is the link. Every informational card used to end in a
 * "View Requests →" that repeated what clicking anywhere already did, cost a
 * line of vertical space and competed with the data above it. They are gone.
 * Quick Actions is the one exception, and its buttons are the content rather
 * than an afterthought at the foot.
 *
 * ═══ FIELDS ════════════════════════════════════════════════════════════════
 *   id             stable, persisted in the saved layout — never renumber
 *   moduleId       the module this card belongs to
 *   name           what the picker calls it, in the user's language
 *   layout         the composition, from the list above
 *   purpose        internal only — orders a module's shelf, never shown
 *   supportedSizes ordered; the picker offers exactly these and nothing else
 *   defaultSize    what it is added at
 *   priority       'primary' means "seeds the default home page", exactly
 *   data           the content, shaped to the layout
 */

/** Fill in what every variation has in common so the catalogue states only
    what is unusual. `fill` is derived from the layout unless overridden. */
const CARD_VARIANTS = [...DOORS, ...COMPACT, ...VARIANTS].map((v) => ({
  priority: 'optional',
  ...v,
  fill: v.fill || LAYOUT_FILL[v.layout] || 'solid',
  data: v.data || {},
}))

/**
 * id → variation. The saved layout stores ids, so this is the hot path.
 *
 * NULL PROTOTYPE, DELIBERATELY. A plain object inherits from Object.prototype,
 * so `VARIANT_BY_ID['toString']` would return a function rather than undefined,
 * `getVariant` would hand back something truthy, and repair() would then read
 * `.supportedSizes` off it and throw — during module evaluation, before app.js
 * runs. One junk value in localStorage would take down the whole page.
 */
const VARIANT_BY_ID = Object.assign(
  Object.create(null),
  Object.fromEntries(CARD_VARIANTS.map((v) => [v.id, v])),
)

function getVariant(id) {
  return (typeof id === 'string' && VARIANT_BY_ID[id]) || null
}

/** A module's cards in the order the picker shows them: doors first, then what
    the module knows, then what is waiting, then what you can do, then what
    just happened. */
function variantsForModule(moduleId) {
  return CARD_VARIANTS
    .filter((v) => v.moduleId === moduleId)
    .sort((a, b) =>
      (PURPOSES[a.purpose]?.rank ?? 9) - (PURPOSES[b.purpose]?.rank ?? 9) ||
      PRIORITY_RANK[a.priority] - PRIORITY_RANK[b.priority] ||
      a.name.localeCompare(b.name))
}

/** Every card the default home page is allowed to seed itself from. */
function primaryVariants() {
  return CARD_VARIANTS.filter((v) => v.priority === 'primary')
}

/**
 * REGISTER A SECOND CATALOGUE.
 *
 * The Site Command Centre has its own widgets, and they go through this same
 * renderer, packer and grid — see the note on registerGroups() in modules.js
 * for why they share one id space rather than being threaded through the
 * engine as a parameter.
 *
 * CARD_VARIANTS ITSELF IS NOT EXTENDED. It is the MODULE catalogue and several
 * things read it as exactly that: primaryVariants() decides the default home
 * page, the picker builds its search index from it, and antz.allVariants()
 * stress-tests it. Site widgets joining that array would put eighty cards the
 * module picker has never heard of into all three. Only the lookup is shared.
 */
function registerVariants(list) {
  for (const v of list || []) {
    if (v && typeof v.id === 'string') VARIANT_BY_ID[v.id] = v
  }

  __x.registerVariants = registerVariants;
  __x.CARD_VARIANTS = CARD_VARIANTS;

/**
 * A MINIMAL OBSERVABLE STORE
 * ───────────────────────────────────────────────────────────────────────────
 * Thirty lines instead of a framework. State goes in one place, mutations go
 * through one function, and anything that cares subscribes. That is the entire
 * contract, and for a page with one grid and one sheet it is enough.
 *
 * The one non-obvious rule: `set` REPLACES the slice it is given rather than
 * deep-merging it. Deep merges are where stores like this quietly go wrong —
 * an array that should have shrunk instead keeps its tail. Callers hand over
 * the new value outright.
 */
function createStore(initial) {
  let state = initial
  const listeners = new Set()

  return {
    get: () => state,

    /**
     * @param {object|function} patch  a partial slice, or (state) => partial
     * @param {object} meta            passed to listeners; the render layer uses
     *                                 `meta.reason` to decide whether a change
     *                                 needs a full rebuild or a cheap touch-up
     */
    set(patch, meta = {}) {
      const next = typeof patch === 'function' ? patch(state) : patch
      const prev = state
      state = { ...state, ...next }
      for (const fn of listeners) fn(state, prev, meta)
    },

    subscribe(fn) {
      listeners.add(fn)
      return () => listeners.delete(fn)
    },
  }
}
  __x.createStore = createStore;
});

__def('js/state/layoutStore.js', function (__x, __req) {
/**
 * LAYOUT STATE + PERSISTENCE
 * ───────────────────────────────────────────────────────────────────────────
 * The user's home page is one ordered array of {uid, variantId, size}. That is
 * the whole document. Positions are not in it — they are derived by the packer
 * from (order × column count) on every render, which is what lets the same
 * saved layout be correct on a phone, an iPad in both orientations and a wall
 * display without a single stored coordinate.
 *
 * PERSISTENCE IS DEFENSIVE. A layout written by an older build can name a card
 * that no longer exists, or a size a card no longer offers. Rather than throw —
 * which on a home page means a blank screen — `repair()` drops what it cannot
 * resolve and coerces what it can, then reports what it did. A user who last
 * used the product six months ago gets their layout minus one retired card,

const MODULE_BY_KEY = Object.assign(
  Object.create(null),
  Object.fromEntries(MODULES.map((m) => [m.key, m])),
)
const MODULE_BY_WIDGET = Object.assign(
  Object.create(null),
  Object.fromEntries(MODULES.map((m) => [m.widget, m])),
)

function getModule(key) {
  return (typeof key === 'string' && MODULE_BY_KEY[key]) || null
}
function moduleForWidget(widgetId) {
  return (typeof widgetId === 'string' && MODULE_BY_WIDGET[widgetId]) || null
}

/**
 * WHAT THIS ROLE IS OFFERED, IN TWO LISTS.
 * ───────────────────────────────────────────────────────────────────────────
 * `mine`  the modules the document marks as a priority for one of the seats
 *         this workspace role covers. This is the answer to "more modules based
 *         on my role" and it is the reason the menu is worth having: a
 *         Veterinarian's first four rows are Medical, Pharmacy, Welfare and
 *         Animal Profiles rather than the alphabet.
 * `rest`  everything else the role is PERMITTED to open. Not hidden, because a
 *         priority list is a suggestion and a permission is the rule — but
 *         below the fold and under its own heading, so the two are never
 *         confused for each other.
 *
 * A module the role may not see at all is in neither list. `permits` is passed
 * in rather than imported so this file stays free of the role catalogue — it
 * describes the product, not who is logged in.
 */
function modulesForRole(roleId, canSee) {
  const mine = new Set(ROLE_DOC_NAMES[roleId] || [])
  const out = { mine: [], rest: [] }
  for (const m of MODULES) {
    if (!canSee(m.domain)) continue
    ;(m.roles.some((r) => mine.has(r)) ? out.mine : out.rest).push(m)
  }
  return out
}

/** Every module widget id, for the catalogue to check itself against. */
const MODULE_WIDGET_IDS = MODULES.map((m) => m.widget)

  __x.MODULE_WIDGET_IDS = MODULE_WIDGET_IDS;
  __x.getModule = getModule;
  __x.moduleForWidget = moduleForWidget;
  __x.modulesForRole = modulesForRole;

/**
 * ══ T · THE ANTZ v5 MODULES, AS SITE CARDS ═════════════════════════════════
 *
 * One card per topic dashboard in `docs/Modules.md Files/` — thirty-four of
 * them, offered by the modules menu in the Site header and by the gallery like
 * everything else. See siteModules.js for the catalogue they come from.
 *
 * ═══ EVERY ONE CARRIES A FACT NO OTHER CARD ON THE PAGE CARRIES ════════════
 *
 * This is the whole design constraint and it took most of the work. The obvious
 * build is "put each module's headline KPI on a card", and it produces a
 * workspace that contradicts itself: the Maintenance module leads with 486 open
 * work orders, `site.maint.open` says twelve, and a reader who sees both learns
 * not to trust either. Nine of the thirty-four collided that way.
 *
 * So where a module's headline is already on the workspace, the card takes the
 * module's SECOND fact instead — the one that dashboard knows and the Site
 * summary does not. Maintenance stops counting jobs and reports the hours those
 * jobs cost. Assets stops counting assets and reports the ones whose service
 * contract has lapsed. Housing stops counting enclosures and reports how many
 * pass biosecurity. Each is a genuine reason to open that module, which is the
 * test §11 of the brief sets for a workspace card.
 *
 * ═══ THE FIGURES ARE AUTHORED AT THE REFERENCE SITE AND SCALED ═════════════
 *
 * The documents are facility-wide: 1,04,382 animals, 5,720 assets, 3,012 staff
 * across eight sites. A Site card cannot show those, and the two datasets do
 * not divide cleanly — the documents' facility runs 57 animals per enclosure
 * where Bannerghatta runs 6.6, so scaling every figure by its own denominator
 * gives some cards a plausible number and others a nonsense one.
 *
 * So each card is authored ONCE, for Bannerghatta — the Site this whole
 * catalogue was authored against, exactly as the note on `figures` in sites.js
 * describes — proportioned from the document's own figure, and `doc` records
 * the line it came from so any value can be traced. Every other Site scales
 * from it by ONE ratio: this Site's count against Bannerghatta's, on the base
 * the card names. Bannerghatta's own ratio is 1, so the authored value is what
 * it shows, which is the only arrangement where the authoring and the
 * arithmetic cannot quietly disagree.
 *
 *   base 'animals' | 'staff' | 'enclosures' | 'species'   what this fact tracks
 *   fixed: true                                a rate, a per-unit cost or a
 *                                              duration — it does not scale
 *
 * A COUNT THAT SCALES TO ZERO TURNS OVER TO ITS REASSURING CLAUSE, rather than
 * printing "0 critical". That is the same rule `site.assets.total` already
 * follows and the reason `none` is on every card that has a clause.
 *
 * AND THE REASSURING CLAUSE HAS TO BE ABOUT THE SAME THING THE COUNT WAS.
 * Six of these were written as a reassurance about the CARD instead, which put
 * "1 Paper Expiring" over "All current" and "4 Vacant Positions" over "Fully
 * staffed" — a headline figure flatly contradicted by the line under it. `none`
 * replaces the clause, not the card, so it answers the clause's question: the
 * Transport card's clause counts fitness certificates that have already lapsed,
 * so its `none` is "None expired" and the papers still expiring stay expiring.
 *
 * ═══ AND A COUNT THAT SCALES TO ONE TAKES THE SINGULAR ═════════════════════
 *
 * Scaling turned "6 critical breakdowns" into "1 critical breakdowns" and
 * "9 Open Alerts" into "1 Open Alerts" at the two smallest Sites. `label1` and
 * `clause1` are declared rather than derived by stripping an "s", because the
 * catalogue is full of words that do not work that way — Species, Papers, Staff
 * — and a plural rule that is right nine times in ten is a rule that ships a
 * typo. Only the cards whose count can actually reach one carry them.
 */

/** How a figure is written once it has been scaled. Counts, lakhs, rupees. */
const FIGURE = {
  int:   (n) => Math.round(n).toLocaleString('en-IN'),
  lakh:  (n) => `₹${n < 100 ? Math.round(n * 10) / 10 : Math.round(n)}L`,
  rupee: (n) => `₹${Math.round(n).toLocaleString('en-IN')}`,
}

/**
 * ONE FUNCTION PRODUCES A MODULE CARD'S DATA, AND IT IS CALLED TWICE.
 * ───────────────────────────────────────────────────────────────────────────
 * Once at load with `ratio` 1, which is how the catalogue entry below gets its
 * authored figures, and again from derive() with the live Site's ratio. Two
 * functions — one to author, one to scale — is how the reference Site ends up
 * showing something the authoring did not say.
 */
function moduleData(spec, ratio) {
  const fig = FIGURE[spec.fmt] || FIGURE.int
  const r = spec.fixed ? 1 : ratio
  const num = (n) => fig(n * r)
  const cnt = (n) => Math.max(0, Math.round(n * r))

  if (spec.layout === 'progress') {
    const v = spec.n * r
    /* `of` can never fall below `value` — a scaled pair that crosses over would
       draw a track past its own end, and the percentage would read over 100. */
    const o = Math.max(spec.of * r, v, 1)
    return {
      title: spec.title, value: fig(v), of: fig(o),
      pct: Math.round((v / o) * 100), caption: spec.caption,
    }
  }

  if (spec.layout === 'metrics') {
    return {
      title: spec.title,
      items: spec.items.map((i) => ({ value: cnt(i.n), label: i.label, tone: i.tone })),
    }
  }

  /* A DONUT AND ITS LEGEND. `n` on a segment is what the wedge is sized by and
     the printed value is the same number, so a reader can add the legend up and
     get the total in the middle. */
  if (spec.layout === 'ring') {
    const segs = spec.segments.map((g) => ({ label: g.label, n: cnt(g.n), value: String(cnt(g.n)) }))
    return {
      title: spec.title, unit: spec.unit,
      total: fig(segs.reduce((n, g) => n + g.n, 0)),
      segments: segs,
    }
  }

  /* A TREND, AND THE FIGURE IT ENDS ON. The summary carries the headline rather
     than the card carrying it twice: a chart whose summary repeats the number
     already drawn as the last point of the line is a card arguing with itself. */
  if (spec.layout === 'chart') {
    return {
      title: spec.title,
      series: spec.series.map((v) => ({ value: Math.max(0, v * r) })),
      summary: `${num(spec.n)} ${spec.label}`,
      delta: spec.delta,
    }
  }

  /* A FIGURE THAT NEEDS ACTING ON, AND WHAT IT IS MADE OF. A part that scales to
     nothing is dropped rather than printed as a zero — five rows one of which
     reads "0 Low" is four rows and a distraction. */
  if (spec.layout === 'attention') {
    return {
      title: spec.title,
      value: num(spec.n), label: spec.label,
      items: spec.items
        .map((i) => ({ text: i.text, value: cnt(i.n), tone: i.tone }))
        .filter((i) => i.value > 0),
    }
  }

  /* DOTTED ROWS — a state rather than a measurement, so the dot carries the
     meaning and the card is never repainted by its worst line. */
  if (spec.layout === 'status') {
    return {
      title: spec.title,
      items: spec.items.map((i) => ({ value: String(cnt(i.n)), text: i.text, tone: i.tone })),
    }
  }

  if (spec.layout === 'queue') {
    /* THE TOTAL IS THE SUM OF THE ROWS, NOT A SCALED FIGURE OF ITS OWN.
       Scaling them separately let the header round to three while the four rows
       rounded to two — a card whose parts do not add up to its own total, which
       is the exact failure the note on `site.people.mix` describes. */
    const rows = spec.rows.map((x) => ({ text: x.text, value: cnt(x.n) }))
    return {
      title: spec.title,
      total: String(rows.reduce((n, x) => n + x.value, 0)),
      rows,
    }
  }

  /* stat — a figure, its caption, and one clause worth acting on */
  const one = cnt(spec.n) === 1
  const data = {
    title: spec.title,
    value: num(spec.n),
    label: (one && spec.label1) || spec.label,
  }
  if (spec.subFixed) {
    data.sub = spec.clause
    data.subTone = spec.tone
  } else if (spec.clause) {
    const n = cnt(spec.sub)
    const word = (n === 1 && spec.clause1) || spec.clause
    data.sub = n ? `${n} ${word}` : spec.none
    data.subTone = n ? spec.tone : 'ok'
  }
  return data
}

/** A spec becomes a catalogue entry. Sizes come from the layout, not the card. */
const MODULE_SIZES = {
  stat:      { sizes: ['small', 'medium'],           initial: 'medium' },
  progress:  { sizes: ['medium', 'large'],           initial: 'medium' },
  metrics:   { sizes: ['small', 'medium', 'large'],  initial: 'medium' },
  queue:     { sizes: ['large'],                     initial: 'large' },
  /* A donut needs both halves on screen — the ring and the legend that names
     it — so it does not offer the one-row sizes. Same as the two rings the
     catalogue already had. */
  ring:      { sizes: ['large', 'tall'],             initial: 'large' },
  chart:     { sizes: ['medium', 'large'],           initial: 'medium' },
  attention: { sizes: ['large', 'tall'],             initial: 'large' },
  status:    { sizes: ['medium', 'large'],           initial: 'medium' },
}

const MODULE_WIDGETS = MODULE_CARDS.map((spec) => {
  const m = V5_MODULE_BY_KEY[spec.key]
  if (!m) throw new Error(`module card for an unknown module: ${spec.key}`)
  const size = MODULE_SIZES[spec.layout]
  return {
    id: m.widget,
    moduleId: m.domain,
    /* THE ONE FIELD A MODULE CARD HAS THAT NOTHING ELSE DOES, and everything
       downstream keys off it: the menu asks which card a module contributes,
       applySite() asks which cards scale, and the empty-state pass asks which
       cards inherit their domain's absence. */
    module: m.key,
    name: m.name,
    sprite: spec.sprite,
    layout: spec.layout,
    purpose: spec.purpose,
    level: spec.level,
    decision: spec.decision,
    spec,
    supportedSizes: size.sizes,
    defaultSize: size.initial,
    data: moduleData(spec, 1),
  }
})

/**
 * Fill in what every widget has in common, so the catalogue above states only
 * what is unusual. `requires` defaults to the widget's own domain, which is
 * true of all but one — Procurement is inside Finance and is gated with it.
 */
const SITE_WIDGETS = [...WIDGETS, ...MODULE_WIDGETS].map((w) => ({
  level: 3,
  priority: 'secondary',
  ...w,
  requires: w.requires || w.moduleId,
  fill: w.fill || LAYOUT_FILL[w.layout] || 'solid',
  data: w.data || {},
}))

const WIDGET_BY_ID = Object.assign(
  Object.create(null),
  Object.fromEntries(SITE_WIDGETS.map((w) => [w.id, w])),
)

function getWidget(id) {
  return (typeof id === 'string' && WIDGET_BY_ID[id]) || null
}

function widgetsForDomain(domainId) {
  return SITE_WIDGETS.filter((w) => w.moduleId === domainId)
}

/**
 * EMPTINESS IS A PROPERTY OF THE SITE, NOT OF THE WIDGET.
 * ───────────────────────────────────────────────────────────────────────────
 * The brief asks for real empty states and forbids fake zero values. The
 * temptation is to add an `isEmpty` flag to a widget, which is exactly the
 * fake: the widget is not empty, the SITE has no data for it. Hesaraghatta was
 * commissioned three weeks ago and has no asset register — the same Asset
 * Health card that is full at Bannerghatta has nothing to draw there, and
 * should say so rather than draw 0 of 0.
 *
 * So switching Site re-registers the catalogue with an `empty` marker on every
 * widget that Site lists as absent, and ModuleCard renders the empty
 * composition instead of the layout. One pass over ~70 objects on a switch the
 * user makes by hand: cheaper than any of the alternatives, and it keeps the
 * grid, the packer and the store completely unaware that emptiness exists.
 */

/**
 * THE PRISTINE CATALOGUE.
 *
 * applySite() rewrites `data` in place, so the values it starts from cannot be
 * the values it last wrote — two Site switches in a row would compound. This is
 * the catalogue as authored, cloned once, and every switch rebuilds from it.
 */
const BASE_DATA = new Map(SITE_WIDGETS.map((w) => [w.id, JSON.parse(JSON.stringify(w.data))]))

/**
 * FIGURES THAT ARE ALREADY IN THE SITE RECORD ARE DERIVED, NOT RE-TYPED.
 * ───────────────────────────────────────────────────────────────────────────
 * The Site header reads "19 Staff" from `site.counts` and the People widget
 * used to read "86 Staff" from the catalogue, on the same screen. That is the
 * worst class of bug this page can have — not a crash, a page that looks
 * completely fine and is wrong — and re-typing the numbers into four Sites'
 * worth of widget data would only move it to whichever one got edited last.
 *
 * So anything the Site record already knows is computed from it here, once, and
 * anything it does not know is written per Site in `figures` (see sites.js).
 * The split is not stylistic: a count that appears twice must have one source,
 * and a judgement — which two domains are dragging the health score down —
 * cannot be computed and has to be authored.
 *
 * The team mix holds its shape across Sites (roughly half keepers, a quarter
 * support) and the remainder is forced onto the largest group so the parts
 * always sum to the whole. A donut whose segments add up to 85 of 86 is a
 * rounding error the reader has no way to explain.
 */
function derive(site) {
  const c = site.counts
  const share = (pct) => Math.max(1, Math.round(c.staff * pct))
  const support = share(0.24), bio = share(0.14), clinical = share(0.13)
  const keepers = Math.max(1, c.staff - support - bio - clinical)
  const onLeave = Math.max(0, Math.round(c.staff * 0.09))
  const managers = Math.max(1, Math.round(c.staff * 0.05))
  const available = Math.round(((c.staff - onLeave) / Math.max(1, c.staff)) * 100)
  const occupied = Math.max(0, c.enclosures - site.free - site.restricted)
  const pct = Math.round((occupied / Math.max(1, c.enclosures)) * 100)
  const n = (x) => String(x)

  const figures = {
    /* ── the four counts the header also shows, and they come from here so the
       header and the cards cannot disagree ─────────────────────────────── */
    'site.people.count': { value: n(c.staff), sub: `${available}% available` },
    'site.space.sections': { value: n(c.sections), sub: `${c.enclosures} enclosures` },
    'site.space.count': { value: n(c.enclosures), sub: `${occupied} occupied` },
    'site.animal.summary': { value: n(c.species), sub: `${c.animals} animals` },
    /* THE TWO FIGURES OVER THE PHOTOGRAPH ARE THE SAME TWO THE HEADER SHOWS.
       They are the whole content of that card, so authoring them per Site would
       have been the staff-count bug with a picture behind it. */
    'site.animal.photo': { figures: [
      { value: n(c.species), label: 'Species' },
      { value: n(c.animals), label: 'Animals' },
    ] },

    /* ── the compositions that decompose one of those counts ───────────── */
    'site.people.mix': { total: n(c.staff), segments: [
      { label: 'Keepers',    n: keepers,  value: n(keepers) },
      { label: 'Support',    n: support,  value: n(support) },
      { label: 'Biologists', n: bio,      value: n(bio) },
      { label: 'Clinical',   n: clinical, value: n(clinical) },
    ] },
    'site.people.today': { items: [
      { value: n(c.staff - onLeave), label: 'Active' },
      { value: n(onLeave),           label: 'On Leave', tone: 'warn' },
      { value: n(managers),          label: 'Managers' },
    ] },
    'site.space.util': {
      value: `${pct}%`, pct,
      facts: [
        { value: n(occupied),        label: 'Occupied' },
        { value: n(site.free),       label: 'Available' },
        { value: n(site.restricted), label: 'Restricted' },
      ],
    },
  }

  /**
   * ── AND THE THIRTY-FOUR MODULE CARDS, SCALED ─────────────────────────────
   * One ratio per card, on the base it names, against the Site the figures were
   * authored for. See section T of the catalogue for why it is one ratio rather
   * than a denominator per document.
   */
  const ref = getSite(REFERENCE_SITE)
  for (const w of MODULE_WIDGETS) {
    const base = w.spec.base
    const ratio = base && ref ? c[base] / Math.max(1, ref.counts[base]) : 1
    figures[w.id] = moduleData(w.spec, ratio)
  }

  /**
   * ONE OVERRIDE, AND IT IS THE RULE THIS FILE OPENS WITH.
   *
   * Animal Population's holding figure is the Site's own animal count — the
   * header shows it, `site.animal.summary` shows it, and a third card scaling
   * the document's 1,500 to something near it would be the staff-count bug
   * again. So the count comes off the record and the DOCUMENT'S RATIO decides
   * the capacity: 1,500 held against 3,854 approved is 38.9%, so a Site holding
   * 318 animals at the same density is approved for 817.
   */
  const capacity = Math.round(c.animals / (1500 / 3854))
  figures['mod.population'] = {
    title: 'Population',
    value: n(c.animals), of: n(capacity),
    pct: Math.round((c.animals / Math.max(1, capacity)) * 100),
    caption: 'Held against approved capacity',
  }

  return figures
}

function applySite(siteId) {
  const site = getSite(siteId)
  const absent = new Set(site?.absent || [])
  const derived = site ? derive(site) : {}
  const authored = (site && site.figures) || {}

  /**
   * A MODULE CARD IS ABSENT WHEN ITS DOMAIN IS, AND THAT IS INFERRED RATHER
   * THAN LISTED.
   * ───────────────────────────────────────────────────────────────────────
   * Hesaraghatta has no asset register, so it has no lapsed service contracts
   * either — and writing thirty-four more ids onto the Site record would mean
   * two lists that have to agree and will not. The summary cards are the
   * source: if every one of a domain's own cards is absent at this Site, the
   * module card that shares the domain has nothing to draw either.
   *
   * `absent` still wins where it names a module card outright, because the
   * inference cannot see everything — Utilities keeps its Conditions card at a
   * Site whose meters are not connected yet, so the domain is not empty even
   * though Energy and Water have nothing to report.
   */
  const emptyDomains = new Set()
  for (const domain of new Set(SITE_WIDGETS.map((w) => w.moduleId))) {
    const own = SITE_WIDGETS.filter((w) => w.moduleId === domain && !w.module)
    if (own.length && own.every((w) => absent.has(w.id))) emptyDomains.add(domain)
  }

  for (const w of SITE_WIDGETS) {
    /* Base, then what the Site record already knows, then what had to be
       written by hand. A shallow merge on purpose: `rows` and `items` are
       replaced outright rather than merged element by element, because a Site
       with three quarantine blocks and a Site with one do not have a
       "corresponding" second row. */
    w.data = { ...BASE_DATA.get(w.id), ...(derived[w.id] || {}), ...(authored[w.id] || {}) }

    if (absent.has(w.id) || (w.module && emptyDomains.has(w.moduleId))) {
      /* PER WIDGET FIRST, THEN PER DOMAIN. Three cards in the Assets domain —
         Assets, Infrastructure, Vehicles — all rendered "No asset register for
         this Site yet", one under the other, which reads as a broken template
         rather than as three things that are genuinely absent for the same
         reason. Only the ones that would repeat need an override. */
      w.empty = {
        note: EMPTY_BY_WIDGET[w.id]?.note || EMPTY_NOTES[w.moduleId] ||
              'No data recorded for this Site yet.',
        action: EMPTY_BY_WIDGET[w.id]?.action || EMPTY_ACTIONS[w.moduleId] || 'Add Data',
      }
    } else {
      delete w.empty
    }
  }
  registerVariants(SITE_WIDGETS)
  return SITE_WIDGETS
}

 * Everything the section record already knows, recomputed. Same rule as the
 * Site level: a count that appears twice must have one source.
 */
function derive(sec) {
  const c = sec.counts
  const encl = enclosuresIn(sec.id)
  const occupied = encl.filter((e) => !e.vacant).length
  const defects = encl.filter((e) => e.condition < 75).length
  const minor = encl.filter((e) => e.condition >= 75 && e.condition < 88).length
  const welfare = encl.filter((e) => e.welfare)
  const pct = (n) => Math.round((n / Math.max(1, c.enclosures)) * 100)

  return {
    'sec.overview.attention': { value: String(sec.attention) },
    'sec.overview.structure': { levels: [
      { value: String(c.enclosures), label: 'Enclosures' },
      { value: String(c.species),    label: 'Species' },
      { value: String(c.animals),    label: 'Animals' },
    ] },
    'sec.space.count':  { value: String(c.enclosures) },
    'sec.people.count': { value: String(c.staff) },
    'sec.animal.count': { value: String(c.animals) },
    'sec.space.util': {
      value: `${pct(occupied)}%`, pct: pct(occupied),
      facts: [
        { value: String(occupied),       label: 'Occupied' },
        { value: String(sec.free),       label: 'Available' },
        { value: String(sec.restricted), label: 'Restricted' },
      ],
    },
    /* THE ENCLOSURE LIST IS THE ENCLOSURES. Five rows, because a queue card
       shows five — the rest are one tap away through the card itself. */
    'sec.space.enclosures': { total: String(c.enclosures), rows: encl.slice(0, 5).map((e) => ({
      text: e.code, value: e.vacant ? 'Vacant' : String(e.occupants),
    })) },
    'sec.cond.summary': { total: String(c.enclosures), rows: [
      { text: 'Sound',         value: String(c.enclosures - minor - defects),
        pct: pct(c.enclosures - minor - defects) },
      { text: 'Minor defects', value: String(minor),   pct: pct(minor), tone: 'warn' },
      { text: 'Needs repair',  value: String(defects), pct: pct(defects), tone: 'alert' },
    ] },
    'sec.animal.summary': { items: [
      { value: String(c.species), label: 'Species' },
      { value: String(c.animals), label: 'Animals' },
      { value: String(Math.max(0, Math.round(c.animals * 0.06))), label: 'Vet Cases', tone: 'warn' },
      { value: String(welfare.length), label: 'Welfare',
        tone: welfare.length ? 'alert' : 'ok' },
    ] },
    'sec.animal.welfare': welfare.length
      ? { value: String(welfare.length), label: 'Raised',
          items: welfare.slice(0, 4).map((e) => ({
            text: `${e.code} · ${e.note ? 'Observation' : 'Review due'}`,
            tone: e.welfare === 'alert' ? 'alert' : 'warn' })) }
      : { value: '0', label: 'None Raised',
          items: [{ text: 'No welfare alerts in this section', tone: 'ok' }] },
    'sec.people.roster': { total: String(c.staff) },
    'sec.people.allocation': { total: String(c.staff), rows: allocation(c.staff) },
    'sec.resp.incharge': { name: sec.inCharge,
      meta: `Section In-charge · ${sec.name}` },
    'sec.resp.duties': { rows: [
      { text: 'Rounds',      value: sec.inCharge },
      { text: 'Feeding',     value: 'Ramya Prasad' },
      { text: 'Enrichment',  value: 'Vinod Hegde' },
      { text: 'Night Watch', value: 'Latha Murthy' },
    ] },
    'sec.cond.defects': defects + minor
      ? { value: String(defects + minor), label: 'Logged',
          items: encl.filter((e) => e.condition < 88).slice(0, 4).map((e) => ({
            text: `${e.code} · ${e.condition < 75 ? 'Barrier' : 'Fittings'}`,
            value: e.condition < 75 ? 'Repair' : 'Minor',
            tone: e.condition < 75 ? 'alert' : 'warn' })) }
      : { value: '0', label: 'None Logged',
          items: [{ text: 'Every enclosure here is sound', tone: 'ok' }] },
  }
}

function allocation(staff) {
  const keepers = Math.max(1, Math.round(staff * 0.57))
  const drivers = Math.max(0, Math.round(staff * 0.21))
  const maint = Math.max(0, Math.round(staff * 0.14))
  const vet = Math.max(0, staff - keepers - drivers - maint)
  return [
    { text: 'Keepers',     value: String(keepers) },
    { text: 'Drivers',     value: String(drivers) },
    { text: 'Maintenance', value: String(maint) },
    { text: 'Veterinary',  value: String(vet) },
  ]
}

const EMPTY_ACTIONS = {

  'd.environment': 'Install Sensor',
  'd.inventory':   'Open Store',
  'd.safety':      'Start Checks',
  'd.assets':      'Add Equipment',

function applySection(sectionId) {
  const sec = getSection(sectionId)
  const absent = new Set(sec?.absent || [])
  const derived = sec ? derive(sec) : {}

  for (const w of SECTION_WIDGETS) {
    w.data = { ...BASE_DATA.get(w.id), ...(derived[w.id] || {}) }
    if (absent.has(w.id)) {
      w.empty = {
        note: EMPTY_NOTES[w.moduleId] || 'Nothing recorded for this section yet.',
        action: EMPTY_ACTIONS[w.moduleId] || 'Add Data',
      }
    } else {
      delete w.empty
    }
  }
  registerVariants(SECTION_WIDGETS)
  return SECTION_WIDGETS
}

/* Individual names, so an enclosure's occupants are named rather than counted.
   Drawn deterministically from the enclosure code — the same FNV hash the rest
   of the hierarchy uses — so Bhima is always in CAR-02. */
const NAMES = ['Bhima', 'Kaveri', 'Arjun', 'Meenakshi', 'Raja', 'Tara', 'Shakti',
               'Nandini', 'Veera', 'Ganga', 'Surya', 'Chitra', 'Anand', 'Lakshmi',
               'Dhruva', 'Ira', 'Kabir', 'Nila', 'Ravi', 'Saanvi', 'Teja', 'Uma']

function hash(str) {
  let h = 2166136261
  for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619) }
  return h >>> 0
}

function individuals(enc) {
  const out = []
  const h = hash(enc.code)
  /* Six named, then a count — a card cannot list twenty-two peafowl, and a
     reader does not want it to. `enc.occ.list` shows what a `recent` card shows. */
  const n = Math.min(enc.occupants, 6)

  /* NO TWO ANIMALS IN ONE ENCLOSURE SHARE A NAME. The first version indexed the
     name table with a hash slice per position, and slices collide — HRB-03 came
     out holding two animals called Shakti, which is the kind of detail that
     makes a reader stop believing the rest of the page. Walk forward from the
     collision instead of rehashing, so the result is still deterministic. */
  const used = new Set()
  for (let i = 0; i < n; i++) {
    let k = ((h >>> (i * 3)) + i * 7) % NAMES.length
    while (used.has(NAMES[k])) k = (k + 1) % NAMES.length
    used.add(NAMES[k])
    const sex = ((h >>> (i * 5)) & 1) ? 'Male' : 'Female'
    const age = 2 + (((h >>> (i * 7)) & 0xff) % 16)
    out.push({ name: NAMES[k], kind: `${sex} · ${age} yrs`, when: `ID ${2200 + ((h >>> i) % 780)}` })
  }
  return out
}

/**
 * Everything the enclosure record knows. Note how much more of this card set is
 * derived than at the Site level — an enclosure IS its record, where a Site is a
 * organisation with judgements attached.
 */
function derive(enc) {
  const sec = getSection(enc.sectionId)
  const perAnimal = enc.occupants ? Math.round(enc.area / enc.occupants) : 0
  const capacity = Math.max(enc.occupants, Math.ceil(enc.area / 900) || 1)
  const density = Math.round((enc.occupants / capacity) * 100)
  const cond = enc.condition
  const welfare = enc.welfare === 'alert' ? 58 : enc.welfare === 'warn' ? 71 : 88
  const band = (n) => (n >= 85 ? 'Good' : n >= 70 ? 'Fair' : 'Poor')
  const tone = (n) => (n >= 85 ? 'ok' : n >= 70 ? 'warn' : 'alert')
  const k = (n) => (n >= 1000 ? (n / 1000).toFixed(1) + 'k' : String(n))

  return {
    'enc.overview.identity': {
      title: enc.code, name: enc.vacant ? 'Vacant' : enc.name,
      meta: `${enc.housing} · ${enc.area.toLocaleString('en-IN')} m²`,

    },
    'enc.overview.attention': enc.welfare || cond < 80
      ? { value: String((enc.welfare ? 1 : 0) + (cond < 80 ? 1 : 0)), label: 'Here',

            ...(enc.welfare ? [{ text: enc.note ? 'Welfare observation' : 'Welfare review due',
                                 value: 'Welfare', tone: enc.welfare === 'alert' ? 'alert' : 'warn' }] : []),
            ...(cond < 80 ? [{ text: 'Structural defect logged', value: `${cond}%`, tone: 'warn' }] : []),
          ] }
      : { value: '0', label: 'Nothing Open',
          items: [{ text: 'This enclosure is clear', tone: 'ok' }] },
    'enc.overview.status': { items: [
      { value: enc.vacant ? 'Vacant' : 'Occupied', text: 'Holding',
        tone: enc.vacant ? 'warn' : 'ok' },
      { value: enc.status === 'closed' ? 'Closed' : 'On View', text: 'Public',
        tone: enc.status === 'closed' ? 'alert' : 'ok' },
      { value: cond < 75 ? 'Check' : 'Secure', text: 'Barriers', tone: tone(cond) },
      { value: 'Locked', text: 'Access Gate', tone: 'ok' },
    ] },
    'enc.occ.summary': { items: [
      { value: String(enc.occupants), label: 'Occupants' },
      { value: enc.vacant ? '0' : '1', label: 'Species' },
      { value: k(enc.area),           label: 'm² Area' },
      { value: k(perAnimal),          label: 'm²/Animal' },
    ] },
    'enc.occ.list': enc.vacant
      ? { items: [{ name: 'No occupants', kind: 'Available for holding', when: '—' }] }
      : { items: individuals(enc) },
    'enc.occ.density': {
      value: `${density}%`, pct: density,
      facts: [

    'enc.condition.rating': { value: `${cond}%` },
    'enc.assess.score': { value: `${welfare}%` },
    'enc.condition.score': {
      value: `${cond}%`, pct: cond,
      facts: [
        { value: String(cond < 75 ? 2 : cond < 88 ? 1 : 0), label: 'Defects' },
        { value: enc.inspected, label: 'Inspected' },
      ],
    },
    'enc.condition.checks': { items: [
      { value: 'Sound', text: 'Perimeter', tone: 'ok' },
      { value: cond < 75 ? 'Repair' : cond < 88 ? 'Worn' : 'Sound', text: 'Barrier', tone: tone(cond) },
      { value: 'Sound', text: 'Gate',      tone: 'ok' },
      { value: 'Sound', text: 'Locks',     tone: 'ok' },
      { value: cond < 88 ? 'Worn' : 'Sound', text: 'Furniture', tone: cond < 88 ? 'warn' : 'ok' },
      { value: 'Sound', text: 'Drainage',  tone: 'ok' },
    ] },
    'enc.condition.defects': cond < 88
      ? { value: String(cond < 75 ? 2 : 1), label: 'Logged', items: [
          { text: 'Barrier mesh · east', value: cond < 75 ? 'Repair' : 'Minor', tone: tone(cond) },
          ...(cond < 75 ? [{ text: 'Climbing frame', value: 'Minor', tone: 'warn' }] : []),
        ] }
      : { value: '0', label: 'None Logged',
          items: [{ text: 'No structural defects logged', tone: 'ok' }] },
    'enc.assess.welfare': {
      value: `${welfare}%`, pct: welfare, label: band(welfare),
      rows: [
        { text: 'Nutrition',    value: 'Good', tone: 'ok' },
        { text: 'Environment',  value: band(cond), tone: tone(cond) },
        { text: 'Health',       value: enc.welfare ? 'Fair' : 'Good', tone: enc.welfare ? 'warn' : 'ok' },
        { text: 'Behaviour',    value: enc.welfare === 'alert' ? 'Poor' : 'Good',
          tone: enc.welfare === 'alert' ? 'alert' : 'ok' },
        { text: 'Mental State', value: enc.welfare ? 'Fair' : 'Good', tone: enc.welfare ? 'warn' : 'ok' },

            text: `${i.name} · ${n ? 'vitamin' : 'analgesic'}`, value: n ? '07:00' : '16:30' })) },
    /**

    'enc.vet.history': enc.vacant

      : (() => {

          return { items: [
            { text: `${who[0].name} · dental check`, meta: enc.inspected, tone: enc.welfare ? 'warn' : 'ok' },
            { text: `${both} · faecal sample`,       meta: '21 Aug', tone: 'ok' },

            { text: `${both} · annual exam`,         meta: '12 Jul', tone: 'ok' },
          ] }
        })(),
    'enc.assess.history': { items: [
      { text: `Welfare review · ${welfare}%`, meta: enc.inspected, tone: tone(welfare) },
      { text: 'Body condition · 4/5',         meta: '21 Aug', tone: 'ok' },
      { text: `Welfare review · ${Math.min(99, welfare + 11)}%`, meta: '31 Jul', tone: 'ok' },
      { text: 'Enclosure audit · Pass',       meta: '18 Jul', tone: 'ok' },
    ] },
    'enc.assess.behaviour': { items: [
      { value: enc.welfare === 'alert' ? '3 / 3' : '0 / 3', text: 'Pacing',
        tone: enc.welfare === 'alert' ? 'alert' : 'ok' },

      { value: 'Normal', text: 'Social',  tone: 'ok' },
      { value: enc.welfare ? 'Low' : 'Normal', text: 'Exploration',
        tone: enc.welfare ? 'warn' : 'ok' },
    ] },
    'enc.assess.trend': {
      series: [{ value: Math.min(99, welfare + 13) }, { value: Math.min(99, welfare + 15) },
               { value: Math.min(99, welfare + 11) }, { value: Math.min(99, welfare + 8) },
               { value: Math.min(99, welfare + 3) }, { value: welfare }],
      summary: `${welfare}% this month`,
      delta: enc.welfare
        ? { dir: 'down', text: `${13} points over six months` }
        : { dir: 'up', text: 'stable over six months' },
    },
    'enc.vet.cases': enc.welfare
      ? { value: '1', label: 'Open', items: [
          { text: `${individuals(enc)[0]?.name || 'Occupant'} · review`, value: 'Sep 04', tone: 'warn' }] }
      : { value: '0', label: 'None Open',
          items: [{ text: 'No open clinical cases here', tone: 'ok' }] },
  }
}

const EMPTY_NOTES = {
  'd.condition': 'No condition survey recorded for this enclosure yet.',
  'd.environment': 'No environmental sensor fitted to this enclosure.',
  'd.husbandry': 'No husbandry routine set up for this enclosure yet.',
  'd.assessment': 'No welfare assessment has been carried out here yet.',
}
const EMPTY_ACTIONS = {
  'd.condition': 'Survey Enclosure',
  'd.environment': 'Fit Sensor',
  'd.husbandry': 'Set Routine',
  'd.assessment': 'Assess Welfare',
}

function applyEnclosure(enclosureId) {
  const enc = getEnclosure(enclosureId)
  const absent = new Set(enc?.absent || [])
  const derived = enc ? derive(enc) : {}

  for (const w of ENCLOSURE_WIDGETS) {
    w.data = { ...BASE_DATA.get(w.id), ...(derived[w.id] || {}) }
    if (absent.has(w.id)) {
      w.empty = {
        note: EMPTY_NOTES[w.moduleId] || 'Nothing recorded for this enclosure yet.',
        action: EMPTY_ACTIONS[w.moduleId] || 'Add Data',
      }
    } else {
      delete w.empty
    }
  }
  registerVariants(ENCLOSURE_WIDGETS)
  return ENCLOSURE_WIDGETS
}

  __x.applyEnclosure = applyEnclosure;

__def('js/data/domainDetail.js', function (__x, __req) {
/**
 * WHAT IS UNDERNEATH A WIDGET
 * ───────────────────────────────────────────────────────────────────────────
 * A widget on the Site page is three lines and a figure. This is the record it
 * was summarised from — every field the operation actually keeps for that
 * dimension of the Site, laid out in the groups the discipline keeps them in.
 * Tapping a widget opens it. See WidgetDetail.js for the sheet that draws it.
 *
 * ═══ KEYED ON THE DOMAIN, NOT ON THE WIDGET ════════════════════════════════
 *
 * Eighty-four widgets at the Site, forty-one at a Section, thirty-eight at an
 * enclosure — a detail record per widget would be a hundred and sixty-three
 * documents, most of them the same document with a different tile on top, and
 * the second one written would already have drifted from the first.
 *
 * The rule the workspace already uses settles it: the destination is a property
 * of the DOMAIN rather than of the card. Every Maintenance widget opens
 * Maintenance, so every Maintenance widget opens the same record — and the
 * widget that was tapped names itself in the sheet's header and has its own
 * group scrolled to, which is the part that is actually per-widget.
 *
 * Adding an eighty-fifth widget tomorrow wires its detail by existing.
 *
 * ═══ ROWS ARE TUPLES ═══════════════════════════════════════════════════════
 *
 *   facts   ['Total animals', '318', 'across 42 species', 'ok']
 *   items   ['Fire Safety NOC pending', '', 'alert']
 *   table   cols: [...] and rows of cells, or {t: tone, c: [cells]}
 *
 * Seven hundred rows written as objects is seven hundred repetitions of four
 * keys, and the density is the point: this file is a data sheet, and it should
 * read like one.
 *
 * A value may be a FUNCTION of the subject, and that is not a convenience —
 * it is the same rule derive() follows in siteWidgets.js. Anything the Site
 * record already knows is computed from it, once, so the sheet and the widget
 * that opened it cannot disagree about how many animals are on the Site. Only
 * what the record does not hold is written as a string.
 *
 * ═══ AND NO COMPOSITE SCORES ═══════════════════════════════════════════════
 *
 * The source list this was built from asks for an "overall facility health
 * score", a "site-wise operational score" and an "animal health score by site
 * or enclosure". They are not here, for the reason Site Health was deleted from
 * this product: an index over incommensurable things is not an observation, two
 * Sites at 87% are not in comparable condition, and it hides the difference
 * between failing and unfinished. Every one of the three is replaced by the
 * counts it would have been computed from, which are both checkable and
 * actionable.
 *
 * What IS kept is a score a profession actually publishes and audits against —
 * body condition, the Five Domains welfare model, an enclosure audit result,
 * a hygiene audit. Those are measurements, not indices this product invented.
 */

/* ── the derivation helpers the rows are written against ─────────────────── */

/** A count the subject holds, or an em dash where this depth has no such thing. */
const n = (v) => (v == null ? '—' : String(v))
const pc = (a, b) => `${Math.round((a / Math.max(1, b)) * 100)}%`

/**
 * Anything scaled off the subject's own size, so a 34-animal field station does
 * not report a 318-animal Site's consumption. Stable, and stated once.
 */
function scaled(x, perAnimal, unit, dp = 0) {
  const v = x.animals * perAnimal
  return `${dp ? v.toFixed(dp) : Math.round(v)}${unit}`
}

 * FIGURES THAT ARE ALSO ON A CARD ARE READ FROM THE CARD.
 * ───────────────────────────────────────────────────────────────────────────
 * The sheet opens from a widget, on top of the widget, and the two are on
 * screen together for the length of the transition. A sheet that computes its
 * own "12 open jobs" over a card reading 9 is the bug this build has already
 * found once and written a note about — the same fact authored twice, correct
 * until one of them is edited.

 * rewritten for the current subject. Everything else the sheet shows is either
 * derived from the subject record or authored above, and neither of those can
 * disagree with a card, because no card holds it.
 */
const LIVE = {
  site: {
    maintOpen: 'site.maint.open', assets: 'site.assets.total', vetCases: 'site.animal.vet',
    tasks: 'site.work.tasks', overdue: 'site.work.overdue', approvals: 'site.work.approvals',
    incidents: 'site.safety.incidents',
  },
  section: {
    maintOpen: 'sec.maint.open', tasks: 'sec.work.tasks', overdue: 'sec.work.overdue',
  },
  enclosure: {
    tasks: 'enc.work.tasks', overdue: 'enc.work.overdue', vetCases: 'enc.vet.cases',
  },
}

/** The first integer in a string, for the "2 overdue" clauses under a figure. */
function firstInt(s, fallback = 0) {
  const m = /(\d+)/.exec(String(s ?? ''))
  return m ? Number(m[1]) : fallback
}

/**
 * ONE CONTEXT PER OPEN, built from the subject the workspace is showing. The
 * getters are passed in rather than imported, so this file stays a data file
 * and the three catalogues stay the app's business — see the call in app.js.
 */
function buildContext({ level, site, section, enclosure, getWidget, sections = [], enclosures = [], occupants = [] }) {
  const read = (key, fallback) => {
    const id = LIVE[level]?.[key]
    const w = id && getWidget ? getWidget(id) : null
    return w?.data?.value != null ? Number(w.data.value) : fallback
  }
  const readSub = (key, fallback) => {
    const id = LIVE[level]?.[key]
    const w = id && getWidget ? getWidget(id) : null
    return w?.data?.sub ? firstInt(w.data.sub, fallback) : fallback
  }

  const subject = level === 'enclosure' ? enclosure : level === 'section' ? section : site
  if (!subject) return null

  const counts = subject.counts || {}
  const animals = level === 'enclosure' ? (enclosure.occupants || 0) : (counts.animals || 0)
  const species = level === 'enclosure' ? (enclosure.vacant ? 0 : 1) : (counts.species || 0)
  const staff = level === 'enclosure' ? 1 : (counts.staff || 0)
  const encl = level === 'enclosure' ? 1 : (counts.enclosures || 0)

  const support = Math.max(1, Math.round(staff * 0.24))
  const bio = Math.max(1, Math.round(staff * 0.14))
  const clinical = Math.max(1, Math.round(staff * 0.13))
  const free = level === 'enclosure' ? 0 : (subject.free || 0)
  const restricted = level === 'enclosure' ? 0 : (subject.restricted || 0)
