 *
 * Section 11 of the brief makes a widget "context, summary and navigation", and
 * at every level but the last, some of that navigation is INTO the hierarchy
 * rather than off to a module. The enclosure list in a Section is the way into an
 * enclosure; the structure card is the way into whatever it counts. Everything
 * else opens the module its domain names.
 */
const DRILL_IN = new Set([
  'site.space.sections', 'site.space.door', 'site.overview.structure',
  'sec.space.enclosures', 'sec.space.door', 'sec.overview.structure',
])

const wsGrid = createModuleGrid({
  root: wsGridRoot,
  /* NOTHING IS LOCKED AT ANY LEVEL — see the note in siteWorkspaceStore.js. */
  isCore: () => false,
  onActivate(widget) {
    if (DRILL_IN.has(widget.id)) {
      if (goDown()) return
    }
    /* The destination is a property of the DOMAIN rather than of the card, so
       every People widget opens People and adding a seventh tomorrow does not
       mean remembering to wire it up. */
    const domain = getDomain(widget.moduleId)
    wsEdit.announce(`Opening ${domain?.module || widget.name}.`)
  },
  onRemove(uid) {
    const neighbour = wsGrid.neighbourOf(uid)
    if (!ws().removeCard(uid)) return
    wsGrid.restoreFocus(neighbour)
    wsEdit.announce('Widget removed from your workspace.')
  },
  onResize(uid, size, slot) {
    wsSizePopover.open(uid, size, slot)
  },
})

const wsSizePopover = createSizePopover({
  onResize(uid, size) {
    ws().resizeCard(uid, size)
    wsEdit.announce(`Resized to ${size}.`)
  },
})

const wsPicker = createModulePicker({
  source: WS_SOURCE,
  onAdd(batch) {
    const made = ws().addCards(batch)
    if (!made.length) return
    requestAnimationFrame(() => {
      wsGrid.slotFor(made[0].uid)?.scrollIntoView({
        behavior: prefersReducedMotion() ? 'auto' : 'smooth',
        block: 'center',
      })
      made.forEach((card, i) => {
        const slot = wsGrid.slotFor(card.uid)
        if (!slot) return
        animate(
          slot,
          [{ transform: 'scale(.86)', opacity: 0 }, { transform: 'scale(1)', opacity: 1 }],
          { duration: 320, delay: i * 45, easing: 'cubic-bezier(.16,1,.3,1)', fill: 'backwards' },
        )
      })
      wsEdit.announce(made.length === 1
        ? 'Widget added to your workspace.'
        : `${made.length} widgets added to your workspace.`)
    })
  },
})

const wsEdit = createEditMode({
  head: wsHeadEl,
  grid: wsGrid,
  root: wsGridRoot,
  onAdd: () => wsPicker.open(),
  getCards: () => ws().store.get().cards,
  /* Level-agnostic on purpose. "Customize Workspace" and "Add Widget" are the
     right words at all three depths, so the mode needs no per-level copy — the
     header above it already says what you are looking at. */
  labels: {
    title:     'Workspace',
    editTitle: 'Customize Workspace',
    add:       'Add Widget',
    hint:      'Drag widgets to rearrange. Press space on a widget to move it with the arrow keys.',
    entered:   'Customizing your workspace. Drag widgets to rearrange, or use the remove buttons.',
    saved:     'Workspace saved.',
  },
  onCommit(next, opts = {}) {
    ws().reorder(next, wsGrid.columns)
    if (opts.keepFocus) {
      requestAnimationFrame(() =>
        wsGrid.slotFor(opts.keepFocus)?.querySelector('.card')?.focus())
    }
  },
  onExit: () => paintWorkspace(),
})

bindHoldToEdit(wsGridRoot, wsEdit)

createDragController({
  grid: wsGrid,
  root: wsGridRoot,
  canDrag: () => wsEdit.editing,
  getCards: () => ws().store.get().cards,
  announce: (m) => wsEdit.announce(m),
  onGrab() { wsWorking = null },
  onPreview(next) {
    wsWorking = next
    paintWorkspace({ animate: true })
  },
  onCommit(next, { changed } = {}) {
    wsWorking = null
    if (changed) ws().reorder(next, wsGrid.columns)
    else paintWorkspace({ animate: true })
  },
})

/* ── the header ─────────────────────────────────────────────────────────── */

const ACTION_NAMES = {
  task: 'Add Task', incident: 'Report Incident', asset: 'Add Asset',
  request: 'Create Request', map: 'Site Map', export: 'Report',
  defect: 'Log Defect', obs: 'Record Observation', reading: 'Log Reading',
}

const wsHeader = createWorkspaceHeader({
  root: document.getElementById('siteHeader'),
  getState: () => viewStore.get(),
  onNavigate: (where) => wsEdit.announce(`Opening ${where}.`),
  onAction: (id) => wsEdit.announce(`${ACTION_NAMES[id] || id} — opening.`),
  onCustomize: () => (wsEdit.editing ? wsEdit.exit() : wsEdit.enter()),
  onReset() {
    ws().resetWorkspace()
    wsEdit.announce(`${cat().noun} workspace reset to the default for your role.`)
  },
  onRole: (id) => setRole(id),
  /**
   * ONE HANDLER FOR EVERY MOVE THROUGH THE HIERARCHY, because the header's
   * breadcrumb, its sibling menu, its counts strip and its More menu are all
   * asking for the same thing in different words.
   */
  onLevel(kind, id) {
    const st = viewStore.get()
    if (kind === 'up') { goUp(); return }
    if (kind === 'down') { goDown(); return }
    if (kind === 'site') {
      if (id && id !== st.siteId) setSite(id)
      else if (st.level !== 'site') setLevel('site')
      return
    }
    if (kind === 'section') {
      if (id) setSection(id)
      else goDown()
      return
    }
    if (kind === 'enclosure') {
      if (id) setEnclosure(id)
      else goDown()
    }
  },
})

/* ── painting ───────────────────────────────────────────────────────────── */

function paintWorkspace(opts = { animate: true }) {
  wsGrid.render(wsCards(), opts)
}

/* All three stores feed the same grid, so all three are subscribed and the
   guard is which level is live. A write to the section store while the
   enclosure is showing is a write nobody is looking at. */
for (const key of ['site', 'section', 'enclosure']) {
  workspaces[key].store.subscribe(() => {
    if (wsWorking) return
    if (levelId() !== key) return
    paintWorkspace()
  })
}

/* ── the switch ─────────────────────────────────────────────────────────── */

const panels = {
  modules: document.getElementById('panel-modules'),
  site: document.getElementById('panel-site'),
}
const searchInput = document.querySelector('.search__input')

const switcher = createWorkspaceSwitcher({
  root: document.getElementById('workspaceSwitch'),
  getView: () => viewStore.get().view,
  onChange: (view) => setView(view),
})

/* What the search field is scoped to, per level. */
function searchScope(st) {
  if (st.level === 'enclosure') {
    const enc = getEnclosure(st.enclosureId)
    return enc ? `Search ${enc.code}` : 'Search'
  }
  if (st.level === 'section') {
    const sec = getSection(st.sectionId)
    return sec ? `Search ${sec.name}` : 'Search'
  }
  const site = getSite(st.siteId)
  return site ? `Search ${site.short}` : 'Search'
}

/**
 * Bring the page into line with the store. Called for every change to view,
 * level, subject or role, because all of them move the same things — and one
 * function that reads the state and applies it is the only arrangement where
 * they cannot disagree. Nothing here decides anything; the store already did.
 */
const SUBJECT_REASONS = new Set(['site', 'section', 'enclosure', 'hash', 'init'])

function syncWorkspace(meta = {}) {
  const st = viewStore.get()
  const onSite = st.view === 'site'

  document.body.classList.toggle('is-site', onSite)
  document.body.dataset.level = st.level
  panels.modules.hidden = onSite
  panels.site.hidden = !onSite
  switcher.sync()

  /* Leaving a workspace leaves its edit mode. A user who switches away mid-edit
     and comes back to a page still wearing jiggling cards and a Done button has
     been handed a mode they did not ask to still be in. Changing LEVEL does the
     same, because the arrangement they were editing is not the one now showing. */
  if (onSite && edit.editing) edit.exit()
  if ((!onSite || SUBJECT_REASONS.has(meta.reason)) && wsEdit.editing) wsEdit.exit()

  searchInput.placeholder = onSite ? searchScope(st) : 'Search'
  searchInput.setAttribute('aria-label', searchInput.placeholder)

  if (meta.reason === 'role') {
    /* Every level's store, not just the live one — the user's arrangement at the
       other two depths is theirs too, and loading it lazily would mean the first
       drill-down after a role switch showed the previous role's page. */
    for (const key of ['site', 'section', 'enclosure']) workspaces[key].useRole(st.roleId)
  }

  if (SUBJECT_REASONS.has(meta.reason) || meta.reason === 'role') {
    /* The catalogue's DATA is what a subject changes — see applySite() and its
       two siblings. The saved arrangement is not touched, which is the point:
       your workspace is how you work, not a property of one enclosure. */
    cat().apply(st)

    /**
     * AND THE GRID HAS TO BE TOLD, because it cannot work this out for itself.
     *
     * The grid reconciles by uid and rebuilds a card only when its variantId or
     * its span changed — exactly right for every other update, and exactly wrong
     * for this one. Moving between two Sections changes neither: the same twenty
     * widgets at the same sizes, with completely different contents underneath.
     * Without this the workspace showed one Section's figures under another's
     * name, which is the worst failure this page can have because it is the one
     * that looks like it worked.
     */
    wsGrid.destroy()
  }

  wsHeader.render()
  if (onSite) paintWorkspace({ animate: !SUBJECT_REASONS.has(meta.reason) })
}

viewStore.subscribe((state, prev, meta) => {
  wsHeader.closeMenus()
  syncWorkspace(meta)
})

/* Escape goes up a level — the keyboard equivalent of the breadcrumb, and the
   thing a person tries first after drilling in. Not bound while a sheet or a
   menu is open, because there Escape already means "close this". */
document.addEventListener('keydown', (e) => {
  if (e.key !== 'Escape') return
  if (viewStore.get().view !== 'site') return
  if (wsPicker.isOpen || picker.isOpen || profileMenu.isOpen) return
  if (wsEdit.editing) return
  if (goUp()) e.preventDefault()
})

/* Edit mode is a session state at every level, for the same reason. */
for (const key of ['site', 'section', 'enclosure']) {
  workspaces[key].setEditing(false)
  workspaces[key].useRole(viewStore.get().roleId)
}
siteCat.applySite(viewStore.get().siteId)
sectionCat.applySection(viewStore.get().sectionId)
enclosureCat.applyEnclosure(viewStore.get().enclosureId)
syncWorkspace({ reason: 'init' })


/* ── render ─────────────────────────────────────────────────────────────── */

function paint(opts = { animate: true }) {
  grid.render(cards(), opts)
}

layoutStore.subscribe(() => {
  /* A store change that arrives mid-drag is the drag's own preview being
     committed; the grid is already showing it. */
  if (working) return
  paint()
})

/* Edit mode is a session state, not a saved one — a user who leaves the page
   mid-edit should come back to a readable home page. */
setEditing(false)
paint({ animate: false })

/* ── responsive reflow ──────────────────────────────────────────────────── */

/**
 * Nothing needs to happen on most resize events: the CSS handles the columns,
 * and the packer only has to re-run when the COLUMN COUNT changes. Dragging a
 * desktop window across two hundred pixels fires a hundred resize events and
 * should cause exactly zero repacks.
 */
let lastCols = currentColumns()
let resizeTimer = 0

function onResize() {
  clearTimeout(resizeTimer)
  resizeTimer = window.setTimeout(() => {
    const cols = currentColumns()
    if (cols === lastCols) return
    lastCols = cols
    /* Both grids, not just the visible one. The hidden panel is `hidden`, not
       unmounted, so it keeps its DOM and its stale `grid-area` values — repack
       it now and switching back is instant; skip it and the first frame after a
       rotation shows the previous column count. */
    paint({ animate: false })
    paintWorkspace({ animate: false })
  }, 120)
}

window.addEventListener('resize', onResize)
window.addEventListener('orientationchange', onResize)

/* ── developer conveniences ─────────────────────────────────────────────── */
Object.assign(window, {
  antz: {
    reset: resetLayout,
    state: () => layoutStore.get(),
    columns: currentColumns,
    /* test hook: put every variant on the grid at every size it declares, so a
       clipping regression cannot hide behind the default layout */
    allVariants() {
      const all = __req('js/data/cardVariants.js').CARD_VARIANTS
      const out = []
      let i = 0
      for (const v of all) for (const sz of v.supportedSizes) out.push({ uid: 'x' + (i++), variantId: v.id, size: sz })
      __req('js/state/layoutStore.js').setCards(out, { reason: 'stress' })
    },

    /**
     * The catalogue and the default home page have to agree, and there are two
     * files where they could quietly stop agreeing: a card promoted to
     * `priority: 'primary'` in cardVariants.js that nobody seeded, or a card
     * seeded in layoutStore.js that is no longer primary — or no longer exists.
     *
     * Cheap to check, invisible when it passes, and it names the file to open
     * when it fails.
     */
    checkDefaults() {
      const { primaryVariants, getVariant } = __req('js/data/cardVariants.js')
      const { DEFAULT_LAYOUT } = __req('js/state/layoutStore.js')

      const seeded = new Set(DEFAULT_LAYOUT.map((d) => d.variantId))
      const problems = []

      for (const v of primaryVariants()) {
        if (!seeded.has(v.id)) problems.push(`primary but not on the default home page: ${v.id}`)
      }
      for (const d of DEFAULT_LAYOUT) {
        const v = getVariant(d.variantId)
        if (!v) { problems.push(`seeded but not in the catalogue: ${d.variantId}`); continue }
        if (v.priority !== 'primary') problems.push(`seeded but ${v.priority}, not primary: ${d.variantId}`)
        if (!v.supportedSizes.includes(d.size)) {
          problems.push(`seeded at a size it does not support: ${d.variantId} @ ${d.size}`)
        }
      }

      if (problems.length) console.warn('[antz] default layout:\n  ' + problems.join('\n  '))
      else console.info('[antz] default layout agrees with the catalogue.')
      return problems
    },

    /* ── the Site Command Centre, at all three depths ────────────────── */
    site: {
      view: () => viewStore.get(),
      state: () => ws().store.get(),
      go: (v) => setView(v),
      site: (id) => setSite(id),
      section: (id) => setSection(id),
      enclosure: (id) => setEnclosure(id),
      level: (l) => setLevel(l),
      up: () => goUp(),
      down: () => goDown(),
      role: (id) => setRole(id),
      reset: () => ws().resetWorkspace(),

      /** What is under the current subject — for finding an id to drill into. */
      children() {
        const st = viewStore.get()
        if (st.level === 'site') return sectionsForSite(st.siteId).map((x) => x.id)
        if (st.level === 'section') return enclosuresIn(st.sectionId).map((x) => x.id)
        return []
      },

      /** Every widget of the CURRENT level at every size it declares. */
      allWidgets() {
        const out = []
        let i = 0
        for (const w of cat().widgets) for (const sz of w.supportedSizes) {
          out.push({ uid: 'x' + (i++), variantId: w.id, size: sz })
        }
        setView('site')
        ws().setCards(out, { reason: 'stress' })
      },
    },

    /**
     * THE THREE CATALOGUES' EQUIVALENT OF checkDefaults(), and it has one more
     * thing to assert than the home page does.
     *
     * The home page has one default arrangement. The Site Command Centre has
     * FIFTEEN — five roles across three levels — and each can go wrong in four
     * ways: naming a widget that does not exist, naming one at a size it does not
     * support, naming one the role is not permitted to see, or — the failure that
     * is invisible until you look at the page — not filling the five-column grid,
     * which leaves a hole the brief explicitly forbids.
     *
     * That last check is the reason this exists. Every default is composed from
     * blocks that fill two rows exactly (see roles.js), and it is very easy to
     * break that by changing one widget's `supportedSizes` in passing. The packer
     * is asked directly rather than trusted.
     */
    checkSiteDefaults() {
      const { pack, rowCount } = __req('js/lib/pack.js')
      const problems = []
      const catalogues = { site: siteCat, section: sectionCat, enclosure: enclosureCat }

      for (const role of __req('js/data/roles.js').ROLES) {
        for (const level of ['site', 'section', 'enclosure']) {
          const tag = `${role.id}/${level}`
          const getW = catalogues[level].getWidget
          const list = defaultsFor(role, level)
          if (!list.length) { problems.push(`${tag}: no default arrangement`); continue }

          const seen = new Set()
          for (const d of list) {
            const w = getW(d.id)
            if (!w) { problems.push(`${tag}: seeded but not in the catalogue: ${d.id}`); continue }
            if (!w.supportedSizes.includes(d.size)) {
              problems.push(`${tag}: seeded at a size it does not support: ${d.id} @ ${d.size}`)
            }
            if (!permits(role, w)) {
              problems.push(`${tag}: seeded but not permitted: ${d.id} (needs ${w.requires})`)
            }
            if (seen.has(d.id)) problems.push(`${tag}: seeded twice: ${d.id}`)
            seen.add(d.id)
          }

          /* Holes. Pack the role's seed at the reference five columns and count
             the cells that no card claimed. */
          const cards = workspaces[level].seedFor(role.id)
          const placed = pack(cards, 5)
          const rows = rowCount(placed)
          const filled = placed.reduce((n, p) => n + p.w * p.h, 0)
          const gap = rows * 5 - filled
          if (gap > 0) {
            problems.push(`${tag}: leaves ${gap} empty cell${gap === 1 ? '' : 's'} in ${rows} rows`)
          }
        }
      }

      if (problems.length) console.warn('[antz] workspace defaults:\n  ' + problems.join('\n  '))
      else console.info('[antz] all 15 role x level workspaces agree with their catalogue and pack without gaps.')
      return problems
    },

    /**
     * THE HIERARCHY ADDS UP.
     *
     * A Site header saying "12 Sections · 48 Enclosures · 86 Staff" over a
     * sections list whose rows come to 44 enclosures is the same class of bug
     * this build already found twice: not a crash, a page that looks completely
     * fine and is wrong. Cheap to check, invisible when it passes, and it names
     * the record to open when it fails.
     *
     * It also asserts that every enclosure a Site-level card NAMES exists — the
     * Welfare Alerts card points at two enclosure codes and Restricted Areas at
     * one, and a summary that names a thing the detail view cannot show teaches
     * the reader not to trust either.
     */
    checkHierarchy() {
      const { SITES } = __req('js/data/sites.js')
      const { sectionsForSite: secs, enclosuresIn: encs, getSection } = __req('js/data/sections.js')
      const problems = []

      for (const site of SITES) {
        const list = secs(site.id)
        if (!list.length) { problems.push(`${site.id}: no sections`); continue }
        if (list.length !== site.counts.sections) {
          problems.push(`${site.id}: ${list.length} section records against counts.sections ${site.counts.sections}`)
        }
        for (const key of ['enclosures', 'staff', 'species', 'animals']) {
          const sum = list.reduce((n, x) => n + x.counts[key], 0)
          if (sum !== site.counts[key]) {
            problems.push(`${site.id}: sections sum to ${sum} ${key}, site record says ${site.counts[key]}`)
          }
        }
        for (const sec of list) {
          const e = encs(sec.id)
          if (e.length !== sec.counts.enclosures) {
            problems.push(`${sec.id}: ${e.length} enclosures generated against counts.enclosures ${sec.counts.enclosures}`)
          }
          if (sec.siteId !== site.id) problems.push(`${sec.id}: siteId does not match`)
        }
      }

      /* Codes a Site-level card promises the reader they can go and look at. */
      const promised = ['CAR-02', 'HRB-03', 'REP-04']
      const all = new Set()
      for (const site of SITES) for (const sec of secs(site.id)) {
        for (const e of encs(sec.id)) all.add(e.code)
      }
      for (const code of promised) {
        if (!all.has(code)) problems.push(`a Site card names ${code}, which does not exist`)
      }

      if (problems.length) console.warn('[antz] hierarchy:\n  ' + problems.join('\n  '))
      else console.info('[antz] the hierarchy reconciles: 4 sites, 31 sections, 139 enclosures.')
      return problems
    },
  },
})


});

__req('js/app.js');
})();
</script>
</body>
</html>
