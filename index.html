        slots.set(item.uid, slot)
        root.append(slot)
      } else {
        syncSlot(slot, item)
      }

      /* +1 because CSS grid lines are 1-based while the packer counts cells */
      slot.style.gridArea = `${item.y + 1} / ${item.x + 1} / span ${item.h} / span ${item.w}`
      slot.style.setProperty('--i', String(live.size - 1))
    }

    for (const [uid, slot] of slots) {
      if (live.has(uid)) continue
      slots.delete(uid)
      dismiss(slot)
    }

    root.style.gridTemplateRows = `repeat(${Math.max(1, rowCount(next))}, var(--grid-row))`
    placed = next

    if (first) play(first)
    return next
  }

  /* ── slot construction ──────────────────────────────────────────────── */

  /**
   * The jiggle's per-card variation.
   *
   * FROM THE UID, NOT FROM THE INDEX AND NOT FROM Math.random().
   *
   * The index is wrong because it changes: reorder the grid and every card
   * would be re-assigned a new phase, so the whole page would visibly
   * re-synchronise on every drop. Random is wrong because the grid reconciles
   * rather than rebuilds — a card that survives a render keeps its element and
   * would keep its old value, while a new neighbour would get a fresh one, and
   * the two would drift apart for no reason a user could see.
   *
   * Hashed from the uid, the phase is a property OF THE CARD. It survives
   * reordering, resizing and re-rendering, and it is stable across a reload,
   * which is what makes the effect read as fourteen objects rather than
   * fourteen animations.
   */
  function jiggleFor(uid) {
    /* FNV-1a, not the usual `h * 31 + c`. The uids differ in one or two
       characters, and a weak hash leaves that difference sitting in the low
       bits — the first version of this took its duration from bits 5-7 and
       produced two distinct durations across fifteen cards, so the grid still
       drifted into step. FNV avalanches, so every slice is usable. */
    let h = 2166136261
    for (let i = 0; i < uid.length; i++) {
      h ^= uid.charCodeAt(i)
      h = Math.imul(h, 16777619)
    }
    const bits = (n, shift) => ((h >>> shift) & 0xffff) % n

    return {
      variant: ['a', 'b', 'c'][bits(3, 0)],
      /* Under one cycle, so no card ever sits visibly still waiting to start. */
      delay: bits(700, 7),
      /* 1.7–2.2s. Different durations matter more than different delays: two
         cards sharing a duration drift back into step no matter how they were
         offset, two on different durations never do. */
      duration: 1700 + bits(6, 15) * 100,
    }
  }

  function buildSlot(item) {
    const slot = document.createElement('div')
    slot.className = 'slot'
    slot.dataset.uid = item.uid
    slot.dataset.variant = item.variantId
    slot.dataset.size = item.size

    const j = jiggleFor(item.uid)
    slot.dataset.jiggle = j.variant
    slot.style.setProperty('--jiggle-delay', `${j.delay}ms`)
    slot.style.setProperty('--jiggle-dur', `${j.duration}ms`)

    const variant = getVariant(item.variantId)
    if (variant) {
      const card = renderCard(variant, { size: item.size, w: item.w, h: item.h, uid: item.uid })
      card.addEventListener('click', (e) => {
        /* In edit mode a card is a thing being moved, not a door. The drag
           controller cancels the click for a real drag; this catches the taps
           that never moved far enough to become one. */
        if (editing) { e.preventDefault(); return }
        onActivate?.(variant, item)
      })
      slot.append(card)
    }

    if (editing) decorate(slot, item)
    return slot
  }

  /**
   * Bring an existing slot up to date. Only the two things that can actually
   * change are checked, and the card is rebuilt only if one of them did —
   * rebuilding on every render would defeat the whole point of keying.
   */
  function syncSlot(slot, item) {
    const spanChanged = slot.dataset.w !== String(item.w) || slot.dataset.h !== String(item.h)
    const identityChanged = slot.dataset.variant !== item.variantId || slot.dataset.size !== item.size

    slot.dataset.w = String(item.w)
    slot.dataset.h = String(item.h)

    if (identityChanged || spanChanged) {
      const variant = getVariant(item.variantId)
      const old = slot.querySelector('.card')
      if (variant && old) {
        if (identityChanged) {
          const card = renderCard(variant, { size: item.size, w: item.w, h: item.h, uid: item.uid })
          card.addEventListener('click', (e) => {
            if (editing) { e.preventDefault(); return }
            onActivate?.(variant, item)
          })
          old.replaceWith(card)
        } else {
          /* span changed but the card did not — the container query and the
             `data-h` selector do the rest, so only the attributes move */
          old.dataset.w = String(item.w)
          old.dataset.h = String(item.h)
        }
      }
      slot.dataset.variant = item.variantId
      slot.dataset.size = item.size
    }

    /* edit affordances are added and removed as the mode changes */
    const hasControl = slot.querySelector('.slot__remove, .slot__locked')
    if (editing && !hasControl) decorate(slot, item)
    if (!editing) for (const c of slot.querySelectorAll('.slot__remove, .slot__locked, .slot__resize')) c.remove()
  }

  function decorate(slot, item) {
    /* Resize is offered on every card that has more than one size to offer —
       including the two core cards, which cannot be removed but can certainly
       be made smaller. */
    const variant = getVariant(item.variantId)
    if (variant && variant.supportedSizes.length > 1) {
      const size = document.createElement('button')
      size.type = 'button'
      size.className = 'slot__resize'
      size.innerHTML = icon('resize')
      size.setAttribute('aria-label', `Change size of ${variant.name} card`)
      size.addEventListener('click', (e) => {
        e.stopPropagation()
        onResize?.(item.uid, item.size, slot)
      })
      slot.append(size)
    }

    if (isCore(item.variantId)) {
      const lock = document.createElement('span')
      lock.className = 'slot__locked'
      lock.title = 'This module is always on your home page'
      lock.innerHTML = icon('security')
      slot.append(lock)
      return
    }
    const btn = document.createElement('button')
    btn.type = 'button'
    btn.className = 'slot__remove'
    btn.innerHTML = icon('minus')
    const name = slot.querySelector('.card')?.getAttribute('aria-label') || 'card'
    btn.setAttribute('aria-label', `Remove ${name}`)
    btn.addEventListener('click', (e) => {
      e.stopPropagation()
      onRemove?.(item.uid)
    })
    slot.append(btn)
  }


  /**
   * Removing a slot outright makes the cards around it jump. Fading it first
   * and taking it out of the packer on the next render lets the FLIP pass
   * animate the survivors into the space it left.
   */
  function dismiss(slot) {
    slot.style.pointerEvents = 'none'
    animate(
      slot,
      [{ opacity: 1, transform: 'scale(1)' }, { opacity: 0, transform: 'scale(.9)' }],
      { duration: 180, easing: 'cubic-bezier(.4,0,1,1)', fill: 'forwards' },
    ).finished.catch(() => {}).finally(() => slot.remove())
  }

  /**
   * Which card should take focus when `uid` is removed?
   *
   * Asked BEFORE the removal, because afterwards the card is gone from the
   * placement and there is no longer anything to be next to. Left alone, focus
   * falls to <body> and a keyboard user removing three cards has to tab in from
   * the top of the page each time.
   *
   * The card after it is the natural landing place; the one before it if it was
   * last.
   */
  function neighbourOf(uid) {
    const order = placed.slice()
    const i = order.findIndex((p) => p.uid === uid)
    if (i < 0) return null
    return order[i + 1]?.uid || order[i - 1]?.uid || null
  }

  /** Hand focus to a uid captured earlier, falling back to the Add tile. */
  function restoreFocus(uid) {
    const target =
      uid && slots.get(uid)?.querySelector('.card')
    target?.focus({ preventScroll: true })
  }

  /* ── FLIP ───────────────────────────────────────────────────────────── */

  function measure() {
    const m = new Map()
    for (const [uid, slot] of slots) m.set(uid, slot.getBoundingClientRect())
    return m
  }

  function play(first) {
    /* Everything below runs against the layout the browser has ALREADY done —
       `getBoundingClientRect` forces it once, here, and not again. */
    const moves = []
    for (const [uid, slot] of slots) {
      const f = first.get(uid)
      if (!f) continue
      const l = slot.getBoundingClientRect()
      const dx = f.left - l.left
      const dy = f.top - l.top
      if (Math.abs(dx) < 0.5 && Math.abs(dy) < 0.5) continue
      moves.push([slot, dx, dy])
    }
    if (!moves.length) return

    for (const [slot, dx, dy] of moves) {
      slot.classList.remove('is-flipping')
      slot.style.transform = `translate3d(${dx}px, ${dy}px, 0)`
    }

    requestAnimationFrame(() => {
      for (const [slot] of moves) {
        slot.classList.add('is-flipping')
        slot.style.transform = ''
        const done = () => {
          slot.classList.remove('is-flipping')
          slot.style.willChange = ''
          slot.removeEventListener('transitionend', done)
        }
        slot.addEventListener('transitionend', done)
      }
    })
  }

  /* ── public surface ─────────────────────────────────────────────────── */

  return {
    render,

    setEditing(on) {
      editing = on
    },

    get columns() { return cols },
    get placement() { return placed },
    get slots() { return slots },

    slotFor(uid) { return slots.get(uid) || null },

    neighbourOf,
    restoreFocus,

    /** Every real card slot in visual order — what the drag maths runs on. */
    orderedSlots() {
      return placed
        .map((p) => ({ ...p, el: slots.get(p.uid) }))
        .filter((p) => p.el)
    },

    destroy() {
      slots.clear()
      root.replaceChildren()
    },
  }
}

/**
 * DRAG CONTROLLER
 * ───────────────────────────────────────────────────────────────────────────
 * Pointer-Events drag and drop for the module grid. One code path serves a
 * finger on an iPad and a mouse on a desktop, because Pointer Events unify
 * them — which is also why the HTML5 drag-and-drop API is not used here: it has
 * never worked on touch and never will.
 *
 * THE GESTURE
 *   mouse   a drag starts as soon as the pointer has moved 4px with the button
 *           down. There is nothing else a press-and-move on a card in edit mode
 *           could mean.
 *   touch   a drag starts after the finger has been still for 200ms. Before
 *           that the page scrolls normally, which it has to — the grid is
 *           taller than an iPad. Move more than 8px inside those 200ms and the
 *           press is abandoned as a scroll.
 *
 * WHAT MOVES. The card is cloned into a fixed layer above the page and the
 * clone follows the pointer; the original stays in the grid at zero opacity so
 * its slot can draw the hole. Moving the real element instead would mean the
 * grid re-laying-out on every frame and the card being clipped the moment it
 * left the container.
 *
 * WHAT REFLOWS. On each frame the controller works out which index the pointer
 * is over, and if that has changed it reorders a working copy of the card list
 * and re-renders the grid. The grid's own FLIP pass animates every other card
 * into its new place — so "other cards move to create space" is not a special
 * case in here at all, it is what the grid already does when its input changes.
 */

const { moveItem } = __req('js/lib/pack.js');

const MOUSE_THRESHOLD = 4      // px before a mouse press becomes a drag
const TOUCH_HOLD_MS   = 200    // how long a finger must be still
const TOUCH_SLOP      = 8      // px of wander allowed during that hold
const EDGE            = 96     // autoscroll zone at the top and bottom
const EDGE_MAX_SPEED  = 22     // px per frame at the very edge

function createDragController({ grid, root, getCards, canDrag, onGrab, onCommit, onPreview, announce }) {
  let active = null            // the live gesture, or null
  let holdTimer = 0
  let raf = 0
  let layer = null

  /* ── entry point ────────────────────────────────────────────────────── */

  function onPointerDown(e) {
    if (active) return
    /* Cards are only draggable in edit mode. Outside it a press on a card is a
       press on a door, and the grid must scroll under a finger like any page. */
    if (canDrag && !canDrag()) return
    if (e.button != null && e.button > 0) return              // right / middle click
    if (e.target.closest('.slot__remove, .slot__locked')) return

    const slot = e.target.closest('.slot')
    if (!slot || !slot.dataset.uid) return

    const cards = getCards()
    const index = cards.findIndex((c) => c.uid === slot.dataset.uid)
    if (index < 0) return

    /* Belt and braces: if a previous gesture somehow ended without reaching
       finish(), the next press clears whatever it left behind. */
    onGrab?.()

    const rect = slot.getBoundingClientRect()

    active = {
      pointerId: e.pointerId,
      touch: e.pointerType !== 'mouse',
      slot,
      uid: slot.dataset.uid,
      startX: e.clientX,
      startY: e.clientY,
      x: e.clientX,
      y: e.clientY,
      /* where inside the card the pointer grabbed it, so the card does not jump
         to centre itself under the finger on lift */
      offsetX: e.clientX - rect.left,
      offsetY: e.clientY - rect.top,
      width: rect.width,
      height: rect.height,
      cards: cards.slice(),
      fromIndex: index,
      index,
      started: false,
      scrollDir: 0,
      /* Autoscroll stays disarmed until the pointer has been outside the edge
         zone at least once. Without this, picking up a card that happens to sit
         near the bottom of the screen starts the page scrolling the instant it
         lifts, and it runs away under the finger before the drag has begun. */
      scrollArmed: false,
    }

    /* Capture immediately, before the drag is confirmed. Without this a fast
       flick can move the pointer off the element between down and move, and the
       gesture is lost — with it, every subsequent event comes here regardless
       of what is underneath. */
    try { slot.setPointerCapture(e.pointerId) } catch { /* stale pointer */ }

    if (active.touch) {
      holdTimer = window.setTimeout(begin, TOUCH_HOLD_MS)
    }
  }

  function onPointerMove(e) {
    if (!active || e.pointerId !== active.pointerId) return

    active.x = e.clientX
    active.y = e.clientY

    if (!active.started) {
      const dist = Math.hypot(e.clientX - active.startX, e.clientY - active.startY)
      if (active.touch) {
        /* wandered during the hold — the user is scrolling, not dragging */
        if (dist > TOUCH_SLOP) cancel()
      } else if (dist > MOUSE_THRESHOLD) {
        begin()
      }
      return
    }

    /* Stop the page moving under the drag. Non-passive and registered only for
       the duration of the gesture, so ordinary scrolling elsewhere on the page
       is never slowed down by it. */
    if (e.cancelable) e.preventDefault()
    schedule()
  }

  function onPointerUp(e) {
    if (!active || e.pointerId !== active.pointerId) return
    if (!active.started) { cancel(); return }
    finish()
  }

  function onPointerCancel(e) {
    /* A phone call, a system gesture, a palm on the screen. Put the card back
       where it came from rather than committing a move the user never made. */
    if (!active || e.pointerId !== active.pointerId) return
    if (active.started) { active.cards = restoreOriginal(); active.index = active.fromIndex }
    finish()
  }

  /* ── lift ───────────────────────────────────────────────────────────── */

  function begin() {
    if (!active || active.started) return
    clearTimeout(holdTimer)
    active.started = true

    document.body.classList.add('is-dragging')
    /* The last line of defence against iOS scrolling: a non-passive touchmove
       that refuses. `touch-action` alone is evaluated at touchstart, which is
       before we knew this was a drag. */
    document.addEventListener('touchmove', blockScroll, { passive: false })

    layer = document.createElement('div')
    layer.className = 'drag-layer'
    document.body.append(layer)

    const proxy = document.createElement('div')
    proxy.className = 'drag-proxy'
    proxy.style.width = `${active.width}px`
    proxy.style.height = `${active.height}px`

    const card = active.slot.querySelector('.card')
    if (card) {
      const clone = card.cloneNode(true)
      clone.removeAttribute('id')
      proxy.append(clone)
    }
    layer.append(proxy)
    active.proxy = proxy

    active.slot.classList.add('is-source', 'is-placeholder')

    paint()
    if (navigator.vibrate) { try { navigator.vibrate(8) } catch { /* unsupported */ } }
    announce?.(`Picked up ${labelFor(active.slot)}. Drag to reposition.`)
  }

  function blockScroll(e) { if (e.cancelable) e.preventDefault() }

  /* ── the frame loop ─────────────────────────────────────────────────── */

  function schedule() {
    if (raf) return
    raf = requestAnimationFrame(() => { raf = 0; tick() })
  }

  function tick() {
    if (!active || !active.started) return
    autoscroll()
    paint()

    const idx = targetIndex(active.x, active.y)
    if (idx != null && idx !== active.index) {
      active.cards = moveItem(active.cards, active.index, idx)
      active.index = idx
      /* Re-render with the working list. The grid keys by uid, so the dragged
         slot survives, keeps `is-source`, and every other card FLIPs into its
         new position. */
      onPreview?.(active.cards)
      active.slot = grid.slotFor(active.uid) || active.slot
      active.slot.classList.add('is-source', 'is-placeholder')
    }

    if (active.scrollDir) schedule()
  }

  function paint() {
    if (!active?.proxy) return
    const x = active.x - active.offsetX
    const y = active.y - active.offsetY
    active.proxy.style.transform =
      `translate3d(${x}px, ${y}px, 0) scale(1.035) rotate(.6deg)`
  }

  /**
   * Scroll the page when the pointer is held near an edge, so a card can be
   * carried from the bottom of a long grid to the top. The speed ramps with how
   * deep into the zone the pointer is — a linear cut-off feels like a lurch.
   */
  function autoscroll() {
    const h = window.innerHeight
    let dir = 0
    if (active.y < EDGE) dir = -(1 - active.y / EDGE)
    else if (active.y > h - EDGE) dir = 1 - (h - active.y) / EDGE

    /* The pointer has to visit the middle of the screen before the edges become
       live. A card lifted from the last row is otherwise dragged straight into
       a scroll it never asked for. */
    if (!dir) active.scrollArmed = true
    if (!active.scrollArmed) dir = 0

    active.scrollDir = dir
    if (dir) window.scrollBy(0, Math.sign(dir) * Math.min(1, Math.abs(dir)) ** 1.6 * EDGE_MAX_SPEED)
  }

  /* ── hit testing ────────────────────────────────────────────────────── */

  /**
   * Which index should the card land at?
   *
   * Element-based rather than arithmetic. The geometric alternative — turning
   * clientX/Y into a {col,row} and looking up what occupies it — has to
   * reproduce the packer's decisions exactly, and it goes wrong at precisely
   * the places that matter: over a hole, over a card twice the height of its
   * neighbour, past the end of the last row. Asking the rendered rectangles is
   * both simpler and always right, because they ARE the layout.
   *
   * Cards are in visual order, and the list is normalised into visual order
   * after every commit, so a visual index and a list index are the same number.
   */
  function targetIndex(x, y) {
    const items = grid.orderedSlots()
    if (!items.length) return 0

    let nearest = null
    let nearestDist = Infinity

    for (let i = 0; i < items.length; i++) {
      const r = items[i].el.getBoundingClientRect()

      if (x >= r.left && x <= r.right && y >= r.top && y <= r.bottom) {
        if (items[i].uid === active.uid) return active.index    // still over itself
        /* Left half means "take this card's place", right half means "go after
           it" — the standard insertion-caret reading, and the one that makes a
           wide card feel like it has two halves rather than one target. */
        const before = x < r.left + r.width / 2
        const idx = before ? i : i + 1
        return normaliseIndex(idx, items)
      }

      const cx = r.left + r.width / 2
      const cy = r.top + r.height / 2
      const d = Math.hypot(x - cx, y - cy)
      if (d < nearestDist) { nearestDist = d; nearest = { i, r } }
    }

    /* In a gap, or past the end of the grid. Fall to the nearest card and use
       the same half-rect rule against it, so dropping into the empty tail of
       the last row appends rather than doing nothing. */
    if (!nearest) return null
    if (items[nearest.i].uid === active.uid) return active.index
    const before = y < nearest.r.top + nearest.r.height / 2
      ? true
      : y > nearest.r.bottom
        ? false
        : x < nearest.r.left + nearest.r.width / 2
    const idx = before ? nearest.i : nearest.i + 1
    return normaliseIndex(idx, items)
  }

  /**
   * `items` excludes nothing, but the dragged card has been spliced out of the
   * working list before reinsertion, so an index computed against the rendered
   * order needs adjusting once the target is past the card's current home.
   */
  function normaliseIndex(idx, items) {
    const current = items.findIndex((it) => it.uid === active.uid)
    if (current < 0) return Math.max(0, Math.min(idx, active.cards.length - 1))
    if (idx > current) idx -= 1
    return Math.max(0, Math.min(idx, active.cards.length - 1))
  }

  function restoreOriginal() {
    return moveItem(active.cards, active.index, active.fromIndex)
  }

  /* ── drop ───────────────────────────────────────────────────────────── */

  function finish() {
    if (!active) return
    const a = active

    clearTimeout(holdTimer)
    if (raf) { cancelAnimationFrame(raf); raf = 0 }
    document.removeEventListener('touchmove', blockScroll)
    document.body.classList.remove('is-dragging')
    try { a.slot.releasePointerCapture(a.pointerId) } catch { /* already gone */ }

    if (!a.started) { active = null; return }

    const slot = grid.slotFor(a.uid) || a.slot
    const rest = slot.getBoundingClientRect()

    /* Fly the proxy home rather than letting it vanish. The card should look
       like it was placed, not like it was deleted and redrawn. */
    if (a.proxy) {
      a.proxy.classList.add('is-landing')
      a.proxy.style.width = `${rest.width}px`
      a.proxy.style.height = `${rest.height}px`
      a.proxy.style.transform = `translate3d(${rest.left}px, ${rest.top}px, 0) scale(1) rotate(0deg)`
    }

    const cleanup = () => {
      slot.classList.remove('is-source', 'is-placeholder')
      layer?.remove()
      layer = null
    }

    if (a.proxy) {
      let done = false
      const end = () => { if (done) return; done = true; cleanup() }
      a.proxy.addEventListener('transitionend', end, { once: true })
      setTimeout(end, 420)     // transitionend never fires if nothing changed
    } else cleanup()

    active = null

    /* ALWAYS notify, even when nothing moved.
       This used to be `if (a.index !== a.fromIndex) onCommit(...)`, and the two
       endings that skipped it — dragging a card back onto its own slot, and a
       pointercancel — left the caller's scratch copy of the card list alive
       forever. From that moment the grid was pinned to a stale array: removing
       a card, adding one from the picker, resizing, all wrote to the store and
       to localStorage while the screen showed the frozen layout, and the two
       only agreed again after a reload.
       The `changed` flag carries what the old condition decided, so the caller
       can still tell a real move from a no-op. */
    onCommit?.(a.cards, { changed: a.index !== a.fromIndex })

    announce?.(
      a.index !== a.fromIndex
        ? `Moved ${labelFor(slot)} to position ${a.index + 1} of ${a.cards.length}.`
        : 'Returned to its original position.',
    )
  }

  function cancel() {
    clearTimeout(holdTimer)
    if (!active) return
    try { active.slot.releasePointerCapture(active.pointerId) } catch { /* fine */ }
    active = null
  }

  function labelFor(slot) {
    return slot?.querySelector('.card')?.getAttribute('aria-label') || 'card'
  }

  /* ── wiring ─────────────────────────────────────────────────────────── */

  root.addEventListener('pointerdown', onPointerDown)
  root.addEventListener('pointermove', onPointerMove)
  root.addEventListener('pointerup', onPointerUp)
  root.addEventListener('pointercancel', onPointerCancel)

  /* A card lifted when the window was 6 columns wide, dropped after a rotation
     to 4, would be landing against rectangles that no longer exist. Abandon the
     gesture and let the layout settle. */
  const onResize = () => { if (active?.started) { active.cards = restoreOriginal(); finish() } }
  window.addEventListener('resize', onResize)
  window.addEventListener('orientationchange', onResize)

  return {
    get dragging() { return !!active?.started },
    abort() { if (active?.started) { active.cards = restoreOriginal(); finish() } else cancel() },
    destroy() {
      root.removeEventListener('pointerdown', onPointerDown)
      root.removeEventListener('pointermove', onPointerMove)
      root.removeEventListener('pointerup', onPointerUp)
      root.removeEventListener('pointercancel', onPointerCancel)
      window.removeEventListener('resize', onResize)
      window.removeEventListener('orientationchange', onResize)
    },
  }

/**
 * EDIT MODULES MODE
 * ───────────────────────────────────────────────────────────────────────────
 * Owns the difference between reading the home page and rearranging it: the
 * section header's copy, the edit affordances on the grid, the Add Module action,
 * and a keyboard route through the whole thing.
 *
 * KEYBOARD REORDERING IS NOT A CONSOLATION PRIZE. A drag-and-drop grid that can
 * only be operated by a pointer is a grid a keyboard user cannot arrange at
 * all — there is no "other way" to do it, the way there is usually a link
 * beside a hover menu. So Space picks a card up, the arrow keys move it, Space
 * puts it down and Escape abandons the move, and every step is announced. It is
 * the same state and the same commit path as the pointer drag; only the input
 * differs.

const { moveItem } = __req('js/lib/pack.js');
const { icon } = __req('js/icons.js');

 * `labels` IS THE ONLY THING THE TWO WORKSPACES DISAGREE ABOUT HERE.
 *
 * The mode is identical — same affordances, same drag, same keyboard route,
 * same commit path. What differs is the noun: the home page arranges MODULES
 * and the Site Command Centre arranges WIDGETS, and calling a site widget a
 * module in the one place the user is being told what to do would be a small
 * lie that costs them a moment every time. Defaults are the home page's, so the
 * original caller passes nothing.
 */

  title:     'Modules',
  editTitle: 'Edit Modules',
  add:       'Add Module',
  hint:      'Drag cards to rearrange. Press space on a card to move it with the arrow keys.',
  entered:   'Editing modules. Drag cards to rearrange, or use the remove buttons.',
  saved:     'Layout saved.',

  const title = head.querySelector('.section-head__title')
  const actions = head.querySelector('.section-head__actions')

     the document before the message arrives, so it is built up front and only

      live.textContent = ''
      live.textContent = message
    }, 60)
  }

  editBtn.type = 'button'
  editBtn.className = 'link-btn'
  editBtn.innerHTML = `${icon('pencil')}<span>Edit</span>`

  const doneBtn = document.createElement('button')
  doneBtn.type = 'button'
  doneBtn.className = 'link-btn link-btn--done'
  doneBtn.textContent = 'Done'

  /**
   * ADD MODULE, AT THE TOP.
   *
   * This was a tile at the end of the grid. With fifteen modules on the page
   * that put the primary action of the whole mode below the fold: you entered
   * Edit Modules to add something and had to scroll past everything you already
   * had to find out how. It now sits beside the title, where it is the first
   * thing in the mode after the mode's own name.
   *
   * It is an ACTION and is dressed as one — an outlined control next to Done,
   * not another module card. Making it look like a card would put it in
   * competition with the things it adds.
   */

  addBtn.type = 'button'
  addBtn.className = 'add-module-btn'

  addBtn.addEventListener('click', () => onAdd?.())

  const hint = document.createElement('p')
  hint.className = 'edit-hint'
  hint.innerHTML = `${icon('grip')}<span>${L.hint}</span>`

  let grabbed = null                // { uid, index } while a keyboard move runs

  doneBtn.addEventListener('click', () => exit())

    /* The controls inside a slot are buttons, and buttons are activated by
       Enter and Space — the same two keys that pick a card up. Without this
       guard the grab handler calls preventDefault first and swallows the
       activation, so Remove and Resize simply do nothing from a keyboard while

    if (e.key === ' ' || e.key === 'Enter') {
      e.preventDefault()
      if (grabbed && grabbed.uid === uid) releaseGrab({ commit: true })

      e.preventDefault()
      releaseGrab({ commit: false, restore: true })
      return
    }

    if (!grabbed || grabbed.uid !== uid) return

    /* Left and right step by one place. Up and down step by a whole row's worth
       of cards, which is the closest honest analogue of "the card above" in a
       layout where the cards are not all the same width. */
    const perRow = Math.max(1, estimateRowLength(uid))

      ArrowLeft: -1, ArrowRight: 1,
      ArrowUp: -perRow, ArrowDown: perRow,
      Home: -index, End: cards.length - 1 - index,
    }[e.key]
    if (delta == null) return

    e.preventDefault()
    const to = Math.max(0, Math.min(cards.length - 1, index + delta))
    if (to === index) return

    onCommit?.(moveItem(cards, index, to), { rerender: true, keepFocus: uid })
    announce(`Position ${to + 1} of ${cards.length}.`)
  })

  function grab(uid, index, slot) {
    releaseGrab({ commit: false })

    slot.classList.add('is-grabbed')
    announce(`Picked up ${label(slot)}. Use the arrow keys to move it, space to drop it, escape to cancel.`)

  function releaseGrab({ commit, restore } = {}) {
    if (!grabbed) return
    const slot = grid.slotFor(grabbed.uid)
    slot?.classList.remove('is-grabbed')
    if (restore) {
      const cards = getCards()
      const now = cards.findIndex((c) => c.uid === grabbed.uid)
      if (now >= 0 && now !== grabbed.index) {
        onCommit?.(moveItem(cards, now, grabbed.index), { rerender: true, keepFocus: grabbed.uid })

      announce(`Dropped ${label(slot)}.`)

/**
 * MODULE PREVIEW
 * ───────────────────────────────────────────────────────────────────────────
 * A preview of a card variant at a given size — rendered by building the REAL
 * card at its REAL pixel size and scaling it down with a transform.
 *
 * WHY NOT A SEPARATE PREVIEW RENDERER. Because it would be wrong within a
 * month. The brief asks for previews that "represent the real module card
 * design, not generic placeholders"; a second renderer is a promise to keep two
 * files in step forever, and nobody ever does. The preview here cannot drift
 * from the card because it is the card.
 *
 * THE SCALE TRICK. `transform: scale()` is a paint operation — it does not
 * change the element's layout width, and it does not change what a container
 * query sees. So a "Full Width" card built at 960px still reports 960px to its
 * own container queries and lays itself out exactly as it will on the home
 * page: figures side by side, list in two columns. Then it is painted at 30%.
 * A preview that was instead BUILT at 290px would report 290px, take the small
 * card's layout, and show the user something they are not going to get.
 *
 * Sizes are computed against the 6-column reference grid, so the proportions
 * between Small, Medium, Large, Tall and Full are the true ones — the user is
 * comparing real footprints, not icons of footprints.
 */

const { resolveSpan } = __req('js/lib/sizes.js');
const { renderCard } = __req('js/components/ModuleCard.js');

/* The reference grid the previews are measured in: the tablet-landscape band,
   which is the device this product is designed on. */
/* The reference grid the previews are measured in: the Figma artboard's own
   band — five columns of 179.2px, 16px gutters, 164px rows. This said 146.7
   while the grid was six columns wide, and kept saying it after the grid became
   five, so every preview was built at the wrong width and its container queries
   dressed it for a card size that no longer exists. */
const REF_COL = 179.2
const REF_ROW = 164
const REF_GAP = 16

function previewMetrics(size) {
  const { w, h } = resolveSpan(size, 6)
  return {
    w,
    h,
    width: w * REF_COL + (w - 1) * REF_GAP,
    height: h * REF_ROW + (h - 1) * REF_GAP,
  }
}

/**
 * @param {object} variant
 * @param {string} size
 * @param {{maxWidth:number, maxHeight:number}} bounds
 * @returns {HTMLElement} a `.variant__stage` sized to the scaled card
 */
function renderPreview(variant, size, bounds = {}) {
  const { maxWidth = 300, maxHeight = 190 } = bounds
  const m = previewMetrics(size)

  /* Never scale up. A 1×1 card blown up to fill the stage would be the only
     preview in the gallery lying about its size. */
  const scale = Math.min(maxWidth / m.width, maxHeight / m.height, 1)

  const stage = document.createElement('div')
  stage.className = 'variant__stage'
  stage.style.width = `${Math.round(m.width * scale)}px`
  stage.style.height = `${Math.round(m.height * scale)}px`

  const card = renderCard(variant, { size, w: m.w, h: m.h, static: true })
  card.style.width = `${m.width}px`
  card.style.height = `${m.height}px`
  card.style.transform = `scale(${scale})`

  stage.append(card)
  return stage
}

  __x.renderPreview = renderPreview;
});

/**
 * MODULE SIZE SELECTOR
 * ───────────────────────────────────────────────────────────────────────────
 * Offers exactly the sizes a variant declares and nothing else — the brief is
 * firm that unavailable sizes must not appear, and enforcing it here means no
 * caller has to remember.
 *
 * Each option draws its own footprint next to its name: the Medium glyph is
 * literally twice the width of the Small one, and Tall is one wide by two high.
 * A word tells you the name of a size; the glyph tells you the shape, before
 * the word has been read.
 *
 * Built as a real radiogroup rather than a row of buttons, so arrow keys move
 * between options the way a keyboard user expects and the current choice is
 * announced as one.
 */

const { orderedSizes, glyphSpan } = __req('js/lib/sizes.js');
const { SIZE_LABELS } = __req('js/data/cardVariants.js');

/* Four of these exist at once — two galleries and two resize popovers — so the
   label's id is per instance for the same reason the gallery's title is. */
let selectorSeq = 0

function createSizeSelector({ onChange }) {
  const root = document.createElement('div')
  root.className = 'size-picker'

  const labelId = `size-picker-label-${++selectorSeq}`

  const label = document.createElement('span')
  label.className = 'size-picker__label'
  label.id = labelId
  label.textContent = 'Choose Size'

  const row = document.createElement('div')
  row.className = 'size-picker__row'
  row.setAttribute('role', 'radiogroup')
  row.setAttribute('aria-labelledby', labelId)

  root.append(label, row)

  let sizes = []
  let value = null

  function render(supported, selected) {
    sizes = orderedSizes(supported || [])
    value = sizes.includes(selected) ? selected : sizes[0] || null
    row.replaceChildren()

    for (const size of sizes) {
      const { w, h } = glyphSpan(size)
      const btn = document.createElement('button')
      btn.type = 'button'
      btn.className = 'size-opt'
      btn.setAttribute('role', 'radio')
      btn.setAttribute('aria-checked', String(size === value))
      /* only the selected option is a tab stop; the arrows move within the group */
      btn.tabIndex = size === value ? 0 : -1
      btn.dataset.size = size

      const glyph = document.createElement('span')
      glyph.className = 'size-opt__glyph'
      glyph.style.gridTemplateColumns = `repeat(${w}, 9px)`
      glyph.style.gridTemplateRows = `repeat(${h}, 9px)`
      for (let i = 0; i < w * h; i++) glyph.append(document.createElement('i'))

      const text = document.createElement('span')
      text.textContent = SIZE_LABELS[size] || size

      btn.append(glyph, text)
      btn.addEventListener('click', () => select(size))
      row.append(btn)
    }
  }

  function select(size) {
    if (!sizes.includes(size) || size === value) return
    value = size
    for (const btn of row.querySelectorAll('.size-opt')) {
      const on = btn.dataset.size === size
      btn.setAttribute('aria-checked', String(on))
      btn.tabIndex = on ? 0 : -1
    }
    onChange?.(size)
  }

  row.addEventListener('keydown', (e) => {
    const step = { ArrowRight: 1, ArrowDown: 1, ArrowLeft: -1, ArrowUp: -1 }[e.key]
    if (!step) return
    e.preventDefault()
    const i = sizes.indexOf(value)
    const next = sizes[(i + step + sizes.length) % sizes.length]
    select(next)
    row.querySelector(`[data-size="${next}"]`)?.focus()
  })

  return {
    root,
    render,

    /* With a basket of cards rather than one, "Choose Size" no longer says
       enough — the control has to name which card it is about, or a curator
       who picked four widgets has no way to know what they are resizing. */
    setLabel(text) { label.textContent = text || 'Choose Size' },

});

   *
   * One gallery now serves four catalogues — modules, and the Site, Section and
   * Enclosure workspaces — and it learns which one it is browsing from
   * `src.revision`, a value the caller changes when the level does. Built once
   * per catalogue and cached, because it is re-scanned on every keystroke.
   *
   * The alternative was four picker instances. That would have been four sheets
   * in the document, four sets of duplicate ids to keep unique, and four copies
   * of a basket that took three attempts to get right.
   */
  const haystack = new Map()
  let builtFor = null

  function buildHaystack() {
    if (builtFor === src.revision) return
    builtFor = src.revision
    haystack.clear()
  for (const v of src.variants) {
    const mod = src.getGroup(v.moduleId)
    const d = v.data || {}
    const bits = [
      mod?.name, mod?.blurb, ...(mod?.keywords || []),
      v.name, v.description, PURPOSES[v.purpose]?.label,
      /* The card's own heading. Left out of the first version of this index,
         which meant "low stock" — the heading on Pharmacy's alert card, and one
         of the three examples the empty state suggests typing — found nothing
         at all. */
      d.title,
    ]
    /* Everything the card actually shows, so the figures are searchable too. */
    for (const blk of d.blocks || []) {
      bits.push(blk.label, blk.caption, blk.text, blk.value)
      for (const it of blk.items || []) bits.push(it.label, it.text, it.lead, it.value)
    }
    /* Strip soft hyphens: the index is matched against what people type, and
       nobody types U+00AD. Without this, searching "communication" finds
       nothing. */
    haystack.set(v.id, bits.filter(Boolean).join(' ').toLowerCase().replace(/\u00AD/g, ''))
  }
  }

  buildHaystack()

  /**
   * Every word in the query must appear somewhere. Substring rather than fuzzy:
   * on a seventeen-module product fuzzy matching mostly produces surprises, and
   * "lab" quietly matching "Follow Up" would be worse than finding nothing.
   */
  function matches(variantId) {
    if (!query) return true
    const hay = haystack.get(variantId) || ''
    return query.split(/\s+/).filter(Boolean).every((term) => hay.includes(term))
  }

  /** A module's widgets that survive the current query. */
  function hits(moduleId) {
    return src.variantsFor(moduleId).filter((v) => matches(v.id))
  }

  searchInput.addEventListener('input', () => {
    query = searchInput.value.trim().toLowerCase()
    searchWrap.classList.toggle('has-value', !!searchInput.value)
    /* If the module being shown has nothing left that matches, move to the
       first one that does. A search that leaves you staring at an empty pane
       while the answer sits three rows up the rail is a search that failed. */
    if (query && !hits(activeId).length) {
      const first = src.groups.find((m) => hits(m.id).length)
      if (first) activeId = first.id
    }
    /* The basket deliberately survives the search — see clearSelection(). */
    renderRail()
    renderDetail()
  })

  searchClear.addEventListener('click', () => {
    searchInput.value = ''
    query = ''
    searchWrap.classList.remove('has-value')
    renderRail()
    renderDetail()
    searchInput.focus()
  })

  /* ── the rail · every module, always ─────────────────────────────────── */

  function renderRail() {
    rail.replaceChildren()
    let any = false

    for (const cat of src.categories) {
      const mods = src.groups.filter((m) => src.categoryOf(m) === cat.id && hits(m.id).length)
      if (!mods.length) continue
      any = true

      const heading = document.createElement('div')
      heading.className = 'mod-rail__heading'
      heading.textContent = cat.name
      rail.append(heading)

      for (const mod of mods) {
        const row = document.createElement('button')
        row.type = 'button'
        row.className = 'mod-row'
        row.setAttribute('role', 'tab')
        row.setAttribute('aria-selected', String(mod.id === activeId))
        row.tabIndex = mod.id === activeId ? 0 : -1
        row.dataset.module = mod.id
        row.innerHTML =
          groupTile(mod, 'mod-row__icon') +
          `<span class="mod-row__name">${esc(mod.name)}</span>` +
          `${icon('chev-right', 'icon mod-row__chev')}`
        row.addEventListener('click', () => selectModule(mod.id))
        rail.append(row)
      }
    }

    if (!any) rail.append(emptyState())
  }

  function selectModule(id) {
    activeId = id
    /* and it survives moving between modules, which is the whole point */
    detailOpen = true
    sheet.classList.add('is-detail')
    for (const row of rail.querySelectorAll('.mod-row')) {
      const on = row.dataset.module === id
      row.setAttribute('aria-selected', String(on))
      row.tabIndex = on ? 0 : -1
    }
    renderDetail()
    body.scrollTop = 0
  }

  /* Arrow keys walk the rail, which is what a keyboard user will try on
     something marked up as a vertical tablist. */
  rail.addEventListener('keydown', (e) => {
    const step = { ArrowDown: 1, ArrowUp: -1 }[e.key]
    if (!step) return
    e.preventDefault()
    const rows = [...rail.querySelectorAll('.mod-row')]
    const i = rows.findIndex((r) => r.dataset.module === activeId)
    const next = rows[(i + step + rows.length) % rows.length]
    if (!next) return
    selectModule(next.dataset.module)
    next.focus()
  })

  /* ── the detail · one module's widgets, grouped by purpose ───────────── */

  function renderDetail() {
    body.replaceChildren()
    const mod = src.getGroup(activeId)
    if (!mod) { body.append(emptyState()); return }

    /* On a phone the two panes are stacked, so the detail needs its own way
       back to the rail. On desktop the rail is right there and this is hidden
       by the stylesheet rather than by a second code path. */
    const back = document.createElement('button')
    back.type = 'button'
    back.className = 'detail-back'
    back.innerHTML = `${icon('chev-left')}<span>${esc(src.backLabel)}</span>`
    back.addEventListener('click', () => {
      detailOpen = false
      sheet.classList.remove('is-detail')
      rail.querySelector(`[data-module="${activeId}"]`)?.focus()
    })

    const head = document.createElement('div')
    head.className = 'detail-head'
    head.innerHTML =
      groupTile(mod, 'detail-head__icon') +
      `<span class="detail-head__text">` +
        `<span class="detail-head__name">${esc(mod.name)}</span>` +
        `<span class="detail-head__blurb">${esc(mod.blurb)}</span>` +
      `</span>`

    body.append(back, head)

    /* ONE SHELF, NOT FIVE SECTIONS.
       An earlier pass grouped these under NAVIGATE / UNDERSTAND / ATTENTION /
       ACT / MONITOR headings with a line of copy on each. It was a taxonomy the
       user had to read before they could look at anything, and the widgets are
       the point. The purposes still ORDER the shelf — door first, then the
       figures, then what is waiting, then what you can do, then what just
       happened — they just no longer announce themselves. */
    const variants = src.variantsFor(mod.id).filter((v) => matches(v.id))
    if (!variants.length) { body.append(emptyState()); return }

    const row = document.createElement('div')
    row.className = 'widget-row'
    for (const v of variants) row.append(widgetTile(v))
    body.append(row)
  }

  /**
   * Are the rail and the gallery side by side, or stacked one over the other?
   *
   * THE STYLESHEET DECIDES AND THIS ASKS. It is the same arrangement as
   * `currentColumns()` in sizes.js, and for the same reason: there was a
   * hard-coded `innerWidth >= 1024` here and a `@media (min-width: 1024px)`
   * there, and when the CSS breakpoint moved to 768 this would have gone on
   * believing every iPad in portrait was stacked. One definition, in the place
   * that owns it.
   */
  function isSplit() {
    return getComputedStyle(document.documentElement)
      .getPropertyValue('--picker-split').trim() === '1'
  }

  /* Wider viewports afford larger previews; these keep a Full Width card
     readable beside a Small one rather than shrinking it to a smear. */
  function previewBounds() {
    const w = window.innerWidth
    return w >= 1200 ? { maxWidth: 300, maxHeight: 218 }
      : w >= 768 ? { maxWidth: 272, maxHeight: 198 }
      : { maxWidth: 236, maxHeight: 172 }
  }

  function widgetTile(v) {
    const btn = document.createElement('button')
    btn.type = 'button'
    btn.className = 'widget'
    btn.dataset.variant = v.id
    const isOn = selected.has(v.id)
    btn.setAttribute('aria-pressed', String(isOn))
    if (isOn && v.id === sizing) btn.classList.add('is-sizing')

    /* The size the basket is holding for this card, so scrolling away and back
       shows the choice rather than resetting it. */
    const size = isOn ? selected.get(v.id) : v.defaultSize
    const stage = renderPreview(v, size, previewBounds())
    stage.classList.add('widget__stage-wrap')

    /* The tick lives on the stage, not the button, so it pins to the corner of
       the CARD rather than to the corner of the tile's padding box — which is
       where the eye expects it and where a Full Width preview's very different
       proportions would otherwise leave it stranded. */
    const check = document.createElement('span')
    check.className = 'widget__check'
    check.setAttribute('aria-hidden', 'true')
    check.innerHTML = icon('check')
    stage.append(check)

    btn.append(stage)

    /* The name, and nothing else. The description and the size count were
       three lines of prose under a picture that already says what the widget
       is — and with 3 to 6 widgets a module, that prose was most of the pane.
       The sizes are still on the footer's selector, where they are a choice
       rather than a fact to read. */
    const meta = document.createElement('span')
    meta.className = 'widget__meta'
    meta.innerHTML = `<span class="widget__name">${esc(v.name)}</span>`

  function emptyState() {

      `<span class="sheet-empty__title">Nothing matches &ldquo;${esc(searchInput.value)}&rdquo;</span>` +
      `<span class="sheet-empty__note">${esc(src.emptyHint)}</span>`

  /* ── selection ──────────────────────────────────────────────────────── */

  function variantById(id) {
    return src.variants.find((v) => v.id === id) || null

  /**
   * A group's coloured tile. Modules wear an SVG exported from Figma; domains
   * wear a symbol from the sprite — see glyph() in ModuleCard.js, which makes
   * the same distinction for the same reason. One helper so the rail row and
   * the detail header cannot disagree about it.

  function groupTile(g, cls) {
    const inner = g.sprite
      ? icon(g.sprite, 'glyph')
      : `<img src="assets/icon/${esc(g.icon)}" alt="" aria-hidden="true">`
    return `<span class="${cls}${g.sprite ? ' is-sprite' : ''}" ` +
           `style="background:var(${esc(g.gradient)})">${inner}</span>`
  }

  /** Toggle a widget in and out of the basket. */
  function toggleVariant(v) {
    if (selected.has(v.id)) {
      selected.delete(v.id)
      /* The size control cannot go on editing a card that is no longer in the
         basket — hand it to whatever is still there, newest first. */
      if (sizing === v.id) sizing = lastKey()
    } else {
      selected.set(v.id, v.defaultSize)
      sizing = v.id
    }
    syncSelectionUI()
  }

  /** The most recently added key, or null — Maps have no `last()`. */
  function lastKey() {
    let out = null
    for (const k of selected.keys()) out = k
    return out
  }

  /** Point the footer's size control at one card in the basket. */
  function focusSizing(variantId) {
    if (!selected.has(variantId)) return
    sizing = variantId
    syncSelectionUI()
  }

  /**
   * One function for every path that can change the basket, so the tile states,
   * the tray, the size control and the Add button can never disagree about what
   * is selected. Cheap enough to call on every toggle — the gallery is at most
   * six tiles.
   */
  function syncSelectionUI() {
    const n = selected.size
    sheet.classList.toggle('has-selection', n > 0)

    for (const btn of body.querySelectorAll('.widget')) {
      const on = selected.has(btn.dataset.variant)
      btn.setAttribute('aria-pressed', String(on))
      btn.classList.toggle('is-sizing', on && btn.dataset.variant === sizing)
    }

    renderTray()

    const v = sizing ? variantById(sizing) : null
    if (v) {
      sizeSelector.render(v.supportedSizes, selected.get(sizing))
      sizeSelector.setLabel(`Size for ${v.name}`)
      sizeSelector.root.hidden = v.supportedSizes.length < 2
    } else {
      sizeSelector.root.hidden = true
    }

    addBtn.textContent = n > 1 ? src.addMany(n) : src.addOne
    addBtn.disabled = n === 0
  }

  function renderTray() {
    const n = selected.size
    trayCount.textContent = n === 1 ? '1 Selected' : `${n} Selected`
    trayChips.replaceChildren()

    for (const [id, size] of selected) {
      const v = variantById(id)
      if (!v) continue

      const chip = document.createElement('span')
      chip.className = 'sel-chip'
      if (id === sizing) chip.classList.add('is-active')

      /* The chip body picks the card up for sizing; the × takes it out. Two
         targets in one chip, so neither gesture can be mistaken for the other. */
      const pick = document.createElement('button')
      pick.type = 'button'
      pick.className = 'sel-chip__pick'
      pick.innerHTML =
        `<span class="sel-chip__name">${esc(v.name)}</span>` +
        `<span class="sel-chip__size">${esc(SIZE_LABELS[size] || size)}</span>`
      pick.setAttribute('aria-label', `${v.name}, ${SIZE_LABELS[size] || size}. Choose a size for this card`)
      pick.addEventListener('click', () => focusSizing(id))

      const drop = document.createElement('button')
      drop.type = 'button'
      drop.className = 'sel-chip__drop'
      drop.innerHTML = icon('close')
      drop.setAttribute('aria-label', `Remove ${v.name} from the selection`)
      drop.addEventListener('click', () => {
        selected.delete(id)
        if (sizing === id) sizing = lastKey()
        syncSelectionUI()
      })

      chip.append(pick, drop)
      trayChips.append(chip)
    }

    /* Keep the card being sized where it can be seen. The tray scrolls
       sideways, so picking a fourth widget puts its chip past the right edge —
       and the size control below would then be labelled with a card the user
       cannot see. */
    const active = trayChips.querySelector('.sel-chip.is-active')
    if (active) {
      const box = trayChips.getBoundingClientRect()
      const it = active.getBoundingClientRect()
      if (it.right > box.right - 4 || it.left < box.left + 4) {
        /* FLUSH LEFT, NOT CENTRED. Centring leaves the previous chip cut down
           the middle at the left edge, and a chip cut after its name reads as a
           chip that has no name — the tray showed a pill saying just "Medium".
           Aligned to the leading edge, a chip is either wholly there or wholly
           gone, and only the trailing edge is ever partial, which is the one
           the fade is for. */
        trayChips.scrollLeft += it.left - box.left
      }
    }
    syncTrayFade()
  }

  /** Fade an edge only when there is something past it to scroll to. */
  function syncTrayFade() {
    const max = trayChips.scrollWidth - trayChips.clientWidth
    const x = trayChips.scrollLeft
    trayChips.style.setProperty('--fade-l', x > 2 ? '22px' : '0px')
    trayChips.style.setProperty('--fade-r', x < max - 2 ? '22px' : '0px')
  }
  trayChips.addEventListener('scroll', syncTrayFade, { passive: true })

  /** Redraw one widget's preview at the size the footer now says. */
  function repaintPreview(variantId) {
    const btn = body.querySelector(`.widget[data-variant="${cssEsc(variantId)}"]`)
    const variant = variantById(variantId)
    if (!btn || !variant) return
    const stage = renderPreview(variant, selected.get(variantId), previewBounds())
    stage.classList.add('widget__stage-wrap')
    btn.querySelector('.variant__stage')?.replaceWith(stage)
  }

  /**
   * Empty the basket.
   *
   * NOT called when the query changes or the module does. The whole point of a
   * basket is that it survives browsing — picking two Medical cards, searching
   * "overdue" and picking a Pharmacy one should give you three, not one.
   */
  function clearSelection() {
    selected.clear()
    sizing = null
    syncSelectionUI()
  }

  addBtn.addEventListener('click', () => {
    if (!selected.size) return
    const batch = [...selected].map(([variantId, size]) => ({ variantId, size }))
    onAdd?.(batch)
    close()
  })
  /* Beside "Add to Home" in a footer, "Cancel" means abandon the whole thing —
     that is what the control reads as. Deselecting without leaving is still
     available by tapping the chosen widget again, which is the gesture that
     selected it. */
  cancelBtn.addEventListener('click', close)
  closeBtn.addEventListener('click', close)
  scrim.addEventListener('click', close)

  /* ── drag to dismiss ────────────────────────────────────────────────── */

  let dragY = null
  sheet.addEventListener('pointerdown', (e) => {
    /* Only from the header. A sheet that dismisses when a finger moves anywhere
       on it cannot also be scrolled. */
    if (e.pointerType === 'mouse') return
    if (!e.target.closest('.sheet__head, .sheet__handle')) return
    dragY = e.clientY
    sheet.style.transition = 'none'
  })
  sheet.addEventListener('pointermove', (e) => {
    if (dragY == null) return
    const dy = Math.max(0, e.clientY - dragY)
    sheet.style.transform = `translateY(${dy}px)`
  })
  const endDrag = (e) => {
    if (dragY == null) return
    const dy = Math.max(0, e.clientY - dragY)
    dragY = null
    sheet.style.transition = ''
    sheet.style.transform = ''
    /* a third of the sheet, or a flick — the usual pair of thresholds */
    if (dy > sheet.offsetHeight * 0.3) close()
  }
  sheet.addEventListener('pointerup', endDrag)
  sheet.addEventListener('pointercancel', endDrag)

  /* ── focus management ───────────────────────────────────────────────── */

  function focusables() {
    return [...sheet.querySelectorAll(
      'button:not([disabled]), input, [href], [tabindex]:not([tabindex="-1"])',
    )].filter((el) => el.offsetParent !== null)
  }

  function onKeydown(e) {
    if (!open) return
    if (e.key === 'Escape') { e.preventDefault(); close(); return }
    if (e.key !== 'Tab') return

    /* A modal that lets Tab wander onto the page behind it is a modal in name
       only — a keyboard user ends up editing a form they cannot see. */
    const items = focusables()
    if (!items.length) return
    const first = items[0]
    const last = items[items.length - 1]
    if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus() }
    else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus() }
  }

  /* ── open / close ───────────────────────────────────────────────────── */

  function show() {
    if (open) return
    open = true
    restoreFocusTo = document.activeElement

    query = ''
    searchInput.value = ''
    searchWrap.classList.remove('has-value')
    /* The sheet's own chrome is level-agnostic — "Add Widget" is right at all
       three depths — but the index and the rail are not, so both are refreshed
       on the way in rather than on construction. */
    buildHaystack()
    activeId = src.groups[0].id
    /* Where the panes are side by side, open with the first module already
       showing so the gallery is never empty. Where they are stacked — a phone —
       open on the rail, because there the rail IS the gallery and landing
       inside one group would hide all the others. */
    detailOpen = isSplit()
    sheet.classList.toggle('is-detail', detailOpen)
    clearSelection()
    renderRail()
    renderDetail()

    scrim.hidden = false
    sheet.hidden = false
    document.body.style.overflow = 'hidden'
    document.addEventListener('keydown', onKeydown)

    /* two frames: one to make the elements visible, one for the transition to
       have a starting value to animate from */
    requestAnimationFrame(() => requestAnimationFrame(() => {
      scrim.classList.add('is-open')
      sheet.classList.add('is-open')
      /* Focus the body, not the search field. Raising a keyboard over a gallery
         the user came to look at is the wrong first move on a tablet. */
      body.focus({ preventScroll: true })
    }))
  }

  function close() {
    if (!open) return
    open = false
    scrim.classList.remove('is-open')
    sheet.classList.remove('is-open')
    document.body.style.overflow = ''
    document.removeEventListener('keydown', onKeydown)

    const done = () => {
      if (open) return
      scrim.hidden = true
      sheet.hidden = true
      body.replaceChildren()
    }
    sheet.addEventListener('transitionend', done, { once: true })
    setTimeout(done, 500)

    restoreFocusTo?.focus?.()
    restoreFocusTo = null
  }

  /* Previews are sized in JS against the viewport, so they have to be rebuilt
     when it changes. Crossing the 1024px line also changes whether the two
     panes are side by side or stacked, so the detail flag is re-derived. */
  window.addEventListener('resize', () => {
    if (!open) return
    /* Rotating an iPad into landscape crosses into the split arrangement, where
       both panes are live whatever this flag says. Setting it keeps the state
       honest for the rotation back. */
    if (isSplit()) { detailOpen = true; sheet.classList.add('is-detail') }
    renderDetail()
  })

  return { open: show, close, get isOpen() { return open } }
}

function esc(s) {

    { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]

 * SIZE POPOVER
 * ───────────────────────────────────────────────────────────────────────────
 * Changes the size of a card that is ALREADY on the home page.
 *
 * WHY THIS EXISTS. The add flow ends with a size choice, so every card arrives
 * at a size the user picked. But a layout is not chosen once — it is tuned. A
 * curator who put Follow Up on as a Tall card and finds it dominating the grid

 * remove the card and add it again from the picker, which is four taps to

 * terms as in the picker: only the sizes the variant declares, never more.

  el.setAttribute('aria-label', 'Card size')

    onChange(size) {

/**
 * THE PROFILE MENU
 * ───────────────────────────────────────────────────────────────────────────
 * A popover under the avatar. It exists because the home page had no visible
 * way into editing it.
 *
 * WHAT WAS THERE BEFORE, AND WHY IT WAS NOT ENOUGH. Edit mode was reachable by
 * pressing and holding a card, right-clicking one, or pressing E. All three
 * still work — a long press on a card is the gesture people bring with them
 * from every phone home screen they have ever used, and it should not stop
 * working because a menu appeared. But every one of those is INVISIBLE. A
 * feature whose only affordance is a gesture you have to already know about is
 * a feature most people never find, and "how do I change my home page" is not
 * a question a command centre should answer with "hold something".
 *
 * The avatar is the right place for it. It is where a person looks for the
 * things that are theirs rather than the organisation's — their account, their
 * preferences, and their home page is one of those.
 *
 * WHY A POPOVER AND NOT A DIALOG. Nothing here is a decision. Every item either
 * opens something or toggles a mode, and all of them are reversible, so the
 * modal's job — stopping you until you have committed — is not wanted. Escape,
 * a click outside, or choosing anything closes it.
 */

const { icon } = __req('js/icons.js');

/**
 * @param {object} opts
 *   anchor      the avatar button the menu hangs from
 *   items       [{ id, label, note, icon, danger }] — a `null` entry is a rule
 *   onSelect    (id) => void
 *   getState    () => ({ editing }) so the Edit item can name what it will do
 */

  menu.className = 'pmenu'
  menu.setAttribute('role', 'menu')
  menu.setAttribute('aria-label', 'Your account')

     listener. The listener version has to guess whether the click that OPENED
     the menu is the same click it is now seeing close it, and every
     implementation of that guess is a race. A layer that appears with the menu
     cannot receive the click that created it. */

  catcher.className = 'pmenu-catcher'
  catcher.hidden = true

  document.body.append(catcher, menu)

  function render() {
    const state = getState?.() || {}
    menu.replaceChildren()

    const head = document.createElement('div')
    head.className = 'pmenu__head'
    head.innerHTML =
      `<img class="pmenu__avatar" src="assets/img/avatar.png" alt="">` +
      `<span class="pmenu__who">` +
        `<span class="pmenu__name">Sourav Tambe</span>` +
        `<span class="pmenu__role">Curator · Command Centre</span>` +
      `</span>`

    for (const item of items) {
      if (!item) {
        const rule = document.createElement('span')
        rule.className = 'pmenu__rule'
        rule.setAttribute('role', 'separator')
        menu.append(rule)
        continue
      }

      const btn = document.createElement('button')
      btn.type = 'button'
      btn.className = 'pmenu__item'
      btn.setAttribute('role', 'menuitem')
      if (item.danger) btn.classList.add('is-danger')
      btn.dataset.id = item.id

         a control labelled "Edit Modules" while you are already editing is a
         control that looks like it does nothing. */

      const note = typeof item.note === 'function' ? item.note(state) : item.note

        `<span class="pmenu__text">` +

    { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]

__def('js/components/WorkspaceSwitcher.js', function (__x, __req) {
/**
 * THE WORKSPACE SWITCHER
 * ───────────────────────────────────────────────────────────────────────────
 * Two destinations, one control: Module Selection, and the Site Command Centre.
 *
 * ═══ WHY A SEGMENT UNDER THE SEARCH FIELD ══════════════════════════════════
 *
 * Three places were on the table and two of them break something.
 *
 *   A LEFT RAIL. It scales to a third and fourth workspace, and it costs
 *   72-88px of a 960px content width permanently. That width is not a
 *   preference — every card on this product is measured from it: 179.2px
 *   columns are (960 - 4x16) / 5 exactly, and the whole Figma artboard falls
 *   out of that arithmetic. A rail would have made every card the wrong size
 *   on the one page whose fidelity is measured in units.
 *
 *   TABS ON THE GREETING LINE. Free vertically, and that row already carries a
 *   two-line greeting plus three 44px controls. At 834px portrait it wraps, and
 *   what wraps is the switcher.
 *
 *   A SEGMENT BETWEEN SEARCH AND CONTENT. Costs about 60px once, sits exactly
 *   where the eye is already travelling on its way from the search field to the
 *   first card, and reads as what it is — two ways of looking at the same work,
 *   rather than a navigation to somewhere else.
 *
 * ═══ A TABLIST, AND ACTUALLY A TABLIST ═════════════════════════════════════
 *
 * Left and Right move between the two; the inactive tab is not a tab stop, so
 * Tab passes over the pair as one control. Both panels stay in the DOM and are
 * toggled with `hidden`, which is what makes the switch instant and what lets a
 * user come back to the scroll position they left.
 */

const { icon } = __req('js/icons.js');

const TABS = [
  { id: 'modules', label: 'Module Selection', sub: 'Your home page',  glyph: 'widgets' },
  { id: 'site',    label: 'Site Command Centre', sub: 'Operate a Site', glyph: 'd-overview' },
]

function createWorkspaceSwitcher({ root, getView, onChange }) {
  root.className = 'wswitch'
  root.setAttribute('role', 'tablist')
  root.setAttribute('aria-label', 'Workspace')

  const buttons = new Map()

  for (const tab of TABS) {
    const btn = document.createElement('button')
    btn.type = 'button'
    btn.className = 'wswitch__tab'
    btn.dataset.view = tab.id
    btn.setAttribute('role', 'tab')
    btn.innerHTML =
      `<span class="wswitch__glyph" aria-hidden="true">${icon(tab.glyph, 'glyph')}</span>` +
      `<span class="wswitch__text">` +
        `<span class="wswitch__label">${tab.label}</span>` +
        `<span class="wswitch__sub">${tab.sub}</span>` +
      `</span>`
    btn.addEventListener('click', () => onChange?.(tab.id))
    buttons.set(tab.id, btn)
    root.append(btn)
  }

  /* The moving plate behind the active tab. One element that slides, rather
     than a background on each button that cross-fades — a slide says the two
     tabs are one control with a position, which is the whole idea of a
     segmented switch. */
  const plate = document.createElement('span')
  plate.className = 'wswitch__plate'
  plate.setAttribute('aria-hidden', 'true')
  root.prepend(plate)

  root.addEventListener('keydown', (e) => {
    const step = { ArrowRight: 1, ArrowLeft: -1 }[e.key]
    if (!step) return
    e.preventDefault()
    const ids = TABS.map((t) => t.id)
    const i = ids.indexOf(getView())
    const next = ids[(i + step + ids.length) % ids.length]
    onChange?.(next)
    buttons.get(next)?.focus()
  })

  function sync() {
    const view = getView()
    root.dataset.active = view
    for (const [id, btn] of buttons) {
      const on = id === view
      btn.setAttribute('aria-selected', String(on))
      btn.setAttribute('aria-controls', `panel-${id}`)
      btn.tabIndex = on ? 0 : -1
    }
  }

  sync()
  return { sync, root }
}
  __x.createWorkspaceSwitcher = createWorkspaceSwitcher;
});

 * than the header growing a row per level.
