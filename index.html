/* ── the switch ─────────────────────────────────────────────────────────── */

const panels = {
  modules: document.getElementById('panel-modules'),
  site: document.getElementById('panel-site'),
}
const searchInput = document.querySelector('.search__input')

/**
 * WHAT THIS FIELD WILL FIND, ONE WORD AT A TIME.
 * ───────────────────────────────────────────────────────────────────────────
 * The list is per VIEW AND PER DEPTH, because the answer genuinely differs: the
 * home page finds modules and people, the Sites listing finds Sites, and an
 * enclosure finds the animals in it and what has been done to them. A single
 * list would have been quicker to write and would advertise, at an enclosure,
 * a search for Sites.
 *
 * FIRST WORD FIRST. Each list opens on the thing that depth is mostly about, so
 * a reader who never sees the animation still reads something true.
 */
const SEARCH_WORDS = {
  modules:   ['Modules', 'Widgets', 'Animals', 'Users', 'Reports'],
  sites:     ['Sites', 'Sections', 'Enclosures', 'Animals', 'Staff'],
  site:      ['Animals', 'Enclosures', 'Sections', 'Users', 'Assets', 'Tasks'],
  section:   ['Enclosures', 'Animals', 'Keepers', 'Tasks', 'Documents'],
  enclosure: ['Animals', 'Treatments', 'Enrichment', 'Keepers', 'Documents'],
}

const searchHint = createSearchHint({
  input: searchInput,
  root: document.querySelector('.search'),
  prefix: 'Search',
  words() {
    const st = viewStore.get()
    return st.view === 'site' ? SEARCH_WORDS[st.level] || SEARCH_WORDS.site : SEARCH_WORDS.modules
  },
})

/**
 * ENTER IS ACKNOWLEDGED, because there is no index to answer with. The motion
 * lives in the component; what belongs here is the WORDS, because only this file
 * knows which workspace's live region is the one being read.
 */
createSearchSubmit({
  input: searchInput,
  root: document.querySelector('.search'),
  hint: searchHint.el,
  onSubmit(value) {
    const mode = viewStore.get().view === 'site' ? wsEdit : edit
    mode.announce(value
      ? `Searching for \u201C${value}\u201D.`
      : 'Type a name, a code or a number to search.')
  },
})

const switcher = createWorkspaceSwitcher({
  root: document.getElementById('workspaceSwitch'),
  getView: () => viewStore.get().view,
  onChange: (view) => setView(view),
})

/* What the search field is scoped to, per level. */
function searchScope(st) {
  if (st.level === 'sites') return 'Search Sites'
  if (st.level === 'enclosure') {
    const enc = getEnclosure(st.enclosureId)
    return enc ? `Search ${enc.code}` : 'Search'
  }
  if (st.level === 'section') {
    const sec = getSection(st.sectionId)
    return sec ? `Search ${sec.name}` : 'Search'
  }
  const site = getSite(st.siteId)
  return site ? `Search ${site.short}` : 'Search'
}

/**
 * Bring the page into line with the store. Called for every change to view,
 * level, subject or role, because all of them move the same things — and one
 * function that reads the state and applies it is the only arrangement where
 * they cannot disagree. Nothing here decides anything; the store already did.
 */
const SUBJECT_REASONS = new Set(['sites', 'site', 'section', 'enclosure', 'hash', 'init'])

function syncWorkspace(meta = {}) {
  const st = viewStore.get()
  const onSite = st.view === 'site'
  /* THE ONE LEVEL WITH NO WORKSPACE. `sites` has no subject, so it has no
     catalogue, no saved arrangement and nothing to drag — the panel shows the
     listing instead of the grid, and every branch below that touches a
     workspace is skipped rather than being made to cope with a null. */
  const listing = onSite && st.level === 'sites'

  /* A RECORD IS A RECORD OF ONE SUBJECT. Switching Site, level or view while
     the sheet is open would leave Mysuru's maintenance record sitting over
     Bannerghatta's workspace — the same failure the grid teardown below exists
     to prevent, one layer up. */
  if (wsDetail.isOpen && (!onSite || SUBJECT_REASONS.has(meta.reason) || meta.reason === 'role')) {
    wsDetail.close()
  }

  document.body.classList.toggle('is-site', onSite)
  document.body.classList.toggle('is-listing', listing)
  document.body.dataset.level = st.level
  panels.modules.hidden = onSite
  panels.site.hidden = !onSite
  sitesEl.hidden = !listing
  workspaceEl.hidden = listing
  switcher.sync()

  /* Leaving a workspace leaves its edit mode. A user who switches away mid-edit
     and comes back to a page still wearing jiggling cards and a Done button has
     been handed a mode they did not ask to still be in. Changing LEVEL does the
     same, because the arrangement they were editing is not the one now showing. */
  if (onSite && edit.editing) edit.exit()
  if ((!onSite || SUBJECT_REASONS.has(meta.reason)) && wsEdit.editing) wsEdit.exit()

  /**
   * THE SCOPE GOES TO THE LABEL, AND THE FIELD'S OWN PLACEHOLDER GOES EMPTY.
   *
   * What is drawn in the field is the rotating hint — "Search · Animals",
   * "Search · Enclosures" — because a placeholder is a string and a string
   * cannot animate. The scope was the placeholder's whole contribution and it
   * is not lost: it is on the input's `aria-label`, which is what a screen
   * reader reads and the only place it was ever announced from.
   */
  searchInput.placeholder = ''
  searchInput.setAttribute('aria-label', onSite ? searchScope(st) : 'Search')
  searchHint.sync()

  if (meta.reason === 'role') {
    /* Every level's store, not just the live one — the user's arrangement at the
       other two depths is theirs too, and loading it lazily would mean the first
       drill-down after a role switch showed the previous role's page. */
    for (const key of ['site', 'section', 'enclosure']) workspaces[key].useRole(st.roleId)
  }

  if (listing) {
    /* The listing marks the Site you last had open, so it re-renders when that
       changes — and it is the only thing on the page that does at this level. */
    sitesList.render()
    wsHeader.render()
    return
  }

  if (SUBJECT_REASONS.has(meta.reason) || meta.reason === 'role') {
    /* The catalogue's DATA is what a subject changes — see applySite() and its
       two siblings. The saved arrangement is not touched, which is the point:
       your workspace is how you work, not a property of one enclosure. */
    cat().apply(st)

    /**
     * AND THE GRID HAS TO BE TOLD, because it cannot work this out for itself.
     *
     * The grid reconciles by uid and rebuilds a card only when its variantId or
     * its span changed — exactly right for every other update, and exactly wrong
     * for this one. Moving between two Sections changes neither: the same twenty
     * widgets at the same sizes, with completely different contents underneath.
     * Without this the workspace showed one Section's figures under another's
     * name, which is the worst failure this page can have because it is the one
     * that looks like it worked.
     */
    wsGrid.destroy()
  }

  wsHeader.render()
  if (onSite) paintWorkspace({ animate: !SUBJECT_REASONS.has(meta.reason) })
}

viewStore.subscribe((state, prev, meta) => {
  wsHeader.closeMenus()
  syncWorkspace(meta)
})

/* Escape goes up a level — the keyboard equivalent of the breadcrumb, and the
   thing a person tries first after drilling in. Not bound while a sheet or a
   menu is open, because there Escape already means "close this". */
document.addEventListener('keydown', (e) => {
  if (e.key !== 'Escape') return
  if (viewStore.get().view !== 'site') return
  if (wsPicker.isOpen || picker.isOpen || profileMenu.isOpen || wsDetail.isOpen) return
  /* A HEADER MENU OWNS ESCAPE WHILE IT IS OPEN. Without this the key both closed
     the menu and climbed a level, which is one keystroke doing two things — and
     the second of them was the one nobody asked for. */
  if (wsHeader.menuOpen) return
  if (wsEdit.editing) return
  if (goUp()) e.preventDefault()
})

/* Edit mode is a session state at every level, for the same reason. */
for (const key of ['site', 'section', 'enclosure']) {
  workspaces[key].setEditing(false)
  workspaces[key].useRole(viewStore.get().roleId)
}
siteCat.applySite(viewStore.get().siteId)
sectionCat.applySection(viewStore.get().sectionId)
enclosureCat.applyEnclosure(viewStore.get().enclosureId)
syncWorkspace({ reason: 'init' })


/* ── render ─────────────────────────────────────────────────────────────── */

function paint(opts = { animate: true }) {
  grid.render(cards(), opts)
}

layoutStore.subscribe(() => {
  /* A store change that arrives mid-drag is the drag's own preview being
     committed; the grid is already showing it. */
  if (working) return
  paint()
})

/* Edit mode is a session state, not a saved one — a user who leaves the page
   mid-edit should come back to a readable home page. */
setEditing(false)
paint({ animate: false })

/* ── responsive reflow ──────────────────────────────────────────────────── */

/**
 * Nothing needs to happen on most resize events: the CSS handles the columns,
 * and the packer only has to re-run when the COLUMN COUNT changes. Dragging a
 * desktop window across two hundred pixels fires a hundred resize events and
 * should cause exactly zero repacks.
 */
let lastCols = currentColumns()
let resizeTimer = 0

function onResize() {
  clearTimeout(resizeTimer)
  resizeTimer = window.setTimeout(() => {
    const cols = currentColumns()
    if (cols === lastCols) return
    lastCols = cols
    /* Both grids, not just the visible one. The hidden panel is `hidden`, not
       unmounted, so it keeps its DOM and its stale `grid-area` values — repack
       it now and switching back is instant; skip it and the first frame after a
       rotation shows the previous column count. */
    paint({ animate: false })
    paintWorkspace({ animate: false })
  }, 120)
}

window.addEventListener('resize', onResize)
window.addEventListener('orientationchange', onResize)

/* ── developer conveniences ─────────────────────────────────────────────── */
Object.assign(window, {
  antz: {
    reset: resetLayout,
    state: () => layoutStore.get(),
    columns: currentColumns,
    /* test hook: put every variant on the grid at every size it declares, so a
       clipping regression cannot hide behind the default layout */
    allVariants() {
      const all = __req('js/data/cardVariants.js').CARD_VARIANTS
      const out = []
      let i = 0
      for (const v of all) for (const sz of v.supportedSizes) out.push({ uid: 'x' + (i++), variantId: v.id, size: sz })
      __req('js/state/layoutStore.js').setCards(out, { reason: 'stress' })
    },

    /**
     * The catalogue and the default home page have to agree, and there are two
     * files where they could quietly stop agreeing: a card promoted to
     * `priority: 'primary'` in cardVariants.js that nobody seeded, or a card
     * seeded in layoutStore.js that is no longer primary — or no longer exists.
     *
     * Cheap to check, invisible when it passes, and it names the file to open
     * when it fails.
     */
    checkDefaults() {
      const { primaryVariants, getVariant } = __req('js/data/cardVariants.js')
      const { DEFAULT_LAYOUT } = __req('js/state/layoutStore.js')

      const seeded = new Set(DEFAULT_LAYOUT.map((d) => d.variantId))
      const problems = []

      for (const v of primaryVariants()) {
        if (!seeded.has(v.id)) problems.push(`primary but not on the default home page: ${v.id}`)
      }
      for (const d of DEFAULT_LAYOUT) {
        const v = getVariant(d.variantId)
        if (!v) { problems.push(`seeded but not in the catalogue: ${d.variantId}`); continue }
        if (v.priority !== 'primary') problems.push(`seeded but ${v.priority}, not primary: ${d.variantId}`)
        if (!v.supportedSizes.includes(d.size)) {
          problems.push(`seeded at a size it does not support: ${d.variantId} @ ${d.size}`)
        }
      }

      if (problems.length) console.warn('[antz] default layout:\n  ' + problems.join('\n  '))
      else console.info('[antz] default layout agrees with the catalogue.')
      return problems
    },

    /** One widget's live, Site-resolved record — for a console session or a
        verification script asking what a card is actually showing. */
    widget: (id) => cat().getWidget(id) || siteCat.getWidget(id),

    /* ── the Site Command Centre, at all three depths ────────────────── */
    site: {
      view: () => viewStore.get(),
      state: () => ws().store.get(),
      go: (v) => setView(v),
      site: (id) => setSite(id),
      section: (id) => setSection(id),
      enclosure: (id) => setEnclosure(id),
      level: (l) => setLevel(l),
      up: () => goUp(),
      down: () => goDown(),
      role: (id) => setRole(id),
      reset: () => ws().resetWorkspace(),

      /** What is under the current subject — for finding an id to drill into. */
      children() {
        const st = viewStore.get()
        if (st.level === 'site') return sectionsForSite(st.siteId).map((x) => x.id)
        if (st.level === 'section') return enclosuresIn(st.sectionId).map((x) => x.id)
        return []
      },

      /** Every widget of the CURRENT level at every size it declares. */
      allWidgets() {
        const out = []
        let i = 0
        for (const w of cat().widgets) for (const sz of w.supportedSizes) {
          out.push({ uid: 'x' + (i++), variantId: w.id, size: sz })
        }
        setView('site')
        /* The switch lands on the SITES LISTING now, and a listing has no grid
           to sweep — so step into the Site whose catalogue this is. */
        if (viewStore.get().level === 'sites') setLevel('site')
        ws().setCards(out, { reason: 'stress' })
      },
    },

    /**
     * THE THREE CATALOGUES' EQUIVALENT OF checkDefaults(), and it has one more
     * thing to assert than the home page does.
     *
     * The home page has one default arrangement. The Site Command Centre has
     * FIFTEEN — five roles across three levels — and each can go wrong in four
     * ways: naming a widget that does not exist, naming one at a size it does not
     * support, naming one the role is not permitted to see, or — the failure that
     * is invisible until you look at the page — not filling the five-column grid,
     * which leaves a hole the brief explicitly forbids.
     *
     * That last check is the reason this exists. Every default is composed from
     * blocks that fill two rows exactly (see roles.js), and it is very easy to
     * break that by changing one widget's `supportedSizes` in passing. The packer
     * is asked directly rather than trusted.
     */
    checkSiteDefaults() {
      const { pack, rowCount } = __req('js/lib/pack.js')
      const problems = []
      const catalogues = { site: siteCat, section: sectionCat, enclosure: enclosureCat }

      for (const role of __req('js/data/roles.js').ROLES) {
        for (const level of ['site', 'section', 'enclosure']) {
          const tag = `${role.id}/${level}`
          const getW = catalogues[level].getWidget
          const list = defaultsFor(role, level)
          if (!list.length) { problems.push(`${tag}: no default arrangement`); continue }

          const seen = new Set()
          for (const d of list) {
            const w = getW(d.id)
            if (!w) { problems.push(`${tag}: seeded but not in the catalogue: ${d.id}`); continue }
            if (!w.supportedSizes.includes(d.size)) {
              problems.push(`${tag}: seeded at a size it does not support: ${d.id} @ ${d.size}`)
            }
            if (!permits(role, w)) {
              problems.push(`${tag}: seeded but not permitted: ${d.id} (needs ${w.requires})`)
            }
            if (seen.has(d.id)) problems.push(`${tag}: seeded twice: ${d.id}`)
            seen.add(d.id)
          }

          /**
           * TWO CARDS WITH THE SAME TITLE ARE A CARD THAT HAS NOT BEEN NAMED.
           *
           * The quick-action cards were first titled after their domain, and
           * four of those titles were already on a summary card in the same
           * domain — so a Facility Manager's default carried two cards headed
           * "Maintenance", one reading "12 Open Jobs" and one reading
           * "Raise Job · Log Defect", and the reader was handed the job of
           * working out they were the same subject. Reading the five defaults by
           * eye found three of the four.
           *
           * The TITLE is checked rather than the widget name, because the title
           * is what is drawn on the card. Two cards from different domains may
           * share one — the same word means different things under different
           * glyphs and different fills — so this is scoped to ONE role's page,
           * which is the only place two of them are ever seen together.
           */
          const titles = new Map()
          for (const d of list) {
            const w = getW(d.id)
            const t = w && w.data && w.data.title
            if (!t) continue
            if (titles.has(t)) {
              problems.push(`${tag}: two cards titled "${t}": ${titles.get(t)} and ${d.id}`)
            }
            titles.set(t, d.id)
          }

          /* Holes. Pack the role's seed at the reference five columns and count
             the cells that no card claimed. */
          const cards = workspaces[level].seedFor(role.id)
          const placed = pack(cards, 5)
          const rows = rowCount(placed)
          const filled = placed.reduce((n, p) => n + p.w * p.h, 0)
          const gap = rows * 5 - filled
          if (gap > 0) {
            problems.push(`${tag}: leaves ${gap} empty cell${gap === 1 ? '' : 's'} in ${rows} rows`)
          }
        }
      }

      if (problems.length) console.warn('[antz] workspace defaults:\n  ' + problems.join('\n  '))
      else console.info('[antz] all 15 role x level workspaces agree with their catalogue and pack without gaps.')
      return problems
    },

    /**
     * THE MODULE CATALOGUE AND THE WIDGET CATALOGUE AGREE.
     * ─────────────────────────────────────────────────────────────────────
     * Two files describe the thirty-four ANTZ modules from different sides —
     * siteModules.js says what a module IS and which card it contributes,
     * siteWidgets.js builds that card — and there are five ways for them to
     * drift apart quietly:
     *
     *   a module naming a widget that does not exist
     *   a module naming a domain that is not in the Site catalogue
     *   a module card whose menu row nobody can reach, because no role's
     *     permissions include its domain
     *   a role name in a module's audience that is not one of the twelve
     *   a module card seeded into a default at a size it does not support —
     *     already covered by checkSiteDefaults(), and asserted here too
     *     because this is the file a reviewer of the menu will run
     *
     * The last of the five is the one that matters most: a module in the menu
     * that no seat can open is a row the product will never show anybody, and
     * it is invisible until somebody counts.
     */
    checkModules() {
      const v5 = __req('js/data/siteModules.js')
      const { ROLES } = __req('js/data/roles.js')
      const problems = []
      const domains = new Set(DOMAINS.map((d) => d.id))
      const seats = new Set(v5.ANTZ_ROLES)
      const seen = new Set()

      for (const m of v5.MODULES) {
        const tag = `${m.key}`
        if (seen.has(m.key)) problems.push(`${tag}: listed twice`)
        seen.add(m.key)

        const w = siteCat.getWidget(m.widget)
        if (!w) { problems.push(`${tag}: names a widget that is not in the catalogue: ${m.widget}`) }
        else if (w.moduleId !== m.domain) {
          problems.push(`${tag}: its card sits in ${w.moduleId}, the module says ${m.domain}`)
        } else if (w.module !== m.key) {
          problems.push(`${tag}: its card does not point back at it (module: ${w.module})`)
        }

        if (!domains.has(m.domain)) problems.push(`${tag}: unknown domain ${m.domain}`)
        for (const r of m.roles) {
          if (!seats.has(r)) problems.push(`${tag}: "${r}" is not one of the twelve roles`)
        }
        if (!ROLES.some((role) => role.permissions.includes(m.domain))) {
          problems.push(`${tag}: no role can open ${m.domain}, so this row is unreachable`)
        }
      }

      /* And every seat in the document is covered by exactly one workspace
         role — the bridge in siteModules.js is the only new thing here that
         can be wrong, and this is the whole of what wrong means for it. */
      const covered = Object.values(v5.ROLE_DOC_NAMES).flat()
      for (const seat of v5.ANTZ_ROLES) {
        const n = covered.filter((x) => x === seat).length
        if (n !== 1) problems.push(`role bridge: "${seat}" is covered by ${n} workspace roles, not 1`)
      }
      for (const name of covered) {
        if (!seats.has(name)) problems.push(`role bridge: "${name}" is not one of the twelve`)
      }
      for (const role of ROLES) {
        if (!v5.ROLE_DOC_NAMES[role.id]) problems.push(`role bridge: ${role.id} has no seats`)
        const { mine } = v5.modulesForRole(role.id, (d) => role.permissions.includes(d))
        if (!mine.length) problems.push(`${role.id}: no module is a priority for this role`)
      }

      if (problems.length) console.warn('[antz] modules:\n  ' + problems.join('\n  '))
      else {
        console.info(`[antz] ${v5.MODULES.length} modules, ${v5.ANTZ_ROLES.length} roles, ` +
                     'and a card for every one of them.')
      }
      return problems
    },

    /**
     * EVERY WIDGET HAS SOMETHING TO OPEN.
     *
     * A card that opens a sheet with nothing in it is worse than a card that
     * opens nothing at all, and the way that happens is quiet: a domain added
     * to a catalogue without a record in domainDetail.js, or a group whose rows
     * are a function that returns nothing at this depth. Both are invisible
     * until somebody taps the one card that finds them.
     *
     * So this resolves the record for EVERY domain at EVERY level against the
     * subject currently loaded, and checks four things: that a record exists,
     * that it survived the level filter with groups left, that no row came out
     * with an empty value, and that the tapped-widget group match resolves to a
     * group that is actually in the record.
     */
    checkDetail() {
      const problems = []
      const catalogues = { site: siteCat, section: sectionCat, enclosure: enclosureCat }
      const st = viewStore.get()
      let records = 0, fields = 0

      /* The deeper two subjects are only set once a reader has been there, and
         a check that silently skipped them would be worth nothing — so it falls
         back to the first child of whatever Site is loaded. */
      const section = getSection(st.sectionId) || sectionsForSite(st.siteId)[0] || null
      const enclosure = getEnclosure(st.enclosureId) ||
                        (section ? enclosuresIn(section.id)[0] : null)

      for (const level of ['site', 'section', 'enclosure']) {
        const lv = LEVELS[level]
        const x = buildContext({
          level,
          site: getSite(st.siteId),
          section, enclosure,
          getWidget: catalogues[level].getWidget,
          sections: level === 'site' ? sectionsForSite(st.siteId) : [],
          enclosures: level === 'section' && section ? enclosuresIn(section.id) : [],
          occupants: level === 'enclosure' ? occupantRows() : [],
        })
        if (!x) { problems.push(`${level}: no subject loaded to resolve against`); continue }

        for (const domainId of lv.domains) {
          const tag = `${level}/${domainId}`
          if (!hasDetail(domainId)) { problems.push(`${tag}: no record in domainDetail.js`); continue }

          const rec = detailFor(domainId, x)
          if (!rec.groups.length) { problems.push(`${tag}: every group filtered out at this level`); continue }
          records++
          fields += rec.fields

          for (const t of rec.tiles) {
            if (!t.value) problems.push(`${tag}: tile "${t.label}" has no value`)
          }
          for (const g of rec.groups) {
            if (!g.rows.length) problems.push(`${tag}: group "${g.name}" is empty`)
            if (g.kind === 'table') {
              const wide = g.rows.find((r) => r.cells.length !== (g.cols || []).length)
              if (wide) problems.push(`${tag}: "${g.name}" has a row of ${wide.cells.length} against ${g.cols.length} columns`)
            } else {
              const blank = g.rows.find((r) => !(r.value || r.text))
              if (blank) problems.push(`${tag}: "${g.name}" has a row with no value: ${blank.label || ''}`)
            }
          }

          /* And the landing group, for every widget that opens this record. */
          for (const w of lv.widgetsForDomain(domainId)) {
            const start = startGroupFor(w, rec.groups)
            if (start && !rec.groups.some((g) => g.name === start)) {
              problems.push(`${tag}: ${w.id} lands on a group that is not here: ${start}`)
            }
          }
        }
      }

      if (problems.length) console.warn('[antz] widget records:\n  ' + problems.join('\n  '))
      else console.info(`[antz] ${records} widget records resolve across three levels, ${fields} fields in total.`)
      return problems
    },

    /**
     * THE HIERARCHY ADDS UP.
     *
     * A Site header saying "12 Sections · 48 Enclosures · 86 Staff" over a
     * sections list whose rows come to 44 enclosures is the same class of bug
     * this build already found twice: not a crash, a page that looks completely
     * fine and is wrong. Cheap to check, invisible when it passes, and it names
     * the record to open when it fails.
     *
     * It also asserts that every enclosure a Site-level card NAMES exists — the
     * Welfare Alerts card points at two enclosure codes and Restricted Areas at
     * one, and a summary that names a thing the detail view cannot show teaches
     * the reader not to trust either.
     */
    checkHierarchy() {
      const { SITES } = __req('js/data/sites.js')
      const { sectionsForSite: secs, enclosuresIn: encs, getSection } = __req('js/data/sections.js')
      const problems = []

      for (const site of SITES) {
        const list = secs(site.id)
        if (!list.length) { problems.push(`${site.id}: no sections`); continue }
        if (list.length !== site.counts.sections) {
          problems.push(`${site.id}: ${list.length} section records against counts.sections ${site.counts.sections}`)
        }
        for (const key of ['enclosures', 'staff', 'species', 'animals']) {
          const sum = list.reduce((n, x) => n + x.counts[key], 0)
          if (sum !== site.counts[key]) {
            problems.push(`${site.id}: sections sum to ${sum} ${key}, site record says ${site.counts[key]}`)
          }
        }
        for (const sec of list) {
          const e = encs(sec.id)
          if (e.length !== sec.counts.enclosures) {
            problems.push(`${sec.id}: ${e.length} enclosures generated against counts.enclosures ${sec.counts.enclosures}`)
          }
          if (sec.siteId !== site.id) problems.push(`${sec.id}: siteId does not match`)
        }
      }

      /* Codes a Site-level card promises the reader they can go and look at. */
      const promised = ['CAR-02', 'HRB-03', 'REP-04']
      const all = new Set()
      for (const site of SITES) for (const sec of secs(site.id)) {
        for (const e of encs(sec.id)) all.add(e.code)
      }
      for (const code of promised) {
        if (!all.has(code)) problems.push(`a Site card names ${code}, which does not exist`)
      }

      if (problems.length) console.warn('[antz] hierarchy:\n  ' + problems.join('\n  '))
      else console.info('[antz] the hierarchy reconciles: 4 sites, 31 sections, 139 enclosures.')
      return problems
    },
  },
})


});

__req('js/app.js');
})();
</script>
