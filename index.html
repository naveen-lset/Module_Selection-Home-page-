<!doctype html>
<!--
  ═══════════════════════════════════════════════════════════════════════════
  ANTZ COMMAND CENTRE · HOME
  Customizable module dashboard — one self-contained file.

  Implemented from Figma: Antz Modules → Home (iPad Pro 12.9" - 6)
  node 55476:32828. Colours, gradients, type sizes, paddings and the five
  column grid are transcribed from that artboard; icons and photographs are the
  assets exported from it, in ./assets. The one drawing that is not from the
  Figma file is the header planting, which was supplied separately as a flat
  PNG and is processed into a transparent, tileable asset by tools/foliage.py.

  Open it by double-clicking. There is no build step and nothing to install.
  Everything except the images lives in this file: the stylesheet is in <style>
  below, and the whole application is in the single <script> at the foot,
  organised into the same sections it was authored in.

  WHAT THIS IS
    Seventeen modules, each offering the widgets its own work actually has —
    seventy-one cards in total, built from two treatments and eleven content
    blocks so that they are recognisably one product. Every card declares a
    PURPOSE (navigate · understand · attention · act · monitor), the sizes it
    supports, and a PRIORITY that decides whether it seeds the default home
    page. The catalogue is data: see js/data/cardVariants.js below.

    The home page is arranged by the user — drag, resize, add, remove — and
    saved to localStorage. Everything they can do to it hangs off their own
    avatar, top right.

  CONTENTS
    <style>   tokens · home chrome · header planting · grid · cards + blocks ·
              edit mode · profile menu · widget gallery · widget record sheet
    <body>    status bar · planting · greeting · search · hero banner · modules
    <script>  icons · sizes · packer · store · modules · card variants ·
              card · grid · drag · edit · preview · profile menu ·
              widget gallery · widget record sheet · app

  Console helpers
    antz.state()          the live layout
    antz.columns()        how many columns the viewport resolves to
    antz.reset()          back to the default home page
    antz.allVariants()    every card at every size it declares, on the grid
    antz.widget(id)       one Site widget's live, Site-resolved record
    antz.checkDefaults()  assert the catalogue and the default page agree
    antz.checkSiteDefaults()  the same, for 5 roles x 3 workspace levels
    antz.checkModules()   assert the 34 ANTZ modules and their cards agree
    antz.checkDetail()    assert every widget has a record to open
  ═══════════════════════════════════════════════════════════════════════════
-->

     ground. Stop positions are Figma's own, to three decimals. */

  --c-tertiary:         #FA6140;  /* MD3_Antz/Tertiary                        */
  --c-on-primary-ctr:   #1F515B;  /* MD3_Antz/OnPrimaryContainer  active date */
  --c-success:          #72E128;  /* Light/Success/Main          presence dot */
  --c-white:            #FFFFFF;  /* Light/Common/White                       */

  --ink:      var(--c-on-secondary-ctr);
  --ink-head: var(--c-on-surface-var);
  --ink-mute: var(--c-neutral-2);
  --on-dark:  var(--c-white);

  /* ── 3 · module card gradients ─────────────────────────────────────────
     Each of these is the RENDERED ramp, sampled off the Figma artboard at ten
     points along the card's own gradient axis, and the angles are Figma's.

     WHY SAMPLED RATHER THAN TRANSCRIBED. Figma reports these fills as two
     alpha stops — e.g. `rgba(0,109,53,.16) 48.848%, rgba(0,109,53,.8) 74.362%`
     — and pasting those into CSS is wrong, because a Figma gradient handle is
     positioned independently of the shape it fills. On these cards the handle
     runs well past the corners, so the shape only ever shows a slice of the
     ramp; CSS instead maps 0–100% onto the shape's own diagonal. Transcribed
     directly, every card came out correct at its dark end and far too pale at
     its light end — measured, the top-left of Medical was #E7FAF9 against
     Figma's #86B99F, while the bottom-right matched to within one unit.

     Sampling sidesteps the whole handle-geometry problem: a linear gradient is
     constant along the perpendicular to its axis, so each stop is the median of
     a full perpendicular scan line, which also rejects the white icon and label
     glyphs sitting on the axis. The values are opaque because they are the
     composited result — what Figma actually draws. */

                    rgb(84, 227, 218) 35.3%,

                    rgb(108, 209, 230) 6.0%,

     see the other modules": a Hospital or Species card with no photograph under
     it painted 32%-alpha teal onto white, and the picker's module tiles, which
     wear the same fill behind a white glyph, came out as pale ghosts next to
     the twelve opaque ones. The photographic cards do not read these tokens at
     all (see cards.css — no background is painted for `image` treatments), so
     the alpha was doing nothing except breaking the plain cards.

     These are the same three hues, composited to opacity on the same ten-stop
     ramp the rest of the palette uses. The photographs are untouched. */
  --g-species:         linear-gradient(123.16619deg,
                  rgb(82, 156, 118) 6.0%,
                  rgb(70, 149, 109) 15.8%,
                  rgb(59, 143, 99) 25.6%,
                  rgb(47, 136, 90) 35.3%,

                  rgb(252, 148, 125) 6.0%,
                  rgb(252, 141, 116) 15.8%,
                  rgb(251, 133, 108) 25.6%,
                  rgb(251, 126, 99) 35.3%,

                  rgb(250, 104, 73) 64.7%,

                  rgb(250, 97, 64) 84.2%,

                  rgb(103, 137, 143) 6.0%,
                  rgb(93, 129, 136) 15.8%,
                  rgb(82, 121, 128) 25.6%,
                  rgb(72, 113, 121) 35.3%,
                  rgb(62, 105, 113) 45.1%,
                  rgb(52, 97, 106) 54.9%,
                  rgb(41, 89, 98) 64.7%,
                  rgb(31, 81, 91) 74.4%,
                  rgb(31, 81, 91) 84.2%,
                  rgb(31, 81, 91) 94.0%);


  /* The scrim under a label on a photographic card. Figma draws it as a fixed
     113px band across the bottom with a 2px backdrop blur — not a full-height
     overlay — which is why the top of those photographs stays clean. */
  --scrim-band: linear-gradient(179.41143632907807deg,
    rgba(255, 255, 255, 0) 5.6838%, rgba(58, 58, 58, .7) 64.478%);
  --scrim-band-h: 113px;

  /* ── 4 · elevation ─────────────────────────────────────────────────────*/
  --shadow-hero: 0 2px 10px 0 rgba(76, 78, 100, .22);
  --shadow-card: 0 1px 3px rgba(31, 65, 91, .06), 0 8px 24px -10px rgba(31, 65, 91, .14);
  --shadow-lift: 0 4px 10px rgba(31, 65, 91, .10), 0 26px 56px -18px rgba(31, 65, 91, .32);

  /* ── 5 · radii · Figma uses 16px almost everywhere ─────────────────────*/
  --r-card:  16px;
  --r-field: 16px;
  --r-sheet: 28px;
  --r-pill:  999px;

  /* ── 6 · spacing scale ─────────────────────────────────────────────────*/
  --s1: 4px;  --s2: 8px;  --s3: 12px; --s4: 16px; --s5: 20px;
  --s6: 24px; --s7: 28px; --s8: 32px; --s10: 40px; --s11: 44px; --s12: 48px;

  /* ── 7 · motion ────────────────────────────────────────────────────────*/
  --ease:       cubic-bezier(.22, .61, .36, 1);
  --ease-out:   cubic-bezier(.16, 1, .3, 1);
  --ease-sheet: cubic-bezier(.32, .72, 0, 1);
  --t-fast: 140ms; --t-base: 220ms; --t-slow: 320ms; --t-sheet: 420ms;

  /* ── 8 · type ──────────────────────────────────────────────────────────
     Three families, each doing one job, all as Figma specifies.
       Inter       everything structural — Antz text/* is an Inter set
       Sour Gummy  the "Good Morning," line, Light, and nothing else
       DM Sans     the two big figures on the Species card, Bold, opsz 14

     LINE HEIGHT IS `normal`, AND THE TOKENS ARE MISLEADING ABOUT IT. Every
     Antz text style reports `lineHeight: 100`, which reads like "line-height:
     1" and is not: in Figma a percentage line height of 100% means 100% of the
     font's own default, i.e. Auto. The node metadata settles it — a 20px
     Module Name occupies a 24px text frame, which is Inter's normal 1.21, not
     1.0. Setting these to 1 was tried and measured worse.

     Every clamp is SOLVED so that its middle term evaluates to Figma's exact
     size at the 1024px reference, not merely to something between the floor and
     the ceiling. Written by eye the first time, the whole page came out 10–25%
     small — `--fs-card` landed at 18.0px against the artboard's 20px, and every
     other token was under too. For a token that should read Npx at 1024:

         a = (N − b × 10.24) / 16      given the chosen vw coefficient b

     so `--fs-card` is 1.058rem + .3vw → 16.928 + 3.072 = 20.000px. Change a
     ceiling or a floor freely; change a middle term and re-solve it. */
  --font:       'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  --font-greet: 'Sour Gummy', 'Comic Sans MS', var(--font);
  --font-num:   'DM Sans', var(--font);
  --font-sys:   -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Roboto, sans-serif;

  --fs-greet:   clamp(18px, 1.3848rem + .18vw, 26px);   /* Figma 24 @1024 */
  --fs-name:    clamp(24px, 1.84rem + .25vw, 36px);   /* Figma 32 @1024 */
  --fs-hero:    clamp(24px, 1.3796rem + 1.36vw, 40px);   /* Figma 36 @1024 */
  --fs-search:  clamp(16px, 1.0772rem + .27vw, 22px);   /* Figma 20 @1024 */
  --fs-card:    clamp(16px, 1.058rem + .3vw, 22px);   /* Figma 20 @1024 */
  --fs-card-lg: clamp(18px, 1.244rem + .4vw, 26px);   /* Figma 24 · Diet  */
  --fs-stat:    clamp(30px, 1.95rem + 1.25vw, 48px);   /* Figma 44 @1024 */
  /* No Figma reference — the artboard has no one-row statistics card. Sized so
     a label row plus a figure clears a 132px content box with room to spare. */
  --fs-stat-sm: clamp(22px, 1.15rem + 1.2vw, 34px);

  /* THE TWO SIZES BETWEEN A HEADING AND A HEADLINE FIGURE.
     Figma has exactly one figure size, 44px, because the artboard has exactly
     one card that shows a figure. A catalogue with four-up metric cards and
     queue counts on it needs two more steps, or every card ends up shouting at
     the same volume and the grid loses its hierarchy entirely.

       --fs-count   a queue length — "24 Pending". Reads as a state.
       --fs-metric  one of two to four figures sharing a card. Reads as data.

     Both are derived from the Figma step rather than picked: count is 44 × 0.7
     and metric is 44 × 0.61, which keeps the same 1.15 ratio the rest of the
     scale walks on. The `-sm` pair is the same figure on a one-row card. */
  --fs-metric:    clamp(20px, 1.14rem + .68vw, 27px);
  --fs-metric-sm: clamp(17px, .99rem + .52vw, 23px);

  /* The title line on a data card. Smaller than a module name on a door —
     that is a label for the whole card, this is a heading over content. */
  --fs-card-title: clamp(14px, .8398rem + .27vw, 19px);
  --fs-body:    clamp(14px, .8848rem + .18vw, 17px);   /* Figma 16 @1024 */
  --fs-label:   clamp(12.5px, .779rem + .15vw, 15px);   /* Figma 14 @1024 */
  --fs-micro:   clamp(11px, .6732rem + .12vw, 13px);   /* Figma 12 @1024 */

  /* ── 9 · the grid ──────────────────────────────────────────────────────
     FIVE columns at the reference, not six.

     This is measured, not chosen: every small card in the Figma is 179.2px and
     every wide one 374.4px. (960 − 4×16) ÷ 5 = 179.2, and 179.2×2 + 16 = 374.4.
     The tall cards are 344px, which is 164×2 + 16. So the artboard is a five
     column grid with 16px gutters and 164px rows, and the whole layout falls
     out of that. An earlier requirements note said six columns for this width;
     the Figma is the more specific instruction and it wins. */
  --grid-cols: 5;
  --grid-gap:  16px;
  --grid-row:  164px;
  --pad-page:  32px;
  --pad-card:  16px;
  /* 960, THE ARTBOARD'S CONTENT WIDTH — so the page frame is 960 + 2×32 =
     1024px, and the product renders at its native size on any monitor.
     It was 1440, which let the page fill a desktop and stretch a design that
     was drawn for a tablet. */
  --max-content: 960px;

  /* ── 10 · UI chrome ────────────────────────────────────────────────────
     Edit mode and the Add-to-Home sheet are product surfaces the artboard does
     not draw — it shows the resting home page only. They still need a neutral
     palette, so this is one derived from the Figma tokens above rather than
     invented alongside them: the petrol ramp is stepped from #1F515B
     (OnPrimaryContainer), the ink tiers from #7A8684 (neutralSecondary), and
     the accent is #00AFD6 (addPrimary) — the same cyan the design uses for its
     own affordances. Nothing here appears on a module card. */
  --surface:    #FFFFFF;
  --line:       rgba(31, 65, 91, .10);
  --line-2:     rgba(31, 65, 91, .16);
  --canvas-2:   #E7F7F5;                 /* mid point of the page wash        */

  --ink-2:      #52697A;
  --ink-3:      var(--c-neutral-2);      /* #7A8684 · labels, meta            */
  --ink-4:      #9AAAB4;                 /* decorative glyphs only, never text */

  --sig:        var(--c-add-primary);    /* #00AFD6                           */

  /* ── semantic tones ────────────────────────────────────────────────────
     Three states, for text and dots sitting on a module's gradient. A card is
     never repainted by its worst line; only the figure or the dot takes the
     colour.

     They are pitched to measure no worse than the white text they sit beside:
     on Follow Up's petrol the alert tone reads 2.4:1 against white's 2.56:1.
     Both are under AA, which is the documented condition of this palette
     rather than anything these introduce — see the accessibility section of
     the README, and the standing fix there (darken the light end of each
     gradient) would lift these with everything else. */
  --c-ok:    #B6F3D6;
  --c-warn:  #FFE4BC;
  --c-alert: #FFD6CE;

  /* The two figure sizes the layouts ask for, named for what they are rather
     than for the card they came from. Aliases, so the fluid definitions and
     the 1024 freeze below stay in one place. */
  --fs-hero-num:    var(--fs-stat);
  --fs-hero-num-sm: var(--fs-stat-sm);
  /* The Edit affordance is the one element on this page that is NOT in the
     artboard, so it is the one place I am free to fix contrast without altering
     the design. Figma's #00AFD6 measures 2.40:1 on the mint canvas; this is the
     same cyan darkened until it clears AA at 4.65:1. Every colour that IS in
     the artboard is left exactly as drawn — see the note in the README. */
  --ui-link:    #007A95;
  --clay:       var(--c-tertiary);       /* #FA6140 · destructive hover       */

  --petrol-050: #EEF5F6;
  --petrol-100: #DCE9EB;
  --petrol-200: #B6CDD1;
  --petrol-300: #8DAEB4;
  --petrol-400: #5E8A92;
  --petrol-500: #3E7078;
  --petrol-600: #2E5C64;
  --petrol-700: #234C54;
  --petrol-800: var(--c-on-primary-ctr); /* #1F515B                           */
  --petrol-900: #16373D;

  --e0:     0 1px 2px rgba(31, 65, 91, .05);
  --e1:     0 1px 3px rgba(31, 65, 91, .06), 0 8px 24px -10px rgba(31, 65, 91, .14);
  --e2:     0 2px 6px rgba(31, 65, 91, .08), 0 18px 40px -14px rgba(31, 65, 91, .22);
  --e-drag: var(--shadow-lift);

  --btn:       var(--icon-btn);          /* 44px touch floor                  */
  --fs-title:  var(--fs-card);
  --s16:       64px;

  /* ── 11 · chrome ───────────────────────────────────────────────────────*/
  --search-h:  64px;
  --hero-h:    204px;
  --icon-btn:  44px;
  --z-sheet:   400;
  --z-drag:    500;
}

/* ══════════════════════════════════════════════════════════════════════════
   BREAKPOINTS
   The reference band is untouched. The others step the column count and the
   spacing so the same cards stay legible; nothing re-declares a component.
   ══════════════════════════════════════════════════════════════════════════ */

/* ── Mobile · < 768px · 2 columns ────────────────────────────────────────*/
@media (max-width: 767px) {
  :root {
    --grid-cols: 2;
    --grid-gap:  12px;
    --grid-row:  148px;
    --pad-page:  16px;
    --pad-card:  14px;
    --search-h:  54px;
    --hero-h:    168px;
  }
}

/* ── Tablet portrait · 768–899px · 4 columns ─────────────────────────────*/
@media (min-width: 768px) and (max-width: 899px) {
  :root {
    --grid-cols: 4;
    --grid-gap:  14px;
    --grid-row:  156px;
    --pad-page:  24px;
    --search-h:  60px;
    --hero-h:    188px;
  }
}

/* ── 900px and up · 5 columns · THE FIGMA REFERENCE, AND THE LAST BAND ───
   There used to be an 8-column band at 1200 and a 12-column one at 1600. They
   are gone, because the page is now capped at 1024px on every screen and a
   column count is only meaningful against the width it has to divide.

   THIS IS THE TRAP THAT MAKES A CAPPED PAGE GO WRONG. `--grid-cols` is set by
   media queries, which measure the VIEWPORT, while the grid divides the PAGE.
   While those two were the same thing the arrangement was sound; the moment the
   page stops growing they diverge, and a 1920px monitor would have asked for
   twelve columns inside 960px of content — 57px cards, on a design whose
   smallest card is 179. Above 1024 the page is always the artboard, so the
   artboard's five columns are always the answer. */
@media (min-width: 900px) {
  :root {
    --grid-cols: 5;
    --grid-gap:  16px;
    --grid-row:  164px;
    --pad-page:  32px;
  }
}

/* ── 1024px and up · the page has stopped growing, so the type stops too ──
   Every --fs- token is a clamp on `vw`, tuned so it lands exactly on Figma's
   value at the 1024pt reference and keeps growing past it. That was right when
   the page grew too. Now the page is pinned at 1024 and the type has to be
   pinned with it, or a 1920px monitor renders artboard-width cards carrying
   desktop-width text.

   These ARE the values the clamps produce at 1024 — the Figma-referenced ones
   land on round numbers because they were derived to, which is the clearest
   possible confirmation that the two definitions agree. Nothing jumps at the
   breakpoint; the curve simply stops. */
@media (min-width: 1024px) {
  :root {
    --fs-greet:     24px;      /* Figma 24 */
    --fs-name:      32px;      /* Figma 32 */
    --fs-hero:      36px;      /* Figma 36 */
    --fs-search:    20px;      /* Figma 20 */
    --fs-card:      20px;      /* Figma 20 */
    --fs-card-lg:   24px;      /* Figma 24 · Diet */
    --fs-stat:      44px;      /* Figma 44 */
    --fs-body:      16px;      /* Figma 16 */
    --fs-label:     14px;      /* Figma 14 */
    --fs-micro:     12px;      /* Figma 12 */
    /* no Figma reference — the artboard has no card that shows these */
    --fs-card-title: 17px;
    --fs-stat-sm:    30.69px;
    --fs-metric:     25.2px;
    --fs-metric-sm:  21.17px;
  }
}

@media (prefers-reduced-motion: reduce) {
  :root { --t-fast: 0ms; --t-base: 0ms; --t-slow: 0ms; --t-sheet: 0ms; }
  *, *::before, *::after {
    animation-duration: .01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: .01ms !important;
    scroll-behavior: auto !important;
  }
}
</style>
<style>
/* ══ css/home.css ══ */
/* ══════════════════════════════════════════════════════════════════════════
   HOME PAGE CHROME
   Status bar · greeting · search · hero banner.
   Transcribed from Figma node 55476:32828. Figma's own numbers are in the
   comments wherever a value looks arbitrary, because it usually is not.
   ══════════════════════════════════════════════════════════════════════════ */

*, *::before, *::after { box-sizing: border-box; }

html { -webkit-text-size-adjust: 100%; }

body {
  margin: 0;
  min-height: 100dvh;
  font-family: var(--font);
  font-size: var(--fs-body);
  color: var(--ink);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  /* The two stacked fills from the artboard. Attached to the body rather than a
     fixed pseudo-element so the wash spans the whole document the way it does
     on the canvas — the artboard is 1695px tall, well past one viewport. */
  background: var(--page-bg) no-repeat;
  background-attachment: fixed, fixed;
  overscroll-behavior-y: none;
}

h1, h2, h3, p { margin: 0; font-weight: inherit; }
button { font: inherit; color: inherit; }

:focus-visible { outline: 2px solid var(--c-add-primary); outline-offset: 3px; border-radius: 6px; }
:focus:not(:focus-visible) { outline: none; }

.sr-only {
  position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
  overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
}

/* ── 1 · iPad status bar ──────────────────────────────────────────────────
   26px / 12px padding, white ground. Present because the artboard has it; it
   is chrome, not product, so it is the one block using the system font stack. */
/* Capped with the page. The bar is the iPad's chrome, and an iPad is 1024pt
   wide — left full-bleed it became a white band running off both sides of a
   centred app, which reads as a broken page rather than as a device. */
.status-bar {
  width: 100%;
  max-width: calc(var(--max-content) + var(--pad-page) * 2);
  margin-inline: auto;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 12px 26px;
  background: var(--c-white);
  font-family: var(--font-sys);
  font-size: 14px;
  font-weight: 510;
  color: #000;
  overflow: hidden;
}
.status-bar__left  { display: flex; align-items: center; gap: 8px; padding-block: 2px; white-space: nowrap; }
.status-bar__right { display: flex; align-items: center; gap: 4px; padding-block: 5px; }
.status-bar__right img { display: block; }
.status-bar__pct { font-size: 12px; line-height: 14px; text-align: right; }

@media (max-width: 767px) {
  /* a phone-width viewport is not an iPad; the iPad bar would read as a bug */
  .status-bar { display: none; }
}

/* ── 2 · page frame ──────────────────────────────────────────────────────*/
.page {
  position: relative;          /* the header planting hangs off this */
  width: 100%;
  max-width: calc(var(--max-content) + var(--pad-page) * 2);
  margin: 0 auto;
  padding-bottom: var(--s12);
}

/* ── 2b · the header planting ────────────────────────────────────────────
   A band of foliage behind the greeting, dissolving before the search field.

   ═══ THE FADE IS A MASK, NOT A GRADIENT ═══════════════════════════════════

   The obvious way to soften the bottom of an illustration is to lay a
   background-coloured gradient over it. It is also wrong here, for two
   reasons. The page wash is a translucent double gradient that changes down
   the document, so any overlay would have to be a moving target and would show
   as a pale block the moment it missed. And an overlay fades the WHOLE band
   uniformly — leaves and gaps alike — which reads as fog rather than as
   foliage thinning out.

   `mask-image` removes the artwork's own alpha instead, so the leaves dissolve
   individually into whatever is behind them and the gaps between them stay
   exactly as transparent as they already were. There is no boundary to see
   because there is no second layer.

   ═══ THE STOPS ARE IN PIXELS, AND THEY ARE THE BRIEF ══════════════════════

   Percentages would float with the box height and hide what the numbers mean.
   These are absolute, measured against the page, and they say the requirement
   out loud:

     0 - 239px    solid. The search field runs 135-199, so the planting is at
                  full strength the whole way down the header, behind the field
                  and through the gap under it. Its tips clear the top of the
                  field by a hundred pixels.
     239 - 428px  the feather. 239 is forty pixels below the foot of the search
                  field, which is where the fade was asked to begin; 189px of
                  ramp to nothing is long enough to read as atmosphere rather
                  than as an edge.

   Eight stops rather than two, so the falloff eases instead of running straight
   — a linear ramp reads as a wipe.

   ONE THING TO KNOW ABOUT WHERE THAT FEATHER LANDS. The hero banner starts 32px
   below the search field, so a fade beginning at 40px starts 8px inside it and
   runs its whole length behind an opaque photograph. What is actually visible
   is the planting at full strength all the way to the hero's top edge. That is
   the instruction carried out exactly; if the feather should be seen, it has to
   begin at the foot of the field instead, and there are 32 pixels to do it in.

   ═══ THE ARTWORK ═══════════════════════════════════════════════════════════

   Supplied as a flat PNG on its own opaque ground — a blue that is not this
   product's mint canvas. Dropped in as-is it would paint a rectangle of the
   wrong colour with a hard edge on all four sides, and no mask can rescue that
   because the ground is part of the picture. tools/foliage.py un-composites it
   instead: it measures the ground, turns every pixel's departure from it into
   alpha, and writes the result as a transparent PNG that sits correctly on
   anything. It also mirror-pairs it, because the source is a one-off
   illustration whose left and right edges do not meet, and a mirrored pair
   always does. */
.foliage {
  position: absolute;
  z-index: 0;
  left: 0;
  right: 0;
  top: 0;
  height: 440px;
  pointer-events: none;
  /* The supplied artwork, un-composited off its own ground and mirror-paired
     so it tiles — see tools/foliage.py. `auto 100%` maps the crop onto this
     box, which is how the artwork is positioned: the crop's proportions are
     the layout, and there is nothing to nudge here. */
  background: url('assets/img/foliage.png') repeat-x top center / auto 100%;

  /* the long vertical feather — the stops are explained above */
  --feather: linear-gradient(to bottom,
    rgb(0, 0, 0) 0,
    rgb(0, 0, 0) 239px,
    rgba(0, 0, 0, .86) 268px,
    rgba(0, 0, 0, .66) 297px,
    rgba(0, 0, 0, .44) 326px,
    rgba(0, 0, 0, .25) 355px,
    rgba(0, 0, 0, .10) 384px,
    rgba(0, 0, 0, .03) 406px,
    transparent 428px);

  /* AND A CLEARING BEHIND THE GREETING.
     Measured on the render, with the glyphs made transparent and the true
     painted ground sampled underneath: the planting took "Good Morning," from
     2.65:1 to 2.24:1 on average, and to 1.87:1 where a leaf sat directly behind
     a letter. That text is #00ABAB from the Figma palette and was already under
     the 3.0:1 it needs at that size — but "already failing" is not a licence to
     make it worse, and the brief is explicit that the planting must never
     reduce readability.

     So a second mask layer thins the planting over the greeting block and
     feathers back to full by the edge of the ellipse. It is soft, and its
     strength tracks the depth of the band: when the planting stopped above the
     search field, holding the centre at 0.30 was enough, and now that it runs
     at full strength the whole depth of the header, that same ellipse left the
     greeting at 2.24:1 against a 2.62:1 baseline. At 0.06 it measures 2.48:1 —
     a tenth of a point, against the 0.38 it was costing. */
  --clearing: radial-gradient(ellipse 470px 138px at 194px 70px,
    rgba(0, 0, 0, .06) 0%,
    rgba(0, 0, 0, .42) 40%,
    rgba(0, 0, 0, .66) 62%,
    rgba(0, 0, 0, .88) 82%,
    rgb(0, 0, 0) 100%);

  -webkit-mask-image: var(--feather);
  mask-image: var(--feather);
}

/* Both layers, intersected, where the browser can do it. Where it cannot, the
   rule above still applies the vertical feather on its own — the planting is
   just a little heavier behind the greeting, which is where this started. */
@supports (mask-composite: intersect) or (-webkit-mask-composite: source-in) {
  .foliage {
    -webkit-mask-image: var(--feather), var(--clearing);
    mask-image: var(--feather), var(--clearing);
    -webkit-mask-composite: source-in;
    mask-composite: intersect;
  }
}

/* A phone header is the same height as a tablet's but a third of the width, so
   the same 220px band puts far fewer, far larger plants behind the greeting.
   Shrinking the box scales the artwork with it — the plants get smaller and
   closer together, which is the finer texture the narrow column wants. */
@media (max-width: 767px) {
  .foliage {
    /* The stops are absolute, so the box has to be deep enough to contain them
       or the band ends in a straight cut before the fade has begun. A phone
       header is shorter — the search field runs 131-185 — so both the box and
       the stops move up with it. */
    height: 410px;
    --feather: linear-gradient(to bottom,
      rgb(0, 0, 0) 0,
      rgb(0, 0, 0) 225px,
      rgba(0, 0, 0, .86) 252px,
      rgba(0, 0, 0, .66) 279px,
      rgba(0, 0, 0, .44) 306px,
      rgba(0, 0, 0, .25) 333px,
      rgba(0, 0, 0, .10) 360px,
      rgba(0, 0, 0, .03) 382px,
      transparent 404px);
    /* and a thinning scaled to the column — at the desktop ellipse a 500px
       header is almost entirely covered by it, which leaves the planting as a
       wisp in the top right rather than a band. */
    --clearing: radial-gradient(ellipse 250px 112px at 122px 58px,
      rgba(0, 0, 0, .06) 0%,
      rgba(0, 0, 0, .42) 40%,
      rgba(0, 0, 0, .66) 62%,
      rgba(0, 0, 0, .88) 82%,
      rgb(0, 0, 0) 100%);
  }
}

/* A browser without mask-image would show the band ending in a straight cut
   across the page, which is the one thing the brief rules out. Better to have
   no planting than a rectangle of it. */
@supports not ((-webkit-mask-image: linear-gradient(#000, transparent)) or
               (mask-image: linear-gradient(#000, transparent))) {
  .foliage { display: none; }
}

/* ── ADD MODULE · the primary action of Edit Modules ─────────────────────
   Beside the section title, where it is the first thing in the mode after the
   mode's own name. It was a tile at the end of the grid, which on a fifteen-
   card page put it below the fold.

   Dressed as an ACTION, not as a module: an outlined control, sized like Done
   beside it. A filled or coloured button here would compete with the cards it
   adds, and a card-shaped one would be mistaken for a module. */
.add-module-btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  height: 38px;
  padding: 0 var(--s4) 0 var(--s3);
  border: 1px solid var(--line-2);
  border-radius: var(--r-pill);
  background: var(--surface);
  color: var(--petrol-800);
  font-size: var(--fs-label);
  font-weight: 650;
  cursor: pointer;
  white-space: nowrap;
  transition: background var(--t-fast) var(--ease), border-color var(--t-fast) var(--ease),
              transform var(--t-fast) var(--ease);
}
.add-module-btn .icon { width: 17px; height: 17px; }
.add-module-btn:hover { background: var(--petrol-050); border-color: var(--petrol-200); }
.add-module-btn:active { transform: scale(.97); }

/* On a phone the title, the action and Done do not share a line. The row wraps
   and Add Module takes the full width underneath — still above the grid, which
   is the point. */
@media (max-width: 599px) {
  .section-head { flex-wrap: wrap; }
  .section-head--editing .section-head__actions { width: 100%; order: 3; margin-top: var(--s3); }
  .section-head--editing .add-module-btn { flex: 1 1 auto; justify-content: center; height: 44px; }

  /* THE HEADER HAS TO GROW WHEN THE ROW WRAPS.
     At rest it is `height: 0`, so the grid sits exactly where Figma puts it,
     and editing animates it to a fixed 44px. That fixed height is wrong the
     moment the actions take a second line: the box stays 44px, `overflow:
     visible` lets the buttons paint outside it, and they land on top of the
     drag hint.

     The `--editing` class is on the selector to win on specificity rather than
     on order — this block sits in the home-chrome stylesheet and the 44px rule
     is in the edit-mode one, several hundred lines later, so an equally
     specific override here would lose. Height `auto` costs the open/close
     animation on phones, which is a fair price: a control drawn over a line of
     text is a bug, a header that snaps open is not. */
  body.is-editing .section-head.section-head--editing {
    height: auto;
    min-height: 44px;
  }
  /* The hint is pulled up 12px to sit tight under a single-line header. Once
     the header wraps and grows, that negative margin is 12px of collision
     instead — measured, the actions ended 4px inside the hint's first line. */
  body.is-editing .section-head--editing + .edit-hint { margin-top: 0; }
}

/* ── 3 · greeting ────────────────────────────────────────────────────────
   Figma: Welcome Container, pt-32 pb-24 px-32, space-between. */
.home-header {
  position: relative;
  z-index: 1;                  /* over the planting, which is z-index 0 */
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--s6);
  padding: var(--s8) var(--pad-page) var(--s6);
}

.greeting { display: flex; flex-direction: column; gap: var(--s1); min-width: 0; }

/* Sour Gummy Light — the one string in the product that is not Inter. */
.greeting__word {
  font-family: var(--font-greet);
  font-weight: 300;
  font-size: var(--fs-greet);
  line-height: normal;
  color: var(--c-secondary-dark);
}

.greeting__name {
  font-size: var(--fs-name);
  font-weight: 600;
  line-height: normal;
  color: var(--c-on-secondary-ctr);
}
.greeting__wave { display: inline-block; margin-left: .12em; }

/* ── 4 · header icons · Figma gap 20px ───────────────────────────────────*/
.header-actions { display: flex; align-items: center; justify-content: flex-end; gap: var(--s5); flex: none; }

.icon-btn {
  display: grid;
  place-items: center;
  width: 32px;
  height: 32px;
  padding: 0;
  border: none;
  background: none;
  cursor: pointer;
  transition: transform var(--t-fast) var(--ease), opacity var(--t-fast) var(--ease);
}
.icon-btn:hover { opacity: .78; }
.icon-btn:active { transform: scale(.92); }
.icon-btn img { display: block; width: 100%; height: 100%; }

/* the bell is 29.877px in Figma, inside a 7.062px pad — kept, not rounded */
.icon-btn--bell { width: 29.877px; height: 29.877px; padding: 0; }

/* the avatar carries its presence badge at 70% inset on a white ring */
.avatar-btn {
  position: relative;
  width: var(--icon-btn);
  height: var(--icon-btn);
  padding: 0;
  border: none;
  border-radius: 64px;
  background: none;
  cursor: pointer;
  transition: transform var(--t-fast) var(--ease);
}
.avatar-btn:active { transform: scale(.94); }
.avatar-btn > img {
  display: block;
  width: 100%;
  height: 100%;
  border-radius: 64px;
  object-fit: cover;
  pointer-events: none;
}
.avatar-btn__badge {
  position: absolute;
  inset: 70% 0 0 70%;
  border-radius: 64px;
  background: var(--c-white);
  display: grid;
  place-items: center;
}
.avatar-btn__badge img { width: 66.66%; height: 66.66%; display: block; }

/* ── 5 · search · Figma h-64 r-16 px-24 gap-16 ───────────────────────────*/
/* THE SEARCH FIELD AND THE SWITCHER WERE TOUCHING.
   ────────────────────────────────────────────────────────────────────────
   Zero pixels between the bottom of the white field and the top of the pill
   under it — two separate controls reading as one two-storey object. The
   switcher arrived in a later session and was given a margin BELOW itself and
   none above, so it hung off the search field.

   The band now steps 24 / 20 / 32 / 16 down into the page: the greeting is a
   different kind of thing from the search, the switcher is the same kind of
   thing (both are how you get around, so they sit closer), 32 is the
   artboard's own page padding before the hero, and 16 is the grid gutter. */
.search-row {
  position: relative;
  z-index: 1;
  display: flex;
  align-items: flex-start;
  justify-content: center;
  margin-bottom: var(--s5);
  padding-inline: var(--pad-page);
}

.search {
  position: relative;
  display: flex;
  flex: 1 0 0;
  align-items: center;
  gap: var(--s4);
  min-width: 0;
  height: var(--search-h);
  padding: 8px var(--s6);
  border-radius: var(--r-field);
  background: var(--c-white);
  overflow: hidden;
}
.search__icon { flex: none; width: 24px; height: 24px; display: block; pointer-events: none; }
.search__input {
  flex: 1 0 0;
  min-width: 0;
  border: none;
  background: none;
  font: inherit;
  font-size: var(--fs-search);
  color: var(--ink);
}
.search__input::placeholder { color: var(--c-neutral-2); }

/* ── the rotating hint ───────────────────────────────────────────────────
   Where the placeholder would have been, to the pixel: the field's own inline
   padding, plus the 24px icon, plus the gap between icon and input. It is
   `aria-hidden` and `pointer-events: none`, so it is a picture of a
   placeholder — the tap goes through it to the field, and a screen reader
   still hears the input's own aria-label. See SearchHint.js. */
.search__hint {
  position: absolute;
  left: calc(var(--s6) + 24px + var(--s4));
  top: 50%;
  translate: 0 -50%;
  display: flex;
  align-items: baseline;
  gap: .38em;
  max-width: calc(100% - var(--s6) * 2 - 24px - var(--s4));
  font-size: var(--fs-search);
  color: var(--c-neutral-2);
  white-space: nowrap;
  pointer-events: none;
}
.search__hint[hidden] { display: none; }
/* The moving word is clipped to its own line box, so it enters and leaves
   behind an edge rather than floating over the field's padding. */
.search__cycle {
  display: inline-block;
  overflow: hidden;
  font-weight: 600;
  color: var(--petrol-600);
  will-change: transform, opacity;
}
.search__input:focus { outline: none; }
.search:focus-within { box-shadow: 0 0 0 3px color-mix(in srgb, var(--c-add-primary) 26%, transparent); }

/* ── 6 · main frame · Figma pt-32 px-32 gap-16 ───────────────────────────*/
.main-frame {
  /* The planting is a positioned element at z-index 0 and now runs 440px deep,
     which reaches the hero banner. Positioned elements paint above unpositioned
     in-flow siblings whatever their order, so without this the foliage would
     lie over the top of the leopard. */
  position: relative;
  z-index: 1;
  display: flex;
  flex-direction: column;
  gap: var(--s4);
  padding: var(--s8) var(--pad-page) 0;
}

/* ── 7 · hero banner ─────────────────────────────────────────────────────
   Figma "Egg Module": 204px tall, the leopard photograph under a flat 40%
   black, a 84px mark rotated −45° in a 118.794px box, the title at 36px, and
   the carousel dots centred at the foot.

   THE PHOTOGRAPH IS CROPPED, NOT COVERED. Figma scales it to the card's width
   and pushes it up 99.34% of the card height, so what you see is the band from
   about 32% to 64% down the frame — the animal's eyes, not the whole animal.
   `cover` would centre it and lose that. The `46.5%` below is that crop
   expressed proportionally, so it survives the card changing width:
   46.5% × (204 − 640) = −202.6px, which is Figma's offset exactly. */
.hero {
  position: relative;
  display: flex;
  flex-direction: column;
  justify-content: center;
  gap: var(--s6);
  height: var(--hero-h);
  padding: var(--s8) var(--s8) var(--s4);
  border-radius: var(--r-card);
  overflow: hidden;
  box-shadow: var(--shadow-hero);
  border: none;
  width: 100%;
  text-align: left;
  cursor: pointer;
  isolation: isolate;
  /* The reset hands `button` its font and colour; an anchor needs telling, and
     needs the underline taken off. Without these the banner renders in the UA's
     link blue at the UA's default size. */
  font: inherit;
  color: inherit;
  text-decoration: none;
  /* THE GUTTER, NOT A CHOICE OF SPACING.
     ──────────────────────────────────────────────────────────────────────
     The banner sat flush against the first row of cards, and the artboard
     does not: the Figma frame is 1136px of 32 padding + 204 hero + **16 gap**
     + five 164px rows with four 16px gaps, and the sixteen after the hero had
     never been drawn. So the grid — and every card row under it — sat 16px
     too high, and the page measured 1120 against the frame's 1136.

     It is `--grid-gap` rather than a literal 16 because that is what it IS.
     On the artboard the space between the banner and the cards is the same
     space as the space between two card rows, which is why it reads as one
     grid with the banner in it rather than as a banner with a grid under it.
     The token already steps 16 → 14 → 12 with the breakpoints; a hard-coded
     16 would have gone wrong at 768 and 640 in a way nobody would notice for
     another two sessions. */
  margin-bottom: var(--grid-gap);
}
.hero__media {
  position: absolute;
  inset: 0;
  z-index: 0;
  background-image: url('assets/img/hero-leopard.jpg');
  background-size: 100% auto;
  background-position: 50% 46.5%;
  background-repeat: no-repeat;
  transition: transform var(--t-slow) var(--ease-out);

.hero__scrim { position: absolute; inset: 0; z-index: 1; background: rgba(0, 0, 0, .4); }
@media (hover: hover) { .hero:hover .hero__media { transform: scale(1.03); } }

.hero__row {
  position: relative;
  z-index: 2;
  display: flex;
  align-items: center;
  gap: var(--s6);
  width: 100%;
  min-width: 0;
}
.hero__mark {
  flex: none;
  display: grid;
  place-items: center;
  width: 118.794px;
  height: 118.794px;
}
.hero__mark img {
  display: block;
  width: 84px;
  height: 84px;
  transform: rotate(-45deg);
}
.hero__title {
  flex: 1 0 0;
  min-width: 0;
  font-size: var(--fs-hero);
  font-weight: 600;
  line-height: normal;
  color: var(--on-dark);
}
.hero__dots {
  position: relative;
  z-index: 2;
  display: flex;
  align-items: center;
  justify-content: center;
  width: 100%;
}
.hero__dots img { display: block; width: 32px; height: 8px; }

@media (max-width: 767px) {
  .hero { padding: var(--s5) var(--s5) var(--s3); gap: var(--s3); }
  .hero__mark { width: 68px; height: 68px; }
  .hero__mark img { width: 52px; height: 52px; }
}

/* ── 8 · modules section head ────────────────────────────────────────────
   NOT IN THE ARTBOARD, AND THEREFORE NOT IN THE RESTING PAGE.

   The Figma frame is 1136px tall: 32 padding + 204 hero + 16 gap + five 164px
   rows with four 16px gaps. There is no room in that arithmetic for a header
   row, and an earlier pass added one anyway — which pushed the whole grid 28px
   down and was the single reason the build was not pixel-exact.

   So this collapses to nothing until edit mode is on. Getting into edit mode is
   a gesture instead of a button: press and hold a card, or right-click it, or
   press E. That is how iPadOS enters widget editing, which is what this feature
   was modelled on in the first place, and it costs the resting page no pixels.
   Once editing, the row expands and carries the title and Done — at that point
   the user is in a mode and needs to see it. */
.section-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--s4);
  /* zero-height and invisible at rest; the grid sits exactly where Figma puts
     it. `overflow: hidden` keeps the Done button from painting outside. */
  height: 0;
  min-height: 0;
  margin: 0;
  overflow: hidden;
  opacity: 0;
  pointer-events: none;
  transition: height var(--t-base) var(--ease), opacity var(--t-base) var(--ease),
              margin var(--t-base) var(--ease);

body.is-editing .section-head {
  height: 44px;
  margin-bottom: var(--s2);
  opacity: 1;
  overflow: visible;
  pointer-events: auto;
}
.section-head__title {
  font-size: var(--fs-card);
  font-weight: 600;
  letter-spacing: -.01em;
  color: var(--ink-head);
}

.section-head__actions { display: flex; align-items: center; gap: var(--s2); margin-left: auto; }

.link-btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  height: 36px;
  padding: 0 var(--s3);
  border: none;
  border-radius: var(--r-pill);
  background: transparent;
  color: var(--ui-link);
  font-size: var(--fs-label);
  font-weight: 500;
  cursor: pointer;
  transition: background var(--t-fast) var(--ease);

.link-btn:hover { background: color-mix(in srgb, var(--ui-link) 12%, transparent); }
.link-btn .icon { width: 16px; height: 16px; }

.link-btn--done {
  padding: 0 var(--s5);
  background: var(--ui-link);
  color: var(--on-dark);
  font-weight: 600;

.link-btn--done:hover { background: color-mix(in srgb, var(--ui-link) 86%, #000); }
.link-btn--done:active { transform: scale(.97); }

/* ══ css/grid.css ══ */
/* ══════════════════════════════════════════════════════════════════════════
   THE MODULE GRID
   ──────────────────────────────────────────────────────────────────────────
   Column count and row height come from tokens.css and change at the five
   breakpoints; every card's position comes from the packer and is written as an
   inline `grid-area`. Nothing here is auto-placed, which is what lets the drag
   controller know where every card actually is.
   ══════════════════════════════════════════════════════════════════════════ */

.module-grid {
  display: grid;
  grid-template-columns: repeat(var(--grid-cols), minmax(0, 1fr));
  grid-auto-rows: var(--grid-row);
  gap: var(--grid-gap);
  /* The grid owns the horizontal scroll axis and refuses it. If a span ever
     escaped the packer, this is the line that stops it turning the whole page
     into a side-scroller on an iPad. */
  min-width: 0;
}

/* Each card sits in a slot. The slot owns the grid position and the drag
   transform; the card inside owns the looks. Keeping those on two elements
   means a FLIP transform on the slot never fights a hover transform on the
   card — which, on one element, it does, and the result is a card that snaps
   back to the wrong place the moment the pointer crosses it. */
.slot {
  position: relative;
  min-width: 0;
  min-height: 0;
}

.slot > .card { width: 100%; height: 100%; }

/* Cards animate to their new home when the layout reflows — after a drop, an
   add, a remove, or a rotation. The transform is set and cleared by the FLIP
   code in ModuleGrid; this class is what gives it a duration. */
.slot.is-flipping {
  transition: transform var(--t-slow) var(--ease-out);
  will-change: transform;
}

/* The slot being dragged. Its CARD is hidden — not the slot — because the slot
   still has to draw the hole the card will drop back into, and a slot at zero
   opacity cannot draw anything. */
.slot.is-source { pointer-events: none; }
.slot.is-source > .card { opacity: 0; }

/* The hole. Not a dashed outline — a dashed outline on a grid this dense reads
   as a fifteenth card. A soft inset wash reads as absence. */
.slot.is-placeholder::after {
  content: '';
  position: absolute;
  inset: 0;
  border-radius: var(--r-card);
  background: color-mix(in srgb, var(--petrol-400) 11%, transparent);
  box-shadow: inset 0 0 0 1.5px color-mix(in srgb, var(--petrol-400) 18%, transparent);
  animation: placeholder-in var(--t-base) var(--ease-out);
}

@keyframes placeholder-in {
  from { opacity: 0; transform: scale(.96); }
  to   { opacity: 1; transform: scale(1); }
}

/* ── the empty state ──────────────────────────────────────────────────────
   Reachable: a user can remove everything except the two core cards, and a
   fresh profile with a cleared layout lands here too. */
.grid-empty {
  grid-column: 1 / -1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: var(--s4);
  padding: var(--s12) var(--s6);
  border-radius: var(--r-card);
  background: color-mix(in srgb, var(--surface) 60%, transparent);
  box-shadow: inset 0 0 0 1px var(--line);
  text-align: center;
}
.grid-empty__title { font-size: var(--fs-title); font-weight: 600; color: var(--ink); }
.grid-empty__note  { font-size: var(--fs-body); color: var(--ink-3); max-width: 40ch; }

/* ── the drag layer ───────────────────────────────────────────────────────
   One fixed-position layer at the top of the stacking order holds the card
   being dragged. Lifting it out of the grid is what lets it cross the whole
   page without being clipped by the grid's own bounds, and what stops every
   pointermove from touching grid layout. */
.drag-layer {
  position: fixed;
  inset: 0;
  z-index: var(--z-drag);
  pointer-events: none;
}

.drag-proxy {
  position: absolute;
  top: 0;
  left: 0;
  border-radius: var(--r-card);
  box-shadow: var(--e-drag);
  /* the lift: a little bigger, a little tilted, so the card reads as being
     held rather than as having jumped */
  transform-origin: center;
  will-change: transform;
}
.drag-proxy .card {
  box-shadow: none;
  transform: none;
  pointer-events: none;
}

/* Settling back into the grid on drop. */
.drag-proxy.is-landing {
  transition: transform var(--t-slow) var(--ease-out),
              width var(--t-slow) var(--ease-out),
              height var(--t-slow) var(--ease-out);
}
